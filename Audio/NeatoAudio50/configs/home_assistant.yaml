# ==============================================================================
# HOME ASSISTANT SPEAKER CONFIGURATION  (HA server on the LAN)
# ==============================================================================
# Joins a WiFi router where a Home Assistant server IS present (internet
# optional). Keeps the native ESPHome api: enabled so HA can control the device
# and receive the esphome.speaker-triggered events fired below. The device also
# still accepts direct device-to-device "Net Play" POSTs over the LAN.
#
# Use this when:      router present, Home Assistant server on the LAN
# Use networked.yaml instead when: router present but NO HA server (No-HA LAN)
# Use standalone.yaml instead when: device runs its own AP (no router)
# ==============================================================================

# Shared base packages — common to all NEATO-FX devices
packages:
  networked_base: !include ../../../_shared/networked_base.yaml
  network_sensors: !include ../../../_shared/network_sensors.yaml
  firmware_update: !include ../../../_shared/firmware_update.yaml

# ==============================================================================
# DASHBOARD IMPORT - Made for ESPHome
# ==============================================================================
# Requires the api: component (kept below), so it's enabled in this HA variant.
# Lets the ESPHome dashboard adopt this device from its published config.
dashboard_import:
  package_import_url: github://CodeMakesItGo/NeatoFx_Public/Audio/NeatoAudio50/main.yaml@main
  import_full_config: true

# ==============================================================================
# SUBSTITUTIONS - Configuration Variables
# ==============================================================================
substitutions:
  # ip_base and ip_addr defaults are set in _shared/networked_base.yaml.
  # Override ip_addr here if a static subnet offset is needed.

# ==============================================================================
# IP ASSIGNMENT - DHCP (with router-side reservation)
# ==============================================================================
# DHCP by default; the router assigns the address (pin it with a DHCP
# reservation for stable HA/direct-IP addressing). To bake a static IP into the
# device instead, uncomment the manual_ip block below.
#wifi:
#  manual_ip:
#    static_ip: 192.168.1.52
#    gateway: 192.168.1.1
#    subnet: 255.255.255.0
#    dns1: 192.168.1.1
#    dns2: 8.8.8.8          # keeps HTTPS OTA firmware updates resolvable

# ==============================================================================
# API & REMOTE ACCESS - Home Assistant
# ==============================================================================
# _shared/networked_base.yaml provides api: (with a 5-min reboot timer if no HA
# client connects). We KEEP it here — a Home Assistant server is expected on the
# LAN, so the connection stays up and the reboot timer never fires.
#
# ------------------------------------------------------------------------------
# LEGACY ENTRY POINT — prefer the Device ID subscription below.
# ------------------------------------------------------------------------------
# This action is named from the DEVICE name, which carries the MAC suffix
# (esphome.audio_a1b2c3_play_sound). Swap a speaker for a spare and every Home
# Assistant script calling it has to be edited. It exists because the units this
# replaces exposed exactly this action (from the site-local .speaker_base.yaml,
# `name: speaker-21${id}`), so installs keep working across the reflash.
#
# It delegates to the same script the subscription uses, so the two paths can
# never drift.
api:
  # Required for the esphome.speaker-triggered events fired further down — the
  # device->HA direction is gated by this flag, and it was never set here even
  # though this config's whole purpose includes sending those events. The
  # Display and Blaster HA configs both set it for the same reason.
  homeassistant_services: true
  services:
    - service: play_sound
      variables:
        sound_id: int
      then:
        - script.execute:
            id: play_sound_script
            mp3: !lambda 'return sound_id;'

# ==============================================================================
# SOUND BY DEVICE ID - survives a hardware swap
# ==============================================================================
# Home Assistant plays a sound on this speaker by writing its file number to
#
#   input_number.speaker_<device_id>_sound
#
# and nothing in Home Assistant needs this unit's name or MAC. Set the Device ID
# on a replacement speaker and every script keeps working untouched. Same
# mechanism the displays use for player_<id>_score — see
# Displays/NeatoDisplay7/configs/networked.yaml.
#
# The entity_id below is a compile-time placeholder only: ESPHome's schema makes
# it Required, so something syntactically valid has to be there. on_boot rebinds
# it to the restored device_id at priority 600 — globals restore at HARDWARE
# (800) and the homeassistant sensor subscribes at AFTER_WIFI (200), so the
# placeholder is never actually subscribed. Changing the Device ID reboots the
# device, which is what re-runs this binding.
#
# WHY THE HELPER IS RESET TO 0 AFTER EACH PLAY (Home Assistant side):
# Home Assistant only pushes a state CHANGE. Writing 5 to a helper that already
# reads 5 sends nothing, so the second hit on the same target would be silent —
# and repeat hits are the normal case in a gallery. The play script in
# HomeAssistant/scripts.yaml therefore writes the file number and then writes 0.
# 0 is out of range here, so it is ignored and never plays.
esphome:
  on_boot:
    - priority: 600   # after globals restore (800), before HA subscribe (200)
      then:
        - lambda: |-
            // static: set_entity_id stores the pointer, not a copy, so this
            // string must outlive the component's setup().
            static std::string sound_eid = "input_number.speaker_" +
                                           std::to_string(id(device_id)) + "_sound";
            id(ha_speaker_sound).set_entity_id(sound_eid.c_str());
            ESP_LOGI("audio", "Sound channel bound to %s", sound_eid.c_str());

sensor:
  - platform: homeassistant
    id: ha_speaker_sound
    entity_id: input_number.speaker_0_sound
    internal: true
    on_value:
      - script.execute:
          id: play_sound_script
          mp3: !lambda 'return (int)x;'

improv_serial:

# ==============================================================================
# ESPHome Script - Home Assistant events
# ==============================================================================
# Fire an event into Home Assistant when a physical input triggers. Enable the
# matching `script.execute: esphome_script_inN` calls in
# scripts/trigger_scripts.yaml to use these.
script:
  - id: esphome_script_in1
    mode: single  # Prevent overlapping hits
    then:
      # Send Home Assistant event
      - homeassistant.event:
          event: esphome.speaker-triggered
          data:
            address: !lambda 'return id(device_id);'
            input: '1'
  - id: esphome_script_in2
    mode: single  # Prevent overlapping hits
    then:
      # Send Home Assistant event
      - homeassistant.event:
          event: esphome.speaker-triggered
          data:
            address: !lambda 'return id(device_id);'
            input: '2'

# ==============================================================================
# NETWORK PLAY ENDPOINT - direct device-to-device trigger
# ==============================================================================
# Still available alongside Home Assistant: other NEATO-FX devices can play a
# sound by POSTing over the LAN via web_server REST:
#
#   POST http://audio-<id>.local/number/Net%20Play/set?value=<mp3 number>
#
# value 1-255 = play that MP3 file; 0 or out-of-range = ignored.
number:
  - platform: template
    name: "Net Play"
    id: net_play
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    optimistic: true
    # Delegates to the shared play script — same amp/volume sequence as every
    # other entry point. It used to inline its own, which skipped setting the
    # volume while muted; see the note on play_sound_script.
    set_action:
      - script.execute:
          id: play_sound_script
          mp3: !lambda 'return (int)x;'

  # ============================================================================
  # NETWORK TRIGGER ENDPOINT - fire a full input chain remotely
  # ============================================================================
  # "Net Play" above is sound only — it calls the DFPlayer directly and so skips
  # everything the physical inputs do. This endpoint instead runs the real
  # run_inputN_script, so a remote caller gets the input's complete behavior:
  # spotlight/relay routing (Input N Output), trigger brightness, output timer,
  # and the background-loop pause.
  #
  #   POST http://audio-<id>.local/number/Net%20Trigger/set?value=<code>
  #
  # The value packs the input number and the MP3 file into one atomic POST:
  #
  #   code = input * 1000 + mp3        input: 1 or 2      mp3: 0-255
  #
  #   1005 → Input 1 effects, play MP3 5      2001 → Input 2 effects, play MP3 1
  #   1000 → Input 1 effects, play whatever "Input 1 MP3" is set to locally
  #
  # Anything else is ignored and logged.
  - platform: template
    name: "Net Trigger"
    id: net_trigger
    min_value: 0
    max_value: 2255
    step: 1
    mode: box
    optimistic: true
    set_action:
      - lambda: |-
          int code = (int) x;
          int input = code / 1000;
          int mp3   = code % 1000;
          if (mp3 > 255) {
            ESP_LOGW("net_trigger", "Ignoring code %d (MP3 %d out of range)", code, mp3);
          } else if (input == 1) {
            ESP_LOGI("net_trigger", "Input 1 chain, MP3 %s", mp3 ? to_string(mp3).c_str() : "(local setting)");
            id(run_input1_script)->execute(mp3);
          } else if (input == 2) {
            ESP_LOGI("net_trigger", "Input 2 chain, MP3 %s", mp3 ? to_string(mp3).c_str() : "(local setting)");
            id(run_input2_script)->execute(mp3);
          } else {
            ESP_LOGW("net_trigger", "Ignoring code %d (input %d is not 1 or 2)", code, input);
          }

# ==============================================================================
# FIRMWARE UPDATES - OTA via HTTP
# ==============================================================================
update:
  - platform: http_request
    id: firmware_update_check
    name: "Firmware Update"
    source: https://raw.githubusercontent.com/CodeMakesItGo/NeatoFx_Public/main/firmware/audio50/manifest.json
