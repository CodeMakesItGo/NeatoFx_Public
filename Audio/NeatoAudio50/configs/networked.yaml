#       mode: INPUT_PULLUP
#       inverted: true
#     name: "Physical WiFi Reset Button"
#     on_press:
#       then:
#         - button.press: wifi_reset_button

improv_serial:

# ==============================================================================
# NETWORK PLAY ENDPOINT - direct device-to-device trigger (no Home Assistant)
# ==============================================================================
# Lets other NEATO-FX devices (e.g. targets) play a sound by POSTing over the
# router LAN — no Home Assistant / broker required. Exposed via web_server REST:
#
#   POST http://audio-<id>.local/number/Net%20Play/set?value=<mp3 number>
#
# value 1-255 = play that MP3 file; 0 or out-of-range = ignored. Mirrors the
# amp wake/unmute/play/watchdog sequence used by the physical input scripts.
number:
  - platform: template
    name: "Net Play"
    id: net_play
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    optimistic: true
    set_action:
      - if:
          condition:
            lambda: 'return ((int)x) >= 1 && ((int)x) <= 255;'
          then:
            - logger.log:
                format: "Net Play: playing MP3 %d"
                args: ['(int)x']
            - output.turn_on: amp_wake     # Wake amp first
            - delay: 50ms                  # Let amp stabilize
            - output.turn_on: amp_unmute   # Unmute
            - delay: 100ms
            - lambda: 'id(dfplayer1).play_mp3((int)x);'
            - script.execute: playback_timeout
          else:
            - logger.log:
                format: "Net Play: ignoring out-of-range value %d"
                args: ['(int)x']

