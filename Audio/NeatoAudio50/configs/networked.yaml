# ==============================================================================
# NETWORKED SPEAKER CONFIGURATION  (No-HA LAN mode)
# ==============================================================================
# Joins a WiFi router but expects NO Home Assistant server and NO internet
# (landlocked gallery LAN). Sounds are triggered device-to-device over the LAN
# via the "Net Play" endpoint below — no broker/HA required.
#
# Use this when:      router present, no HA server (internet optional/absent)
# Use home_assistant.yaml instead when: a Home Assistant server is on the LAN
# Use standalone.yaml instead when:      device runs its own AP (no router)
# ==============================================================================

# Shared base packages — common to all NEATO-FX devices
packages:
  networked_base: !include ../../../_shared/networked_base.yaml
  network_sensors: !include ../../../_shared/network_sensors.yaml
  # OTA update checks disabled — gallery LANs are landlocked (no internet),
  # so the GitHub manifest fetch can never succeed. Re-enable this include
  # (and the update: block below) if deploying on an internet-connected net.
  #firmware_update: !include ../../../_shared/firmware_update.yaml

# ==============================================================================
# SUBSTITUTIONS - Configuration Variables
# ==============================================================================
substitutions:
  # ip_base and ip_addr defaults are set in _shared/networked_base.yaml.
  # Override ip_addr here if a static subnet offset is needed.

# ==============================================================================
# IP ASSIGNMENT - DHCP (with router-side reservation)
# ==============================================================================
# Using DHCP: the LandLockedGallery router assigns the address, and a DHCP
# reservation on the router pins it to a stable IP for direct device-to-device
# triggering (targets POST straight to that IP, no Home Assistant / mDNS).
#
# To go back to a device-baked static IP instead, uncomment the manual_ip block
# below and set static_ip/gateway to match the deployment subnet.
#wifi:
#  manual_ip:
#    static_ip: 192.168.1.52
#    gateway: 192.168.1.1
#    subnet: 255.255.255.0
#    dns1: 192.168.1.1
#    dns2: 8.8.8.8          # keeps HTTPS OTA firmware updates resolvable

# ==============================================================================
# API & REMOTE ACCESS - Home Assistant (REMOVED — No-HA LAN mode)
# ==============================================================================
# No Home Assistant server on this gallery LAN. Sounds are triggered over the LAN
# via the "Net Play" number endpoint (see below) — no HA needed. _shared/
# networked_base.yaml provides api: (with a 5-min reboot timer that would
# otherwise reboot this device every 5 min with no HA client); !remove strips it
# here so this device runs pure LAN. To integrate with Home Assistant, switch
# main.yaml to configs/home_assistant.yaml instead of this file.
api: !remove

# Optional: Physical button on GPIO for WiFi reset (uncomment if needed)
# binary_sensor:
