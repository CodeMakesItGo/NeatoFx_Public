# ==============================================================================
# STANDALONE SPEAKER CONFIGURATION
# ==============================================================================
# This configuration sets up a speaker device in standalone mode.
# In standalone mode, the speaker operates independently without requiring
# a central controller or Home Assistant integration.
# ==============================================================================

# Shared base packages — common to all NEATO-FX devices
packages:
  standalone_base: !include ../../../_shared/standalone_base.yaml

# ==============================================================================
# BUTTONS - Clear WiFi credentials
# ==============================================================================
# Named "Factory Reset" to match the networked configs (_shared/
# network_sensors.yaml) so the custom web UI's Reset card works in every mode.
button:
  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_button
    icon: "mdi:restart-alert"

# ==============================================================================
# ESPHome Script - ESPHome/Home Assistant integration
# ==============================================================================
script:
  - id: esphome_script_in1
    mode: single  # Prevent overlapping hits
    then:     
      - logger.log: "Input 1 triggered - ESPHome script executed"
  - id: esphome_script_in2
    mode: single  # Prevent overlapping hits
    then:     
      - logger.log: "Input 2 triggered - ESPHome script executed"