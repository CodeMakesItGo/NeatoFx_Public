          else if (output_choice == "Relay 2") { id(relay_2).turn_on(); }
          else if (output_choice == "FET 1") { auto call = id(spot_light_1).turn_on(); call.perform(); }
          else if (output_choice == "FET 2") { auto call = id(spot_light_2).turn_on(); call.perform(); }
          int mp3_setting = (int)id(aux4_mp3_select).state;
