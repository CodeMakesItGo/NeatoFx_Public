# ==============================================================================
# NEATO AUDIO 50 - RFTX CONNECTOR REPURPOSED AS 4 TRIGGER INPUTS
# ==============================================================================
# Optional package: include this to repurpose the RF transmitter connector
# (RFTX0-3) as 4 additional trigger inputs instead of outputs.
#
# Pin mapping when used as inputs:
#   RFTX0  GPIO14  → Aux 1 trigger → run_aux1_script
#   RFTX1  GPIO12  → Aux 2 trigger → run_aux2_script  (strapping pin)
#   RFTX2  GPIO19  → Aux 3 trigger → run_aux3_script
#   RFTX3  GPIO18  → Aux 4 trigger → run_aux4_script
#
# To enable: uncomment the rftx_inputs line in main.yaml
# ==============================================================================

# ==============================================================================
# RFTX INPUTS - Binary Sensors
# ==============================================================================
binary_sensor:
  - platform: gpio
    name: "Aux 1 (RFTX0)"
    id: aux_in_1
    internal: true
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - logger.log: "Aux 1 Triggered"
      - script.execute: run_aux1_script

  - platform: gpio
    name: "Aux 2 (RFTX1)"
    id: aux_in_2
    internal: true
    pin:
      number: GPIO12
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - logger.log: "Aux 2 Triggered"
      - script.execute: run_aux2_script

  - platform: gpio
    name: "Aux 3 (RFTX2)"
    id: aux_in_3
    internal: true
    pin:
      number: GPIO19
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - logger.log: "Aux 3 Triggered"
      - script.execute: run_aux3_script

  - platform: gpio
    name: "Aux 4 (RFTX3)"
    id: aux_in_4
    internal: true
    pin:
      number: GPIO18
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - logger.log: "Aux 4 Triggered"
      - script.execute: run_aux4_script

# ==============================================================================
# AUX SWITCHES - Random Mode Toggles
# ==============================================================================
switch:
  - platform: template
    name: "Aux 1 Sequential"
    id: aux1_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "Aux 2 Sequential"
    id: aux2_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "Aux 3 Sequential"
    id: aux3_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "Aux 4 Sequential"
    id: aux4_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "RF A Sequential"
    id: rf_a_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "RF B Sequential"
    id: rf_b_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "RF C Sequential"
    id: rf_c_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "RF D Sequential"
    id: rf_d_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

