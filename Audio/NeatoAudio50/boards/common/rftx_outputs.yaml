# ==============================================================================
# NEATO AUDIO 50 - RFTX CONNECTOR AS RF TRANSMITTER OUTPUTS (default)
# ==============================================================================
# Configures the 4-pin RFTX connector as GPIO outputs driving an RF transmitter.
# Each channel fires a 100ms momentary pulse when triggered.
#
# Pin mapping:
#   RFTX0  GPIO14  → RF TX A
#   RFTX1  GPIO12  → RF TX B  (strapping pin — warning suppressed)
#   RFTX2  GPIO19  → RF TX C
#   RFTX3  GPIO18  → RF TX D
#
# GPIO4 (RF TX Power) is defined in the board file and controls transmitter power.
# To switch to input mode: esphome -s rftx rftx_inputs compile main.yaml
# ==============================================================================

# ==============================================================================
# RF TRANSMITTER SWITCHES - Momentary Pulse Outputs
# ==============================================================================
switch:
  - platform: gpio
    pin: GPIO14
    name: "RF TX A"
    id: rf_tx_a
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: rf_tx_a

  - platform: gpio
    pin:
      number: GPIO12
      ignore_strapping_warning: true
    name: "RF TX B"
    id: rf_tx_b
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: rf_tx_b

  - platform: gpio
    pin: GPIO19
    name: "RF TX C"
    id: rf_tx_c
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: rf_tx_c

  - platform: gpio
    pin: GPIO18
    name: "RF TX D"
    id: rf_tx_d
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: rf_tx_d

  - platform: gpio
    pin: GPIO4
    name: "RF TX Power"
    id: rf_tx_power
    restore_mode: ALWAYS_OFF
    # Controls power to the RF transmitter on the RFTX connector

  - platform: template
    name: "RF A Sequential"
    id: rf_a_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "RF B Sequential"
    id: rf_b_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "RF C Sequential"
    id: rf_c_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "RF D Sequential"
    id: rf_d_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

# ==============================================================================
# RF NUMBER CONTROLS - MP3 File Assignment
# ==============================================================================
number:
  - platform: template
    name: "RF A MP3"
    id: rf_a_mp3_select
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    initial_value: 1
    restore_value: true
    optimistic: true

  - platform: template
    name: "RF B MP3"
    id: rf_b_mp3_select
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    initial_value: 1
    restore_value: true
    optimistic: true

  - platform: template
    name: "RF C MP3"
    id: rf_c_mp3_select
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    initial_value: 1
    restore_value: true
    optimistic: true

  - platform: template
    name: "RF D MP3"
    id: rf_d_mp3_select
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    initial_value: 1
    restore_value: true
    optimistic: true

# ==============================================================================
# RF SELECT CONTROLS - Output Routing
# ==============================================================================
select:
  - platform: template
    name: "RF A Output"
    id: rf_a_output_select
    optimistic: true
    restore_value: true
    initial_option: "None"
    options: ["None", "Relay 1", "Relay 2", "PWR 1", "PWR 2"]

  - platform: template
    name: "RF B Output"
    id: rf_b_output_select
    optimistic: true
    restore_value: true
    initial_option: "None"
    options: ["None", "Relay 1", "Relay 2", "PWR 1", "PWR 2"]

  - platform: template
    name: "RF C Output"
    id: rf_c_output_select
    optimistic: true
    restore_value: true
    initial_option: "None"
    options: ["None", "Relay 1", "Relay 2", "PWR 1", "PWR 2"]

  - platform: template
    name: "RF D Output"
    id: rf_d_output_select
    optimistic: true
    restore_value: true
    initial_option: "None"
    options: ["None", "Relay 1", "Relay 2", "PWR 1", "PWR 2"]
