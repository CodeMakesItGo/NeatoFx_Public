# ==============================================================================
# NEATO AUDIO 50 - ON-BOARD RF RECEIVER (Remote A-D)
# ==============================================================================
# The plug-in RF receiver module (Remote BtnA-D on GPIO36/2/15/35, defined in
# the board file) is independent of the RFTX connector: it is always an input.
# This package holds what each remote button does — which MP3 plays, whether it
# plays sequentially, which output fires — plus an on/off switch for units that
# have no receiver plugged in (a floating receiver input can false-trigger).
#
#   RF Receiver Enabled  on (default) = remote presses play; off = ignored and
#                        the RF Receiver card collapses to just this switch
#
# Was split across rftx_outputs / rftx_inputs / rftx_none, which tied the
# receiver to the RFTX connector mode. They are separate hardware.
# ==============================================================================

switch:
  - platform: template
    name: "RF Receiver Enabled"
    id: rf_receiver_enabled
    icon: "mdi:remote"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "RF A Sequential"
    id: rf_a_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "RF B Sequential"
    id: rf_b_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "RF C Sequential"
    id: rf_c_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "RF D Sequential"
    id: rf_d_random_enable
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

# MP3 file per remote button (0 = play nothing)
number:
  - platform: template
    name: "RF A MP3"
    id: rf_a_mp3_select
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    initial_value: 1
    restore_value: true
    optimistic: true

  - platform: template
    name: "RF B MP3"
    id: rf_b_mp3_select
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    initial_value: 1
    restore_value: true
    optimistic: true

  - platform: template
    name: "RF C MP3"
    id: rf_c_mp3_select
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    initial_value: 1
    restore_value: true
    optimistic: true

  - platform: template
    name: "RF D MP3"
    id: rf_d_mp3_select
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    initial_value: 1
    restore_value: true
    optimistic: true

# Output fired per remote button
select:
  - platform: template
    name: "RF A Output"
    id: rf_a_output_select
    optimistic: true
    restore_value: true
    initial_option: "None"
    options: ["None", "Relay 1", "Relay 2", "PWR 1", "PWR 2"]

  - platform: template
    name: "RF B Output"
    id: rf_b_output_select
    optimistic: true
    restore_value: true
    initial_option: "None"
    options: ["None", "Relay 1", "Relay 2", "PWR 1", "PWR 2"]

  - platform: template
    name: "RF C Output"
    id: rf_c_output_select
    optimistic: true
    restore_value: true
    initial_option: "None"
    options: ["None", "Relay 1", "Relay 2", "PWR 1", "PWR 2"]

  - platform: template
    name: "RF D Output"
    id: rf_d_output_select
    optimistic: true
    restore_value: true
    initial_option: "None"
    options: ["None", "Relay 1", "Relay 2", "PWR 1", "PWR 2"]
