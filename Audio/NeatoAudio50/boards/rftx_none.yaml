# ==============================================================================
# NEATO AUDIO 50 - RFTX CONNECTOR DISABLED (no inputs, no outputs)
# ==============================================================================
# Use this package when the RFTX connector is not used for anything.
# All RF A/B/C/D controls are hidden from Home Assistant and the web UI.
# The RFTX pins (GPIO14, GPIO12, GPIO19, GPIO18) are left unconfigured.
# The RF receiver inputs on the board still work and will trigger run_rf_*_script,
# but those scripts will silently do nothing (MP3 set to 0 = None by default).
#
# To enable: set rftx line in main.yaml to:
#   rftx: !include boards/rftx_none.yaml
# ==============================================================================

# ==============================================================================
# RF SWITCHES - Hidden (internal: true = not exposed to HA or web UI)
# ==============================================================================
switch:
  - platform: template
    name: "RF A Sequential"
    id: rf_a_random_enable
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "RF B Sequential"
    id: rf_b_random_enable
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "RF C Sequential"
    id: rf_c_random_enable
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

  - platform: template
    name: "RF D Sequential"
    id: rf_d_random_enable
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true

# ==============================================================================
# RF NUMBER CONTROLS - Hidden
# ==============================================================================
number:
  - platform: template
    name: "RF A MP3"
    id: rf_a_mp3_select
    internal: true
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    initial_value: 0      # 0 = None, so RF triggers play nothing
    restore_value: true
    optimistic: true

  - platform: template
    name: "RF B MP3"
    id: rf_b_mp3_select
    internal: true
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    initial_value: 0
    restore_value: true
    optimistic: true

  - platform: template
    name: "RF C MP3"
    id: rf_c_mp3_select
    internal: true
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    initial_value: 0
    restore_value: true
    optimistic: true

  - platform: template
    name: "RF D MP3"
    id: rf_d_mp3_select
    internal: true
    min_value: 0
    max_value: 255
    step: 1
    mode: box
    initial_value: 0
    restore_value: true
    optimistic: true

# ==============================================================================
# RF SELECT CONTROLS - Hidden
# ==============================================================================
select:
  - platform: template
    name: "RF A Output"
    id: rf_a_output_select
    internal: true
    optimistic: true
    restore_value: true
    initial_option: "None"
    options: ["None", "Relay 1", "Relay 2", "FET 1", "FET 2"]

  - platform: template
    name: "RF B Output"
    id: rf_b_output_select
    internal: true
    optimistic: true
    restore_value: true
    initial_option: "None"
    options: ["None", "Relay 1", "Relay 2", "FET 1", "FET 2"]

  - platform: template
    name: "RF C Output"
    id: rf_c_output_select
    internal: true
    optimistic: true
    restore_value: true
    initial_option: "None"
    options: ["None", "Relay 1", "Relay 2", "FET 1", "FET 2"]

  - platform: template
    name: "RF D Output"
    id: rf_d_output_select
    internal: true
    optimistic: true
    restore_value: true
    initial_option: "None"
    options: ["None", "Relay 1", "Relay 2", "FET 1", "FET 2"]
