    on_press:
      - logger.log: "Remote Btn D Pressed"
      - script.execute: run_rf_d_script
    on_release:
      - logger.log: "Remote Btn D Released"

  - platform: gpio
    name: "Input 1"
    id: input_1
    pin:
      number: GPIO34
      inverted: true
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
    on_press:
      - logger.log: "Input 1 Triggered"
      - script.execute:
          id: run_input1_script
          mp3_override: 0   # local trigger: use the "Input 1 MP3" setting
    on_release:
      - logger.log: "Input 1 Released"

  - platform: gpio
    name: "Input 2"
    id: input_2
    pin:
      number: GPIO39
      inverted: true
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
    on_press:
      - logger.log: "Input 2 Triggered"
      - script.execute:
          id: run_input2_script
          mp3_override: 0   # local trigger: use the "Input 2 MP3" setting
    on_release:
      - logger.log: "Input 2 Released"


# ==============================================================================
# USER CONTROLS - Numbers and Selects
# ==============================================================================
number:
  - platform: template
    name: "DFPlayer Volume"
    id: dfplayer_volume
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 5
    restore_value: true    # This ensures the value is restored after a reboot
    optimistic: true       # Ensures the UI reflects the current value
    set_action:
      - dfplayer.set_volume:
          id: dfplayer1
          volume: !lambda 'return (int)x;'

  
  - platform: template
    name: "Background Loop MP3"
    id: bg_loop_mp3_select
    min_value: 1
    max_value: 255
    step: 1
    mode: box
    initial_value: 1
    restore_value: true
    optimistic: false     # set_action publishes the state (see note)
    # MP3 file number to loop continuously in the background.
    # control() fires set_action BEFORE the optimistic publish, so we publish the
    # new value first (then play_bg_loop reads the fresh state) and restart the
    # loop immediately if it is active — keeps the UI value and the audio in sync
    # when this is changed while the loop is playing.
    set_action:
      - lambda: 'id(bg_loop_mp3_select).publish_state(x);'   # commit new value first
      - if:
          condition:
            lambda: 'return id(loop_bg_active);'
          then:
            - script.execute: play_bg_loop
            - script.execute: bg_loop_start_effect


  - platform: template
    name: "Input 1 MP3"
    id: input1_mp3_select
    min_value: 0
    max_value: 255
    step: 1
    mode: box              # Display as input box instead of slider
    initial_value: 1       # Changed from 0 to 1 so it will play by default
    restore_value: true
    optimistic: true
    # 0 = None (no MP3)
    # 1-255 = Specific MP3 file

  - platform: template
    name: "Input 2 MP3"
    id: input2_mp3_select
    min_value: 0
    max_value: 255
    step: 1
    mode: box              # Display as input box instead of slider
    initial_value: 1
    restore_value: true
    optimistic: true
    # 0 = None (no MP3)
    # 1-255 = Specific MP3 file

  - platform: template
    name: "Max MP3 Files"
    id: max_mp3_files
    min_value: 1
    max_value: 255
    step: 1
    mode: box
    initial_value: 32
    restore_value: true
    optimistic: true
    # Sets the maximum number of MP3 files on SD card for sequential playback

  - platform: template
    name: "Playback Timeout"
    id: playback_timeout_seconds
    min_value: 5
    max_value: 300
    step: 5
    mode: box
    initial_value: 60
    restore_value: true
    optimistic: true
    unit_of_measurement: "s"
    # Timeout in seconds - resets DFPlayer if playback gets stuck

  - platform: template
    name: "SpotLight 1 Trigger Brightness"
    id: spot1_trigger_brightness
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 100
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"

  - platform: template
    name: "SpotLight 2 Trigger Brightness"
    id: spot2_trigger_brightness
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 100
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"

  - platform: template
    name: "Input 1 Output Timer"
    id: input1_output_timer
    min_value: 0
    max_value: 5000
    step: 100
    mode: box
    initial_value: 0
    restore_value: true
    optimistic: true
    unit_of_measurement: "ms"
    # 0 = Song Duration (output stays on until song ends)

  - platform: template
    name: "Input 2 Output Timer"
    id: input2_output_timer
    min_value: 0
    max_value: 5000
    step: 100
    mode: box
    initial_value: 0
    restore_value: true
    optimistic: true
    unit_of_measurement: "ms"
    # 0 = Song Duration (output stays on until song ends)


# ==============================================================================
# SELECT CONTROLS - Output Selection
# ==============================================================================
select:
  - platform: template
    name: "Input 1 Output"
    id: input1_output_select
    optimistic: true
    restore_value: true
    initial_option: "None"
    options:
      - "None"
      - "Relay 1"
      - "Relay 2"
      - "PWR 1"
      - "PWR 2"

  - platform: template
    name: "Input 2 Output"
    id: input2_output_select
    optimistic: true
    restore_value: true
    initial_option: "None"
    options:
      - "None"
      - "Relay 1"
      - "Relay 2"
      - "PWR 1"
      - "PWR 2"

  - platform: template
    name: "BG Loop PWR Output"
    id: bg_loop_fet_select
    optimistic: true
    restore_value: true
    initial_option: "PWR 1"
    options:
      - "None"
      - "PWR 1"
      - "PWR 2"

  - platform: template
    name: "BG Loop PWR Effect"
    id: bg_loop_effect_select
    optimistic: true
