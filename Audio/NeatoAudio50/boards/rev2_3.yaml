# ==============================================================================
# SUBSTITUTIONS - Device Identification
# ==============================================================================
substitutions:
  # Default ID - override with -s id XXXX command line parameter
  id: "0000"                     # Default speaker ID
  # name / friendly_name intentionally NOT set here — they are defined in
  # main.yaml (audio-${id}) and main-file substitutions override packages.
  # Setting them here too created a confusing speaker-* vs audio-* ambiguity.
  project_name: "CodeMakesItGo.Speaker"
  project_version: "1.0.0"
  hw_version: "Rev 2.3"

# ==============================================================================
# CORE ESPHOME CONFIGURATION - Common Settings
# ==============================================================================
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: ${project_name}
    version: ${project_version}

  on_boot:
    - priority: -100   # after all components are set up
      then:
        - text_sensor.template.publish:
            id: firmware_version_sensor
            state: "${project_version} · ${hw_version}"
    - priority: 300  # Match working .speaker_base.yaml timing
      then:
      - output.turn_on: mp3_power
      - output.turn_off: amp_unmute  # Keep muted
      - output.turn_off: amp_wake    # Keep asleep
      - output.turn_on: hb_led
      # DFPlayer needs 1.5-3s+ after power-on to boot and mount the SD card
      # (longer with big/slow cards). A volume command sent too early is
      # silently dropped and the player stays at its default volume 30 (max).
      - delay: 3000ms  # Wait for DFPlayer to be ready
      - dfplayer.set_volume:
          id: dfplayer1
          volume: !lambda 'return (int)id(dfplayer_volume).state;'
      - logger.log: "Boot complete - DFPlayer initialized at saved volume"
      - lambda: 'id(boot_complete) = true;'
      # Sync the loop flag to the ACTUAL switch state at boot. loop_bg_active must
      # never be a second source of truth: after a firmware change resets flash
      # preferences it could restore stale (true) while the switch shows OFF,
      # making the loop run — and endlessly retry a missing file — with the switch
      # off. The bg_loop_enable switch is authoritative.
      - lambda: 'id(loop_bg_active) = id(bg_loop_enable).state;'
      - if:
          condition:
            lambda: 'return id(loop_bg_active);'
          then:
            - script.execute: play_bg_loop
            - script.execute: bg_loop_start_effect

# ==============================================================================
# ESP32 FRAMEWORK - Common Settings
# ==============================================================================
esp32:
  board: esp32dev
  # DIO required by hardware flash chip. platformio_options.board_build.flash_mode
  # (formerly under esphome: above) is now ignored — ESP32 Arduino builds run on
  # the native ESP-IDF toolchain too. esp32.flash_mode is the replacement that
  # works under both frameworks.
  flash_mode: dio
  framework:
    type: arduino


# Allow Over-The-Air updates
ota: 
  - platform: esphome
    password: ""

# ==============================================================================
# COMMON SENSORS - System Monitoring
# ==============================================================================
# ==============================================================================
# TEXT SENSORS - Device Information
# ==============================================================================
text_sensor:
  # Firmware / hardware version shown in the custom web UI header. Published once
  # at boot from the compile-time project_version + hw_version substitutions.
  - platform: template
    name: "Firmware Version"
    id: firmware_version_sensor
    icon: "mdi:chip"
    update_interval: never

sensor:
  - platform: uptime
    id: uptime_sensor
    name: "Uptime Sensor"
    update_interval: 60s

status_led:
  pin:
    number: GPIO22 #COM LED
    inverted: yes
    
# ==============================================================================
# COMMON SWITCHES - System Controls
# ==============================================================================
switch:
  - platform: gpio
    pin: GPIO26
    name: "Relay 1"
    id: relay_1

  - platform: gpio
    pin: GPIO27
    name: "Relay 2"
    id: relay_2

  - platform: template
    name: "Test SpotLight 1"
    id: test_spotlight_1
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on:
          id: spot_light_1
          brightness: !lambda 'return id(spot1_trigger_brightness).state / 100.0f;'
          transition_length: 0ms
    on_turn_off:
      - light.turn_off:
          id: spot_light_1

  - platform: template
    name: "Test SpotLight 2"
    id: test_spotlight_2
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on:
          id: spot_light_2
          brightness: !lambda 'return id(spot2_trigger_brightness).state / 100.0f;'
          transition_length: 0ms
    on_turn_off:
      - light.turn_off:
          id: spot_light_2

  - platform: template
    name: "Input 1 Sequential"
    id: input1_random_enable
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    # When enabled, plays next MP3 in sequence instead of specific file

  - platform: template
    name: "Input 2 Sequential"
    id: input2_random_enable
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    # When enabled, plays next MP3 in sequence instead of specific file

  - platform: template
    name: "Background Loop Enable"
    id: bg_loop_enable
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_on:
      - lambda: 'id(loop_bg_active) = true;'
      - logger.log: "Background loop enabled"
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - script.execute: play_bg_loop
            - script.execute: bg_loop_start_effect
    on_turn_off:
      - lambda: 'id(loop_bg_active) = false;'
      - logger.log: "Background loop disabled"
      - dfplayer.stop:
          id: dfplayer1
      - script.stop: playback_timeout
      - light.turn_off: spot_light_1
      - light.turn_off: spot_light_2
      - output.turn_off: amp_unmute
      - delay: 10ms
      - output.turn_off: amp_wake


# ==============================================================================
# COMMON BUTTONS - User Controls
# ==============================================================================
button:
  # Fixed name (no ${friendly_name}) so the custom web UI can address it by a
  # known REST path: /button/Restart%20Device/press
  - platform: restart
    id: restart_button
    name: "Restart Device"

  - platform: template
    id: test_play_random_mp3
    name: "Test Play Next MP3"
    on_press:
      # Same path as real triggers: wakes amp, re-sends saved volume, plays,
      # and starts the playback watchdog
      - script.execute: play_random_mp3

  - platform: template
    id: test_input_1
    name: "Test Input 1"
    on_press:
      - script.execute:
          id: run_input1_script
          mp3_override: 0   # local trigger: use the "Input 1 MP3" setting

  - platform: template
    id: test_input_2
    name: "Test Input 2"
    on_press:
      - script.execute:
          id: run_input2_script
          mp3_override: 0   # local trigger: use the "Input 2 MP3" setting



# ==============================================================================
# COMMON OUTPUTS - System Controls
# ==============================================================================
output:
  - platform: gpio
    pin: GPIO21  
    id: mp3_power

  - platform: gpio
    pin: GPIO23  
    id: hb_led

  - platform: gpio
    pin: 
       number: GPIO0
    id: amp_wake  # turn_on = wake, turn_off = sleep
    
  - platform: gpio
    pin: 
       number: GPIO5  
       ignore_strapping_warning: true
       inverted: true
    id: amp_unmute  # turn_on = unmute, turn_off = mute

  - platform: ledc
    pin: GPIO33 
    id: fet_1

  - platform: ledc
    pin: GPIO25
    id: fet_2
 
light:
  - platform: monochromatic
    output: fet_1
    name: "SpotLight 1"
    id: spot_light_1
    internal: true
    default_transition_length: 200ms
    effects:
      - pulse:
          name: "pulse"
          transition_length:
            on_length: 500ms
            off_length: 500ms
          update_interval: 1.0s
      - pulse:
          name: "Fade"
          transition_length: 2s
          update_interval: 4s
          min_brightness: 0%
          max_brightness: 100%
      - strobe:
          name: "Strobe"
          colors:
            - state: true
              duration: 100ms
              brightness: 100%
            - state: false
              duration: 100ms
      - automation:
          name: "Lightning"
          sequence:
            - if:
                condition:
                  lambda: 'return (esp_random() % 3) == 0;'
                then:
                  # SHEET — gradual build, continuous smooth fade
                  - light.turn_on:
                      id: spot_light_1
                      brightness: 20%
                      transition_length: 200ms
                  - delay: 200ms
                  - light.turn_on:
                      id: spot_light_1
                      brightness: 45%
                      transition_length: 300ms
                  - delay: 300ms
                  - light.turn_on:
                      id: spot_light_1
                      brightness: !lambda 'return (float)(esp_random() % 21 + 52) / 100.0f;'
                      transition_length: 400ms
                  - delay: !lambda 'return (uint32_t)(400 + esp_random() % 300);'
                  - light.turn_on:
                      id: spot_light_1
                      brightness: 45%
                      transition_length: 300ms
                  - delay: !lambda 'return (uint32_t)(300 + esp_random() % 200);'
                  - light.turn_on:
                      id: spot_light_1
                      brightness: 33%
                      transition_length: 350ms
                  - delay: !lambda 'return (uint32_t)(350 + esp_random() % 200);'
                  - light.turn_on:
                      id: spot_light_1
                      brightness: 23%
                      transition_length: 400ms
                  - delay: !lambda 'return (uint32_t)(400 + esp_random() % 220);'
                  - light.turn_on:
                      id: spot_light_1
                      brightness: 15%
                      transition_length: 400ms
                  - delay: !lambda 'return (uint32_t)(400 + esp_random() % 220);'
                  - light.turn_on:
                      id: spot_light_1
                      brightness: 8%
                      transition_length: 400ms
                  - delay: !lambda 'return (uint32_t)(400 + esp_random() % 200);'
                  - light.turn_on:
                      id: spot_light_1
                      brightness: 4%
                      transition_length: 350ms
                  - delay: !lambda 'return (uint32_t)(350 + esp_random() % 180);'
                  - light.turn_on:
                      id: spot_light_1
                      brightness: 2%
                      transition_length: 300ms
                  - delay: !lambda 'return (uint32_t)(300 + esp_random() % 1501 + 500);'
                else:
                  - if:
                      condition:
                        lambda: 'return (esp_random() % 2) == 0;'
                      then:
                        # SOFT — two dim strokes, smooth 5-step glow
                        - light.turn_on:
                            id: spot_light_1
