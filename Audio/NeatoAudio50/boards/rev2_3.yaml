                            transition_length: 350ms
                        - delay: !lambda 'return (uint32_t)(350 + esp_random() % 180);'
                        - light.turn_on:
                            id: spot_light_1
                            brightness: 2%
                            transition_length: 300ms
                        - delay: !lambda 'return (uint32_t)(300 + esp_random() % 1001 + 300);'
                      else:
