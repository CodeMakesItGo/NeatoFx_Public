# ==============================================================================
# GLOBAL VARIABLES - Common State Management
# ==============================================================================
globals:
  - id: button_counter
    type: int
    restore_value: no
    initial_value: '1'  # Start from 1
  - id: loop_bg_active
    type: bool
    restore_value: yes
    initial_value: 'false'