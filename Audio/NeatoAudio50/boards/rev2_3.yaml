                            transition_length: 0ms
                        - delay: !lambda 'return (uint32_t)(esp_random() % 61 + 50);'
                        - light.turn_on:
                            id: spot_light_1
                            brightness: !lambda 'return (float)(esp_random() % 13 + 8) / 100.0f;'
