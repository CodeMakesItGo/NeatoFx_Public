                            transition_length: 0ms
                        - delay: !lambda 'return (uint32_t)(esp_random() % 71 + 60);'
                        - light.turn_on:
                            id: spot_light_1
                            brightness: !lambda 'return (float)(esp_random() % 23 + 28) / 100.0f;'
                            transition_length: 0ms
                        - delay: !lambda 'return (uint32_t)(esp_random() % 51 + 40);'
                        - light.turn_on:
                            id: spot_light_1
                            brightness: 22%
                            transition_length: 250ms
                        - delay: !lambda 'return (uint32_t)(250 + esp_random() % 150);'
                        - light.turn_on:
                            id: spot_light_1
                            brightness: 14%
                            transition_length: 300ms
                        - delay: !lambda 'return (uint32_t)(300 + esp_random() % 180);'
                        - light.turn_on:
                            id: spot_light_1
                            brightness: 8%
                            transition_length: 350ms
                        - delay: !lambda 'return (uint32_t)(350 + esp_random() % 200);'
                        - light.turn_on:
                            id: spot_light_1
