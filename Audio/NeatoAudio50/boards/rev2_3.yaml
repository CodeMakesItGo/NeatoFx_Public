    initial_option: "Lightning"
    options:
      - "Fade"
      - "Strobe"
      - "Lightning"


# ==============================================================================
# GLOBAL VARIABLES - Common State Management
# ==============================================================================
globals:
  - id: button_counter
    type: int
    restore_value: no
    initial_value: '1'  # Start from 1
  - id: loop_bg_active
    type: bool
    restore_value: no      # derived from the bg_loop_enable switch (single source
    initial_value: 'false' # of truth); synced at boot and by the switch triggers

  - id: boot_complete
    type: bool
    restore_value: no
    initial_value: 'false'
