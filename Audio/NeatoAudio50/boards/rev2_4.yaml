# Shared base packages — common to all NEATO-FX devices
packages:
  esphome_base: !include ../../../_shared/esphome_base.yaml

# ==============================================================================
# SUBSTITUTIONS - Device Identification
# ==============================================================================
substitutions:
  # Default ID - override with -s id XXXX command line parameter
  id: "0000"                     # Default speaker ID
  name: speaker-${id}
  friendly_name: "NEATO Speaker ${id}"
  project_name: "CodeMakesItGo.Speaker"
  project_version: "1.0.0"

# ==============================================================================
# ESPHOME BOOT SEQUENCE
# ==============================================================================
esphome:
  on_boot:
    - priority: 900  # Force relays off before GPIO init completes
      then:
      - switch.turn_off: relay_1
      - switch.turn_off: relay_2
      - logger.log: "Boot: Relays forced OFF (boot-safe init)"
    - priority: 300
      then:
      - output.turn_off: amp_unmute  # Keep muted
      - output.turn_off: amp_wake    # Keep asleep
      - output.turn_on: hb_led
      - logger.log: "Boot: Resetting DFPlayer..."
      - dfplayer.reset:
          id: dfplayer1
      - delay: 3000ms  # Wait for DFPlayer SD card mount after reset
      - dfplayer.set_volume:
          id: dfplayer1
          volume: !lambda 'return (int)id(dfplayer_volume).state;'
      - logger.log: "Boot complete - DFPlayer ready at saved volume"
      - lambda: 'id(boot_complete) = true;'
      - light.turn_off:
          id: spot_light_1
      - light.turn_off:
          id: spot_light_2
      - if:
          condition:
            lambda: 'return id(loop_bg_active);'
          then:
            - script.execute: play_bg_loop
            - script.execute: bg_loop_start_effect
      #- dfplayer.play_mp3:
      #    id: dfplayer1
      #    file: 2
      #- logger.log: "Playing boot MP3 #2"
      #- script.execute: playback_timeout

# ==============================================================================
# ESP32 FRAMEWORK - Common Settings
# ==============================================================================
esp32:
  board: esp32dev
  framework:
    type: arduino

# ==============================================================================
# COMMON SENSORS - System Monitoring
# ==============================================================================
sensor:
  - platform: uptime
    id: uptime_sensor
    name: "Uptime Sensor"
    update_interval: 60s

status_led:
  pin:
    number: GPIO23 #COM LED
    inverted: yes
    
# ==============================================================================
# COMMON SWITCHES - System Controls
# ==============================================================================
switch:
  - platform: gpio
    pin: GPIO26
    name: "Relay 1"
    id: relay_1
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin: GPIO27
    name: "Relay 2"
    id: relay_2
    restore_mode: ALWAYS_OFF

  - platform: template
    name: "Background Loop Enable"
    id: bg_loop_enable
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_on:
      - lambda: 'id(loop_bg_active) = true;'
      - logger.log: "Background loop enabled"
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - script.execute: play_bg_loop
            - script.execute: bg_loop_start_effect
    on_turn_off:
      - lambda: 'id(loop_bg_active) = false;'
      - logger.log: "Background loop disabled"
      - dfplayer.stop:
          id: dfplayer1
      - script.stop: playback_timeout
      - switch.turn_off: relay_1
      - switch.turn_off: relay_2
      - light.turn_off: spot_light_1
      - light.turn_off: spot_light_2
      - output.turn_off: amp_unmute
      - delay: 10ms
      - output.turn_off: amp_wake

  - platform: template
    name: "Test SpotLight 1"
    id: test_spotlight_1
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on:
          id: spot_light_1
          brightness: !lambda 'return id(spot1_trigger_brightness).state / 100.0f;'
          transition_length: 0ms
    on_turn_off:
      - light.turn_off:
          id: spot_light_1

  - platform: template
    name: "Test SpotLight 2"
    id: test_spotlight_2
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on:
          id: spot_light_2
          brightness: !lambda 'return id(spot2_trigger_brightness).state / 100.0f;'
          transition_length: 0ms
    on_turn_off:
      - light.turn_off:
          id: spot_light_2

  - platform: template
    name: "Input 1 Sequential"
    id: input1_random_enable
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    # When enabled, plays next MP3 in sequence instead of specific file

  - platform: template
    name: "Input 2 Sequential"
    id: input2_random_enable
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    # When enabled, plays next MP3 in sequence instead of specific file


# ==============================================================================
# COMMON BUTTONS - User Controls
# ==============================================================================
button:
  - platform: restart
    id: restart_button
    name: "Restart ${friendly_name}"

  - platform: template
    id: test_play_random_mp3
    name: "Test Play Next MP3"
    on_press:
      - lambda: |-
          int max_files = (int)id(max_mp3_files).state;
          id(button_counter) += 1;
          if (id(button_counter) > max_files) id(button_counter) = 1;
          ESP_LOGD("test", "Playing sequential MP3: %d", id(button_counter));
          id(dfplayer1).play_mp3(id(button_counter));
      - output.turn_on: amp_wake    # Wake amp
      - delay: 50ms                 # Let amp stabilize
      - output.turn_on: amp_unmute  # Unmute

  - platform: template
    id: test_input_1
    name: "Test Input 1"
    on_press:
      - script.execute: run_input1_script

  - platform: template
    id: test_input_2
    name: "Test Input 2"
    on_press:
      - script.execute: run_input2_script



# ==============================================================================
# COMMON OUTPUTS - System Controls
# ==============================================================================
output:
  - platform: gpio
    pin: GPIO22
    id: hb_led

  - platform: gpio
    pin: 
       number: GPIO0
    id: amp_wake  # turn_on = wake, turn_off = sleep
    
  - platform: gpio
    pin: 
       number: GPIO5  
       ignore_strapping_warning: true
       inverted: true
    id: amp_unmute  # turn_on = unmute, turn_off = mute

  - platform: ledc
    pin: GPIO33 
    id: fet_1

  - platform: ledc
    pin: GPIO25
    id: fet_2
 
light:
  - platform: monochromatic
    output: fet_1
    name: "SpotLight 1"
    id: spot_light_1
    internal: true
    effects:
      - pulse:
          name: "pulse"
          transition_length:
            on_length: 500ms
            off_length: 500ms
          update_interval: 1.0s
      - pulse:
          name: "Fade"
          transition_length: 2s
          update_interval: 4s
          min_brightness: 0%
          max_brightness: 100%
      - strobe:
          name: "Strobe"
          colors:
            - state: true
              duration: 100ms
              brightness: 100%
            - state: false
              duration: 100ms
      - automation:
          name: "Lightning"
          sequence:
            - if:
                condition:
                  lambda: 'return (esp_random() % 3) == 0;'
                then:
                  # SHEET — gradual build, continuous smooth fade
                  - light.turn_on:
                      id: spot_light_1
                      brightness: 20%
                      transition_length: 200ms
                  - delay: 200ms
