      number: GPIO32
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - logger.log: "Push Button Pressed"

# ==============================================================================
# USER CONTROLS - Numbers and Selects
# ==============================================================================
number:
  - platform: template
    name: "DFPlayer Volume"
    id: dfplayer_volume
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 5
    restore_value: true    # This ensures the value is restored after a reboot
    optimistic: true       # Ensures the UI reflects the current value
    set_action:
      - dfplayer.set_volume:
          id: dfplayer1
          volume: !lambda 'return (int)x;'

  - platform: template
    name: "Input 1 MP3"
    id: input1_mp3_select
    min_value: 0
    max_value: 255
    step: 1
    mode: box              # Display as input box instead of slider
    initial_value: 1       # Changed from 0 to 1 so it will play by default
    restore_value: true
    optimistic: true
    # 0 = None (no MP3)
    # 1-255 = Specific MP3 file

  - platform: template
    name: "Input 2 MP3"
    id: input2_mp3_select
    min_value: 0
    max_value: 255
    step: 1
    mode: box              # Display as input box instead of slider
    initial_value: 1
    restore_value: true
    optimistic: true
    # 0 = None (no MP3)
    # 1-255 = Specific MP3 file

  - platform: template
    name: "Background Loop MP3"
    id: bg_loop_mp3_select
    min_value: 1
    max_value: 255
    step: 1
    mode: box
    initial_value: 1
    restore_value: true
    optimistic: true
    # MP3 file number to loop continuously in the background

  - platform: template
    name: "Max MP3 Files"
    id: max_mp3_files
    min_value: 1
    max_value: 255
    step: 1
    mode: box
    initial_value: 32
    restore_value: true
    optimistic: true
    # Sets the maximum number of MP3 files on SD card for sequential playback

  - platform: template
    name: "Playback Timeout"
    id: playback_timeout_seconds
    min_value: 5
    max_value: 300
    step: 5
    mode: box
    initial_value: 60
    restore_value: true
    optimistic: true
    unit_of_measurement: "s"
    # Timeout in seconds - resets DFPlayer if playback gets stuck

  - platform: template
    name: "SpotLight 1 Trigger Brightness"
    id: spot1_trigger_brightness
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 100
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"

  - platform: template
    name: "SpotLight 2 Trigger Brightness"
    id: spot2_trigger_brightness
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 100
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"

# ==============================================================================
# SELECT CONTROLS - Output Selection
# ==============================================================================
select:
  - platform: template
    name: "Input 1 Output"
    id: input1_output_select
    optimistic: true
    restore_value: true
    initial_option: "None"
    options:
      - "None"
      - "Relay 1"
      - "Relay 2"
      - "FET 1"
      - "FET 2"

  - platform: template
    name: "Input 2 Output"
    id: input2_output_select
    optimistic: true
    restore_value: true
    initial_option: "None"
    options:
      - "None"
      - "Relay 1"
      - "Relay 2"
      - "FET 1"
      - "FET 2"

  - platform: template
    name: "BG Loop FET Output"
    id: bg_loop_fet_select
    optimistic: true
    restore_value: true
    initial_option: "FET 1"
    options:
      - "None"
      - "FET 1"
      - "FET 2"

  - platform: template
    name: "BG Loop FET Effect"
    id: bg_loop_effect_select
    optimistic: true
    restore_value: true
    initial_option: "Lightning"
    options:
      - "Fade"
      - "Strobe"
      - "Lightning"

# ==============================================================================
# GLOBAL VARIABLES - Common State Management
# ==============================================================================
globals:
  - id: loop_bg_active
    type: bool
    restore_value: yes
    initial_value: 'true'

  - id: boot_complete
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: button_counter
    type: int
    restore_value: no
    initial_value: '1'  # Start from 1

