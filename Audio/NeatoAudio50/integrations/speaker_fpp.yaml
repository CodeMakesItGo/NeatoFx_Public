
# ==============================================================================
# SUBSTITUTIONS - Configuration Variables
# ==============================================================================
substitutions:
  fpp_playlist_name: "test"    # Change this to your desired FPP playlist name
  fpp_ip_addr: "192.168.8.150"  # Change this to your FPP Server IP

# ==============================================================================
# HTTP client for FPP (Falcon Player) communication
# ==============================================================================
http_request:
  useragent: esphome/device
  verify_ssl: false
  timeout: 3s  # Shorter global timeout to prevent blocking

# ==============================================================================
# TEXT SENSORS - FPP Server Status
# ==============================================================================
text_sensor:
  # FPP Server status text sensor  
  - platform: template
    name: "FPP Server Status"
    id: fpp_status
    lambda: 'return {"Unknown"};'

# ==============================================================================
# Simple FPP Control - Single Test Playlist Button
# ==============================================================================
button:
  - platform: template
    id: fpp_start_button
    name: "▶️ Start FPP Playlist"
    icon: "mdi:play"
    on_press:
      - script.execute: fpp_start_playlist

# ==============================================================================
# TEXT INPUT - FPP IP Configuration
# ==============================================================================
text:
  - platform: template
    name: "FPP Server IP Address"
    id: fpp_ip_input
    optimistic: true
    min_length: 7
    max_length: 15
    initial_value: ${fpp_ip_addr}
    restore_value: true
    mode: text
    set_action:
      - lambda: |-
          id(fpp_ip_addr) = x;
          ESP_LOGI("FPP", "IP Address updated to: %s", x.c_str());
          id(fpp_status).publish_state("IP Updated: " + x);

# ==============================================================================
# GLOBAL VARIABLES
# ==============================================================================
globals:
  # FPP Server IP address for LED control
  - id: fpp_ip_addr
    type: std::string
    restore_value: true
    initial_value: ${fpp_ip_addr}  # Change this to your FPP Server IP


# ==============================================================================
# SCRIPTS - FPP Playlist Control
# ==============================================================================
script:
  - id: fpp_start_playlist
    mode: single  # Prevent overlapping requests
    then:
      - logger.log: "🎯 Starting FPP playlist (truly non-blocking)..."
      - if:
          condition:
            wifi.connected:
          then:
            # NOTE: raw WiFiClient sockets stopped compiling on ESPHome 2026's
            # espidf-based builds. Use the http_request component declared above
            # instead — its 3s global timeout keeps the call from stalling the loop.
            - http_request.get:
                url: !lambda |-
                  return "http://" + id(fpp_ip_addr) +
                         "/api/command/Start%20Playlist/" +
                         std::string("${fpp_playlist_name}");
                capture_response: false
          else:
            - logger.log: "❌ WiFi not connected!"
            - lambda: |-
                id(fpp_status).publish_state("WiFi Disconnected");