# ==============================================================================
# NEATO AUDIO 50 - MAIN CONFIGURATION FILE
# ==============================================================================
# Usage:
# ONE BINARY for every unit — there is no per-unit build.
#
#   esphome compile main.yaml
#   esphome run     main.yaml
#   esphome logs    main.yaml
#   Then set the Device ID from the device web interface.
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS - Device Identification
# ==============================================================================
substitutions:
  # ONE BINARY: there is no build-time id substitution. ESPHome appends the MAC
  # suffix to the hostname at runtime (see _shared/esphome_base.yaml), giving
  # each unit a unique, permanent hostname. Logical identity is the runtime
  # Device ID, assigned from the web UI and stored in flash.
  name: audio
  name_add_mac_suffix: "true"
  friendly_name: "NeatoFx Audio"
  runtime_name_label: "Audio Name"

# ==============================================================================
# PACKAGES
# ==============================================================================
packages:
  # Runtime identity — in main.yaml so standalone builds get it too.
  runtime_id: !include ../../_shared/runtime_id.yaml

  # Hardware — select one board revision:
  board:          !include boards/rev2_4.yaml    # Rev 2.4 / 2.5 / 2.6 (current production)
  #board:         !include boards/rev2_3.yaml    # Rev 2.3 (mp3_power on GPIO21)

  # RFTX connector — select one mode:
  # NOTE: this line also decides whether the RF A/B/C/D receiver controls (MP3 #,
  # Sequential, Output) are visible. The on-board RF receiver itself (Remote
  # BtnA-D, GPIO36/2/15/35 in the board file) is wired up in ALL three modes and
  # always runs run_rf_*_script — but rftx_none marks those controls internal and
  # pins each RF MP3 # to 0 (None), so the UI shows nothing and a remote press
  # plays nothing. Use outputs or inputs to get the RF Receiver card back.
  #rftx:           !include boards/common/rftx_outputs.yaml   # RFTX as RF transmitter outputs (default)
  #rftx:          !include boards/common/rftx_inputs.yaml    # RFTX as 4 trigger inputs
  rftx:          !include boards/common/rftx_none.yaml      # RFTX unused (hides all RF controls from UI)

  # Network mode — select one:
  #config:        !include configs/standalone.yaml       # Device's own AP, no router
  #config:        !include configs/networked.yaml        # Router, no HA server (No-HA LAN)
  config:         !include configs/home_assistant.yaml   # Router + Home Assistant server

  # Optional integrations (uncomment to enable):
  #fpp_file:      !include integrations/speaker_fpp.yaml

  # Scripts (customize in these files, not here)
  trigger_scripts: !include scripts/trigger_scripts.yaml
  audio_scripts:   !include scripts/audio_control.yaml

# ==============================================================================
# WEB INTERFACE - Custom NeatoFx dashboard (boards/common/custom_ui.js)
# ==============================================================================
# js_include embeds the custom UI into the firmware so it works with no
# internet (AP/standalone mode included). js_url "" stops the page from also
# pulling the default ESPHome UI from the CDN; local: false skips embedding the
# default UI assets (the custom UI has a switch-to-default button that loads
# them from the CDN when internet is available).
web_server:
  local: false
  js_url: ""
  js_include: "boards/common/custom_ui.js"

# ==============================================================================
# DEBUGGING
# ==============================================================================
logger:
  level: WARN   # TEMP: troubleshooting DFPlayer "track not found" — shows
                 # "Playing file X in mp3 folder". Set back to WARN for production.
