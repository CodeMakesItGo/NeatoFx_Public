# ==============================================================================
# NEATO AUDIO 50 - MAIN CONFIGURATION
# Board: Rev 2.4  |  RFTX: Output (RF Transmitter)
# ==============================================================================
# Use program.sh to select board/RFTX variant — do not edit packages directly.
#
# Variants:
#   main.yaml              Rev 2.4 + RFTX as transmitter outputs  (default)
#   main_rftx.yaml         Rev 2.4 + RFTX as 4 trigger inputs
#   main_rev2_3.yaml       Rev 2.3 + RFTX as transmitter outputs
#   main_rev2_3_rftx.yaml  Rev 2.3 + RFTX as 4 trigger inputs
#
# Compile directly:
#   esphome -s id 1 compile main.yaml
#   esphome -s id 1 compile main_rftx.yaml
# ==============================================================================

substitutions:
  id: "1"
  name: audio-${id}
  friendly_name: "NEATO Audio ${id}"

packages:
  # Hardware
  board:          !include boards/rev2_4.yaml
  rftx:           !include boards/rftx_outputs.yaml

  # Network / standalone mode — swap these lines to switch:
  #config_file:   !include configs/standalone.yaml
  config_file:    !include configs/networked.yaml

  # Optional integrations (uncomment to enable):
  #fpp_file:      !include integrations/speaker_fpp.yaml
  #linear_actuator: !include scripts/linear_actuator_out_in.yaml

  # Scripts (customize in these files, not here)
  trigger_scripts: !include scripts/trigger_scripts.yaml
  audio_scripts:   !include scripts/audio_control.yaml

logger:
  level: WARN
  baud_rate: 0
