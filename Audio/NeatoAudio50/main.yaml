# ==============================================================================
# NEATO AUDIO 50 - MAIN CONFIGURATION FILE
# ==============================================================================
# Usage:
# ONE BINARY for every unit — there is no per-unit build.
#
#   esphome compile main.yaml
#   esphome run     main.yaml
#   esphome logs    main.yaml
#   Then set the Device ID from the device web interface.
#
# Program a unit at a specific IP address (OTA over the network — use this when
# the .local name doesn't resolve, or to pick one unit out of several):
#   esphome run     Audio/NeatoAudio50/main.yaml --device 192.168.1.50
#   esphome upload  Audio/NeatoAudio50/main.yaml --device 192.168.1.50   # already compiled
#   esphome logs    Audio/NeatoAudio50/main.yaml --device 192.168.1.50
# Replace 192.168.1.50 with the unit's IP (shown in its web UI under Debug, or
# in your router's client list). Or open http://<ip>/ in a browser and install
# a compiled firmware.ota.bin from the unit's web page (firmware update / OTA
# section) — no internet needed. A brand-new unit with no firmware is flashed
# over USB instead:
#   esphome run     Audio/NeatoAudio50/main.yaml --device /dev/cu.usbserial-XXXX
#
# ------------------------------------------------------------------------------
# Author:   W. Jason Altice <jason.altice@neatofx.com>
# Company:  NeatoFx — https://neatofx.com
# Support:  jason.altice@neatofx.com
#
# Copyright (c) 2026 CodeMakesItGo. Released under the MIT License — see the
# LICENSE file in the repository root for the full terms. This configuration is
# provided "AS IS", without warranty of any kind, express or implied.
#
# Safety: NeatoFx devices can switch relays, motors and external power. Wiring
# to mains voltage, motors or other hazardous loads must be done by a qualified
# person in line with local electrical codes. You are responsible for the safe
# installation and operation of the equipment this firmware controls.
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS - Device Identification
# ==============================================================================
substitutions:
  # ONE BINARY: there is no build-time id substitution. ESPHome appends the MAC
  # suffix to the hostname at runtime (see _shared/esphome_base.yaml), giving
  # each unit a unique, permanent hostname. Logical identity is the runtime
  # Device ID, assigned from the web UI and stored in flash.
  name: audio
  friendly_name: "NeatoFx Audio"
  runtime_name_label: "Audio Name"

# ==============================================================================
# PACKAGES
# ==============================================================================
packages:
  # Runtime identity — in main.yaml so standalone builds get it too.
  runtime_id: !include ../../_shared/runtime_id.yaml

  # Hardware — select one board revision:
  board:          !include boards/rev2_4.yaml    # Rev 2.4 / 2.5 / 2.6 (current production)
  #board:         !include boards/rev2_3.yaml    # Rev 2.3 (mp3_power on GPIO21)

  # RFTX connector — Off / Inputs / Outputs chosen at runtime ("RFTX Mode"
  # select, default Off), plus RF TX Power. See the file for why a wrong mode
  # is harmless to whatever is plugged in.
  rftx:           !include boards/common/rftx.yaml
  # On-board RF receiver (Remote A-D) — independent of RFTX; on/off at runtime
  # ("RF Receiver Enabled").
  rf_receiver:    !include boards/common/rf_receiver.yaml

  # Network mode — select one:
  #config:        !include configs/standalone.yaml       # Device's own AP, no router
  #config:        !include configs/networked.yaml        # Router, no HA server (No-HA LAN)
  config:         !include configs/home_assistant.yaml   # Router + Home Assistant server

  # Optional integrations (uncomment to enable):
  #fpp_file:      !include integrations/speaker_fpp.yaml

  # Scripts (customize in these files, not here)
  trigger_scripts: !include scripts/trigger_scripts.yaml
  audio_scripts:   !include scripts/audio_control.yaml

# ==============================================================================
# WEB INTERFACE - Custom NeatoFx dashboard (boards/common/custom_ui.js)
# ==============================================================================
# js_include embeds the custom UI into the firmware so it works with no
# internet (AP/standalone mode included). js_url "" stops the page from also
# pulling the default ESPHome UI from the CDN; local: false skips embedding the
# default UI assets. Nothing needs the default UI: firmware updates install
# from the custom UI's Firmware Update card (POST /update, ota: web_server).
web_server:
  local: false
  js_url: ""
  js_include: "boards/common/custom_ui.js"

# ==============================================================================
# DEBUGGING - log level
# ==============================================================================
# Two settings:
#   level          what is COMPILED IN. Messages below it are stripped from the
#                  firmware and can never be shown without a reflash. DEBUG
#                  keeps the troubleshooting detail available in the field.
#   initial_level  what the unit RUNS at after every boot. Shipped firmware
#                  must be WARN — tools/lint_repo.py fails any other value.
#
# To troubleshoot a unit, pick a louder level from the "Log Level" dropdown
# (web UI › Diagnostics) and watch the Device Log panel under it — the web
# server streams the log to the page in every network mode, no USB or internet
# needed (`esphome logs main.yaml --device <ip>` also works on Home Assistant
# builds). It drops back to WARN on the next reboot. No reflash needed.
# (DFPlayer "track not found": DEBUG shows "Playing file X in mp3 folder".)
#
# Levels, quietest first — each shows its own messages plus every one above it.
# Select EXACTLY ONE for initial_level:
#   NONE          nothing at all — no log output
#   ERROR         errors only: things that failed
#   WARN          SHIPPED: errors + warnings — quiet, and enough to diagnose a fault
#   INFO          + normal events (triggers, playback started, WiFi connect)
#   CONFIG        + each component's settings, printed at boot
#   DEBUG         + detailed troubleshooting (DFPlayer commands, every state
#                 change) — busy; streaming it can slow the web UI on phones
#   VERBOSE       + internal component chatter — very busy (needs level: VERBOSE)
#   VERY_VERBOSE  + everything, incl. low-level traffic — floods the log and can
#                 disturb timing (needs level: VERY_VERBOSE)
logger:
  level: DEBUG          # compiled in: up to DEBUG is available at runtime
  initial_level: WARN   # runs at after every boot — keep WARN for shipped firmware

# "Log Level" dropdown — changes the running level on the spot (options run
# NONE..DEBUG, up to the compiled level). Not saved: every boot starts at
# initial_level.
select:
  - platform: logger
    name: "Log Level"
