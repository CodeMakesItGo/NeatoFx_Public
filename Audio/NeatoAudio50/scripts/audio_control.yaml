# ==============================================================================
# NEATO AUDIO 50 - AUDIO CONTROL SCRIPTS
# ==============================================================================
# This file contains all DFPlayer MP3 playback scripts. These define what audio
# plays in response to each input trigger. Included by speaker_main.yaml.
#
# Scripts:
#   play_sound_script  - Play one MP3 by number (the shared play implementation)
#   playback_timeout   - Watchdog: resets DFPlayer if playback stalls
#   play_bg_loop       - Plays a looping background track
#   play_random_mp3    - Plays next MP3 in sequence (cycles through all files)
#   play_input1_mp3    - Plays MP3 assigned to Input 1
#   play_input2_mp3    - Plays MP3 assigned to Input 2
#   play_rf_a_mp3      - Plays MP3 assigned to RF channel A
#   play_rf_b_mp3      - Plays MP3 assigned to RF channel B
#   play_rf_c_mp3      - Plays MP3 assigned to RF channel C
#   play_rf_d_mp3      - Plays MP3 assigned to RF channel D
# ==============================================================================

script:
  # ==========================================================================
  # PLAY ONE MP3 - the shared play implementation
  # ==========================================================================
  # Every "just play file N" caller goes through here: the Net Play REST
  # endpoint, the Home Assistant play_sound action, and the device-ID sound
  # subscription (all in configs/home_assistant.yaml). One implementation means
  # the amp sequence cannot drift between entry points — which it had: Net Play
  # used to play WITHOUT setting the volume first, so a DFPlayer that missed the
  # boot-time set_volume (the SD mount can outlast the boot delay) would play
  # that sound at its power-on default of 30 = full volume.
  #
  # Order matters. The volume MUST be set while the amp is still muted: the
  # command steps the DFPlayer's DAC output to the new level, and an unmuted amp
  # reproduces that step as an audible pop.
  - id: play_sound_script
    mode: queued
    parameters:
      mp3: int    # 1-255 = file number; anything else is ignored and logged
    then:
      - if:
          condition:
            lambda: 'return mp3 >= 1 && mp3 <= 255;'
          then:
            - logger.log:
                format: "play_sound: playing MP3 %d"
                args: ['mp3']
            - output.turn_on: amp_wake     # Wake amp first
            - delay: 50ms                  # Let amp stabilize
            - dfplayer.set_volume:         # While still muted — see above
                id: dfplayer1
                volume: !lambda 'return (int)id(dfplayer_volume).state;'
            - delay: 100ms
            - output.turn_on: amp_unmute
            - delay: 50ms
            - lambda: 'id(dfplayer1).play_mp3(mp3);'
            - script.execute: playback_timeout
          else:
            - logger.log:
                format: "play_sound: ignoring out-of-range MP3 %d"
                args: ['mp3']

  - id: playback_timeout
    mode: restart  # Restart timer if new playback starts
    then:
      - delay: !lambda 'return (int)id(playback_timeout_seconds).state * 1000;'
      - logger.log:
          level: ERROR
          format: "Playback timeout! MP3 player stuck, resetting..."
      # Turn off all outputs
      - output.turn_off: amp_unmute
      - output.turn_off: amp_wake
      - switch.turn_off: relay_1
      - switch.turn_off: relay_2
      - light.turn_off: spot_light_1
      - light.turn_off: spot_light_2
      # Reset DFPlayer
      - dfplayer.reset:
          id: dfplayer1
      - delay: 1000ms
      - dfplayer.set_device:
          id: dfplayer1
          device: TF_CARD
      - delay: 500ms
      - dfplayer.set_volume:
          id: dfplayer1
          volume: !lambda 'return (int)id(dfplayer_volume).state;'
      - logger.log: "DFPlayer reset complete"
      - if:
          condition:
            lambda: 'return id(loop_bg_active);'
          then:
            - script.execute: play_bg_loop
            - script.execute: bg_loop_start_effect

  - id: bg_loop_start_effect
    mode: restart
    then:
      - lambda: |-
          std::string fet = id(bg_loop_fet_select).current_option();
          std::string effect = id(bg_loop_effect_select).current_option();
          if (fet == "PWR 1") {
            auto call = id(spot_light_1).turn_on();
            call.set_effect(effect.c_str());
            call.perform();
          } else if (fet == "PWR 2") {
            auto call = id(spot_light_2).turn_on();
            call.set_effect(effect.c_str());
            call.perform();
          }

  - id: play_bg_loop
    mode: restart
    then:
      - lambda: |-
          ESP_LOGI("bg_loop", "Background loop: playing MP3 #%d", (int)id(bg_loop_mp3_select).state);
      - output.turn_on: amp_wake
      - delay: 50ms
      # Volume MUST be set while the amp is still muted. This command steps the
      # DFPlayer's DAC output to the new level, and an unmuted amp reproduces
      # that step as an audible pop. Re-sent before every play because the
      # DFPlayer powers up (and resets) at volume 30 = max: if it missed the
      # boot-time set_volume — SD mount can outlast the boot delay — it would
      # otherwise blast full volume while the UI shows the saved value.
      - dfplayer.set_volume:
          id: dfplayer1
          volume: !lambda 'return (int)id(dfplayer_volume).state;'
      - delay: 100ms
      - output.turn_on: amp_unmute
      - delay: 50ms
      - dfplayer.play_mp3:
          id: dfplayer1
          file: !lambda 'return (int)id(bg_loop_mp3_select).state;'
      - script.execute: playback_timeout

  - id: play_random_mp3
    mode: queued
    then:
      - logger.log: "Random MP3 script started"
       # Wake + unmute the amp BEFORE playing; volume is set while still muted
      - logger.log: "Waking amp..."
      - output.turn_on: amp_wake    # Wake amp first
      - delay: 50ms                 # Let amp stabilize
      # Volume MUST be set while the amp is still muted. This command steps the
      # DFPlayer's DAC output to the new level, and an unmuted amp reproduces
      # that step as an audible pop. Re-sent before every play because the
      # DFPlayer powers up (and resets) at volume 30 = max: if it missed the
      # boot-time set_volume — SD mount can outlast the boot delay — it would
      # otherwise blast full volume while the UI shows the saved value.
      - dfplayer.set_volume:
          id: dfplayer1
          volume: !lambda 'return (int)id(dfplayer_volume).state;'
      - delay: 100ms
      - logger.log: "Unmuting amp..."
      - output.turn_on: amp_unmute  # Unmute
      - delay: 50ms
      - logger.log: "Amp awake, unmuted, volume already set"
      - lambda: |-
          id(button_counter) += 1;
          int max_files = (int)id(max_mp3_files).state;
          if (id(button_counter) > max_files) {
              id(button_counter) = 1;
          }
          id(dfplayer1).play_mp3(id(button_counter));
      # Start timeout watchdog AFTER play command is sent
      - script.execute: playback_timeout

  - id: play_input1_mp3
    mode: queued
    parameters:
      mp3_override: int   # 0 = use "Input 1 MP3"; 1-255 = caller-supplied file
    then:
      - logger.log: "Input 1 MP3 script started"
       # Wake + unmute the amp BEFORE playing; volume is set while still muted
      - logger.log: "Waking amp..."
      - output.turn_on: amp_wake    # Wake amp first
      - delay: 50ms                 # Let amp stabilize
      # Volume MUST be set while the amp is still muted. This command steps the
      # DFPlayer's DAC output to the new level, and an unmuted amp reproduces
      # that step as an audible pop. Re-sent before every play because the
      # DFPlayer powers up (and resets) at volume 30 = max: if it missed the
      # boot-time set_volume — SD mount can outlast the boot delay — it would
      # otherwise blast full volume while the UI shows the saved value.
      - dfplayer.set_volume:
          id: dfplayer1
          volume: !lambda 'return (int)id(dfplayer_volume).state;'
      - delay: 100ms
      - logger.log: "Unmuting amp..."
      - output.turn_on: amp_unmute  # Unmute
      - delay: 50ms
      - logger.log: "Amp awake, unmuted, volume already set"

      - lambda: |-
          // Control selected output
          std::string output_choice = id(input1_output_select).current_option();
          ESP_LOGI("input1", "Output selected: %s", output_choice.c_str());
          if (output_choice == "Relay 1") {
            id(relay_1).turn_on();
          } else if (output_choice == "Relay 2") {
            id(relay_2).turn_on();
          } else if (output_choice == "PWR 1") {
            auto call = id(spot_light_1).turn_on();
            call.set_brightness(id(spot1_trigger_brightness).state / 100.0f);
            call.perform();
          } else if (output_choice == "PWR 2") {
            auto call = id(spot_light_2).turn_on();
            call.set_brightness(id(spot2_trigger_brightness).state / 100.0f);
            call.perform();
          }

          // Play MP3
          int mp3_setting = (int)id(input1_mp3_select).state;
          bool random_enabled = id(input1_random_enable).state;
          ESP_LOGI("input1", "MP3 setting: %d, Random: %s, Override: %d", mp3_setting, random_enabled ? "YES" : "NO", mp3_override);

          if (mp3_override >= 1 && mp3_override <= 255) {
            // Caller (Net Trigger) supplied the file — wins over the local
            // "Input 1 MP3" setting and over sequential mode. Everything else
            // above (output routing, brightness, timer) still applies.
            ESP_LOGI("input1", "Playing caller-supplied MP3: %d", mp3_override);
            id(dfplayer1).play_mp3(mp3_override);
          } else if (mp3_setting == 0) {
            // None - do nothing
            ESP_LOGW("input1", "No MP3 assigned (set to 0)");
          } else if (random_enabled) {
            // Sequential mode: advance counter and cycle
            int max_files = (int)id(max_mp3_files).state;
            id(button_counter) += 1;
            if (id(button_counter) > max_files) id(button_counter) = 1;
            ESP_LOGI("input1", "Playing sequential MP3: %d", id(button_counter));
            id(dfplayer1).play_mp3(id(button_counter));
          } else {
            // Specific MP3 (1-255)
            ESP_LOGI("input1", "Playing MP3: %d", mp3_setting);
            id(dfplayer1).play_mp3(mp3_setting);
          }
      - if:
          condition:
            lambda: 'return (int)id(input1_output_timer).state > 0;'
          then:
            - script.execute: input1_output_timer_script
      # Start timeout watchdog AFTER play command is sent
      - script.execute: playback_timeout

  - id: play_input2_mp3
    mode: queued
    parameters:
      mp3_override: int   # 0 = use "Input 2 MP3"; 1-255 = caller-supplied file
    then:
      - logger.log: "Input 2 MP3 script started"
       # Wake + unmute the amp BEFORE playing; volume is set while still muted
      - logger.log: "Waking amp..."
      - output.turn_on: amp_wake    # Wake amp first
      - delay: 50ms                 # Let amp stabilize
      # Volume MUST be set while the amp is still muted. This command steps the
      # DFPlayer's DAC output to the new level, and an unmuted amp reproduces
      # that step as an audible pop. Re-sent before every play because the
      # DFPlayer powers up (and resets) at volume 30 = max: if it missed the
      # boot-time set_volume — SD mount can outlast the boot delay — it would
      # otherwise blast full volume while the UI shows the saved value.
      - dfplayer.set_volume:
          id: dfplayer1
          volume: !lambda 'return (int)id(dfplayer_volume).state;'
      - delay: 100ms
      - logger.log: "Unmuting amp..."
      - output.turn_on: amp_unmute  # Unmute
      - delay: 50ms
      - logger.log: "Amp awake, unmuted, volume already set"

      - lambda: |-
          // Control selected output
          std::string output_choice = id(input2_output_select).current_option();
          if (output_choice == "Relay 1") {
            id(relay_1).turn_on();
          } else if (output_choice == "Relay 2") {
            id(relay_2).turn_on();
          } else if (output_choice == "PWR 1") {
            auto call = id(spot_light_1).turn_on();
            call.set_brightness(id(spot1_trigger_brightness).state / 100.0f);
            call.perform();
          } else if (output_choice == "PWR 2") {
            auto call = id(spot_light_2).turn_on();
            call.set_brightness(id(spot2_trigger_brightness).state / 100.0f);
            call.perform();
          }

          // Play MP3
          int mp3_setting = (int)id(input2_mp3_select).state;
          if (mp3_override >= 1 && mp3_override <= 255) {
            // Caller (Net Trigger) supplied the file — wins over the local
            // "Input 2 MP3" setting and over sequential mode. Everything else
            // above (output routing, brightness, timer) still applies.
            ESP_LOGD("input2", "Playing caller-supplied MP3: %d", mp3_override);
            id(dfplayer1).play_mp3(mp3_override);
          } else if (mp3_setting == 0) {
            // None - do nothing
            ESP_LOGD("input2", "No MP3 assigned");
          } else if (id(input2_random_enable).state) {
            // Sequential mode: advance counter and cycle
            int max_files = (int)id(max_mp3_files).state;
            id(button_counter) += 1;
            if (id(button_counter) > max_files) id(button_counter) = 1;
            ESP_LOGD("input2", "Playing sequential MP3: %d", id(button_counter));
            id(dfplayer1).play_mp3(id(button_counter));
          } else {
            // Specific MP3 (1-255)
            ESP_LOGD("input2", "Playing MP3: %d", mp3_setting);
            id(dfplayer1).play_mp3(mp3_setting);
          }
      - if:
          condition:
            lambda: 'return (int)id(input2_output_timer).state > 0;'
          then:
            - script.execute: input2_output_timer_script
      # Start timeout watchdog
      - script.execute: playback_timeout

  - id: play_rf_a_mp3
    mode: queued
    then:
      - output.turn_on: amp_wake
      - delay: 50ms
      # Set volume while muted — see note in play_random_mp3
      - dfplayer.set_volume:
          id: dfplayer1
          volume: !lambda 'return (int)id(dfplayer_volume).state;'
      - delay: 100ms
      - output.turn_on: amp_unmute
      - delay: 50ms
      - lambda: |-
          std::string output_choice = id(rf_a_output_select).current_option();
          if (output_choice == "Relay 1") { id(relay_1).turn_on(); }
          else if (output_choice == "Relay 2") { id(relay_2).turn_on(); }
          else if (output_choice == "PWR 1") { auto call = id(spot_light_1).turn_on(); call.set_brightness(id(spot1_trigger_brightness).state / 100.0f); call.perform(); }
          else if (output_choice == "PWR 2") { auto call = id(spot_light_2).turn_on(); call.set_brightness(id(spot2_trigger_brightness).state / 100.0f); call.perform(); }
          int mp3_setting = (int)id(rf_a_mp3_select).state;
          if (mp3_setting == 0) { ESP_LOGW("rf_a", "No MP3 assigned"); }
          else if (id(rf_a_random_enable).state) {
            id(button_counter) += 1;
            if (id(button_counter) > (int)id(max_mp3_files).state) id(button_counter) = 1;
            id(dfplayer1).play_mp3(id(button_counter));
          } else { id(dfplayer1).play_mp3(mp3_setting); }
      - script.execute: playback_timeout

  - id: play_rf_b_mp3
    mode: queued
    then:
      - output.turn_on: amp_wake
      - delay: 50ms
      # Set volume while muted — see note in play_random_mp3
      - dfplayer.set_volume:
          id: dfplayer1
          volume: !lambda 'return (int)id(dfplayer_volume).state;'
      - delay: 100ms
      - output.turn_on: amp_unmute
      - delay: 50ms
      - lambda: |-
          std::string output_choice = id(rf_b_output_select).current_option();
          if (output_choice == "Relay 1") { id(relay_1).turn_on(); }
          else if (output_choice == "Relay 2") { id(relay_2).turn_on(); }
          else if (output_choice == "PWR 1") { auto call = id(spot_light_1).turn_on(); call.set_brightness(id(spot1_trigger_brightness).state / 100.0f); call.perform(); }
          else if (output_choice == "PWR 2") { auto call = id(spot_light_2).turn_on(); call.set_brightness(id(spot2_trigger_brightness).state / 100.0f); call.perform(); }
          int mp3_setting = (int)id(rf_b_mp3_select).state;
          if (mp3_setting == 0) { ESP_LOGW("rf_b", "No MP3 assigned"); }
          else if (id(rf_b_random_enable).state) {
            id(button_counter) += 1;
            if (id(button_counter) > (int)id(max_mp3_files).state) id(button_counter) = 1;
            id(dfplayer1).play_mp3(id(button_counter));
          } else { id(dfplayer1).play_mp3(mp3_setting); }
      - script.execute: playback_timeout

  - id: play_rf_c_mp3
    mode: queued
    then:
      - output.turn_on: amp_wake
      - delay: 50ms
      # Set volume while muted — see note in play_random_mp3
      - dfplayer.set_volume:
          id: dfplayer1
          volume: !lambda 'return (int)id(dfplayer_volume).state;'
      - delay: 100ms
      - output.turn_on: amp_unmute
      - delay: 50ms
      - lambda: |-
          std::string output_choice = id(rf_c_output_select).current_option();
          if (output_choice == "Relay 1") { id(relay_1).turn_on(); }
          else if (output_choice == "Relay 2") { id(relay_2).turn_on(); }
          else if (output_choice == "PWR 1") { auto call = id(spot_light_1).turn_on(); call.set_brightness(id(spot1_trigger_brightness).state / 100.0f); call.perform(); }
          else if (output_choice == "PWR 2") { auto call = id(spot_light_2).turn_on(); call.set_brightness(id(spot2_trigger_brightness).state / 100.0f); call.perform(); }
          int mp3_setting = (int)id(rf_c_mp3_select).state;
          if (mp3_setting == 0) { ESP_LOGW("rf_c", "No MP3 assigned"); }
          else if (id(rf_c_random_enable).state) {
            id(button_counter) += 1;
            if (id(button_counter) > (int)id(max_mp3_files).state) id(button_counter) = 1;
            id(dfplayer1).play_mp3(id(button_counter));
          } else { id(dfplayer1).play_mp3(mp3_setting); }
      - script.execute: playback_timeout

  - id: play_rf_d_mp3
    mode: queued
    then:
      - output.turn_on: amp_wake
      - delay: 50ms
      # Set volume while muted — see note in play_random_mp3
      - dfplayer.set_volume:
          id: dfplayer1
          volume: !lambda 'return (int)id(dfplayer_volume).state;'
      - delay: 100ms
      - output.turn_on: amp_unmute
      - delay: 50ms
      - lambda: |-
          std::string output_choice = id(rf_d_output_select).current_option();
          if (output_choice == "Relay 1") { id(relay_1).turn_on(); }
          else if (output_choice == "Relay 2") { id(relay_2).turn_on(); }
          else if (output_choice == "PWR 1") { auto call = id(spot_light_1).turn_on(); call.set_brightness(id(spot1_trigger_brightness).state / 100.0f); call.perform(); }
          else if (output_choice == "PWR 2") { auto call = id(spot_light_2).turn_on(); call.set_brightness(id(spot2_trigger_brightness).state / 100.0f); call.perform(); }
          int mp3_setting = (int)id(rf_d_mp3_select).state;
          if (mp3_setting == 0) { ESP_LOGW("rf_d", "No MP3 assigned"); }
          else if (id(rf_d_random_enable).state) {
            id(button_counter) += 1;
            if (id(button_counter) > (int)id(max_mp3_files).state) id(button_counter) = 1;
            id(dfplayer1).play_mp3(id(button_counter));
          } else { id(dfplayer1).play_mp3(mp3_setting); }
      - script.execute: playback_timeout

  - id: input1_output_timer_script
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t)id(input1_output_timer).state;'
      - lambda: |-
          std::string output_choice = id(input1_output_select).current_option();
          if (output_choice == "Relay 1") {
            id(relay_1).turn_off();
          } else if (output_choice == "Relay 2") {
            id(relay_2).turn_off();
          } else if (output_choice == "PWR 1") {
            auto call = id(spot_light_1).turn_off();
            call.perform();
          } else if (output_choice == "PWR 2") {
            auto call = id(spot_light_2).turn_off();
            call.perform();
          }

  - id: input2_output_timer_script
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t)id(input2_output_timer).state;'
      - lambda: |-
          std::string output_choice = id(input2_output_select).current_option();
          if (output_choice == "Relay 1") {
            id(relay_1).turn_off();
          } else if (output_choice == "Relay 2") {
            id(relay_2).turn_off();
          } else if (output_choice == "PWR 1") {
            auto call = id(spot_light_1).turn_off();
            call.perform();
          } else if (output_choice == "PWR 2") {
            auto call = id(spot_light_2).turn_off();
            call.perform();
          }

