# ==============================================================================
# NEATO AUDIO WHISPER - HARDWARE (Rev 1, ESP32 D1 Mini)
# ==============================================================================
# Minimal MP3 player built around the DY-SV8F voice module.
#
# The DY-SV8F speaks a 0xAA-framed UART protocol (NOT the DFPlayer protocol),
# so it is driven with raw uart.write frames — see scripts/mp3_control.yaml.
#
# DY-SV8F wiring (module must be in UART Mode: DIP CON1=OFF CON2=OFF CON3=ON):
#   ESP32 GPIO21 (TX) ---> module RXD/IO1 (pin 4)
#   ESP32 GPIO22 (RX) <--- module TXD/IO0 (pin 3)
#   ESP32 GPIO17      <--- module BUSY          (playback status)
#   ESP32 GND        ----> module 5V- / GND
#   5V               ----> module 5V+
# ==============================================================================

# Shared base packages — common to all NEATO-FX devices
packages:
  esphome_base: !include ../../../_shared/esphome_base.yaml

# ==============================================================================
# SUBSTITUTIONS - Device Identification
# ==============================================================================
substitutions:
  id: "0000"                      # Default ID - override with -s id XXXX
  name: whisper-${id}
  friendly_name: "NEATO Audio Whisper ${id}"
  project_name: "CodeMakesItGo.AudioWhisper"
  project_version: "1.0.0"

# ==============================================================================
# ESP32 FRAMEWORK
# ==============================================================================
esp32:
  board: esp32dev
  framework:
    type: arduino

# ==============================================================================
# BOOT SEQUENCE
# ==============================================================================
esphome:
  on_boot:
    priority: 300
    then:
      - delay: 1500ms                 # Let the DY-SV8F finish its own boot
      - script.execute:               # Push saved volume to the module
          id: set_volume
          vol: !lambda 'return (int) id(volume).state;'
      - script.execute: query_song_count   # populate "MP3 Song Count" once at boot
      - logger.log: "Boot complete - MP3 module initialized"

# ==============================================================================
# UART - DY-SV8F MP3 module (9600 8N1)
# ==============================================================================
uart:
  id: mp3_uart
  tx_pin: GPIO21   # ESP32 TX -> module RXD/IO1
  rx_pin: GPIO22   # ESP32 RX <- module TXD/IO0
  baud_rate: 9600

# ==============================================================================
# SENSORS
# ==============================================================================
sensor:
  - platform: uptime
    id: uptime_sensor
    name: "Uptime Sensor"
    update_interval: 60s

  # --- DY-SV8F query readouts (published by the RX parser interval) ---------
  # "Song Count" is the key diagnostic: if it exceeds the number of tracks you
  # copied, the module is counting macOS ._ shadow files / hidden entries.
  - platform: template
    name: "MP3 Song Count"
    id: mp3_song_count
    accuracy_decimals: 0
  - platform: template
    name: "MP3 Current Song"
    id: mp3_current_song
    accuracy_decimals: 0

text_sensor:
  - platform: template
    name: "MP3 Play Status"
    id: mp3_play_status

# ==============================================================================
# BINARY SENSORS
# ==============================================================================
binary_sensor:
  # --- DY-SV8F BUSY / playback status (GPIO17) ------------------------------
  # Reports whether the module is currently playing. When playback goes idle we
  # fire on_playback_idle, which resumes a loop that a one-shot play interrupted.
  #
  # POLARITY: must read TRUE while audio is playing. Per the DY-SV8F manual the
  # BUSY pin is active-low (0V = playing, 3.3V = idle), so inverted: true. If the
  # loop never resumes (or resumes immediately/at boot), flip `inverted`.
  - platform: gpio
    id: mp3_playing
    name: "MP3 Playing"
    pin:
      number: GPIO17
      mode:
        input: true
      inverted: true
    filters:
      - delayed_off: 120ms   # mask brief BUSY dips at loop repeat boundaries
    on_release:
      - script.execute: on_playback_idle

  # --- External trigger input (GPIO16) --------------------------------------
  # Grounding GPIO16 fires the delayed play, using the "Test MP3 Number" and
  # "Test Delay (s)" controls (same behavior as the play_mp3_delayed API).
  # Internal pull-up so the pin idles high; inverted so grounded == pressed.
  - platform: gpio
    id: mp3_trigger
    name: "MP3 Trigger"
    pin:
      number: GPIO16
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms     # debounce the contact to ground
    on_press:
      - script.execute:
          id: play_track_delayed
          file: !lambda 'return (int) id(test_mp3_number).state;'
          delay_ms: !lambda 'return (int) (id(test_delay_sec).state * 1000.0f);'

# ==============================================================================
# UART RX PARSER + AUTO-REFRESH - DY-SV8F query replies
# ==============================================================================
# The module answers queries with 0xAA-framed replies: AA <cmd> <len> <data..> SM
# We drain the UART, validate the checksum, and publish the values we care about.
interval:
  # Parse whatever the module has sent back
  - interval: 100ms
    then:
      - lambda: |-
          static std::vector<uint8_t> buf;
          uint8_t b;
          while (id(mp3_uart).available() && id(mp3_uart).read_byte(&b)) {
            buf.push_back(b);
            if (buf.size() > 64) buf.erase(buf.begin());   // runaway guard
          }
          while (buf.size() >= 4) {
            if (buf[0] != 0xAA) { buf.erase(buf.begin()); continue; }
            uint8_t len = buf[2];
            size_t flen = (size_t) len + 4;                // AA cmd len data SM
            if (flen > 32) { buf.erase(buf.begin()); continue; }
            if (buf.size() < flen) break;                  // wait for the rest
            uint8_t sm = 0;
            for (size_t i = 0; i + 1 < flen; i++) sm += buf[i];
            if (sm != buf[flen - 1]) { buf.erase(buf.begin()); continue; }
            uint8_t cmd = buf[1];
            if (cmd == 0x01 && len == 1) {
              const char *s = buf[3] == 0x01 ? "playing"
                            : buf[3] == 0x02 ? "paused" : "stopped";
              id(mp3_play_status).publish_state(s);
            } else if (cmd == 0x0C && len == 2) {
              id(mp3_song_count).publish_state((buf[3] << 8) | buf[4]);
            } else if (cmd == 0x0D && len == 2) {
              id(mp3_current_song).publish_state((buf[3] << 8) | buf[4]);
            }
            buf.erase(buf.begin(), buf.begin() + flen);
          }

  # Keep play status + current-song live in the UI
  - interval: 2s
    then:
      - script.execute: query_play_status
      - script.execute: query_current_song

# ==============================================================================
# USER CONTROLS - Volume + test track selector
# ==============================================================================
number:
  - platform: template
    name: "Volume"
    id: volume
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 20
    restore_value: true
    optimistic: true
    set_action:
      - script.execute:
          id: set_volume
          vol: !lambda 'return (int) x;'

  - platform: template
    name: "Test MP3 Number"
    id: test_mp3_number
    min_value: 1
    max_value: 255
    step: 1
    mode: box
    initial_value: 1
    restore_value: true
    optimistic: true
    # File to play with the "Test Play MP3" / "Test Loop MP3" buttons

  - platform: template
    name: "Test Delay (s)"
    id: test_delay_sec
    min_value: 0
    max_value: 60
    step: 0.5
    mode: box
    initial_value: 3
    restore_value: false   # test-only convenience; not persisted so it does not
    optimistic: true       # shift flash-preference slots (would reset Volume)
    # Delay used by the "Test Delayed Play MP3" button

# ==============================================================================
# BUTTONS
# ==============================================================================
button:
  - platform: restart
    name: "Restart ${friendly_name}"

  - platform: template
    name: "Test Play MP3"
    id: test_play_mp3
    on_press:
      - script.execute:
          id: play_track
          file: !lambda 'return (int) id(test_mp3_number).state;'
          loop: false

  - platform: template
    name: "Test Delayed Play MP3"
    id: test_delayed_play_mp3
    on_press:
      - script.execute:
          id: play_track_delayed
          file: !lambda 'return (int) id(test_mp3_number).state;'
          delay_ms: !lambda 'return (int) (id(test_delay_sec).state * 1000.0f);'

  - platform: template
    name: "Test Loop MP3"
    id: test_loop_mp3
    on_press:
      - script.execute:
          id: play_loop
          file: !lambda 'return (int) id(test_mp3_number).state;'

  - platform: template
    name: "Stop"
    id: test_stop
    on_press:
      - script.stop: play_track_delayed   # cancel a pending delayed play
      - script.execute: stop_track
