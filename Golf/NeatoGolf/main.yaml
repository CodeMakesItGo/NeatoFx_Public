# ==============================================================================
# NEATO GOLF - MAIN CONFIGURATION FILE
# ==============================================================================
# This is the PRIMARY configuration file that assembles all golf components.
# It includes hardware definitions, network configuration, IR protocols,
# and optional integrations like FPP (Falcon Player) support.
#
# ONE BINARY for every unit — there is no per-unit build.
#
# Usage:
#   esphome compile main.yaml
#   esphome run     main.yaml
#   esphome logs    main.yaml
#   Then set the Device ID from the device web interface.
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS - Device Identification
# ==============================================================================
substitutions:
  # ONE BINARY: there is no build-time id substitution. ESPHome appends the MAC
  # suffix to the hostname at runtime (see _shared/esphome_base.yaml), giving
  # each unit a unique, permanent hostname. Logical identity is the runtime
  # Device ID, assigned from the web UI and stored in flash.
  name: golf
  name_add_mac_suffix: "true"
  friendly_name: "NeatoFx Golf"
  runtime_name_label: "Golf Name"

# ==============================================================================
# EXTERNAL PACKAGES
# ==============================================================================
packages:
  # Runtime identity — in main.yaml so standalone builds get it too.
  runtime_id: !include ../../_shared/runtime_id.yaml

  # - For Rev 3.x targets uncomment the next line
  board: !include boards/rev3.yaml

  # Change this manually when changing golf_type:
  # - For standalone: uncomment the next line
  config: !include configs/standalone.yaml
  # - For networked: uncomment the next two lines
  #config: !include configs/networked.yaml

  # Falcon Player Packages (only for networked golf devices)
  # Uncomment BOTH lines below to enable FPP support
  #fpp_file: !include integrations/golf_fpp.yaml

  # Hit behavior script - defines what happens when the golf target is hit
  hit_script: !include scripts/hit_script.yaml

# ==============================================================================
# GOLF HIT SCRIPTS - what to do when target is hit
# ==============================================================================
script:
  # Main Hit Script - do these things when target is hit
  - id: run_hit_script
    mode: parallel
    then:
      - script.execute: target_hit_script
      # Uncomment the next line when FPP package is enabled above
      #- script.execute: fpp_start_playlist
      # Uncomment the next line when you want the target to send an ESPHome event to Home Assistant server
      #- script.execute: esphome_hit_script


# ==============================================================================
# DEBUGGING
# ==============================================================================
logger:
  level: WARN  # Reduced from DEBUG to prevent mobile browser overload
  #level: DEBUG
  baud_rate: 115200  # Non-zero required: improv_serial (networked config) uses serial
