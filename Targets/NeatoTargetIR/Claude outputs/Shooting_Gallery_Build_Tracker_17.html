<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shooting Gallery Build Tracker</title>
<style>
  :root{
    color-scheme: light;
    --surface-1:#fcfcfb; --surface-2:#ffffff; --page:#f3f2ee;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --gridline:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
    --series-1:#2a78d6; /* blue - 12V DC */
    --series-2:#eb6834; /* orange - 110V AC */
    --series-7:#4a3aa7; /* violet - Other power */
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --good-text:#006300;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:var(--page); color:var(--text-primary);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  .layout{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:270px; flex:0 0 270px; background:var(--surface-2);
    border-right:1px solid var(--border); padding:20px 0; position:sticky; top:0;
    height:100vh; overflow-y:auto;
  }
  .brand{padding:0 20px 14px 20px; border-bottom:1px solid var(--gridline); margin-bottom:12px;}
  .brand-name{font-size:16px; font-weight:700; letter-spacing:.2px;}
  .brand-sub{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .nav-section-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); padding:14px 20px 6px 20px; font-weight:600;}
  .nav-link{
    display:flex; align-items:center; gap:8px; padding:9px 20px; font-size:14px; color:var(--text-secondary);
    cursor:pointer; border-left:3px solid transparent;
  }
  .nav-link:hover{background:rgba(11,11,11,0.03); color:var(--text-primary);}
  .nav-link.active{background:rgba(42,120,214,0.08); border-left-color:var(--series-1); color:var(--text-primary); font-weight:600;}
  .nav-link .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}
  .nav-link .lane-tag{margin-left:auto; font-size:11px; color:var(--text-muted); font-weight:400;}

  .mode-toggle{ display:flex; gap:4px; margin:0 20px 14px 20px; background:rgba(11,11,11,0.05); border-radius:8px; padding:3px; }
  .mode-btn{ flex:1; border:none; background:transparent; padding:7px 0; font-size:12px; font-weight:700; border-radius:6px; cursor:pointer; color:var(--text-secondary); font-family:inherit; }
  .mode-btn.active{ background:var(--surface-2); color:var(--text-primary); box-shadow:0 1px 3px rgba(11,11,11,0.14); }

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; padding:28px 36px 60px 36px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .report-logo{margin-bottom:10px;}
  .report-logo svg{width:170px; height:auto; display:block;}
  .crumbs{font-size:13px; color:var(--text-muted);}
  .crumbs b{color:var(--text-primary);}
  .actions{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{
    font-family:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:7px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text-primary); cursor:pointer;
  }
  .btn:hover{background:rgba(11,11,11,0.04);}
  .btn.primary{background:var(--series-1); color:#fff; border-color:var(--series-1);}
  .btn.primary:hover{background:#2367bd;}

  h1{font-size:24px; margin:0 0 4px 0;}
  h2{font-size:18px; margin:0 0 12px 0;}
  h3{font-size:14px; margin:0 0 8px 0; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted);}
  p{line-height:1.55; color:var(--text-secondary); margin:0 0 10px 0;}

  .card{
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:20px; margin-bottom:18px;
  }
  .grid{display:grid; gap:18px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-5{grid-template-columns:repeat(5,1fr);}
  .grid.cols-6{grid-template-columns:repeat(6,1fr);}
  @media (max-width:980px){ .grid.cols-2, .grid.cols-3, .grid.cols-4, .grid.cols-5, .grid.cols-6{grid-template-columns:1fr 1fr;} }

  .stat-tile{background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:16px 18px;}
  .stat-label{font-size:12px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  .stat-value{font-size:24px; font-weight:700; font-variant-numeric:proportional-nums;}
  .stat-sub{font-size:12px; color:var(--text-muted); margin-top:4px;}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:3px 9px; border-radius:99px;}
  .badge .ic{font-size:11px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--text-muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--gridline);}
  td{padding:9px 10px; border-bottom:1px solid var(--gridline); color:var(--text-primary); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  td.num{font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap;}
  th.num{text-align:right;}

  .swatch{display:inline-block; width:14px; height:14px; border-radius:4px; border:1px solid var(--border); vertical-align:-2px; margin-right:6px;}

  .media-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px;}
  .media-tile{display:flex; flex-direction:column; gap:6px;}
  .media-frame{position:relative; aspect-ratio:4/3; border-radius:10px; overflow:hidden;}
  .media-frame.empty{
    border:1px dashed var(--baseline);
    background:repeating-linear-gradient(135deg, rgba(11,11,11,0.035), rgba(11,11,11,0.035) 8px, transparent 8px, transparent 16px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; padding:10px;
  }
  .media-frame:not(.empty){border:1px solid var(--border); background:var(--surface-1);}
  .media-frame img, .media-frame video{width:100%; height:100%; object-fit:cover; display:block;}
  /* The report/PDF shows each photo in full (never cropped) even if that
     means it appears smaller inside its frame — the editor grid still
     crops-to-fill for a tidy thumbnail look. */
  .report-view .media-frame img, .report-view .media-frame video{object-fit:contain;}
  .media-frame .ic{font-size:26px; opacity:.55;}
  .media-tile-actions{position:absolute; top:6px; right:6px; z-index:2; display:flex; gap:4px;}
  .media-add-tile{
    aspect-ratio:4/3; border-radius:10px; border:1px dashed var(--baseline);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    cursor:pointer; color:var(--text-muted); font-size:12px; font-weight:600;
  }
  .media-add-tile:hover{background:rgba(11,11,11,0.03);}
  .media-caption{font-size:12px; color:var(--text-secondary); font-weight:600;}
  .media-note{font-size:11px; color:var(--text-muted); font-style:italic;}
  .btn-x.neutral{color:var(--text-primary);}

  .changelog-item{display:flex; gap:14px; padding:10px 0; border-bottom:1px solid var(--gridline);}
  .changelog-item:last-child{border-bottom:none;}
  .changelog-date{flex:0 0 96px; font-size:12px; font-weight:700; color:var(--text-primary); font-variant-numeric:tabular-nums;}
  .changelog-body{flex:1;}
  .changelog-author{font-size:11px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}

  .map-wrap{border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface-1);}
  .map-caption{ font-size:12px; color:var(--text-muted); margin-top:8px; text-align:center; }
  .map-legend{display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--text-secondary);}
  .map-legend .li{display:flex; align-items:center; gap:6px;}
  .map-legend .dot{width:10px; height:10px; border-radius:50%;}

  .cost-line{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--gridline); font-size:13px;}
  .cost-line:last-child{border-bottom:none;}
  .cost-line.total{font-weight:700; font-size:15px; padding-top:10px;}
  .cost-line span:last-child{font-variant-numeric:tabular-nums;}

  .prop-list-table tr.row-link{cursor:pointer;}
  .prop-list-table tr.row-link:hover{background:rgba(11,11,11,0.025);}

  .info-note{font-size:12px; color:var(--text-muted); background:rgba(11,11,11,0.03); border-radius:8px; padding:10px 12px; line-height:1.5;}

  .download-box{display:flex; align-items:center; justify-content:space-between; gap:12px; background:rgba(42,120,214,0.06); border:1px solid rgba(42,120,214,0.25); border-radius:10px; padding:12px 14px;}
  .download-box .fname{font-size:13px; font-weight:700;}
  .download-box .fmeta{font-size:11px; color:var(--text-muted);}

  /* ---------- Editable form controls ---------- */
  .inline-input, .inline-select{
    font-family:inherit; font-size:13px; padding:5px 8px; border:1px solid var(--border); border-radius:6px;
    background:var(--surface-1); color:var(--text-primary);
  }
  .inline-input.small{font-size:12px; padding:3px 6px; width:100%;}
  .num-input{width:80px;}
  .yaml-box{
    width:100%; min-height:92px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; padding:10px;
    border-radius:8px; border:1px solid var(--border); background:var(--surface-1); color:var(--text-primary);
    white-space:pre; resize:vertical; line-height:1.5;
  }
  pre.yaml-box{ white-space:pre-wrap; overflow-x:auto; margin:0; }
  .text-box{ width:100%; min-height:70px; font-family:inherit; font-size:13px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); resize:vertical; color:var(--text-primary); line-height:1.5; }
  .btn-x{ border:1px solid var(--border); background:var(--surface-1); border-radius:6px; padding:4px 9px; cursor:pointer; color:var(--critical); font-size:12px; }
  .feature-check{ display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-primary); }
  .feature-check.block{ display:flex; margin-bottom:8px; }
  .target-label{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); font-weight:600; margin-bottom:4px; }
  .add-component-row{ margin-top:12px; }
  .add-custom-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center; }

  /* ---------- ROI chart ---------- */
  .roi-chart-wrap{ position:relative; margin-top:10px; }
  .roi-tooltip{ position:absolute; background:var(--text-primary); color:#fff; font-size:12px; padding:6px 9px; border-radius:6px; pointer-events:none; white-space:nowrap; transform:translate(-6px,-100%); z-index:5; }

  /* ---------- Print / report ---------- */
  @media print{
    .sidebar, .topbar .actions, .no-print{display:none !important;}
    .layout{display:block;}
    .main{padding:0; width:100%;}
    body{background:#fff;}
    .card{border:1px solid #ccc; box-shadow:none;}

    /* CSS Grid fragments badly when printing in Chromium — content that runs
       past the bottom of a page gets clipped instead of flowing onto the next
       page. Rather than let that happen mid-block, keep each grid intact and
       let page breaks fall between blocks instead of through one. */
    .grid{break-inside:avoid; page-break-inside:avoid;}

    /* Keep single atomic pieces (one map, one diagram, one cost line, one
       photo tile, one changelog entry, one table row) from being sliced in
       half right at a page edge. */
    .map-wrap, svg, .cost-line, .changelog-item, .stat-tile, .media-tile, .download-box, .roi-chart-wrap, tr{
      break-inside:avoid; page-break-inside:avoid;
    }
    thead{display:table-header-group;} /* repeat column headers if a table spans pages */
    h1, h2, h3{break-after:avoid; page-break-after:avoid;} /* never leave a heading stranded at the bottom of a page */
    img, svg{max-width:100%;}

    .prop-print-section{page-break-before:always; break-before:page;}
    .prop-print-section:first-of-type{page-break-before:auto; break-before:auto;}

    @page{ margin:0.6in; }
  }

  .save-toast{
    position:fixed; bottom:22px; right:22px; background:#1a1a1a; color:#fff;
    padding:10px 18px; border-radius:8px; font-size:13px; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity 0.3s ease; z-index:9999;
    box-shadow:0 4px 16px rgba(0,0,0,0.25);
  }
  .save-toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="save-toast" class="save-toast"></div>

<script>
/* =========================================================================
   DATA MODEL
   Everything the tracker renders comes from GALLERY. To persist edits made
   in the browser, use Save/Open (writes straight back to a chosen file, Chrome/Edge only) or
   Export/Import (.json) in the sidebar (Internal view) — this file itself does not auto-save
   between page loads.
   ========================================================================= */
let GALLERY = {
  id: "boothill-shooting-gallery",
  name: "Boothill Shooting Gallery",
  lastUpdated: "2026-07-22",

  pricing: {
    markupPercent: 35 // applied on top of total cost (materials + labor) to get the customer quote price
  },

  publishSettings: {
    showComponents: true,
    showFirmware: false,
    showChangelog: false,
    showPhotosVideo: true
  },

  customer: {
    name: "Sample Client — Prototype Build",
    contactName: "Jane Doe",
    email: "jane@example.com",
    phone: "(555) 123-4567"
  },

  design: {
    galleryType: "standback", // standback | walkthrough
    rooms: [], // only used when galleryType === "walkthrough": [{id,name,widthFt,depthFt}]
    theme: "Old West / Boothill",
    widthFt: 30,
    depthFt: 15,
    heightFt: 10,
    gridSpacingFt: 5,
    costPerGame: 5,
    freePlayEnabled: false,
    birthdayMode: { enabled: true, description: "Unlimited free play for private birthday-party bookings (2-hour block)." },
    avgGamesPerPlayer: 3,
    playersPerDay: 40,
    trafficVariancePercent: 25, // best/worst-case swing applied to players/event for ROI scenario modeling
    electricityRatePerKWh: 0.14,
    operatingHoursPerDay: 10,
    daysOperatingPerWeek: 6
  },

  // Gallery-level power/network infrastructure — not tied to any single prop.
  // Power distribution box + inverter are capacity/supply items (their rating is capacity, not
  // draw, same convention as "Power Supply"-type components), so they're cost-only and don't add
  // to total power draw. Support equipment (router, HA server, etc.) are real power-consuming
  // devices, so both their cost AND wattage count toward the gallery totals.
  infrastructure: {
    powerDistributionBox: { included: true, costEach: 180 },
    powerInverter: { qty: 1, costEach: 140, wattsRating: 480 },
    supportEquipment: [
      { name: "Network router", qty: 1, costEach: 60, watts: 8, power: "110V AC" },
      { name: "Home Assistant server", qty: 1, costEach: 150, watts: 15, power: "110V AC" }
    ]
  },

  // Travel incidentals for install/service trips — flights, rental cars, etc. Internal cost basis
  // only (rolls into Job Quote & Margin like infrastructure does); never shown to the customer.
  travel: {
    incidentals: [
      { type: "Flight", description: "Install crew — round trip", cost: 640, startDate: "2026-08-10", endDate: "2026-08-14" },
      { type: "Rental Car", description: "Full-size, pickup at airport", cost: 310, startDate: "2026-08-10", endDate: "2026-08-14" }
    ]
  },

  // Off-grid power sizing — for events/builds that run on battery power stations or a generator
  // rather than wall power. Duty cycle is the % of tracked peak wattage actually drawn on average
  // (most props aren't triggered simultaneously), and drives the Wh needed for a full event day.
  powerPlanning: {
    eventLengthHours: 8,
    dutyCyclePercent: 25,
    efficiencyPercent: 90, // usable Wh after inverter/battery round-trip losses
    candidates: [
      { name: "Jackery HomePower 3600 Plus", capacityWh: 3584, continuousW: 3600, surgeW: 7200, price: 1699 },
      { name: "Jackery Explorer 2000 Plus", capacityWh: 2042, continuousW: 3000, surgeW: 6000, price: 1199 },
      { name: "Jackery Explorer 2000 v2", capacityWh: 2042, continuousW: 2200, surgeW: 4400, price: 799 }
    ]
  },

  playerExperience: {
    numPlayers: 4,
    blasterType: "IR-sensor toy blaster",
    blasterStyle: "Old West six-shooter replica, weighted grip, recoil click on trigger pull",
    blasterCostEach: 45,
    soundFeedback: true,
    forceFeedback: false,
    touchScreenPerPlayer: true,
    touchScreenCostEach: 120,
    screenShows: { timeInGame: true, shotsTaken: true, hits: true, other: "" },
    gameTypesSupported: ["timed", "shot-based", "quick-draw"],
    // Purchase-tracking progress for qty-based player gear — separate from the estimate fields above.
    purchasing: { blastersPurchasedQty: 0, blastersActualCostTotal: 0, touchScreensPurchasedQty: 0, touchScreensActualCostTotal: 0 }
  },

  props: [
    {
      id: "dueling-bandit",
      name: "Dueling Bandit",
      status: "in-build", // concept | in-build | testing | installed
      location: { xFt: 10, distanceFromLineFt: 15, elevation: "24 in wooden riser",
        notes: "Mid-gallery, 10 ft from the left wall. Mounted on a 24 in riser behind a painted rock outcrop backdrop. Clear sightline from firing positions 2–4." },
      action: "When the IR break-beam sensor on the target face is broken by a hit, the controller fires the air solenoid, which retracts the pneumatic cylinder and snaps the bandit backward 90° into the ‘downed’ position. At the same instant the MP3 trigger module plays a ricochet + groan sound effect through the hidden speaker. After the relay time elapses, the solenoid re-extends the cylinder, resetting the target upright and re-arming the hit sensor.",
      externalComponents: [
        { name:"Air solenoid valve", type:"Motor / Actuator", power:"12V DC", watts:5, cost:45, notes:"Controls pneumatic cylinder extend/retract" },
        { name:"Pneumatic cylinder, 4 in stroke", type:"Motor / Actuator", power:"Other", watts:0, cost:60, notes:"Runs on shop air, 80–100 PSI regulated" },
        { name:"IR break-beam hit sensor", type:"Sensor", power:"12V DC", watts:1, cost:18, notes:"Mounted behind target face, aimed through hit zone" },
        { name:"Arduino Nano controller", type:"Controller", power:"12V DC", watts:1, cost:12, notes:"Runs prop-01-bandit firmware" },
        { name:"MP3 trigger module + speaker", type:"Sound", power:"12V DC", watts:3, cost:25, notes:"3 ricochet/groan sound variations, randomized" },
        { name:"Red LED eye pair", type:"Light", power:"12V DC", watts:1, cost:15, notes:"Idle glow, strobes on hit" },
        { name:"110V→12V DC power supply, 5A", type:"Power Supply", power:"110V AC", watts:60, cost:20, notes:"Feeds the 12V DC bus for this prop only" }
      ],
      target: {
        idlePattern: "Solid",
        idleColor: "Blue",
        hitPattern: "Strobe",
        hitColor: "Red",
        relayTimeSec: 4,
        gndSwitchTimeMs: 50,
        servoIdleAngle: 0,
        servoTriggerAngle: 0,
        features: { gndSwitch: true, ledStrip2: false, servo: false, gpio: false }
      },
      firmware: {
        filename: "prop-01-bandit_v1.3.hex",
        version: "v1.3",
        notes: "Adjust RESET_DELAY_MS (default 4000) to change reset timing. IR_THRESHOLD may need retuning if ambient light changes.",
        content: "; PLACEHOLDER FIRMWARE FILE — replace with the real compiled build for this prop\n; prop-01-bandit v1.3 — Arduino Nano\n; RESET_DELAY_MS=4000\n; IR_THRESHOLD=620\n; SOUND_BANK=ricochet_groan_v3\n"
      },
      media: {
        photos: [
          { caption:"Bandit target — upright / armed position" },
          { caption:"Bandit target — downed position after hit" },
          { caption:"Riser + backdrop mounting detail" }
        ],
        video: { caption:"Trigger cycle demo — hit to reset (8 sec)", dataUrl:"" }
      },
      changelog: [
        { date:"2026-03-02", author:"Jason", note:"Initial concept sketch. Selected pneumatic cylinder over solenoid-only flip for a more realistic knockdown motion." },
        { date:"2026-04-10", author:"Jason", note:"Swapped sound module to MP3 Trigger v3 after field-testing showed dropouts on the previous board." },
        { date:"2026-06-18", author:"Jason", note:"Added red LED eye strobe effect per client request; updated firmware to v1.3." }
      ],
      buildTimeHours: 6,
      miscMaterials: 20,
      isTarget: true,
      targetCost: 145,
      targetWatts: 1.2,
      mapCategory: "prop"
    },
    {
      id: "charging-bull",
      name: "Charging Bull",
      status: "concept",
      location: { xFt: 21, distanceFromLineFt: 22, elevation: "Ground-level rail track",
        notes: "Rear of gallery, 21 ft from the left wall. Runs along an 8 ft horizontal rail track set into a false-floor trench, background silhouette against the painted mesa backdrop." },
      action: "On cycle start, the DC gear motor drives the bull carriage along the 8 ft rail at a randomized speed, patrolling side to side between the two limit switches. When the impact microswitch on the target registers a hit, the controller stops the carriage, spins the target 360° in place, and plays a bull-snort sound effect through the amp/speaker. After the relay time elapses, patrol resumes at a new randomized speed.",
      externalComponents: [
        { name:"DC gear motor + rail carriage", type:"Motor / Actuator", power:"12V DC", watts:15, cost:85, notes:"Drives carriage along 8 ft rail" },
        { name:"H-bridge motor driver module", type:"Controller", power:"12V DC", watts:2, cost:15, notes:"Bidirectional speed control" },
        { name:"Impact microswitch", type:"Sensor", power:"12V DC", watts:0, cost:8, notes:"Mounted on target rear, trips on hit impact" },
        { name:"Arduino Uno controller", type:"Controller", power:"12V DC", watts:1, cost:18, notes:"Runs prop-02-bull firmware" },
        { name:"Audio amp + speaker", type:"Sound", power:"12V DC", watts:5, cost:22, notes:"Bull snort effect, 2 variations" },
        { name:"Limit switches (x2)", type:"Sensor", power:"12V DC", watts:0, cost:10, notes:"End-of-rail carriage stops" },
        { name:"110V→12V DC power supply, 10A", type:"Power Supply", power:"110V AC", watts:120, cost:28, notes:"Feeds motor + logic bus, sized for motor stall current" }
      ],
      target: {
        idlePattern: "Chase",
        idleColor: "Orange",
        hitPattern: "Flash",
        hitColor: "White",
        relayTimeSec: 3,
        gndSwitchTimeMs: 0,
        servoIdleAngle: 90,
        servoTriggerAngle: 20,
        features: { gndSwitch: false, ledStrip2: true, servo: true, gpio: true }
      },
      firmware: {

/* ---------- Off-grid power sizing (battery/generator planning) ----------
   Peak watts = everything tracked drawing at once (rarely realistic). Duty cycle scales that down
   to a realistic sustained average, which is what actually determines Wh needed for an event day —
   not peak watts × hours, which wildly overstates the requirement. */
function powerPlanningAvgWatts(){
  const pp = GALLERY.powerPlanning;
  return galleryTotalWatts() * Math.max(0,(pp.dutyCyclePercent||0))/100;
}
function powerPlanningEnergyNeededWh(){
  const pp = GALLERY.powerPlanning;
  return powerPlanningAvgWatts() * Math.max(0,(pp.eventLengthHours||0));
}
function evaluatePowerCandidate(c){
  const pp = GALLERY.powerPlanning;
  const peakWatts = galleryTotalWatts();
  const avgWatts = powerPlanningAvgWatts();
  const energyNeededWh = powerPlanningEnergyNeededWh();
  const usableWh = (c.capacityWh||0) * Math.max(0,(pp.efficiencyPercent||100))/100;
  const coversPeak = (c.continuousW||0) >= peakWatts;
  const coversEnergy = usableWh >= energyNeededWh;
  const marginWh = usableWh - energyNeededWh;
  const marginPercent = energyNeededWh > 0 ? (marginWh/energyNeededWh)*100 : (usableWh>0?Infinity:0);
  const runtimeHoursAtAvg = avgWatts > 0 ? usableWh/avgWatts : Infinity;
  return { usableWh, coversPeak, coversEnergy, marginWh, marginPercent, runtimeHoursAtAvg, recommended: coversPeak && coversEnergy && marginPercent >= 15 };
}

function computeROI(){
  // "Event" = one operating instance/session of the gallery (a single day open, or a single booked
  // event) — we model per-event economics rather than promising a specific calendar-day payback,
  // since not every build operates daily. Energy cost is likewise treated as a per-event cost here.
  const d = GALLERY.design;
  const totalInvestment = priceFromCost(galleryTotalCost() + playerEquipmentTotalCost() + infrastructureCost() + travelCost()); // the customer's real capital outlay is what they paid (the quote price), not your build cost
  const totalWatts = galleryTotalWatts();
  const dailyKWh = (totalWatts/1000) * d.operatingHoursPerDay;
  const dailyEnergyCost = dailyKWh * d.electricityRatePerKWh;
  const monthlyEnergyCost = dailyEnergyCost * d.daysOperatingPerWeek * 4.345;

  const variance = Math.max(0, (d.trafficVariancePercent||0)/100);

  function scenario(label, playersPerEvent){
    playersPerEvent = Math.max(0, playersPerEvent);
    const eventGames = playersPerEvent * d.avgGamesPerPlayer;
    const eventRevenue = d.freePlayEnabled ? 0 : eventGames * d.costPerGame;
    const eventProfit = eventRevenue - dailyEnergyCost;
    let breakEvenEvents = null, breakEvenGames = null;
    if(eventProfit > 0){
      breakEvenEvents = totalInvestment / eventProfit;
      breakEvenGames = Math.round(breakEvenEvents * eventGames);
    }
    return { label, playersPerEvent: Math.round(playersPerEvent), eventGames, eventRevenue, eventProfit, breakEvenEvents, breakEvenGames };
  }

  const scenarios = {
    worst: scenario("Worst case", d.playersPerDay * (1 - variance)),
    expected: scenario("Expected", d.playersPerDay),
    best: scenario("Best case", d.playersPerDay * (1 + variance))
  };

  return { totalInvestment, totalWatts, dailyKWh, dailyEnergyCost, monthlyEnergyCost, scenarios };
}

function categoryLegendHTML(){
  return `<div class="map-legend">${Object.entries(MAP_CATEGORY_STYLES).map(([k,c])=>`
    <span class="li"><svg width="16" height="16" viewBox="-8 -8 16 16" style="vertical-align:middle;"><circle r="8" fill="#8a8880"/>${categoryIconGlyph(k)}</svg>${c.label}</span>`).join("")}</div>`;

function renderStandbackMapSVG(highlightId){
  const d = GALLERY.design;
  const marginTop=42, marginBottom=34, marginSide=34;
  const W = 900;
  const pxPerFt = (W - 2*marginSide) / d.widthFt;
  const plotH = pxPerFt * d.depthFt;
  const H = plotH + marginTop + marginBottom;
  const gridFt = d.gridSpacingFt || 5;

  // vertical grid lines + ft labels, spaced by gridFt and re-derived any time
  // width/depth change so the background always matches the real footprint
  let gridLines = "", gridLabels = "";
  for(let x=0; x<=d.widthFt+0.001; x+=gridFt){
    const px = marginSide + x*pxPerFt;
    gridLines += `<line x1="${px}" y1="${marginTop}" x2="${px}" y2="${marginTop+plotH}" stroke="var(--gridline)" stroke-width="1" stroke-dasharray="4 4"/>`;
    gridLabels += `<text x="${px}" y="${marginTop-10}" font-size="10" fill="var(--text-muted)" text-anchor="middle">${Math.round(x)} ft</text>`;
  }
  for(let y=0; y<=d.depthFt+0.001; y+=gridFt){
    const py = marginTop + y*pxPerFt;
    gridLines += `<line x1="${marginSide}" y1="${py}" x2="${marginSide+d.widthFt*pxPerFt}" y2="${py}" stroke="var(--gridline)" stroke-width="1" stroke-dasharray="4 4"/>`;
    gridLabels += `<text x="${marginSide-8}" y="${py+3}" font-size="10" fill="var(--text-muted)" text-anchor="end">${Math.round(d.depthFt-y)} ft</text>`;
  }
  const interactive = isEditable();
  let pins = "";
  GALLERY.props.forEach(p=>{
    const xFt = Math.max(0, Math.min(d.widthFt, p.location.xFt));
    const yFt = Math.max(0, Math.min(d.depthFt, d.depthFt - p.location.distanceFromLineFt));
    const px = marginSide + xFt*pxPerFt;
    const py = marginTop + Math.max(18, yFt*pxPerFt);
    const dimmed = highlightId && p.id !== highlightId;
    const st = STATUS_STYLES[p.status];
    const r = highlightId === p.id ? 13 : 10;
    pins += `
      <g class="prop-pin" data-prop-id="${escapeAttr(p.id)}" transform="translate(${px},${py})" style="cursor:${interactive?'grab':'pointer'};" ${interactive?`onpointerdown="startDragProp(event,'${p.id}')"`:`onclick="location.hash='#/prop/${p.id}'"`} opacity="${dimmed?0.35:1}">
        ${highlightId===p.id ? `<circle r="${r+6}" fill="none" stroke="${st.color}" stroke-width="2"/>` : ""}
        <circle r="${r}" fill="${st.color}" stroke="#fff" stroke-width="2"/>
        ${categoryIconGlyph(p.mapCategory)}
        <text y="${-r-8}" font-size="12" font-weight="700" fill="var(--text-primary)" text-anchor="middle">${p.name}</text>
        <text y="${r+16}" font-size="10" fill="var(--text-muted)" text-anchor="middle">${p.location.xFt} ft</text>
      </g>`;
  });
  window.MAP_GEOM = { type:"standback", marginSide, marginTop, pxPerFt, widthFt: d.widthFt, depthFt: d.depthFt };
  return `
  <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block; background:var(--surface-1);">
    <rect x="${marginSide-4}" y="${marginTop-4}" width="${d.widthFt*pxPerFt+8}" height="${plotH+8}" rx="10" fill="none" stroke="var(--baseline)" stroke-width="2"/>
    ${gridLines}
    ${gridLabels}
    <line x1="${marginSide}" y1="${marginTop+plotH}" x2="${marginSide+d.widthFt*pxPerFt}" y2="${marginTop+plotH}" stroke="var(--critical)" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="${marginSide+(d.widthFt*pxPerFt)/2}" y="${marginTop+plotH+20}" font-size="12" font-weight="700" fill="var(--critical)" text-anchor="middle" letter-spacing="1">FIRING LINE</text>
    ${pins}
  </svg>`;
}

/* =========================================================================
   WALKTHROUGH MAP SVG — lays out every room at once (shelf-packed by row),
   each room drawn to a shared ft-to-px scale so relative sizes stay honest.
   Props are pinned within whichever room they're assigned to.
   ========================================================================= */
function renderWalkthroughMapSVG(highlightId){
  const rooms = GALLERY.design.rooms;
  if(!rooms.length){
    return `<div style="padding:50px 20px; text-align:center; color:var(--text-muted); background:var(--surface-1); border-radius:8px;">No rooms added yet. Add rooms on the Gallery Design page to see the floor plan.</div>`;
  }
  const cols = Math.max(1, Math.ceil(Math.sqrt(rooms.length)));
  const roomRows = [];
  for(let i=0;i<rooms.length;i+=cols) roomRows.push(rooms.slice(i, i+cols));

  const gapFt = 4;
  const rowHeights = roomRows.map(row => Math.max(...row.map(r=>r.depthFt||1)));
  const rowWidths = roomRows.map(row => row.reduce((s,r)=>s+(r.widthFt||1),0) + gapFt*(row.length-1));
  const totalWidthFt = Math.max(1, ...rowWidths);
  const totalHeightFt = rowHeights.reduce((s,h)=>s+h,0) + gapFt*(roomRows.length-1);

  const marginTop=20, marginBottom=20, marginSide=20;
  const W = 900;
  const pxPerFt = (W - 2*marginSide) / totalWidthFt;
  const H = totalHeightFt*pxPerFt + marginTop + marginBottom;

  const roomPos = {};
  let yCursor = 0;
  roomRows.forEach(row=>{
    const rowH = Math.max(...row.map(r=>r.depthFt||1));
    let xCursor = 0;
    row.forEach(r=>{
      roomPos[r.id] = { xFt:xCursor, yFt:yCursor, wFt:(r.widthFt||1), dFt:(r.depthFt||1) };
      xCursor += (r.widthFt||1) + gapFt;
    });
    yCursor += rowH + gapFt;
  });

  let roomRects = "";
  rooms.forEach(r=>{
    const pos = roomPos[r.id];
    const rx = marginSide + pos.xFt*pxPerFt;
    const ry = marginTop + pos.yFt*pxPerFt;
    const rw = pos.wFt*pxPerFt;
    const rd = pos.dFt*pxPerFt;
    roomRects += `
      <rect x="${rx}" y="${ry}" width="${rw}" height="${rd}" rx="6" fill="var(--page)" stroke="var(--baseline)" stroke-width="2"/>
      <text x="${rx+rw/2}" y="${ry+18}" font-size="12" font-weight="700" fill="var(--text-primary)" text-anchor="middle">${escapeHTML(r.name)}</text>
      <text x="${rx+rw/2}" y="${ry+rd-8}" font-size="10" fill="var(--text-muted)" text-anchor="middle">${r.widthFt} × ${r.depthFt} ft</text>`;
  });

  const interactive = isEditable();
  let pins = "";
  GALLERY.props.forEach(p=>{
    const pos = roomPos[p.location.roomId];
    if(!pos) return; // prop isn't assigned to a room currently on the map
    const xFt = Math.max(0, Math.min(pos.wFt, p.location.xFt||0));
    const yFt = Math.max(0, Math.min(pos.dFt, p.location.yFt||0));
    const px = marginSide + (pos.xFt+xFt)*pxPerFt;
    const py = marginTop + Math.max(pos.yFt*pxPerFt+24, (pos.yFt+yFt)*pxPerFt);
    const dimmed = highlightId && p.id !== highlightId;
    const st = STATUS_STYLES[p.status];
    const r = highlightId === p.id ? 13 : 10;
    pins += `
      <g class="prop-pin" data-prop-id="${escapeAttr(p.id)}" transform="translate(${px},${py})" style="cursor:${interactive?'grab':'pointer'};" ${interactive?`onpointerdown="startDragProp(event,'${p.id}')"`:`onclick="location.hash='#/prop/${p.id}'"`} opacity="${dimmed?0.35:1}">
        ${highlightId===p.id ? `<circle r="${r+6}" fill="none" stroke="${st.color}" stroke-width="2"/>` : ""}
        <circle r="${r}" fill="${st.color}" stroke="#fff" stroke-width="2"/>
        ${categoryIconGlyph(p.mapCategory)}
        <text y="${-r-8}" font-size="12" font-weight="700" fill="var(--text-primary)" text-anchor="middle">${p.name}</text>
      </g>`;
  });

  window.MAP_GEOM = {
    type: "walkthrough", marginSide, marginTop, pxPerFt,
    rooms: rooms.map(r => ({ id:r.id, xFt:roomPos[r.id].xFt, yFt:roomPos[r.id].yFt, wFt:roomPos[r.id].wFt, dFt:roomPos[r.id].dFt }))
  };
  return `
  <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block; background:var(--surface-1);">
    ${roomRects}
    ${pins}
  </svg>`;
}

/* =========================================================================
   DRAG-TO-PLACE — click and drag a prop's pin directly on the map instead
   of typing ft coordinates by hand. window.MAP_GEOM is stamped by whichever
   render*MapSVG function last ran, so this works for both gallery types.
   ========================================================================= */
let DRAG_PROP = null;
function cssEscapeId(s){
  return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/[^a-zA-Z0-9_-]/g, "\\$&");
}
function svgPointFromEvent(svg, evt){
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const scaleX = vb.width / rect.width, scaleY = vb.height / rect.height;
  return { x: (evt.clientX - rect.left) * scaleX, y: (evt.clientY - rect.top) * scaleY };
}
function startDragProp(evt, propId){
  evt.preventDefault();
  evt.stopPropagation();
  const svg = evt.currentTarget.ownerSVGElement;
  DRAG_PROP = { propId, svg, startX: evt.clientX, startY: evt.clientY, moved: false, pending: null };
  window.addEventListener("pointermove", onDragProp);
  window.addEventListener("pointerup", endDragProp, { once: true });
}
function onDragProp(evt){
  if(!DRAG_PROP) return;
  const dx = evt.clientX - DRAG_PROP.startX, dy = evt.clientY - DRAG_PROP.startY;
  if(Math.abs(dx) > 3 || Math.abs(dy) > 3) DRAG_PROP.moved = true;
  if(!DRAG_PROP.moved) return;
  const geom = window.MAP_GEOM;
  if(!geom) return;
  const { x, y } = svgPointFromEvent(DRAG_PROP.svg, evt);
  let px, py, pending;
  if(geom.type === "walkthrough"){
    const mapXFt = (x - geom.marginSide) / geom.pxPerFt;
    const mapYFt = (y - geom.marginTop) / geom.pxPerFt;
    let room = geom.rooms.find(r => mapXFt >= r.xFt-0.01 && mapXFt <= r.xFt+r.wFt+0.01 && mapYFt >= r.yFt-0.01 && mapYFt <= r.yFt+r.dFt+0.01);
    if(!room && geom.rooms.length){
      // pointer is off every room (dragged past an edge, into a gap, etc.) —
      // snap to whichever room's rectangle is geometrically closest, not
      // back to the prop's original room, so overshooting toward a room
      // still lands you in that room instead of bouncing home.
      let bestDist = Infinity;
      geom.rooms.forEach(r=>{
        const cx = Math.max(r.xFt, Math.min(r.xFt+r.wFt, mapXFt));
        const cy = Math.max(r.yFt, Math.min(r.yFt+r.dFt, mapYFt));
        const dist = Math.hypot(cx-mapXFt, cy-mapYFt);
        if(dist < bestDist){ bestDist = dist; room = r; }
      });
    }
    if(!room) return;
    const xFt = Math.max(0, Math.min(room.wFt, mapXFt - room.xFt));
    const yFt = Math.max(0, Math.min(room.dFt, mapYFt - room.yFt));
    px = geom.marginSide + (room.xFt + xFt) * geom.pxPerFt;
    py = geom.marginTop + (room.yFt + yFt) * geom.pxPerFt;
    pending = { roomId: room.id, xFt: Math.round(xFt*10)/10, yFt: Math.round(yFt*10)/10 };
  } else {
    const xFt = Math.max(0, Math.min(geom.widthFt, (x - geom.marginSide) / geom.pxPerFt));
    const distFromLine = Math.max(0, Math.min(geom.depthFt, geom.depthFt - (y - geom.marginTop) / geom.pxPerFt));
    px = geom.marginSide + xFt * geom.pxPerFt;
    py = geom.marginTop + Math.max(18, (geom.depthFt - distFromLine) * geom.pxPerFt);
    pending = { xFt: Math.round(xFt*10)/10, distanceFromLineFt: Math.round(distFromLine*10)/10 };
  }
  DRAG_PROP.pending = pending;
  const g = DRAG_PROP.svg.querySelector('g[data-prop-id="'+cssEscapeId(DRAG_PROP.propId)+'"]');
  if(g) g.setAttribute("transform", "translate("+px+","+py+")");
}
function endDragProp(evt){
  window.removeEventListener("pointermove", onDragProp);
  if(!DRAG_PROP) return;
  const { propId, moved, pending } = DRAG_PROP;
  DRAG_PROP = null;
  if(!moved){
    location.hash = "#/prop/"+propId; // no drag happened — treat it as a normal click-through
    return;
  }
  if(!pending) return;
  const prop = GALLERY.props.find(p=>p.id===propId);
  if(!prop) return;
  if(pending.roomId !== undefined){
    prop.location.roomId = pending.roomId;
    prop.location.xFt = pending.xFt;
    prop.location.yFt = pending.yFt;
  } else {
    prop.location.xFt = pending.xFt;
    prop.location.distanceFromLineFt = pending.distanceFromLineFt;
  }
  renderApp();
}

/* =========================================================================
   ROI CHART (with hover crosshair + tooltip)
   ========================================================================= */
function renderROIChart(roi){
  const W=760, H=300, mL=64, mR=20, mT=20, mB=40;
  const plotW=W-mL-mR, plotH=H-mT-mB;
  const s = roi.scenarios;
  const seriesDefs = [
    { data: s.worst, color: "var(--warning)", dash: "6 4" },
    { data: s.expected, color: "var(--series-1)", dash: "" },
    { data: s.best, color: "var(--good)", dash: "6 4" }
  ];
  const beValues = seriesDefs.map(sd=>sd.data.breakEvenEvents).filter(v=>v!=null);
  let horizon = 60;
  if(beValues.length) horizon = Math.max(30, Math.ceil(Math.max(...beValues)*1.4));
  horizon = Math.min(horizon, 365);
  const maxProfitVal = Math.max(...seriesDefs.map(sd=>sd.data.eventProfit*horizon), 0);
  const maxY = Math.max(roi.totalInvestment*1.15, maxProfitVal*1.05, 100);
  function xPx(ev){ return mL + (ev/horizon)*plotW; }
  function yPx(val){ return mT + plotH - (val/maxY)*plotH; }

  let gridlines = "";
  const steps = 4;
  for(let i=0;i<=steps;i++){
    const val = maxY*i/steps;
    const y = yPx(val);
    gridlines += `<line x1="${mL}" y1="${y}" x2="${W-mR}" y2="${y}" stroke="var(--gridline)" stroke-width="1"/>`;
    gridlines += `<text x="${mL-8}" y="${y+4}" font-size="10" fill="var(--text-muted)" text-anchor="end">${fmt$(val)}</text>`;
  }
  let xticks = "";
  for(let i=0;i<=6;i++){
    const ev = Math.round(horizon*i/6);
    xticks += `<text x="${xPx(ev)}" y="${H-mB+18}" font-size="10" fill="var(--text-muted)" text-anchor="middle">Event ${ev}</text>`;
  }

  const investY = yPx(roi.totalInvestment);
  let paths = "", markers = "", legend = "";
  seriesDefs.forEach(sd=>{
    let path = "";
    const pointsN = Math.min(horizon, 120);
    for(let i=0;i<=pointsN;i++){
      const ev = horizon*i/pointsN;
      const val = Math.max(0, sd.data.eventProfit*ev);
      path += (i===0?"M":"L") + xPx(ev).toFixed(1) + " " + yPx(val).toFixed(1) + " ";
    }
    paths += `<path d="${path}" fill="none" stroke="${sd.color}" stroke-width="2.5" ${sd.dash?`stroke-dasharray="${sd.dash}"`:""}/>`;
    if(sd.data.breakEvenEvents && sd.data.breakEvenEvents<=horizon){
      const bx = xPx(sd.data.breakEvenEvents);
      markers += `<circle cx="${bx}" cy="${investY}" r="5" fill="${sd.color}" stroke="#fff" stroke-width="2"/>`;
    }
    legend += `<span style="margin-right:16px; white-space:nowrap;"><span style="display:inline-block;width:14px;height:2.5px;background:${sd.color};vertical-align:middle;margin-right:5px;"></span>${sd.data.label}: ${sd.data.breakEvenEvents ? "event "+Math.ceil(sd.data.breakEvenEvents) : "not reached"}</span>`;
  });

  window.CHART_GEOM = { mL,mR,mT,mB,plotW,plotH,horizon,maxY,W,H, expectedProfit: s.expected.eventProfit };

  return `
  <div class="roi-chart-wrap" onmousemove="handleROIHover(event)" onmouseleave="hideROITooltip()">
    <svg id="roiSvg" viewBox="0 0 ${W} ${H}" width="100%" style="display:block;">
      ${gridlines}
      ${xticks}
      <line x1="${mL}" y1="${investY}" x2="${W-mR}" y2="${investY}" stroke="var(--baseline)" stroke-width="1.5" stroke-dasharray="6 4"/>
      <text x="${W-mR}" y="${investY-6}" font-size="10" fill="var(--text-secondary)" text-anchor="end">Total investment: ${fmt$(roi.totalInvestment)}</text>
      ${paths}
      ${markers}
      <line id="roiCrosshair" x1="0" y1="${mT}" x2="0" y2="${mT+plotH}" stroke="var(--text-muted)" stroke-width="1" style="display:none;"/>
      <circle id="roiHoverDot" r="4" fill="var(--series-1)" stroke="#fff" stroke-width="1.5" style="display:none;"/>
    </svg>
    <div id="roiTooltip" class="roi-tooltip" style="display:none;"></div>
    <div style="margin-top:10px; font-size:12px; color:var(--text-secondary);">${legend}</div>
  </div>`;
}
function handleROIHover(event){
  const svg = document.getElementById("roiSvg");
  const g = window.CHART_GEOM;
  if(!svg || !g) return;
  const rect = svg.getBoundingClientRect();
  const scaleX = g.W / rect.width;
  const mx = (event.clientX - rect.left) * scaleX;
  let ev = ((mx - g.mL) / g.plotW) * g.horizon;
  ev = Math.max(0, Math.min(g.horizon, ev));
  const val = Math.max(0, g.expectedProfit*ev);
  const xPx = g.mL + (ev/g.horizon)*g.plotW;
  const yPx = g.mT + g.plotH - (val/g.maxY)*g.plotH;
  const cross = document.getElementById("roiCrosshair");
  const dot = document.getElementById("roiHoverDot");
  if(cross){ cross.setAttribute("x1", xPx); cross.setAttribute("x2", xPx); cross.style.display="block"; }
  if(dot){ dot.setAttribute("cx", xPx); dot.setAttribute("cy", yPx); dot.style.display="block"; }
  const tip = document.getElementById("roiTooltip");
  if(tip){
    tip.style.display = "block";
    tip.style.left = (event.clientX - rect.left + 12) + "px";
    tip.style.top = (event.clientY - rect.top - 6) + "px";
    tip.innerHTML = `Event ${Math.round(ev)}<br><b>${fmt$(val)}</b> cumulative profit (expected case)`;
  }
}
function hideROITooltip(){
  ["roiCrosshair","roiHoverDot"].forEach(id=>{ const el=document.getElementById(id); if(el) el.style.display="none"; });
  const tip = document.getElementById("roiTooltip"); if(tip) tip.style.display="none";
}

function componentsTable(prop){

/* =========================================================================
   PHOTO / VIDEO UPLOAD — images are downscaled client-side and stored inline
   as data URLs (no backend, so this keeps the exported JSON reasonably sized).
   Video is stored inline as-is; keep clips short since there's no compression.
   ========================================================================= */
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          const scale = maxDim / Math.max(w,h);
          w = Math.round(w*scale); h = Math.round(h*scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("That file doesn't look like a valid image."));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Could not read that file."));
    reader.readAsDataURL(file);
  });
}
function addPropPhoto(propId, inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  resizeImageFile(file, 1400, 0.82).then(dataUrl => {
    const prop = GALLERY.props.find(p=>p.id===propId);
    if(!prop) return;
    prop.media.photos.push({ caption: file.name.replace(/\.[^.]+$/,""), dataUrl });
    renderApp();
  }).catch(err => alert(err.message));
  inputEl.value = "";
}
function replacePropPhoto(propId, idx, inputEl){

function uploadPropVideo(propId, inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  if(file.size > 25*1024*1024 && !confirm("That video is over 25MB. It'll be embedded directly in this file and any exported JSON, which can make both quite large and slow to load. Continue anyway?")) {
    inputEl.value = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    const prop = GALLERY.props.find(p=>p.id===propId);
    if(!prop) return;
    prop.media.video.dataUrl = e.target.result;
    if(!prop.media.video.caption) prop.media.video.caption = file.name.replace(/\.[^.]+$/,"");
    renderApp();
  };
  reader.onerror = () => alert("Could not read that video file.");
  reader.readAsDataURL(file);
  inputEl.value = "";
}

/* ---------- Save/Export/Import/Open ----------
   Export/Import work everywhere (download a copy / pick a file to read). Open+Save use the File
   System Access API (Chrome/Edge only) to keep a live handle on the file you opened, so Save can
   write straight back to it instead of downloading a new copy each time. The handle only lives in
   memory for this browser tab/session — reload the page or switch files via classic Import and
   you'll need to "Open data file..." again before Save resumes writing to that same file. */
let LINKED_FILE_HANDLE = null;
let LINKED_FILE_NAME = null;

function fileSystemAccessSupported(){
  return typeof window.showOpenFilePicker === "function" && typeof window.showSaveFilePicker === "function";
}
function exportPayloadText(){
  return JSON.stringify({ PROJECTS, ACTIVE_PROJECT_ID, PROP_LIBRARY, COMPONENT_LIBRARY, HOURLY_RATE }, null, 2);
}
function dataConnectionNoteHTML(){
  const fsaOk = fileSystemAccessSupported();
  if(LINKED_FILE_HANDLE){
    return `<div class="info-note" style="margin-top:10px;">Connected to <b>${escapeHTML(LINKED_FILE_NAME)}</b> — Save writes changes straight back to that file. This connection resets on reload (every fresh page load starts unconnected) — use "Open data file…" again to reconnect, then "Save" will reappear.</div>`;
  }
  if(fsaOk){
    return `<div class="info-note" style="margin-top:10px;">No file connected yet in this session — that's why you see "Save As…" instead of "Save". Click "Open data file…" and pick your .json file: once it's loaded this way, the button becomes "Save" and writes straight back to that same file from then on (until you reload the page).</div>`;
  }
  return `<div class="info-note" style="margin-top:10px;">Direct file saving isn't supported in this browser (works in Chrome/Edge) — Save downloads a new copy, same as Export.</div>`;
}
function dataActionsCardHTML(){
  const linked = !!LINKED_FILE_HANDLE;
  const fsaOk = fileSystemAccessSupported();
  return `
    <div class="actions">
      <button class="btn ${linked?'primary':''}" onclick="saveDataFile()">💾 ${linked ? "Save" : (fsaOk ? "Save As…" : "Save (download)")}</button>
      ${fsaOk
        ? `<button class="btn" onclick="openDataFile()">Open data file…</button>`
        : `<label class="btn" style="cursor:pointer;">Import data (.json)<input type="file" accept=".json" style="display:none;" onchange="importData(event)"></label>`
      }
      <button class="btn" onclick="exportData()">Export a copy (.json)</button>
    </div>
    ${dataConnectionNoteHTML()}
  `;
}
function dataActionsSidebarHTML(){
  const linked = !!LINKED_FILE_HANDLE;
  const fsaOk = fileSystemAccessSupported();
  return `
    <button class="btn ${linked?'primary':''}" style="width:100%; margin-bottom:8px;" onclick="saveDataFile()">💾 ${linked ? "Save" : (fsaOk ? "Save As…" : "Save (download)")}</button>
    ${fsaOk
      ? `<button class="btn" style="width:100%; margin-bottom:8px;" onclick="openDataFile()">Open data file…</button>`
      : `<label class="btn" style="width:100%; display:block; text-align:center; cursor:pointer; box-sizing:border-box; margin-bottom:8px;">Import data
          <input type="file" accept=".json" style="display:none;" onchange="importData(event)">
        </label>`
    }
    <button class="btn" style="width:100%; margin-bottom:8px;" onclick="exportData()">Export a copy (.json)</button>
    ${linked ? `<div style="font-size:11px; color:var(--text-muted); margin-top:8px; word-break:break-word;">Connected: ${escapeHTML(LINKED_FILE_NAME)}</div>` : ""}
  `;
}
function showSaveToast(msg){
  const el = document.getElementById("save-toast");
  if(!el){ return; }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window.__saveToastTimer);
  window.__saveToastTimer = setTimeout(()=>{ el.classList.remove("show"); }, 2600);
}
function exportData(){
  const payload = exportPayloadText();
  const blob = new Blob([payload], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "gallery-tracker-data.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function applyImportedData(parsed){
  if(Array.isArray(parsed.PROJECTS) && parsed.PROJECTS.length){
    PROJECTS = parsed.PROJECTS;
  } else if(parsed.GALLERY){
    // backward compatibility with single-project exports from an earlier version
    const g = parsed.GALLERY;
    if(parsed.PUBLISH_SETTINGS) g.publishSettings = parsed.PUBLISH_SETTINGS;
    if(!g.publishSettings) g.publishSettings = { showComponents:true, showFirmware:false, showChangelog:false, showPhotosVideo:true };
    if(g.publishSettings.showPhotosVideo === undefined) g.publishSettings.showPhotosVideo = true; // migrate older saved projects
    if(!g.id) g.id = slugify(g.name || "project");
    PROJECTS = [g];
  }
  PROJECTS.forEach(p => { if(!p.pricing) p.pricing = { markupPercent: 35 }; }); // backward compatibility with exports from before job pricing existed
  PROJECTS.forEach(p => {
    if(!p.publishSettings) p.publishSettings = { showComponents:true, showFirmware:false, showChangelog:false, showPhotosVideo:true };
    if(p.publishSettings.showPhotosVideo === undefined) p.publishSettings.showPhotosVideo = true; // backward compatibility with exports from before this toggle existed
  });
  PROJECTS.forEach(p => {
    if(p.design && p.design.trafficVariancePercent === undefined) p.design.trafficVariancePercent = 25; // backward compatibility with exports from before ROI best/worst-case scenarios existed
  });
  PROJECTS.forEach(p => {
    (p.props||[]).forEach(prop => { if(prop.targetWatts === undefined) prop.targetWatts = 0; }); // backward compatibility with exports from before target power draw was tracked — defaults to 0 until set
    (p.props||[]).forEach(prop => { if(!prop.mapCategory) prop.mapCategory = "prop"; }); // backward compatibility with exports from before map category icons existed
  });
  PROJECTS.forEach(p => {
    if(!p.infrastructure){
      p.infrastructure = {
        powerDistributionBox: { included:false, costEach:0 },
        powerInverter: { qty:0, costEach:0, wattsRating:480 },
        supportEquipment: []
      };
    } // backward compatibility with exports from before power distribution box / inverter / support equipment tracking existed
  });
  PROJECTS.forEach(p => {
    if(!p.travel) p.travel = { incidentals: [] }; // backward compatibility with exports from before travel incidentals (flights/rental cars) were tracked
  });
  PROJECTS.forEach(p => {
    if(!p.powerPlanning){
      p.powerPlanning = {
        eventLengthHours: 8, dutyCyclePercent: 25, efficiencyPercent: 90,
        candidates: [
          { name: "Jackery HomePower 3600 Plus", capacityWh: 3584, continuousW: 3600, surgeW: 7200, price: 1699 },
          { name: "Jackery Explorer 2000 Plus", capacityWh: 2042, continuousW: 3000, surgeW: 6000, price: 1199 },
          { name: "Jackery Explorer 2000 v2", capacityWh: 2042, continuousW: 2200, surgeW: 4400, price: 799 }
        ]
      };
    } // backward compatibility with exports from before off-grid power sizing existed
  });
  PROJECTS.forEach(p => {
    if(p.playerExperience && !p.playerExperience.purchasing){
      p.playerExperience.purchasing = { blastersPurchasedQty: 0, blastersActualCostTotal: 0, touchScreensPurchasedQty: 0, touchScreensActualCostTotal: 0 };
    } // backward compatibility with exports from before the Purchase Tracker existed
  });
  ACTIVE_PROJECT_ID = (parsed.ACTIVE_PROJECT_ID && PROJECTS.some(p=>p.id===parsed.ACTIVE_PROJECT_ID)) ? parsed.ACTIVE_PROJECT_ID : PROJECTS[0].id;
  GALLERY = PROJECTS.find(p=>p.id===ACTIVE_PROJECT_ID) || PROJECTS[0];
  if(parsed.PROP_LIBRARY) PROP_LIBRARY = parsed.PROP_LIBRARY;
  if(parsed.COMPONENT_LIBRARY) COMPONENT_LIBRARY = parsed.COMPONENT_LIBRARY;
  if(typeof parsed.HOURLY_RATE === "number"){
    HOURLY_RATE = parsed.HOURLY_RATE;
  } else if(typeof GALLERY.hourlyRate === "number"){
    HOURLY_RATE = GALLERY.hourlyRate; // backward compatibility with exports from before the shop rate was made a single admin-level setting
  }
}
function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      applyImportedData(parsed);
      // the classic file input never hands back a writable handle, so Save can't target this file —
      // clear any previously linked handle rather than let Save silently overwrite a different file
      LINKED_FILE_HANDLE = null;
      LINKED_FILE_NAME = null;
      location.hash = "#/overview";
      renderApp();
    }catch(err){ alert("Could not read that file: " + err.message); }
  };
  reader.readAsText(file);
  event.target.value = ""; // allow re-selecting the same filename later without the change event failing to fire
}
async function openDataFile(){
  if(!fileSystemAccessSupported()){ alert("Opening a file directly isn't supported in this browser (works in Chrome/Edge) — use Import instead."); return; }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: "Gallery Tracker data", accept: { "application/json": [".json"] } }],
      excludeAcceptAllOption: false
    });
    const file = await handle.getFile();
    const text = await file.text();
    const parsed = JSON.parse(text);
    applyImportedData(parsed);
    LINKED_FILE_HANDLE = handle;
    LINKED_FILE_NAME = handle.name;
    location.hash = "#/overview";
    renderApp();
  } catch(e){
    if(e.name !== "AbortError") alert("Couldn't open that file: " + e.message);
  }
}
async function saveDataFile(){
  const text = exportPayloadText();
  if(LINKED_FILE_HANDLE){
    try {
      const writable = await LINKED_FILE_HANDLE.createWritable();
      await writable.write(text);
      await writable.close();
      showSaveToast("Saved to " + LINKED_FILE_NAME);
    } catch(e){
      alert("Couldn't save to " + LINKED_FILE_NAME + ": " + e.message + "\n\nUse Export instead, or Save again to pick a new location.");
      LINKED_FILE_HANDLE = null;
      LINKED_FILE_NAME = null;
      renderApp();
    }
    return;
  }
  if(!fileSystemAccessSupported()){ exportData(); return; }
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: "gallery-tracker-data.json",
      types: [{ description: "Gallery Tracker data", accept: { "application/json": [".json"] } }]
    });
    const writable = await handle.createWritable();
    await writable.write(text);
    await writable.close();
    LINKED_FILE_HANDLE = handle;
    LINKED_FILE_NAME = handle.name;
    showSaveToast("Saved to " + LINKED_FILE_NAME);
    renderApp();
  } catch(e){
    if(e.name !== "AbortError") alert("Couldn't save: " + e.message);
  }
}

function designReportBlock(){
  const d = GALLERY.design; const roi = computeROI();
  const isWalkthrough = d.galleryType === "walkthrough";
  const footprintText = isWalkthrough
    ? `<b>Footprint:</b> ${totalRoomsSqFt(d.rooms).toLocaleString()} sq ft across ${d.rooms.length} room${d.rooms.length===1?"":"s"} (ceiling ${d.heightFt} ft)`
    : `<b>Footprint:</b> ${d.widthFt} ft × ${d.depthFt} ft × ${d.heightFt} ft high (${(d.widthFt*d.depthFt).toLocaleString()} sq ft)`;
  const s = roi.scenarios;
  const scenarioColor = { "Worst case":"var(--warning)", "Expected":"var(--series-1)", "Best case":"var(--good)" };
  const scenarioRows = [s.worst, s.expected, s.best].map(sc => `
      <tr style="border-bottom:1px solid var(--gridline);">
        <td style="padding:7px 8px 7px 0;"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${scenarioColor[sc.label]};vertical-align:middle;margin-right:6px;"></span>${sc.label}</td>
        <td style="padding:7px 8px;">${sc.playersPerEvent.toLocaleString()}</td>
        <td style="padding:7px 8px;">${Math.round(sc.eventGames).toLocaleString()}</td>
        <td style="padding:7px 8px;">${d.freePlayEnabled?"—":fmt$(sc.eventRevenue)}</td>
        <td style="padding:7px 8px;">${sc.breakEvenEvents ? "~"+Math.ceil(sc.breakEvenEvents).toLocaleString()+" events" : "Not reached"}</td>
      </tr>`).join("");
  return `
  <div class="card">
    <h2>Gallery Design &amp; Economics</h2>
    <p>${d.theme?`<b>Theme:</b> ${d.theme} &nbsp;·&nbsp; `:""}${footprintText}</p>
    <div class="map-wrap">${renderMapSVG(null)}</div>
    ${categoryLegendHTML()}
    <div class="grid cols-4" style="margin-top:14px;">
      <div class="stat-tile"><div class="stat-label">Total power draw</div><div class="stat-value">${Math.round(roi.totalWatts)} W</div></div>
      <div class="stat-tile"><div class="stat-label">Daily energy cost</div><div class="stat-value">${fmt$(roi.dailyEnergyCost)}</div></div>
      <div class="stat-tile"><div class="stat-label">Cost per game</div><div class="stat-value">${d.freePlayEnabled?"Free play":fmt$(d.costPerGame)}</div></div>
      <div class="stat-tile"><div class="stat-label">Break-even (expected)</div><div class="stat-value">${s.expected.breakEvenEvents?Math.ceil(s.expected.breakEvenEvents)+" events":"—"}</div></div>
    </div>
    <p style="margin:14px 0 6px; font-size:13px; color:var(--text-secondary);">Modeled on an estimated <b>${d.avgGamesPerPlayer}</b> plays per person and <b>${d.playersPerDay.toLocaleString()}</b> players per event, with a ±${d.trafficVariancePercent}% swing for the best/worst case below. An "event" is one operating session (a day open, or a booked event) — not a promise of a specific calendar date.</p>
    <table style="width:100%; border-collapse:collapse; margin-bottom:10px; font-size:13px;">
      <thead>
        <tr style="border-bottom:2px solid var(--gridline);">
          <th style="text-align:left; padding:6px 8px 8px 0;">Scenario</th>
          <th style="text-align:left; padding:6px 8px;">Players/event</th>
          <th style="text-align:left; padding:6px 8px;">Games/event</th>
          <th style="text-align:left; padding:6px 8px;">Revenue/event</th>
          <th style="text-align:left; padding:6px 8px;">Break-even</th>
        </tr>
      </thead>
      <tbody>${scenarioRows}</tbody>
    </table>
    ${s.expected.eventProfit>0 ? renderROIChart(roi) : `<div class="info-note" style="margin-top:12px;">Break-even isn't reachable at the current price/traffic assumptions.</div>`}
  </div>`;
}

function powerReportBlock(){
  const grandTotal = galleryTotalWatts();
  const infra = GALLERY.infrastructure;
  const targetWattsTotal = GALLERY.props.reduce((s,p)=> s + (hasTarget(p) ? (p.targetWatts||0) : 0), 0);
  const infraWattsTotal = supportEquipmentWatts();
  const componentWattsTotal = grandTotal - targetWattsTotal - infraWattsTotal;
  const bySource = { "110V AC":0, "12V DC":0, "Other":0 };
  GALLERY.props.forEach(p=>{
    p.externalComponents.filter(c=>c.type!=="Power Supply").forEach(c=>{
      const key = POWER_TYPE_OPTIONS.includes(c.power) ? c.power : "Other";
      bySource[key] = (bySource[key]||0) + (c.watts||0);
    });
  });
  infra.supportEquipment.forEach(e=>{
    const key = POWER_TYPE_OPTIONS.includes(e.power) ? e.power : "Other";
    bySource[key] = (bySource[key]||0) + (e.qty||0)*(e.watts||0);
  });
  const recQty = recommendedInverterQty();
  const inverterCoverage = (infra.powerInverter.qty||0) * (infra.powerInverter.wattsRating||480);
  const inverterOK = inverterCoverage >= grandTotal;
  const hasInverterInfo = (infra.powerInverter.qty||0) > 0 || infra.powerDistributionBox.included;

  const infraRows = infra.supportEquipment.map(e=>`
    <tr style="border-bottom:1px solid var(--gridline);">
      <td style="padding:7px 8px 7px 0;">${e.name}</td>
      <td style="padding:7px 8px;">${e.qty||0}</td>
      <td style="padding:7px 8px;">${e.watts||0} W</td>
      <td style="padding:7px 8px; font-weight:700;">${((e.qty||0)*(e.watts||0)).toFixed(1)} W</td>
    </tr>`).join("");

  return `
  <div class="card">
    <h2>Total Power Draw</h2>
    <div class="grid cols-4" style="margin-bottom:14px;">
      <div class="stat-tile"><div class="stat-label">Grand total power draw</div><div class="stat-value">${grandTotal.toFixed(1)} W</div><div class="stat-sub">${GALLERY.props.length} props${infra.supportEquipment.length?' + support equipment':''}</div></div>
      <div class="stat-tile"><div class="stat-label">Components</div><div class="stat-value">${componentWattsTotal.toFixed(1)} W</div></div>
      <div class="stat-tile"><div class="stat-label">Target hardware</div><div class="stat-value">${targetWattsTotal.toFixed(1)} W</div></div>
      <div class="stat-tile"><div class="stat-label">Infrastructure equipment</div><div class="stat-value">${infraWattsTotal.toFixed(1)} W</div></div>
    </div>
    ${infra.supportEquipment.length ? `
    <table style="width:100%; border-collapse:collapse; margin-bottom:10px; font-size:13px;">
      <thead>
        <tr style="border-bottom:2px solid var(--gridline);">
          <th style="text-align:left; padding:6px 8px 8px 0;">Support equipment</th>
          <th style="text-align:left; padding:6px 8px;">Qty</th>
          <th style="text-align:left; padding:6px 8px;">Watts each</th>
          <th style="text-align:left; padding:6px 8px;">Total</th>
        </tr>
      </thead>
      <tbody>${infraRows}</tbody>
    </table>` : ""}
    <div class="grid cols-4" style="margin-bottom:10px;">
      ${Object.entries(bySource).map(([k,w])=>`<div class="stat-tile"><div class="stat-label">${k}</div><div class="stat-value">${w.toFixed(1)} W</div></div>`).join("")}
      <div class="stat-tile"><div class="stat-label">Target hardware (untyped)</div><div class="stat-value">${targetWattsTotal.toFixed(1)} W</div></div>
    </div>
    ${hasInverterInfo ? `
    <p style="margin:10px 0 0 0; font-size:13px;">${infra.powerDistributionBox.included?"Includes a power distribution box. ":""}You have <b>${infra.powerInverter.qty||0}</b> × ${infra.powerInverter.wattsRating||480}W inverter${(infra.powerInverter.qty||0)===1?"":"s"} = <b>${inverterCoverage} W</b> of capacity, against <b>${grandTotal.toFixed(1)} W</b> of total tracked draw.</p>
    <div class="info-note" style="margin-top:6px; ${inverterOK?'':'color:var(--warning);'}">${inverterOK ? "✓ Sufficient inverter capacity for the tracked draw." : `⚠ Additional inverter capacity is recommended — at least ${recQty} × ${infra.powerInverter.wattsRating||480}W unit${recQty===1?"":"s"} total.`}</div>
    ` : `<div class="info-note" style="margin-top:6px;">Excludes power-supply units themselves (their wattage rating is capacity, not draw). Target hardware is broken out separately since it isn't tied to a specific circuit voltage.</div>`}
  </div>`;
}
