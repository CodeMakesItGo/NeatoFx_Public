function renderReport(){
  STATIC_RENDER = true;
  const totalCostAll = galleryTotalCost();
  const totalHoursAll = galleryTotalHours();
  const showCostCol = MODE === "internal";
  const targetPropsCount = GALLERY.props.filter(isPropTarget).length; // "Props in this build" counts only actual prop/target line items, not light/audio/aux extras
  const propRows = GALLERY.props.map(p => `
    <tr><td><b>${p.name}</b></td><td>${propLocationLabel(p)}</td><td>${statusBadge(p.status)}</td><td class="num">${fmt$(showCostCol ? totalCost(p) : priceFromCost(totalCost(p)))}</td><td class="num">${p.buildTimeHours} hrs</td></tr>
  `).join("");

  const propSections = GALLERY.props.map(p => {
    const showComponents = MODE==="internal" || GALLERY.publishSettings.showComponents;
    const showFirmware = MODE==="internal" || GALLERY.publishSettings.showFirmware;
    const showChangelog = MODE==="internal" || GALLERY.publishSettings.showChangelog;
    const showPhotosVideo = shouldShowPhotosVideo(p);
    return `
    <div class="prop-print-section">
      <div class="card">
        <h1 style="margin-bottom:2px;">${p.name}</h1>
        <div class="crumbs" style="margin-bottom:14px;">${propLocationLabel(p)} &nbsp;·&nbsp; ${statusBadge(p.status)} &nbsp;·&nbsp; Last updated ${latestChangeDate(p)}</div>

        <div class="grid cols-2">
          <div>
            <h3>Location in gallery</h3>
            <p><b>Mount description:</b> ${p.location.notes}</p>
            <p style="font-size:13px;"><b>Elevation / mount:</b> ${p.location.elevation}</p>
            <div class="map-wrap">${renderMapSVG(p.id)}</div>
          </div>
          <div>
            <h3>Action when triggered</h3>
            <p>${p.action}</p>
            ${hasTarget(p) ? targetSection(p) : `<div class="info-note" style="margin-top:12px;">No physical target on this prop — components only.</div>`}
          </div>
        </div>

        ${showComponents ? `<h3 style="margin-top:16px;">External components</h3>${componentsTable(p)}` : ""}

        ${showFirmware ? `<div style="margin-top:16px;"><h3>Firmware</h3><p><b>${p.firmware.filename}</b> (${p.firmware.version})</p><p>${p.firmware.notes}</p></div>` : ""}

        ${showPhotosVideo ? `<div style="margin-top:16px;"><h3>Photos &amp; video</h3>${mediaSection(p)}</div>` : ""}

        <div class="grid cols-2" style="margin-top:16px;">
          <div><h3>${MODE==="internal"?"Cost &amp; build time":"Price &amp; build time"}</h3>${costCard(p)}</div>
          ${showChangelog ? `<div><h3>Update log</h3>${changelogSection(p)}</div>` : "<div></div>"}
        </div>
      </div>
    </div>`;
  }).join("");

  const html = `
    <div class="topbar">
      <div>
        <div class="report-logo">${neatoFxLogo()}</div>
        <h1>${GALLERY.name} — ${MODE==="internal"?"Internal Build Report":"Customer Build Plan Report"}</h1>
        <div class="crumbs">Prepared for ${GALLERY.customer.name} (${GALLERY.customer.contactName}, ${GALLERY.customer.email}, ${GALLERY.customer.phone}) &nbsp;·&nbsp; Prepared ${GALLERY.lastUpdated}</div>
      </div>
      <div class="actions no-print">
        <button class="btn primary" onclick="window.print()">Print / Save as PDF</button>
        <a class="btn" href="#/overview">Back to tracker</a>
      </div>
    </div>

    <div class="card">
      <h2>Summary</h2>
      ${showCostCol ? `
      <div class="grid cols-5" style="margin-bottom:14px;">
        <div class="stat-tile"><div class="stat-label">Props in this build</div><div class="stat-value">${targetPropsCount}</div></div>
        <div class="stat-tile"><div class="stat-label">Prop build cost</div><div class="stat-value">${fmt$(totalCostAll)}</div></div>
        <div class="stat-tile"><div class="stat-label">+ Player equipment cost</div><div class="stat-value">${fmt$(playerEquipmentTotalCost())}</div><div class="stat-sub">blasters${GALLERY.playerExperience.touchScreenPerPlayer?' + touch screens':''}</div></div>
        <div class="stat-tile" style="background:rgba(11,11,11,0.03);"><div class="stat-label">= Total build cost</div><div class="stat-value">${fmt$(totalCostAll + playerEquipmentTotalCost() + infrastructureCost() + travelCost())}</div><div class="stat-sub">${fmt$(totalCostAll)} props + ${fmt$(playerEquipmentTotalCost())} gear + ${fmt$(infrastructureCost())} infra + ${fmt$(travelCost())} travel</div></div>
        <div class="stat-tile"><div class="stat-label">Total build time</div><div class="stat-value">${totalHoursAll} hrs</div></div>
      </div>
      ` : `
      <div class="grid cols-3" style="margin-bottom:14px;">
        <div class="stat-tile"><div class="stat-label">Props in this build</div><div class="stat-value">${targetPropsCount}</div></div>
        <div class="stat-tile"><div class="stat-label">Total build time</div><div class="stat-value">${totalHoursAll} hrs</div></div>
        <div class="stat-tile" style="background:rgba(11,11,11,0.03);"><div class="stat-label">Quote price</div><div class="stat-value">${fmt$(priceFromCost(totalCostAll + playerEquipmentTotalCost() + infrastructureCost() + travelCost()))}</div></div>
      </div>
      `}
      <table>
        <thead><tr><th>Prop</th><th>Location</th><th>Status</th><th class="num">${showCostCol?'Cost':'Price'}</th><th class="num">Build time</th></tr></thead>
        <tbody>${propRows}</tbody>
        <tfoot><tr><td colspan="3" style="font-weight:700; border-bottom:none;">Total</td><td class="num" style="font-weight:700; border-bottom:none;">${fmt$(showCostCol ? totalCostAll : priceFromCost(totalCostAll))}</td><td class="num" style="font-weight:700; border-bottom:none;">${totalHoursAll} hrs</td></tr></tfoot>
      </table>
    </div>

    ${MODE==="internal" ? jobQuoteBlock() : ""}
    ${designReportBlock()}
    ${playersReportBlock()}
    ${powerReportBlock()}
    ${propSections}
  `;
  STATIC_RENDER = false;
  return `<div class="report-view">${html}</div>`;
}

function renderRoomsManager(internal){
  const rooms = GALLERY.design.rooms;
  const rows = rooms.map(r => `
    <tr>
      <td>${internal?`<input class="inline-input" style="width:100%;" value="${escapeAttr(r.name)}" onchange="setRoomField('${r.id}','name',this.value)">`:escapeHTML(r.name)}</td>
      <td class="num">${internal?`<input type="number" class="inline-input num-input" style="width:60px;" value="${r.widthFt}" onchange="setRoomField('${r.id}','widthFt',this.value,'number')">`:r.widthFt} ft</td>
      <td class="num">${internal?`<input type="number" class="inline-input num-input" style="width:60px;" value="${r.depthFt}" onchange="setRoomField('${r.id}','depthFt',this.value,'number')">`:r.depthFt} ft</td>
      <td class="num">${(r.widthFt*r.depthFt).toLocaleString()} sq ft</td>
      ${internal ? `<td class="num"><button class="btn-x" onclick="removeRoom('${r.id}')" title="Remove room">✕</button></td>` : ""}
    </tr>`).join("");
  return `
    <div style="margin-top:14px;">
      <table>
        <thead><tr><th>Room</th><th class="num">Width</th><th class="num">Depth</th><th class="num">Area</th>${internal?"<th></th>":""}</tr></thead>
        <tbody>${rows || `<tr><td colspan="5" style="color:var(--text-muted);">No rooms yet.</td></tr>`}</tbody>
      </table>
      ${internal?`<button class="btn" style="margin-top:10px;" onclick="addRoom()">+ Add Room</button>`:""}
    </div>`;
}

function renderDesignPage(){
  const d = GALLERY.design;
  const internal = isEditable();
  const roi = computeROI();
  const isWalkthrough = d.galleryType === "walkthrough";

  const galleryTypeControl = internal ? `
    <div style="margin-bottom:14px;">
      <label class="feature-check" style="margin-right:20px;"><input type="radio" name="galleryType" ${!isWalkthrough?"checked":""} onchange="setGalleryType('standback')"> Stand-back range (single room, firing line)</label>
      <label class="feature-check"><input type="radio" name="galleryType" ${isWalkthrough?"checked":""} onchange="setGalleryType('walkthrough')"> Walkthrough (multiple rooms)</label>
    </div>` : `<p style="margin:0 0 12px 0;"><b>Gallery type:</b> ${isWalkthrough ? "Walkthrough (multiple rooms)" : "Stand-back range"}</p>`;

  const footprintLine = isWalkthrough
    ? `<p><b>Total footprint:</b> ${totalRoomsSqFt(d.rooms).toLocaleString()} sq ft across ${d.rooms.length} room${d.rooms.length===1?"":"s"} &nbsp;·&nbsp; <b>Ceiling height:</b> ${internal?`<input type="number" class="inline-input num-input" style="width:64px;" value="${d.heightFt}" onchange="setDesignField('heightFt',this.value,'number')"> ft`:d.heightFt+' ft'}</p>`
    : `<p><b>Footprint (W × D × H):</b> ${internal
          ? `<input type="number" class="inline-input num-input" style="width:64px;" value="${d.widthFt}" onchange="setDesignField('widthFt',this.value,'number')"> ×
             <input type="number" class="inline-input num-input" style="width:64px;" value="${d.depthFt}" onchange="setDesignField('depthFt',this.value,'number')"> ×
             <input type="number" class="inline-input num-input" style="width:64px;" value="${d.heightFt}" onchange="setDesignField('heightFt',this.value,'number')"> ft`
          : `${d.widthFt} ft × ${d.depthFt} ft × ${d.heightFt} ft (${(d.widthFt*d.depthFt).toLocaleString()} sq ft, ${d.heightFt} ft ceiling)`}</p>`;

  const mapCaption = isWalkthrough
    ? [totalRoomsSqFt(d.rooms).toLocaleString()+' sq ft · '+d.rooms.length+' room'+(d.rooms.length===1?"":"s"), d.theme].filter(Boolean).join(' · ')
    : [d.widthFt+' ft × '+d.depthFt+' ft × '+d.heightFt+' ft high', d.theme].filter(Boolean).join(' · ');

  const showCost = MODE === "internal"; // equipment cost basis — internal-only, matching every other cost figure in the app
  const inf = GALLERY.infrastructure;
  const recQty = recommendedInverterQty();

  const powerEquipmentBlock = `
    <div class="grid cols-2" style="margin-top:14px; padding-top:14px; border-top:1px dashed var(--gridline);">
      <div>
        <label class="feature-check"><input type="checkbox" ${inf.powerDistributionBox.included?"checked":""} ${internal?`onchange="setInfraField('powerDistributionBox.included',this.checked)"`:"disabled"}> Power distribution box</label>
        ${(showCost && inf.powerDistributionBox.included) ? `<div class="cost-line" style="margin-top:6px;"><span>Cost</span><span>${internal?`$<input type="number" class="inline-input num-input" style="width:70px;" value="${inf.powerDistributionBox.costEach||0}" onchange="setInfraField('powerDistributionBox.costEach',this.value,'number')">`:fmt$(inf.powerDistributionBox.costEach||0)}</span></div>` : ""}
      </div>
      <div>
        <p style="margin:0 0 6px 0;"><b>480W power inverter:</b> ${internal?`<input type="number" min="0" class="inline-input num-input" style="width:56px;" value="${inf.powerInverter.qty||0}" onchange="setInfraField('powerInverter.qty',this.value,'number')">`:(inf.powerInverter.qty||0)} ${(inf.powerInverter.qty||0)===1?"unit":"units"}</p>
        ${showCost ? `<div class="cost-line"><span>Cost each</span><span>${internal?`$<input type="number" class="inline-input num-input" style="width:70px;" value="${inf.powerInverter.costEach||0}" onchange="setInfraField('powerInverter.costEach',this.value,'number')">`:fmt$(inf.powerInverter.costEach||0)}</span></div>` : ""}
        <div class="info-note" style="margin-top:6px;">Recommended: at least <b>${recQty}</b> × 480W ${recQty===1?"unit":"units"} to cover the ${Math.round(galleryTotalWatts())} W tracked so far (inverter capacity isn't counted as power draw, same as a component power supply).</div>
      </div>
    </div>`;

  const supportEquipRows = inf.supportEquipment.map((e,idx) => `
    <tr>
      <td>${internal?`<input class="inline-input small" style="width:100%;" value="${escapeAttr(e.name)}" onchange="updateSupportEquipmentField(${idx},'name',this.value)">`:e.name}</td>
      <td class="num">${internal?`<input type="number" min="0" class="inline-input num-input" style="width:50px;" value="${e.qty||0}" onchange="updateSupportEquipmentField(${idx},'qty',this.value,'number')">`:(e.qty||0)}</td>
      <td class="num">${internal?`<input type="number" step="0.1" class="inline-input num-input" style="width:60px;" value="${e.watts||0}" onchange="updateSupportEquipmentField(${idx},'watts',this.value,'number')">`:(e.watts||0)+" W"}</td>
      ${showCost ? `<td class="num">${internal?`$<input type="number" class="inline-input num-input" style="width:70px;" value="${e.costEach||0}" onchange="updateSupportEquipmentField(${idx},'costEach',this.value,'number')">`:fmt$(e.costEach||0)}</td>` : ""}
      ${internal ? `<td class="num"><button class="btn-x" onclick="removeSupportEquipment(${idx})" title="Remove">✕</button></td>` : ""}
    </tr>`).join("");

  const supportEquipmentCard = `
    <div class="card">
      <h3>Infrastructure &amp; support equipment</h3>
      <table>
        <thead><tr><th>Equipment</th><th class="num">Qty</th><th class="num">Watts each</th>${showCost?'<th class="num">Cost each</th>':''}${internal?'<th></th>':''}</tr></thead>
        <tbody>${supportEquipRows || `<tr><td colspan="5" style="color:var(--text-muted);">No support equipment tracked yet.</td></tr>`}</tbody>
        <tfoot><tr>
          <td style="border-bottom:none; font-weight:700;">Subtotal</td>
          <td class="num" style="border-bottom:none;"></td>
          <td class="num" style="border-bottom:none; font-weight:700;">${supportEquipmentWatts().toFixed(1)} W</td>
          ${showCost ? `<td class="num" style="border-bottom:none; font-weight:700;">${fmt$(inf.supportEquipment.reduce((s,e)=>s+(e.qty||0)*(e.costEach||0),0))}</td>` : ""}
          ${internal?'<td style="border-bottom:none;"></td>':''}
        </tr></tfoot>
      </table>
      ${internal?`<button class="btn" style="margin-top:10px;" onclick="addSupportEquipment()">+ Add equipment</button>`:""}
      <div class="info-note" style="margin-top:12px;">Router, Home Assistant server, and any other always-on network/automation gear for the whole gallery (not tied to a single prop). Unlike the power distribution box and inverters above, this equipment actually draws power, so its wattage is included in the gallery's total power draw and energy cost.</div>
    </div>`;

  return `
    <div class="topbar">
      <div><h1>Gallery Design &amp; Economics</h1><div class="crumbs">Theme, floor plan, power draw, and player ROI for ${GALLERY.name}</div></div>
      <div class="actions no-print"><button class="btn" onclick="window.print()">Print / Save PDF</button></div>
    </div>

    <div class="card">
      <h3>Theme &amp; dimensions</h3>
      ${galleryTypeControl}
      <div class="grid cols-2">
        <p><b>Theme:</b> ${internal?`<input class="inline-input" value="${escapeAttr(d.theme)}" onchange="setDesignField('theme',this.value)">`:d.theme}</p>
        ${footprintLine}
      </div>
      ${isWalkthrough ? renderRoomsManager(internal) : ""}
      <div class="map-wrap" style="margin-top:10px;">${renderMapSVG(null)}</div>
      <div class="map-caption">${mapCaption}</div>
      ${categoryLegendHTML()}
    </div>

    <div class="card">
      <h3>Power consumption &amp; energy cost</h3>
      <div class="grid cols-4">
        <div class="stat-tile"><div class="stat-label">Total power draw</div><div class="stat-value">${Math.round(roi.totalWatts)} W</div><div class="stat-sub">${GALLERY.props.length} props${GALLERY.infrastructure.supportEquipment.length?' + support equipment':''}</div></div>
        <div class="stat-tile"><div class="stat-label">Daily energy use</div><div class="stat-value">${roi.dailyKWh.toFixed(2)} kWh</div><div class="stat-sub">${internal?`<input type="number" step="0.5" class="inline-input num-input" style="width:56px;" value="${d.operatingHoursPerDay}" onchange="setDesignField('operatingHoursPerDay',this.value,'number')">`:d.operatingHoursPerDay} hrs/day open</div></div>
        <div class="stat-tile"><div class="stat-label">Daily energy cost</div><div class="stat-value">${fmt$(roi.dailyEnergyCost)}</div><div class="stat-sub">at ${internal?`$<input type="number" step="0.01" class="inline-input num-input" style="width:56px;" value="${d.electricityRatePerKWh}" onchange="setDesignField('electricityRatePerKWh',this.value,'number')">`:"$"+d.electricityRatePerKWh}/kWh</div></div>
        <div class="stat-tile"><div class="stat-label">Monthly energy cost</div><div class="stat-value">${fmt$(roi.monthlyEnergyCost)}</div><div class="stat-sub">~${internal?`<input type="number" class="inline-input num-input" style="width:50px;" value="${d.daysOperatingPerWeek}" onchange="setDesignField('daysOperatingPerWeek',this.value,'number')">`:d.daysOperatingPerWeek} days/week open</div></div>
      </div>
      <div class="info-note" style="margin-top:12px;">Power draw is estimated from each prop's tracked external components${GALLERY.infrastructure.supportEquipment.length?' plus always-on support equipment below':''}. Add more props for a complete facility estimate.</div>
      ${powerEquipmentBlock}
    </div>

    ${supportEquipmentCard}

    <div class="card">
      <h3>Play economics &amp; ROI</h3>
      <div class="grid cols-2" style="margin-bottom:14px;">
        <div>
          <p><b>Cost per game:</b> ${internal?`$<input type="number" step="0.5" class="inline-input num-input" style="width:70px;" value="${d.costPerGame}" onchange="setDesignField('costPerGame',this.value,'number')">`:(d.freePlayEnabled?"—":fmt$(d.costPerGame))}</p>
          <p><label class="feature-check"><input type="checkbox" ${d.freePlayEnabled?"checked":""} ${internal?`onchange="setDesignField('freePlayEnabled',this.checked)"`:"disabled"}> Free play (no per-game charge)</label></p>
          <p><label class="feature-check"><input type="checkbox" ${d.birthdayMode.enabled?"checked":""} ${internal?`onchange="setDesignField('birthdayMode.enabled',this.checked)"`:"disabled"}> Birthday / private event mode</label></p>
          ${d.birthdayMode.enabled ? `<div style="font-size:12px; color:var(--text-secondary); margin-top:-6px;">${internal?`<input class="inline-input" style="width:100%;" value="${escapeAttr(d.birthdayMode.description)}" onchange="setDesignField('birthdayMode.description',this.value)">`:d.birthdayMode.description}</div>`:""}
        </div>
        <div>
          <p><b>Avg. games per player:</b> ${internal?`<input type="number" step="0.5" class="inline-input num-input" style="width:70px;" value="${d.avgGamesPerPlayer}" onchange="setDesignField('avgGamesPerPlayer',this.value,'number')">`:d.avgGamesPerPlayer}</p>
          <p><b>Players per event (est.):</b> ${internal?`<input type="number" class="inline-input num-input" style="width:70px;" value="${d.playersPerDay}" onchange="setDesignField('playersPerDay',this.value,'number')">`:d.playersPerDay}</p>
          <p><b>Best/worst case swing:</b> ${internal?`±<input type="number" step="1" min="0" class="inline-input num-input" style="width:56px;" value="${d.trafficVariancePercent}" onchange="setDesignField('trafficVariancePercent',this.value,'number')">%`:"±"+d.trafficVariancePercent+"%"}</p>
        </div>
      </div>
      <div class="info-note" style="margin-bottom:14px;">An "event" is one operating session — a day open, or a booked private event — so break-even is shown in events rather than a specific calendar-day promise. The best/worst case scenarios flex players/event by the swing % above; games per player and cost per game are held constant across scenarios.</div>

      <table class="roi-scenario-table" style="width:100%; border-collapse:collapse; margin-bottom:16px; font-size:13px;">
        <thead>
          <tr style="border-bottom:2px solid var(--gridline);">
            <th style="text-align:left; padding:6px 8px 8px 0;">Scenario</th>
            <th style="text-align:left; padding:6px 8px;">Players/event</th>
            <th style="text-align:left; padding:6px 8px;">Games/event</th>
            <th style="text-align:left; padding:6px 8px;">Revenue/event</th>
            <th style="text-align:left; padding:6px 8px;">Profit/event</th>
            <th style="text-align:left; padding:6px 8px;">Break-even</th>
          </tr>
        </thead>
        <tbody>
          ${[
            { sc: roi.scenarios.worst, color: "var(--warning)" },
            { sc: roi.scenarios.expected, color: "var(--series-1)" },
            { sc: roi.scenarios.best, color: "var(--good)" }
          ].map(({sc,color}) => `
          <tr style="border-bottom:1px solid var(--gridline);">
            <td style="padding:7px 8px 7px 0;"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color};vertical-align:middle;margin-right:6px;"></span>${sc.label}</td>
            <td style="padding:7px 8px;">${sc.playersPerEvent.toLocaleString()}</td>
            <td style="padding:7px 8px;">${Math.round(sc.eventGames).toLocaleString()}</td>
            <td style="padding:7px 8px;">${d.freePlayEnabled?"—":fmt$(sc.eventRevenue)}</td>
            <td style="padding:7px 8px;">${fmt$(sc.eventProfit)}</td>
            <td style="padding:7px 8px;">${sc.breakEvenEvents ? "~"+Math.ceil(sc.breakEvenEvents).toLocaleString()+" events" : (d.freePlayEnabled?"Free play":"Not reached")}</td>
          </tr>`).join("")}
        </tbody>
      </table>

      <div class="grid cols-2" style="margin-bottom:14px;">
        <div class="stat-tile"><div class="stat-label">Expected break-even</div><div class="stat-value">${roi.scenarios.expected.breakEvenEvents ? Math.ceil(roi.scenarios.expected.breakEvenEvents)+" events" : "—"}</div><div class="stat-sub">${roi.scenarios.expected.breakEvenGames ? "~"+roi.scenarios.expected.breakEvenGames.toLocaleString()+" games played" : (d.freePlayEnabled?"Free play — no per-game revenue":"Not reached at current settings")}</div></div>
        <div class="stat-tile"><div class="stat-label">Best → worst range</div><div class="stat-value">${roi.scenarios.best.breakEvenEvents && roi.scenarios.worst.breakEvenEvents ? Math.ceil(roi.scenarios.best.breakEvenEvents)+"–"+Math.ceil(roi.scenarios.worst.breakEvenEvents)+" events" : "—"}</div><div class="stat-sub">best case → worst case</div></div>
      </div>

      <h3>When will this gallery be in the black?</h3>
      ${roi.scenarios.expected.eventProfit>0 ? renderROIChart(roi) : `<div class="info-note">Break-even isn't reachable with the current price/traffic assumptions — increase cost per game, players/event, or disable free play to see the payback chart.</div>`}
    </div>
  `;
}

function renderPowerPage(){
  const internal = isEditable();
  const props = GALLERY.props;
  const rows = [...props].sort((a,b)=>propWatts(b)-propWatts(a));
  const grandTotal = galleryTotalWatts();
  const infra = GALLERY.infrastructure;
  const bySource = { "110V AC":0, "12V DC":0, "Other":0 };
  props.forEach(p=>{
    p.externalComponents.filter(c=>c.type!=="Power Supply").forEach(c=>{
      const key = POWER_TYPE_OPTIONS.includes(c.power) ? c.power : "Other";
      bySource[key] = (bySource[key]||0) + (c.watts||0);
    });
  });
  infra.supportEquipment.forEach(e=>{
    const key = POWER_TYPE_OPTIONS.includes(e.power) ? e.power : "Other";
    bySource[key] = (bySource[key]||0) + (e.qty||0)*(e.watts||0);
  });
  const targetWattsTotal = props.reduce((s,p)=> s + (hasTarget(p) ? (p.targetWatts||0) : 0), 0);
  const infraWattsTotal = supportEquipmentWatts();
  const componentWattsTotal = grandTotal - targetWattsTotal - infraWattsTotal;
  const propRows = rows.map(p=>`
    <tr>
      <td><a href="#/prop/${p.id}">${p.name}</a></td>

  const pp = GALLERY.powerPlanning;

    ${MODE==="internal" ? `

      <div class="grid cols-2" style="margin-bottom:14px;">

          <p style="margin:0 0 6px 0;"><b>Battery efficiency:</b> <input type="number" min="1" max="100" class="inline-input num-input" style="width:56px;" value="${pp.efficiencyPercent}" onchange="setPowerPlanningField('efficiencyPercent',this.value,'number')">%</p>

        </div>

      <div class="grid cols-3" style="margin-bottom:14px;">
        <div class="stat-tile"><div class="stat-label">Peak watts (tracked)</div><div class="stat-value">${grandTotal.toFixed(1)} W</div></div>

      </div>
      <table>
        <thead><tr><th>Power station</th><th class="num">Capacity</th><th class="num">Continuous</th><th class="num">Surge</th><th class="num">Price</th><th class="num">Covers peak?</th><th class="num">Covers event?</th>${internal?'<th></th>':''}</tr></thead>
        <tbody>${candidateRows || `<tr><td colspan="8" style="color:var(--text-muted);">No candidates yet.</td></tr>`}</tbody>
      </table>
      ${internal?`<button class="btn" style="margin-top:10px;" onclick="addPowerCandidate()">+ Add power station</button>`:""}
      <div class="info-note" style="margin-top:12px;">Energy needed = tracked peak watts × duty cycle % × event hours — not peak watts × hours, which badly overstates real draw. "Recommended" means a unit covers the instantaneous peak, covers the full event's energy need, and has at least a 15% capacity buffer on top. This card is internal-only since it's an equipment-purchasing decision, not customer-facing content.</div>
    </div>
    ` : ""}
  `;
}

function daysSince(dateStr){
  if(!dateStr || dateStr === "—") return null;
  const diffMs = new Date(todayStr()) - new Date(dateStr);
  return Math.floor(diffMs / 86400000);
}
function renderBuildTrackerPage(){
  const internal = isEditable();
  const props = GALLERY.props;
  const statusKeys = Object.keys(STATUS_STYLES); // concept, in-build, testing, installed — in build-progress order
  const counts = {}, hoursByStatus = {};
  statusKeys.forEach(k=>{ counts[k]=0; hoursByStatus[k]=0; });
  props.forEach(p=>{
    counts[p.status] = (counts[p.status]||0)+1;
    hoursByStatus[p.status] = (hoursByStatus[p.status]||0) + (p.buildTimeHours||0);
  });
  const totalProps = props.length;
  const totalHours = props.reduce((s,p)=>s+(p.buildTimeHours||0),0);
  const installedCount = counts["installed"]||0;
  const installedHours = hoursByStatus["installed"]||0;
  const pctPropsDone = totalProps>0 ? Math.round((installedCount/totalProps)*100) : 0;
  const pctHoursDone = totalHours>0 ? Math.round((installedHours/totalHours)*100) : 0;

  const barSegments = statusKeys.map(k=>{
    const pct = totalProps>0 ? (counts[k]/totalProps)*100 : 0;
    return pct>0 ? `<div style="width:${pct}%; background:${STATUS_STYLES[k].color};" title="${STATUS_STYLES[k].label}: ${counts[k]}"></div>` : "";
  }).join("");

  const sortOrder = { "concept":0, "in-build":1, "testing":2, "installed":3 };
  const rows = [...props].sort((a,b)=> (sortOrder[a.status]??0)-(sortOrder[b.status]??0) || a.name.localeCompare(b.name)).map(p=>{
    const last = latestChangeDate(p);
    const days = daysSince(last);
    const stalled = p.status !== "installed" && days!=null && days >= 14;
    return `
    <tr>
      <td><a href="#/prop/${p.id}">${escapeHTML(p.name)}</a></td>
      <td>${escapeHTML(propLocationShort(p))}</td>
      <td>${internal ? statusSelectHTML(p.id, p.status) : statusBadge(p.status)}</td>
      <td class="num">${internal ? `<input type="number" min="0" step="0.5" class="inline-input num-input" value="${p.buildTimeHours||0}" onchange="setPropField('${p.id}','buildTimeHours',this.value,'number')"> hrs` : (p.buildTimeHours||0)+" hrs"}</td>
      <td>${last}${stalled ? ` <span class="badge" style="color:var(--warning); background:rgba(250,178,25,0.14); margin-left:6px;" title="No changelog update in ${days} days">⚠ Stalled ${days}d</span>` : ""}</td>
    </tr>`;
  }).join("");

  return `
    <div class="topbar">
      <div><h1>Build Tracker</h1><div class="crumbs">Track build progress across every prop, and see how close the whole gallery is to done. Internal only; never shown in Customer View or either report.</div></div>
    </div>

    <div class="grid cols-4" style="margin-bottom:14px;">
      ${statusKeys.map(k=>`
      <div class="stat-tile">
        <div class="stat-label" style="color:${STATUS_STYLES[k].color};">${STATUS_STYLES[k].icon} ${STATUS_STYLES[k].label}</div>
        <div class="stat-value">${counts[k]||0}</div>
        <div class="stat-sub">${hoursByStatus[k]||0} build hrs</div>
      </div>`).join("")}
    </div>

    <div class="card">
      <h3>Overall progress</h3>
      <div style="display:flex; height:14px; border-radius:7px; overflow:hidden; background:rgba(11,11,11,0.06); margin:10px 0 14px 0;">${barSegments}</div>
      <div class="grid cols-2">
        <div><b>${installedCount} of ${totalProps}</b> props installed <span style="color:var(--text-muted);">(${pctPropsDone}%)</span></div>
        <div><b>${installedHours} of ${totalHours}</b> build hours complete <span style="color:var(--text-muted);">(${pctHoursDone}%)</span></div>
      </div>
    </div>

    <div class="card">
      <h3>Props</h3>
      <table>
        <thead><tr><th>Prop</th><th>Location</th><th>Status</th><th class="num">Build time</th><th>Last updated</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="5" style="color:var(--text-muted);">No props yet.</td></tr>`}</tbody>
        ${totalProps ? `<tfoot><tr><td colspan="3" style="font-weight:700;">Total</td><td class="num" style="font-weight:700;">${totalHours} hrs</td><td></td></tr></tfoot>` : ""}
      </table>
      <div class="info-note" style="margin-top:12px;">"Stalled" flags any prop that isn't installed yet and hasn't had a changelog entry in 14+ days — a nudge to check on it, not a hard rule. Add a changelog note from the prop's detail page to clear it.</div>
    </div>
  `;
}

function renderPurchaseTrackerPage(){
  const internal = isEditable();
  const estTotal = jobGoodsEstimate();
  const actualTotal = jobGoodsActual();
  const remainingEst = jobGoodsRemainingEstimate();
  const variance = jobGoodsVariance();
  const progress = checklistProgress();
  const signed = (n) => n===0 ? fmt$(0) : (n>0?'+':'−')+fmt$(Math.abs(n));

  function checkRow(opts){
    const { label, sub, estCost, purchased, actualCost, purchasedDate, toggleHandler, costHandler, dateHandler } = opts;
    const diff = (purchased && actualCost!=null) ? (actualCost - estCost) : null;
    const diffColor = diff==null ? 'var(--text-muted)' : (diff>0?'var(--warning)':(diff<0?'var(--good)':'var(--text-secondary)'));
    return `
    <tr style="${purchased?'background:rgba(12,163,12,0.05);':''}">
      <td style="width:34px; text-align:center;"><input type="checkbox" ${purchased?'checked':''} ${internal?`onchange="${toggleHandler}"`:'disabled'}></td>
      <td>${escapeHTML(label)}${sub?`<div style="color:var(--text-muted); font-size:12px; margin-top:2px;">${escapeHTML(sub)}</div>`:''}</td>
      <td class="num">${fmt$(estCost)}</td>
      <td class="num">$${internal?`<input type="number" class="inline-input num-input" style="width:80px;" placeholder="${Math.round(estCost)}" value="${actualCost!=null?actualCost:''}" onchange="${costHandler}">`:(actualCost!=null?fmt$(actualCost):'—')}</td>
      <td class="num" style="color:${diffColor};">${diff==null?'—':signed(diff)}</td>
      <td>${internal?`<input type="date" class="inline-input small" style="width:130px;" value="${purchasedDate||''}" onchange="${dateHandler}">`:(purchasedDate||'')}</td>
    </tr>`;
  }
  function qtyRow(opts){
    const { label, sub, costEach, qtyNeeded, qtyPurchased, actualCostTotal, qtyHandler, costHandler } = opts;
    const qp = qtyPurchased||0;
    const estForQty = qp * (costEach||0);
    const diff = (qp>0 && actualCostTotal) ? (actualCostTotal - estForQty) : null;
    const diffColor = diff==null ? 'var(--text-muted)' : (diff>0?'var(--warning)':(diff<0?'var(--good)':'var(--text-secondary)'));
    return `
    <tr style="${qtyNeeded>0 && qp>=qtyNeeded?'background:rgba(12,163,12,0.05);':''}">
      <td style="width:90px; text-align:center; color:var(--text-muted); font-size:12px;">${internal?`<input type="number" min="0" max="${qtyNeeded}" class="inline-input num-input" style="width:44px;" value="${qp}" onchange="${qtyHandler}">`:qp} / ${qtyNeeded}</td>
      <td>${escapeHTML(label)}${sub?`<div style="color:var(--text-muted); font-size:12px; margin-top:2px;">${escapeHTML(sub)}</div>`:''}</td>
      <td class="num">${fmt$(estForQty)}</td>
      <td class="num">$${internal?`<input type="number" class="inline-input num-input" style="width:80px;" placeholder="0" value="${actualCostTotal?actualCostTotal:''}" onchange="${costHandler}">`:fmt$(actualCostTotal||0)}</td>
      <td class="num" style="color:${diffColor};">${diff==null?'—':signed(diff)}</td>
      <td></td>
    </tr>`;
  }

  const propCards = GALLERY.props.map(p=>{
    const compRows = p.externalComponents.map((c,idx)=>checkRow({
      label: c.name, sub: c.notes||'', estCost: c.cost||0, purchased: !!c.purchased, actualCost: c.actualCost, purchasedDate: c.purchasedDate,
      toggleHandler: `toggleComponentPurchased('${p.id}',${idx},this.checked)`,
      costHandler: `updateComponentField('${p.id}',${idx},'actualCost',this.value,'number')`,
      dateHandler: `updateComponentField('${p.id}',${idx},'purchasedDate',this.value)`
    })).join("");
    const miscRow = checkRow({
      label: "Misc materials", sub: "", estCost: p.miscMaterials||0, purchased: !!p.miscMaterialsPurchased, actualCost: p.miscMaterialsActualCost, purchasedDate: p.miscMaterialsPurchasedDate,
      toggleHandler: `toggleMiscMaterialsPurchased('${p.id}',this.checked)`,
      costHandler: `setPropField('${p.id}','miscMaterialsActualCost',this.value,'number')`,
      dateHandler: `setPropField('${p.id}','miscMaterialsPurchasedDate',this.value)`
    });
    const targetRow = hasTarget(p) ? checkRow({
      label: "Target / animatronic base cost", sub: "", estCost: p.targetCost||0, purchased: !!p.targetPurchased, actualCost: p.targetActualCost, purchasedDate: p.targetPurchasedDate,
      toggleHandler: `toggleTargetPurchased('${p.id}',this.checked)`,
      costHandler: `setPropField('${p.id}','targetActualCost',this.value,'number')`,
      dateHandler: `setPropField('${p.id}','targetPurchasedDate',this.value)`
    }) : "";
    const est = propGoodsEstimate(p), actual = propGoodsActual(p);
    return `
    <div class="card">
      <h3><a href="#/prop/${p.id}" style="color:inherit; text-decoration:none;">${escapeHTML(p.name)}</a> ${statusBadge(p.status)}</h3>
      <table>
        <thead><tr><th></th><th>Item</th><th class="num">Est.</th><th class="num">Actual</th><th class="num">Δ vs est.</th><th>Date</th></tr></thead>
        <tbody>${compRows}${miscRow}${targetRow}</tbody>
        <tfoot><tr>
          <td colspan="2" style="font-weight:700;">Prop subtotal</td>
          <td class="num" style="font-weight:700;">${fmt$(est)}</td>
          <td class="num" style="font-weight:700;">${fmt$(actual)}</td>
          <td colspan="2"></td>
        </tr></tfoot>
      </table>
    </div>`;
  }).join("");

  const infra = GALLERY.infrastructure;
  const infraCheckRows = [
    infra.powerDistributionBox.included ? checkRow({
      label: "Power distribution box", sub: "", estCost: infra.powerDistributionBox.costEach||0, purchased: !!infra.powerDistributionBox.purchased, actualCost: infra.powerDistributionBox.actualCost, purchasedDate: infra.powerDistributionBox.purchasedDate,
      toggleHandler: `toggleDistributionBoxPurchased(this.checked)`,
      costHandler: `setInfraField('powerDistributionBox.actualCost',this.value,'number')`,
      dateHandler: `setInfraField('powerDistributionBox.purchasedDate',this.value)`
    }) : "",
    ...infra.supportEquipment.map((e,idx)=>checkRow({
      label: `${e.name}${(e.qty||1)>1?` (×${e.qty})`:''}`, sub: "", estCost: (e.qty||0)*(e.costEach||0), purchased: !!e.purchased, actualCost: e.actualCost, purchasedDate: e.purchasedDate,
      toggleHandler: `toggleSupportEquipmentPurchased(${idx},this.checked)`,
      costHandler: `updateSupportEquipmentField(${idx},'actualCost',this.value,'number')`,
      dateHandler: `updateSupportEquipmentField(${idx},'purchasedDate',this.value)`
    }))
  ].join("");
  const inverterQtyRow = (infra.powerInverter.qty||0) > 0 ? qtyRow({
    label: `${infra.powerInverter.wattsRating||480}W power inverter`, sub: "",
    costEach: infra.powerInverter.costEach||0, qtyNeeded: infra.powerInverter.qty||0, qtyPurchased: infra.powerInverter.purchasedQty,
    actualCostTotal: infra.powerInverter.actualCostTotal,
    qtyHandler: `setInfraField('powerInverter.purchasedQty',this.value,'number')`,
    costHandler: `setInfraField('powerInverter.actualCostTotal',this.value,'number')`
  }) : "";

  const pe = GALLERY.playerExperience;
  const purch = pe.purchasing || {};
  const blasterQtyRow = (pe.numPlayers||0) > 0 ? qtyRow({
    label: "Blasters", sub: pe.blasterType||"",
    costEach: pe.blasterCostEach||0, qtyNeeded: pe.numPlayers||0, qtyPurchased: purch.blastersPurchasedQty,
    actualCostTotal: purch.blastersActualCostTotal,
    qtyHandler: `setPlayerPurchasingField('blastersPurchasedQty',this.value,'number')`,
    costHandler: `setPlayerPurchasingField('blastersActualCostTotal',this.value,'number')`
  }) : "";
  const touchScreenQtyRow = (pe.touchScreenPerPlayer && (pe.numPlayers||0) > 0) ? qtyRow({
    label: "Player touchscreens", sub: "",
    costEach: pe.touchScreenCostEach||0, qtyNeeded: pe.numPlayers||0, qtyPurchased: purch.touchScreensPurchasedQty,
    actualCostTotal: purch.touchScreensActualCostTotal,
    qtyHandler: `setPlayerPurchasingField('touchScreensPurchasedQty',this.value,'number')`,
    costHandler: `setPlayerPurchasingField('touchScreensActualCostTotal',this.value,'number')`
  }) : "";

  return `
    <div class="topbar">
      <div><h1>Purchase Tracker</h1><div class="crumbs">Check off components as you actually buy them and log what you actually paid — a real-world running total kept separate from the estimate used for the customer quote. Internal only; never shown in Customer View or either report.</div></div>
    </div>
    <div class="grid cols-4" style="margin-bottom:18px;">
      <div class="stat-tile"><div class="stat-label">Estimated cost of goods</div><div class="stat-value">${fmt$(estTotal)}</div><div class="stat-sub">Components, materials, target hardware, infrastructure &amp; player gear — excludes labor</div></div>
      <div class="stat-tile"><div class="stat-label">Actual spent so far</div><div class="stat-value">${fmt$(actualTotal)}</div><div class="stat-sub">${progress.checked} of ${progress.total} checklist items purchased</div></div>
      <div class="stat-tile"><div class="stat-label">Remaining to buy (est.)</div><div class="stat-value">${fmt$(remainingEst)}</div></div>
      <div class="stat-tile"><div class="stat-label">Variance vs. estimate</div><div class="stat-value" style="color:${variance>0?'var(--critical)':(variance<0?'var(--good)':'inherit')};">${signed(variance)}</div><div class="stat-sub">${variance>0?"Over estimate for what's bought so far":(variance<0?"Under estimate for what's bought so far":"On budget so far")}</div></div>
    </div>

    ${propCards}

    ${(infraCheckRows || inverterQtyRow) ? `
    <div class="card">
      <h3>Infrastructure &amp; support equipment</h3>
      ${infraCheckRows ? `
      <table>
        <thead><tr><th></th><th>Item</th><th class="num">Est.</th><th class="num">Actual</th><th class="num">Δ vs est.</th><th>Date</th></tr></thead>
        <tbody>${infraCheckRows}</tbody>
      </table>` : ""}
      ${inverterQtyRow ? `
      <table style="margin-top:${infraCheckRows?'14px':'0'};">
        <thead><tr><th>Qty bought</th><th>Item</th><th class="num">Est. (for qty bought)</th><th class="num">Actual</th><th class="num">Δ vs est.</th><th></th></tr></thead>
        <tbody>${inverterQtyRow}</tbody>
      </table>` : ""}
    </div>` : ""}

    ${(blasterQtyRow || touchScreenQtyRow) ? `
    <div class="card">
      <h3>Player equipment</h3>
      <table>
        <thead><tr><th>Qty bought</th><th>Item</th><th class="num">Est. (for qty bought)</th><th class="num">Actual</th><th class="num">Δ vs est.</th><th></th></tr></thead>
        <tbody>${blasterQtyRow}${touchScreenQtyRow}</tbody>
      </table>
    </div>` : ""}

    <div class="info-note" style="margin-top:4px;">This tracker is independent of the customer quote — checking items off and logging real prices here never changes the Price shown to the customer or the estimate used anywhere else in the app. It's purely for tracking your real cost of goods against what you originally estimated. Labor isn't included here since it isn't something you purchase.</div>
  `;
}

function renderLibraryPage(){

        <input class="inline-input small" style="width:100%;" value="${escapeAttr(item.name)}" onchange="setLibraryComponentField(${idx},'name',this.value)">

    <tr>
      <td><b>${tpl.libraryName}</b></td>
      <td class="num">${tpl.externalComponents.length}</td>
      <td class="num">${fmt$(tpl.externalComponents.reduce((s,c)=>s+c.cost,0) + tpl.buildTimeHours*HOURLY_RATE + (tpl.miscMaterials||0) + (hasTarget(tpl)?(tpl.targetCost||0):0))}</td>

  return `

    <div class="card">
      <h3>Shop Rate</h3>

      <div class="cost-line"><span>Hourly rate</span><span>$<input type="number" step="0.5" class="inline-input num-input" style="width:70px;" value="${HOURLY_RATE}" onchange="setHourlyRate(this.value)">/hr</span></div>

    <div class="card">

      <p>Save any finished (or in-progress) prop here with <b>💾 Save to Prop Library</b> on its detail page, then reuse it in this project or a future one instead of rebuilding it from scratch.</p>
      ${PROP_LIBRARY.length ? `
      <table>
        <thead><tr><th>Prop</th><th class="num">Components</th><th class="num">Est. cost</th><th class="num">Build time</th><th></th></tr></thead>
        <tbody>${propRows}</tbody>
      </table>` : `<div class="info-note">No saved props yet.</div>`}

    <div class="card">
      <h3>Component Library</h3>
      <p>This is the dropdown list offered by "+ Add from component library…" on every prop's Components section. Add your own common parts here, or remove ones you don't use.</p>
      <table>
        <thead><tr><th>Component</th><th>Category</th><th>Type</th><th>Power</th><th class="num">Watts</th><th class="num">Cost</th><th></th></tr></thead>
        <tbody>${compRows}</tbody>

      <div class="add-custom-row" style="margin-top:14px;">

        <input id="lib-watts" type="number" class="inline-input num-input" placeholder="Watts">

        <input id="lib-notes" class="inline-input" placeholder="Notes (optional)" style="min-width:160px;">
        <button class="btn primary" onclick="addLibraryComponent()">+ Add to library</button>
      </div>
    </div>
  `;
}

function renderProjectsPage(){
  const rows = PROJECTS.map(proj => {
    const total = proj.props.reduce((s,p)=> s + p.externalComponents.reduce((s2,c)=>s2+c.cost,0) + p.buildTimeHours*HOURLY_RATE + (p.miscMaterials||0) + (hasTarget(p)?(p.targetCost||0):0), 0);
    const active = proj.id === ACTIVE_PROJECT_ID;
    return `
    <tr style="${active?'background:rgba(42,120,214,0.06);':''}">
      <td>
        <input class="inline-input" value="${escapeAttr(proj.name)}" onchange="setProjectField('${proj.id}','name',this.value)">
        ${active ? `<span class="badge" style="color:var(--series-1); background:rgba(42,120,214,0.12); margin-left:6px;">Active</span>` : ""}
      </td>
      <td><input class="inline-input" value="${escapeAttr(proj.customer.name)}" onchange="setProjectCustomerField('${proj.id}','name',this.value)"></td>
      <td class="num">${proj.props.length}</td>
      <td class="num">${fmt$(total)}</td>
      <td class="num" style="white-space:nowrap;">
        ${active ? "" : `<button class="btn primary" onclick="switchProject('${proj.id}')">Switch to</button>`}
        <button class="btn" onclick="duplicateProject('${proj.id}')">Duplicate</button>
        ${PROJECTS.length>1 ? `<button class="btn-x" style="margin-left:6px;" onclick="deleteProject('${proj.id}')" title="Delete project">✕</button>` : ""}
      </td>
    </tr>`;
  }).join("");

  return `
    <div class="topbar">
      <div>
        <h1>Projects</h1>
        <div class="crumbs">Every gallery build you're tracking, each with its own customer, design, and props. The Component &amp; Prop Libraries are shared across all of them.</div>
      </div>
      <div class="actions no-print"><button class="btn primary" onclick="createProject()">+ New Project</button></div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Project</th><th>Customer</th><th class="num">Props</th><th class="num">Total cost</th><th></th></tr></thead>

      <div class="info-note" style="margin-top:12px;">Rename a project by editing its name above. "Switch to" makes it the active project everywhere in the sidebar and on every page. Customer name, gallery design, and player experience are edited from the Overview and their own pages once a project is active.</div>
    </div>
  `;
}

function renderApp(){
  const hash = location.hash || "#/overview";
  const app = document.getElementById("app");
  let body, navRoute;

  if(hash.startsWith("#/prop/")){
    const id = hash.replace("#/prop/","");
    const prop = GALLERY.props.find(p=>p.id===id);
    if(prop){ body = renderPropDetail(prop); navRoute = "prop:"+id; }
    else { body = renderOverview(); navRoute = "overview"; }
  } else if(hash === "#/report"){
    body = renderReport(); navRoute = "report";
  } else if(hash === "#/design"){
    body = renderDesignPage(); navRoute = "design";
  } else if(hash === "#/players"){
    body = renderPlayersPage(); navRoute = "players";
  } else if(hash === "#/power"){
    body = renderPowerPage(); navRoute = "power";
  } else if(hash === "#/build"){
    body = MODE==="internal" ? renderBuildTrackerPage() : renderOverview(); navRoute = "build";
  } else if(hash === "#/purchases"){
    body = MODE==="internal" ? renderPurchaseTrackerPage() : renderOverview(); navRoute = "purchases";
  } else if(hash === "#/publish"){
    body = MODE==="internal" ? renderPublishSettings() : renderOverview(); navRoute = "publish";
  } else if(hash === "#/library"){
    body = MODE==="internal" ? renderLibraryPage() : renderOverview(); navRoute = "library";
  } else if(hash === "#/projects"){
    body = MODE==="internal" ? renderProjectsPage() : renderOverview(); navRoute = "projects";
  } else {
    body = renderOverview(); navRoute = "overview";
  }

  app.innerHTML = `<div class="layout">${sidebarHTML(navRoute)}<div class="main">${body}</div></div>`;
}
function onHashChange(){ renderApp(); window.scrollTo(0,0); }
window.addEventListener("hashchange", onHashChange);
renderApp();
</script>
</body>
</html>
