# ==============================================================================
# FALCON PLAYER (FPP) - start a playlist when the target is hit
# ==============================================================================
# Enable by un-commenting `fpp_file: !include integrations/target_fpp.yaml` in
# the main. That is the only step: this package hooks into every hit itself
# (`!extend hit_hooks`, base.yaml).
#
# Everything is set in the web UI (FPP card) and kept across reboots/updates:
#   FPP Enabled          off = hits do not start the playlist (card collapses)
#   FPP Server IP Address
#   FPP Playlist         the playlist name exactly as it appears in FPP
#   Start FPP Playlist   manual test button
#   FPP Server Status    result of the last request
#
# NETWORK: FPP needs the target and the FPP server on the same router network
# (configs/home_assistant.yaml or configs/networked.yaml). A standalone build
# (the target's own hotspot, no router) can never reach it, so the combination
# fails to compile — see the static_assert in fpp_start_playlist — and
# tools/lint_repo.py flags it before you get that far.
# ==============================================================================

substitutions:
  fpp_ip_default: "192.168.8.150"   # first-boot "FPP Server IP Address"
  fpp_playlist_default: "test"      # first-boot "FPP Playlist"

# HTTP client for the FPP API (merges with any http_request block elsewhere).
http_request:
  useragent: esphome/device
  verify_ssl: false
  timeout: 3s  # short, so an unreachable server cannot stall the main loop long

switch:
  - platform: template
    name: "FPP Enabled"
    id: fpp_enabled
    icon: "mdi:play-network"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON   # including the package means you want it

text:
  - platform: template
    name: "FPP Server IP Address"
    id: fpp_ip_input
    optimistic: true
    min_length: 7
    max_length: 15
    initial_value: ${fpp_ip_default}
    restore_value: true
    mode: text

  - platform: template
    name: "FPP Playlist"
    id: fpp_playlist_input
    optimistic: true
    min_length: 1
    max_length: 64
    initial_value: ${fpp_playlist_default}
    restore_value: true
    mode: text

button:
  - platform: template
    name: "Start FPP Playlist"
    id: fpp_start_button
    icon: "mdi:play"
    on_press:
      - script.execute: fpp_start_playlist

text_sensor:
  # Result of the last playlist request. Published by fpp_start_playlist only —
  # no lambda/polling, which used to overwrite it with "Unknown" every minute.
  - platform: template
    name: "FPP Server Status"
    id: fpp_status
    icon: "mdi:server-network"
    update_interval: never

script:
  # Every accepted hit (base.yaml run_hit_script) — start the playlist when FPP
  # is enabled. Appended to the empty hit_hooks script.
  - id: !extend hit_hooks
    then:
      - if:
          condition:
            switch.is_on: fpp_enabled
          then:
            - script.execute: fpp_start_playlist

  - id: fpp_start_playlist
    mode: single  # a hit landing mid-request is dropped, not queued
    then:
      - lambda: |-
          // Build-time guard: FPP cannot work on the target's own hotspot.
          static_assert(std::string_view("${network_mode}") != std::string_view("standalone"),
                        "integrations/target_fpp.yaml needs a router network: use "
                        "configs/home_assistant.yaml or configs/networked.yaml, "
                        "not configs/standalone.yaml");
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                # FPP command API: /api/command/Start Playlist/<name>. The
                # playlist name is percent-encoded so spaces etc. survive.
                url: !lambda |-
                  std::string name = id(fpp_playlist_input).state, enc;
                  static const char kHexDigits[] = "0123456789ABCDEF";  // not HEX: an Arduino macro
                  for (unsigned char c : name) {
                    if (isalnum(c) || c == '-' || c == '_' || c == '.' || c == '~') enc += (char) c;
                    else { enc += '%'; enc += kHexDigits[c >> 4]; enc += kHexDigits[c & 15]; }
                  }
                  return "http://" + id(fpp_ip_input).state +
                         "/api/command/Start%20Playlist/" + enc;
                capture_response: false
                on_response:
                  then:
                    - lambda: |-
                        char buf[48];
                        if (response->status_code >= 200 && response->status_code < 300)
                          snprintf(buf, sizeof(buf), "Started: %s", id(fpp_playlist_input).state.c_str());
                        else
                          snprintf(buf, sizeof(buf), "FPP error: HTTP %d", response->status_code);
                        id(fpp_status).publish_state(buf);
                on_error:
                  then:
                    - text_sensor.template.publish:
                        id: fpp_status
                        state: "No response from FPP server"
          else:
            - text_sensor.template.publish:
                id: fpp_status
                state: "WiFi disconnected"
