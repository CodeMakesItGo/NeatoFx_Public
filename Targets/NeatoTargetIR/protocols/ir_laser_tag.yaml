# ==============================================================================
# LASER TAG OPTIONS
# ==============================================================================
# The team_color_enabled / capture_mode_enabled globals these switches drive are
# declared in boards/common/common.yaml, not here, so the shared hit script can
# read them under every protocol. See the notes there.
#
# ==============================================================================
# TEXT SENSORS - Team Detection
# ==============================================================================
text_sensor:
  # Detected laser tag team
  - platform: template
    name: "Detected Team"
    id: detected_team
    icon: "mdi:target"
    update_interval: never  # Only updated when team is detected

# ==============================================================================
# SWITCHES - Laser Tag Options
# ==============================================================================
switch:
  # Flash the hit in the shooting team's color. The hit effect itself is
  # unchanged — this only swaps the color used by the "Solid Color" and
  # "Strobe Flash" hit effects. Animated hit effects (Rainbow, Scanner, …)
  # generate their own colors and are unaffected. The target's resting color is
  # restored when the hit ends.
  - platform: template
    name: "Team Color On Hit"
    id: team_color_on_hit_switch
    icon: "mdi:palette"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - globals.set:
          id: team_color_enabled
          value: 'true'
      - logger.log: "Team color flash on hit enabled"
    turn_off_action:
      - globals.set:
          id: team_color_enabled
          value: 'false'
      - logger.log: "Team color flash on hit disabled"

  # CAPTURE MODE — the target keeps the color of the last team to hit it.
  # On a team hit the "Target LEDs Solid Color" preset is set to that team's
  # color, so the target rests in it until another team takes it. At the end of a
  # capture-the-flag round, whoever holds the most targets wins.
  #
  # Set "Target LEDs Idle Effect" to "Solid Color" for this to be visible at a
  # glance — animated idle effects paint their own colors over the resting color.
  - platform: template
    name: "Team Color Capture"
    id: team_color_capture_switch
    icon: "mdi:flag-checkered"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - globals.set:
          id: capture_mode_enabled
          value: 'true'
      - logger.log: "Capture mode enabled - target will keep the last team's color"
    turn_off_action:
      - globals.set:
          id: capture_mode_enabled
          value: 'false'
      - logger.log: "Capture mode disabled"

# ==============================================================================
# INFRARED RECEIVER - LASER TAG TEAM DETECTION
# ==============================================================================
remote_receiver:
  pin:
    number: ${ir_gpio}
    inverted: true      # Keep this for most IR receiver modules (TSOP, etc.)
    mode:
      input: true
      pullup: ${ir_pullup}
  tolerance: 25%
  filter: 50us          # Filter noise
  idle: 10ms             # Signal end detection
  buffer_size: 10kB     # Large buffer for complex signals
  
  # Dump raw timing for analysis (comment out in production)
  # dump: raw
  
  # RAW IR timing automation - Pulse-based laser tag team detection
  on_raw:
    then:
      - if:
          condition:
            - lambda: 'return id(ir_enabled);'
          then:
            - lambda: |-
                id(ir_command) = 0;
                std::vector<long int> raw_data = x;
                ESP_LOGI("IR", "RAW signal received, length: %zu", raw_data.size());
                
                // Skip if signal too short
                if (raw_data.size() < 20) {
                  ESP_LOGD("IR", "Signal too short, ignoring");
                  return;
                }

                // --- Adaptive per-frame thresholds (robust to close-range AGC) ---
                // Laser-tag encodes bits as SHORT vs LONG. Absolute widths drift with
                // signal strength: a very close/strong emitter stretches ON pulses and
                // shrinks spaces. Fixed windows with a dead-zone silently DROPPED any
                // symbol that drifted between the 0/1 windows, and a dropped symbol
                // shifts every following bit — breaking the fixed-position team match.
                // That is why point-blank shots intermittently failed to register.
                // Instead, classify each symbol against the midpoint between this
                // frame's own short and long clusters, so the threshold tracks the
                // drift and NO symbol is ever dropped. Header (>1500us) is excluded
                // from both the stats and the decode, same as before.
                int p_min = 100000, p_max = 0, s_min = 100000, s_max = 0;
                for (int i = 0; i < raw_data.size() - 1; i += 2) {
                  int p = abs(raw_data[i]);
                  int s = abs(raw_data[i + 1]);
                  if (p <= 1500) { if (p < p_min) p_min = p; if (p > p_max) p_max = p; }
                  if (s <= 1500) { if (s < s_min) s_min = s; if (s > s_max) s_max = s; }
                }
                // Two clusters present (spread >= 200us): use their midpoint, which
                // moves with the drift. Otherwise (rare single-symbol frame) fall back
                // to the nominal boundary.
                int thr_pulse = (p_max - p_min >= 200) ? (p_min + p_max) / 2 : 627;
                int thr_space = (s_max - s_min >= 200) ? (s_min + s_max) / 2 : 550;
                ESP_LOGD("IR", "Adaptive thr: pulse=%d (%d..%d) space=%d (%d..%d)",
                         thr_pulse, p_min, p_max, thr_space, s_min, s_max);

                // Decode IR timing to binary using BOTH pulse and space patterns
                std::string pulse_bits = "";
                std::string space_bits = "";
                std::string debug_pulses = "PULSES: ";
                std::string debug_spaces = "SPACES: ";
                
                for (int i = 0; i < raw_data.size() - 1; i += 2) {
                  int pulse = abs(raw_data[i]);     // IR ON duration (microseconds)
                  int space = abs(raw_data[i + 1]); // IR OFF duration (microseconds)
                  
                  // Log both pulse and space timing for analysis
                  debug_pulses += str_sprintf("%d,", pulse);
                  debug_spaces += str_sprintf("%d,", space);
                  
                  // Process PULSES: skip >1500μs header, classify the rest against the
                  // adaptive threshold. Single midpoint (no dead-zone) => every data
                  // symbol yields a bit, so alignment can never shift from a dropped bit.
                  if (pulse <= 1500) {
                    pulse_bits += (pulse < thr_pulse) ? "0" : "1";
                  }

                  // Process SPACES: skip >1500μs header, classify the rest against the
                  // adaptive threshold. Same no-dead-zone rule as pulses above.
                  if (space <= 1500) {
                    space_bits += (space < thr_space) ? "0" : "1";
                  }
                }
                
                ESP_LOGI("IR", "%s", debug_pulses.c_str());
                ESP_LOGI("IR", "%s", debug_spaces.c_str());
                        
                // Reverse bit strings if data is LSB-first
                std::reverse(pulse_bits.begin(), pulse_bits.end());
                std::reverse(space_bits.begin(), space_bits.end());
                
                ESP_LOGI("IR", "PULSE bits (reversed): %s", pulse_bits.c_str());
                ESP_LOGI("IR", "SPACE bits (reversed): %s", space_bits.c_str());
                
                // Convert both pulse and space bits to hex for team identification
                std::string pulse_hex = "";
                std::string space_hex = "";
                
                // Convert PULSE bits to hex
                if (pulse_bits.length() >= 4) {
                  // Pad the binary string to a multiple of 4 bits from the left
                  std::string padded_pulse = pulse_bits;
                  while (padded_pulse.length() % 4 != 0) {
                  padded_pulse = "0" + padded_pulse;
                  }
                  
                  for (int i = 0; i < padded_pulse.length(); i += 4) {
                  std::string nibble = padded_pulse.substr(i, 4);
                  
                  int val = 0;
                  for (int j = 0; j < 4; j++) {
                    val = val * 2 + (nibble[j] == '1' ? 1 : 0);
                  }
                  char hex_char = (val < 10) ? ('0' + val) : ('A' + val - 10);
                  pulse_hex += hex_char;
                  }
                }
                
                // Convert SPACE bits to hex
                if (space_bits.length() >= 4) {
                  // Pad the binary string to a multiple of 4 bits from the left
                  std::string padded_space = space_bits;
                  while (padded_space.length() % 4 != 0) {
                  padded_space = "0" + padded_space;
                  }
                  
                  for (int i = 0; i < padded_space.length(); i += 4) {
                  std::string nibble = padded_space.substr(i, 4);
                  
                  int val = 0;
                  for (int j = 0; j < 4; j++) {
                    val = val * 2 + (nibble[j] == '1' ? 1 : 0);
                  }
                  char hex_char = (val < 10) ? ('0' + val) : ('A' + val - 10);
                  space_hex += hex_char;
                  }
                }
                
                ESP_LOGI("IR", "PULSE HEX: 0x%s", pulse_hex.c_str());
                ESP_LOGI("IR", "SPACE HEX: 0x%s", space_hex.c_str());
                
                
                // Team identification using ultra-clean pattern matching
                std::string team = "Unknown";
                
                if (pulse_hex.length() >= 3 && space_hex.length() >= 3) {
                  // Convert hex strings to integers for bit manipulation
                  uint32_t pulse_val = 0;
                  uint32_t space_val = 0;
                  
                  // Parse pulse hex string
                  for (char c : pulse_hex) {
                  pulse_val = pulse_val * 16 + (c <= '9' ? c - '0' : c - 'A' + 10);
                  }
                  
                  // Parse space hex string  
                  for (char c : space_hex) {
                  space_val = space_val * 16 + (c <= '9' ? c - '0' : c - 'A' + 10);
                  }
                  
                  // Extract clean patterns: drop MSB nibble and LSB byte
                  uint8_t pulse_pattern = (pulse_val & 0x00F00) >> 8;  // Middle nibble only
                  uint8_t space_pattern = (space_val & 0x00F00) >> 8;  // Middle byte only
                  
                  //ESP_LOGI("IR", "CLEAN PATTERNS: PULSE=0x%02X, SPACE=0x%02X", pulse_pattern, space_pattern);
                  
                  // Ultra-clean team detection matrix (state-independent)
                  if (pulse_pattern == 0x4 && space_pattern == 0x0) {
                  team = "White";
                  } else if (pulse_pattern == 0x8 && space_pattern == 0x0) {
                  team = "Blue";
                  } else if (pulse_pattern == 0x0 && space_pattern == 0x8) {
                  team = "Red";
                  } else if (pulse_pattern == 0x8 && space_pattern == 0x8) {
                  team = "Green";
                  } else {
                  // Log unrecognized patterns for future analysis
                  ESP_LOGI("IR", "UNRECOGNIZED CLEAN PATTERN: PULSE=0x%02X, SPACE=0x%02X", pulse_pattern, space_pattern);
                  team = "Unknown";
                  }
                } else {
                  ESP_LOGI("IR", "HEX CONVERSION ERROR: pulse_len=%zu, space_len=%zu", pulse_hex.length(), space_hex.length());
                }
                
                ESP_LOGI("IR", "ANALYSIS RESULT: Team=%s", team.c_str());
                
                // Display results
                id(detected_team).publish_state(team);
                
                // Set team ID based on detection.
                //
                // Hand the team color to target_hit_script via globals instead of
                // writing it to the strip here. A direct set_rgb() never showed:
                // the running idle effect (Scanner by default) rewrites every
                // pixel each frame, so the base color is ignored — while the
                // strip's on_state auto-save still wrote that unseen color to
                // flash, which is why the team color only ever appeared after a
                // reboot. The hit script now paints it during the hit flash and
                // restores the user's preset afterward.
                int team_id = 0;  // Default unknown
                if (team == "Red") {
                  team_id = 3;
                  id(team_r) = 1.0f; id(team_g) = 0.0f; id(team_b) = 0.0f;
                }
                else if (team == "Green") {
                  team_id = 2;
                  id(team_r) = 0.0f; id(team_g) = 1.0f; id(team_b) = 0.0f;
                }
                else if (team == "Blue") {
                  team_id = 1;
                  id(team_r) = 0.0f; id(team_g) = 0.0f; id(team_b) = 1.0f;
                }
                else if (team == "White") {
                  team_id = 4;
                  id(team_r) = 1.0f; id(team_g) = 1.0f; id(team_b) = 1.0f;
                }
                // Recognised team only. team_name matches an option of the
                // "Target LEDs Solid Color" select, which Capture Mode adopts.
                id(team_detected) = (team_id != 0);
                if (id(team_detected)) id(team_name) = team;

                id(ir_command) = team_id;
            - if:
                condition:
                  lambda: 'return id(ir_command) != 0;'
                then:
                  - script.execute: run_hit_script 
                 
          else:
            - lambda: 'ESP_LOGI("IR", "IR_DISABLED");'
            
