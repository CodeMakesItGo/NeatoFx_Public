# ==============================================================================
# NEATO TARGET IR - COMMON COMPONENTS
# ==============================================================================
# This file contains shared components used by all target hardware revisions.
# It includes common substitutions, networking, sensors, controls, and globals
# that are consistent across different hardware versions.
#
# Included by: target_rev1_x.yaml, target_rev3_x.yaml
# ==============================================================================

# Shared base packages — common to all NEATO-FX devices
packages:
  esphome_base: !include ../../../../_shared/esphome_base.yaml
  color_controls: !include color_controls.yaml

# ==============================================================================
# COMMON SUBSTITUTIONS - Shared Configuration Variables
# ==============================================================================
substitutions:
  # Hardware Configuration (common across all revisions)
  hit_display_time: "3000"       # Time to display hit effect
  default_relay_time: "3000"     # Relay activation time after hit in milliseconds
  default_cooldown_time: "1000"  # Time target is inactive after hit in milliseconds
  default_points: "10"           # Points awarded for hitting this target

  # Common GPIO Pins (consistent across revisions)
  led_gpio: GPIO5        # Main target LED strip
  led_ignore_strapping: "true"  # GPIO5 is a strapping pin; variants override
  ir_gpio: GPIO19        # IR receiver
  relay_gpio: GPIO23     # Relay output
  tx_gpio: GPIO01        # UART TX
  rx_gpio: GPIO03        # UART RX

  # Project Information
  project_name: "CodeMakesItGo.Target"
  project_version: "1.0.0"
  hw_version: "Rev 1"          # Hardware revision label (boards/rev3.yaml overrides)

# ==============================================================================
# ESP32 FRAMEWORK - Common Settings
# ==============================================================================
esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino
    version: recommended
  flash_size: 4MB

# ==============================================================================
# COMMON SENSORS - System Monitoring
# ==============================================================================
sensor:
  # System uptime monitoring
  - platform: uptime
    id: uptime_sensor
    name: "Uptime Sensor"
    update_interval: 60s

  # Hit counter — exposed to web UI and Home Assistant
  - platform: template
    name: "Hit Count"
    id: hit_count_sensor
    lambda: 'return (float)id(hit_count);'
    update_interval: 1s
    accuracy_decimals: 0
    icon: "mdi:target"

# ==============================================================================
# COMMON SWITCHES - System Controls
# ==============================================================================
switch:
  # Main relay output control
  - platform: gpio
    pin: ${relay_gpio}
    name: "Relay 1"
    id: relay_1
    restore_mode: ALWAYS_OFF
    icon: "mdi:electric-switch"
    on_turn_on:
      - logger.log: "Relay 1 activated"
    on_turn_off:
      - logger.log: "Relay 1 deactivated"

  # GND switch ramp enable — when on, the GND switch ramps 0→100% over the
  # relay window on hit (soft start); when off it snaps on instantly (legacy).
  # Ramp logic lives in scripts/hit_script.yaml; the pin is PWM-backed on Rev 3.x.
  - platform: template
    name: "GND Ramp"
    id: gnd_ramp_switch
    icon: "mdi:transfer-up"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - globals.set:
          id: gnd_ramp_enabled
          value: 'true'
      - logger.log: "GND switch ramp enabled"
    turn_off_action:
      - globals.set:
          id: gnd_ramp_enabled
          value: 'false'
      - logger.log: "GND switch ramp disabled"

  # GPIO25 hit trigger enable/disable
  - platform: template
    name: "GPIO25 Hit Trigger"
    id: gpio25_hit_trigger_switch
    icon: "mdi:electric-switch"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - globals.set:
          id: gpio25_hit_enabled
          value: 'true'
      - logger.log: "GPIO25 hit trigger enabled"
    turn_off_action:
      - globals.set:
          id: gpio25_hit_enabled
          value: 'false'
      - logger.log: "GPIO25 hit trigger disabled"

  # Test switch for manual target triggering (momentary)
  - platform: template
    name: "Test Target Hit"
    id: test_button
    icon: "mdi:target"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - logger.log: "Test button pressed!"
      - script.execute: run_hit_script
      - logger.log: "Test complete!"
      - delay: 100ms
      - switch.turn_off: test_button

# ==============================================================================
# LIGHTING - LED Strips
# ==============================================================================
light:
  # Main Target LED Strip (6 LEDs) - Full power available with 2A regulator
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    rmt_symbols: 64
    rgb_order: GRB
    pin: 
      number: ${led_gpio}
      ignore_strapping_warning: ${led_ignore_strapping}
    num_leds: 6
    name: "Target LEDs"
    id: led_strip
    default_transition_length: 500ms
    color_correct: [100%, 100%, 100%]  # Full brightness restored - 2A is plenty
    restore_mode: RESTORE_AND_OFF  # Allow proper restoration of saved state

    # Auto-save LED settings when they change
    on_state:
      - lambda: |-
          // Only auto-save after startup is complete and not during hit processing
          if (!id(startup_complete)) {
            ESP_LOGI("LED", "⏳ Skipping auto-save during startup initialization");
            return;
          }
          if (id(hit_processing)) {
            ESP_LOGI("LED", "🎯 Skipping auto-save during hit effect processing");
            return;
          }
          
          ESP_LOGI("LED", "💾 Auto-saving LED settings...");
          
          // Save current brightness (direct assignment)
          id(saved_brightness) = id(led_strip).remote_values.get_brightness();
          
          // Save current RGB values
          id(saved_red) = id(led_strip).remote_values.get_red();
          id(saved_green) = id(led_strip).remote_values.get_green();
          id(saved_blue) = id(led_strip).remote_values.get_blue();
          
          // Save current effect (get current effect name and map to index)
          std::string current_effect = id(led_strip).get_effect_name();
          int effect_index = 0;  // Default to solid color
          if (current_effect == "Rainbow Effect") effect_index = 1;
          else if (current_effect == "Color Wipe Effect") effect_index = 2;
          else if (current_effect == "Scanner Effect") effect_index = 3;
          else if (current_effect == "Twinkle Effect") effect_index = 4;
          else if (current_effect == "Heartbeat Effect") effect_index = 5;
          
          id(saved_effect_index) = effect_index;
          
          ESP_LOGI("LED", "💾 Saved: B=%.2f, RGB=(%.2f,%.2f,%.2f), Effect='%s' (index=%d)", 
                   (float)id(saved_brightness), (float)id(saved_red), 
                   (float)id(saved_green), (float)id(saved_blue),
                   current_effect.c_str(), effect_index);
    
    effects:
      - addressable_rainbow:
          name: Rainbow Effect
          speed: 10
          width: 50
      - addressable_color_wipe:
          name: Color Wipe Effect
          colors:
            - red: 100%
              green: 0%
              blue: 0%
              num_leds: 1
            - red: 0%
              green: 100%
              blue: 0%
              num_leds: 1
            - red: 0%
              green: 0%
              blue: 100%
              num_leds: 1
      - addressable_scan:
          name: Scanner Effect
      - addressable_twinkle:
          name: Twinkle Effect
      # Realistic "lub-dub" cardiac heartbeat in red
      - addressable_lambda:
          name: "Heartbeat Effect"
          update_interval: 16ms
          lambda: |-
            // Persistent state across updates
            static uint32_t cycle_start = 0;
            static uint32_t cycle_len   = 1100;   // full cardiac cycle (ms)
            static float    beat1_peak  = 1.00f;  // "lub" (systole) strength
            static float    beat2_peak  = 0.55f;  // "dub" (diastole) strength

            uint32_t now = millis();
            if (initial_run || cycle_start == 0) cycle_start = now;
            uint32_t t = now - cycle_start;

            // At the end of each cycle, roll new values so no two beats look
            // identical (heart-rate variability + beat-to-beat amplitude drift).
            if (t >= cycle_len) {
              cycle_start = now;
              t = 0;
              uint32_t s = now;
              float r1 = ((s >> 4) & 0xFF) / 255.0f;
              float r2 = ((s >> 9) & 0xFF) / 255.0f;
              cycle_len  = 950 + (uint32_t)(r1 * 400.0f);  // ~44-63 bpm
              beat1_peak = 0.85f + r2 * 0.15f;             // strong first bump
              beat2_peak = 0.45f + r1 * 0.18f;             // softer second bump
            }

            float tf = (float)t;
            // Two Gaussian pulses: the "lub" then a softer, slightly wider "dub".
            float d1  = (tf -  90.0f) / 45.0f;
            float d2  = (tf - 320.0f) / 55.0f;
            float lub = beat1_peak * expf(-0.5f * d1 * d1);
            float dub = beat2_peak * expf(-0.5f * d2 * d2);

            float level = 0.04f + lub + dub;   // 0.04 = faint resting glow
            if (level > 1.0f) level = 1.0f;

            uint8_t r = (uint8_t)(level * 255.0f);
            uint8_t g = (uint8_t)(level * level * level * 30.0f); // faint warm flash on peaks
            it.all() = Color(r, g, 0);

  # Secondary LED Strip (Configurable count) - Full power available
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    rmt_symbols: 128 
    rgb_order: RGB
    pin: ${led2_gpio}
    num_leds: ${strip_2_led_count}
    name: "LED Strip 2"
    id: led_strip2
    default_transition_length: 500ms
    color_correct: [100%, 100%, 100%]  # Full brightness restored
    restore_mode: RESTORE_DEFAULT_OFF  # Keep conservative startup
    internal: ${strip_2_internal}  # Hidden for Rev1, visible for Rev3
    effects:
      - addressable_rainbow:
          name: Rainbow Effect
          speed: 10
          width: 50
      - addressable_color_wipe:
          name: Color Wipe Effect
          colors:
            - red: 100%
              green: 0%
              blue: 0%
              num_leds: 1
            - red: 0%
              green: 100%
              blue: 0%
              num_leds: 1
            - red: 0%
              green: 0%
              blue: 100%
              num_leds: 1
      - addressable_scan:
          name: Scanner Effect
      - addressable_twinkle:
          name: Twinkle Effect
      # Realistic "lub-dub" cardiac heartbeat in red
      - addressable_lambda:
          name: "Heartbeat Effect"
          update_interval: 16ms
          lambda: |-
            static uint32_t cycle_start = 0;
            static uint32_t cycle_len   = 1100;
            static float    beat1_peak  = 1.00f;
            static float    beat2_peak  = 0.55f;

            uint32_t now = millis();
            if (initial_run || cycle_start == 0) cycle_start = now;
            uint32_t t = now - cycle_start;

            if (t >= cycle_len) {
              cycle_start = now;
              t = 0;
              uint32_t s = now;
              float r1 = ((s >> 4) & 0xFF) / 255.0f;
              float r2 = ((s >> 9) & 0xFF) / 255.0f;
              cycle_len  = 950 + (uint32_t)(r1 * 400.0f);
              beat1_peak = 0.85f + r2 * 0.15f;
              beat2_peak = 0.45f + r1 * 0.18f;
            }

            float tf = (float)t;
            float d1  = (tf -  90.0f) / 45.0f;
            float d2  = (tf - 320.0f) / 55.0f;
            float lub = beat1_peak * expf(-0.5f * d1 * d1);
            float dub = beat2_peak * expf(-0.5f * d2 * d2);

            float level = 0.04f + lub + dub;
            if (level > 1.0f) level = 1.0f;

            uint8_t r = (uint8_t)(level * 255.0f);
            uint8_t g = (uint8_t)(level * level * level * 30.0f);
            it.all() = Color(r, g, 0);


# ==============================================================================
# USER CONTROLS - Numbers and Selects
# ==============================================================================
number:
  # Relay activation duration control
  - platform: template
    name: "Relay Timer"
    id: relay_timer_control
    min_value: 100
    max_value: 60000
    step: 100
    restore_value: true
    optimistic: true
    initial_value: ${default_relay_time}
    icon: "mdi:timer-outline"
    unit_of_measurement: "ms"
    set_action:
      - lambda: |-
          int value = static_cast<int>(x); 
          id(relay_timer) = value;
          ESP_LOGI("config", "Relay timer set to: %d ms", value);
          
  # Points awarded per hit
  - platform: template
    name: "Hit Points"
    id: hit_points_control
    min_value: 10
    max_value: 100
    step: 10
    restore_value: true
    optimistic: true
    initial_value: ${default_points}
    icon: "mdi:star"
    unit_of_measurement: "pts"
    set_action:
      - lambda: |-
          id(target_points) = static_cast<int>(x);
          ESP_LOGI("config", "Hit points set to: %d", id(target_points));

  # Target cooldown period control
  - platform: template
    name: "Cooldown Timer"
    id: target_cooldown_control
    min_value: 0
    max_value: 60000
    step: 100
    restore_value: true
    optimistic: true
    initial_value: ${default_cooldown_time}
    icon: "mdi:timer-sand"
    unit_of_measurement: "ms"
    set_action:
      - lambda: |-
          int value = static_cast<int>(x); 
          id(cooldown_timer) = value;
          ESP_LOGI("config", "Cooldown timer set to: %d ms", value);

# ==============================================================================
# HIT EFFECT OPTIONS
# ==============================================================================
select:
  # Hit effect selection
  - platform: template
    name: "Target LEDs Hit Effect"
    id: hit_effect_select
    options:
      - "Rainbow Effect"
      - "Color Wipe Effect"
      - "Scanner Effect"
      - "Twinkle Effect"
      - "Heartbeat Effect"
      - "Strobe Flash"
      - "Solid Color"
    initial_option: "Color Wipe Effect"
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          // Save effect index when selection changes
          int effect_index = 2; // Default to Color Wipe
          if (x == "Rainbow Effect") effect_index = 1;
          else if (x == "Color Wipe Effect") effect_index = 2;
          else if (x == "Scanner Effect") effect_index = 3;
          else if (x == "Twinkle Effect") effect_index = 4;
          else if (x == "Heartbeat Effect") effect_index = 5;
          else if (x == "Strobe Flash") effect_index = 0;  // transient — no persistent effect
          else if (x == "Solid Color") effect_index = 0;
          
          ESP_LOGI("LED", "💾 Saved hit effect: %s (index=%d)", x.c_str(), effect_index);

  # Secondary strip (LED Strip 2) hit effect — applied to led_strip2 on hit.
  # "Solid Color"/"Strobe Flash" fall back to the LED Strip 2 Solid Color preset;
  # every other option is a native effect name on led_strip2. See hit_script.yaml.
  - platform: template
    name: "LED Strip 2 Hit Effect"
    id: led_strip2_hit_effect
    options:
      - "Rainbow Effect"
      - "Color Wipe Effect"
      - "Scanner Effect"
      - "Twinkle Effect"
      - "Heartbeat Effect"
      - "Strobe Flash"
      - "Solid Color"
    initial_option: "Color Wipe Effect"
    restore_value: true
    optimistic: true


# ==============================================================================
# TEXT SENSORS - Device Information
# ==============================================================================
text_sensor:
  # Firmware / hardware version shown in the custom web UI header. Published once
  # at boot from the compile-time project_version + hw_version substitutions.
  - platform: template
    name: "Firmware Version"
    id: firmware_version_sensor
    icon: "mdi:chip"
    update_interval: never

esphome:
  on_boot:
    - priority: -100   # after all components are set up
      then:
        - text_sensor.template.publish:
            id: firmware_version_sensor
            state: "${project_version} · ${hw_version}"


# ==============================================================================
# GLOBAL VARIABLES - Common State Management
# ==============================================================================
globals:
  # Total hits received this session (used by LCD face display)
  - id: hit_count
    type: int
    restore_value: no
    initial_value: '0'

  # GPIO25 hit trigger enable/disable (persisted across reboots)
  - id: gpio25_hit_enabled
    type: bool
    restore_value: yes
    initial_value: 'false'

  # GND switch ramp enable — soft-start the GND switch 0→100% on hit (persisted)
  - id: gnd_ramp_enabled
    type: bool
    restore_value: yes
    initial_value: 'false'

  # IR receiver enable/disable state
  - id: ir_enabled
    type: bool
    restore_value: no
    initial_value: 'true'
    
  # Last received IR command
  - id: ir_command
    type: int
    restore_value: no
    initial_value: '0'

  # Saved LED effect as index (more reliable than string)
  - id: saved_effect_index
    type: int
    restore_value: yes
    initial_value: '3'  # Scanner Effect = 3
    
  # Relay activation duration (milliseconds)
  - id: relay_timer
    type: int
    restore_value: true
    initial_value: ${default_relay_time}
    
  # Points awarded per hit
  - id: target_points
    type: int
    restore_value: true
    initial_value: ${default_points}

  # Target cooldown period (milliseconds)
  - id: cooldown_timer
    type: int
    restore_value: true
    initial_value: ${default_cooldown_time}

  # Prevent auto-save during hit effect processing
  - id: hit_processing
    type: bool
    restore_value: no
    initial_value: 'false'

# Saved LED brightness (0.0 to 1.0)
  - id: saved_brightness
    type: float
    restore_value: yes
    initial_value: '1.0'  # 100% default brightness
    
  # Saved LED colors (0.0 to 1.0)
  - id: saved_red
    type: float
    restore_value: yes
    initial_value: '1.0'  # Default white
  
  - id: saved_green  
    type: float
    restore_value: yes
    initial_value: '1.0'
    
  - id: saved_blue
    type: float
    restore_value: yes
    initial_value: '1.0'
    
  # Auto-save LED settings when they change (but not during startup)
  - id: startup_complete
    type: bool
    restore_value: no
    initial_value: 'false'
