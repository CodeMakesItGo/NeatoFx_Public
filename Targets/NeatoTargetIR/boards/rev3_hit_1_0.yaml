# ==============================================================================
# NEATO TARGET IR - HARDWARE DEFINITION (REV 3.X)
# ==============================================================================
# Hardware: ESP32 Mini D1 + dual WS2812 strips, servo, aux power, relay,
#           GND switch, HIT PUSH BUTTON, external trigger, GPIO expansion.
#
# HIT FACE 1.0 — the face is a mechanical push button, not an IR receiver.
# The button sits on GPIO19 (the pin the IR receiver used on rev3). Idle the
# line is pulled HIGH; a hit shorts it to GND. See the binary_sensor below.
#
# Included by: main.yaml
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS - Rev 3.x Hardware Pin Assignments
# ==============================================================================
substitutions:
  # Rev 3.x specific hardware
  aux_pwr_gpio: GPIO26           # Auxiliary power control

  # --- HIT FACE: push button replaces the IR receiver ------------------------
  # The button lands on GPIO19 — the same face-connector pin the rev3 IR
  # receiver used, so the existing harness is reused unchanged.
  hit_button_gpio: GPIO19        # Hit push button (idle HIGH, hit = short to GND)

  # GPIO19 now belongs to the button, so the IR receiver cannot stay there.
  # Preferred: comment out the `ir_receiver:` package in main.yaml for this
  # board — this face has no IR receiver at all. These two lines are the safety
  # net for when it is left enabled: they park remote_receiver on GPIO35, an
  # unused input-only pin, so the build does not fail with a GPIO19 conflict.
  # GPIO34-39 have no internal pull resistors, hence ir_pullup false.
  ir_gpio: GPIO35
  ir_pullup: "false"

  # Right Side Connector Pins (Rev 3.x specific)
  io16_gpio: GPIO16      # General I/O
  io17_gpio: GPIO17      # General I/O
  io25_gpio: GPIO25      # General I/O
  io34_gpio: GPIO34      # ADC input (input only)

  # Left Side Connector Pins (Rev 3.x specific)
  switch_12v: GPIO33     # 12V switch control
  led2_gpio: GPIO22      # Secondary LED strip
  servo_gpio: GPIO04     # Servo control
  strip_2_led_count: "100" # Configurable LED count
  strip_2_internal: "false" # Visible in UI for Rev3

  # Project Information (Rev 3.x specific)
  project_version: "3.2.0"
  hw_version: "Rev 3"            # Overrides common.yaml default for the version readout

# ==============================================================================
# PACKAGES
# ==============================================================================
packages:
  common_components: !include common/common.yaml

# ==============================================================================
# CORE CONFIGURATION - Rev 3.x Boot Sequence
# ==============================================================================
esphome:
  min_version: 2025.8.2
  on_boot:
    # Stage 1: Early startup - read settings and turn OFF LEDs (prevent power surge)
    - priority: 600  # Later priority - after GPIO initialization
      then:
        - logger.log: "=== POWER-CONSCIOUS STARTUP (PCB Safe) ==="
        - delay: 100ms  # Brief delay to let components initialize

        # Read saved settings first (but don't apply them yet)
        - lambda: |-
            ESP_LOGI("LED", "📖 Reading saved LED settings for later restoration...");
            float brightness = id(saved_brightness);
            float red = id(saved_red);
            float green = id(saved_green);
            float blue = id(saved_blue);
            int effect_index = id(saved_effect_index);
            ESP_LOGI("LED", "Saved: B=%.2f, RGB=(%.2f,%.2f,%.2f), Effect=%d",
                     brightness, red, green, blue, effect_index);

        # TURN OFF LEDs completely to prevent startup surge
        - logger.log: "=== EARLY BOOT: Turning LEDs OFF for safe startup ==="
        - light.turn_off: led_strip   # Completely OFF (not just 0% brightness)
        - light.turn_off: led_strip2  # Secondary strip also OFF
        - delay: 100ms
        - logger.log: "✅ Both LED strips OFF - startup surge prevented"

        # Visual startup indicator - Stage 1/6 (Basic Initialization)
        - light.turn_on:
            id: led_strip
            brightness: 50%
            red: 100%
            green: 0%
            blue: 0%
            effect: "None"
        - logger.log: "🔴 STARTUP STAGE 1/6 - Basic Initialization (LED 1 RED)"

        # Extended delay for power supply stabilization
        - delay: 2s

        # Initialize timer controls first (very low power)
        - number.set:
            id: relay_timer_control
            value: !lambda 'return id(relay_timer);'
        - number.set:
            id: target_cooldown_control
            value: !lambda 'return id(cooldown_timer);'

        - logger.log: "Basic systems initialized - power consumption minimal"

        # === STAGE 2/6: Power Preparation ===
        - light.turn_on:
            id: led_strip
            brightness: 50%
            red: 100%
            green: 50%
            blue: 0%
            effect: "None"
        - logger.log: "🟠 STARTUP STAGE 2/6 - Power Preparation"
        - delay: 2s
        - logger.log: "Power supply conditioning complete"

        # === STAGE 3/6: Auxiliary Power Enable ===
        - light.turn_on:
            id: led_strip
            brightness: 50%
            red: 100%
            green: 100%
            blue: 0%
            effect: "None"
        - logger.log: "🟡 STARTUP STAGE 3/6 - Auxiliary Power Enable"
        - delay: 1s

        # First attempt with extended timing
        - switch.turn_on: aux_pwr
        - delay: 1s  # Wait for stabilization

        # Verify with multiple retries
        - if:
            condition:
              switch.is_on: aux_pwr
            then:
              - logger.log: "✓ Auxiliary power stable on first attempt"
            else:
              - logger.log: "⚠ Power supply struggling - implementing extended recovery..."
              - delay: 2s
              - switch.turn_on: aux_pwr
              - delay: 1s
              - if:
                  condition:
                    switch.is_on: aux_pwr
                  then:
                    - logger.log: "✓ Auxiliary power stable after retry"
                  else:
                    - logger.log: "❌ CRITICAL: Power supply insufficient!"

        # === STAGE 4/6: Power Verification ===
        - light.turn_on:
            id: led_strip
            brightness: 50%
            red: 0%
            green: 100%
            blue: 0%
            effect: "None"
        - logger.log: "🟢 STARTUP STAGE 4/6 - Power Verification"
        - delay: 2s

        # Only restore LEDs if power is confirmed stable
        - if:
            condition:
              switch.is_on: aux_pwr
            then:
              - logger.log: "✓ Power verified stable - proceeding with component initialization"

              # Now restore LED with all saved settings
              - lambda: |-
                  ESP_LOGI("LED", "🔆 Restoring LED with saved settings...");

                  float brightness = id(saved_brightness);
                  if (brightness <= 0.0) brightness = 0.5;  // Default 50%

                  float red = id(saved_red);
                  float green = id(saved_green);
                  float blue = id(saved_blue);
                  int effect_index = id(saved_effect_index);

                  ESP_LOGI("LED", "Restoring: B=%.2f, RGB=(%.2f,%.2f,%.2f), Effect=%d",
                           brightness, red, green, blue, effect_index);

                  auto call = id(led_strip).make_call();
                  call.set_state(true);
                  call.set_brightness(brightness);
                  call.set_rgb(red, green, blue);

                  if (effect_index > 0 && effect_index <= 5) {
                    if (effect_index == 1) call.set_effect("Rainbow Effect");
                    else if (effect_index == 2) call.set_effect("Color Wipe Effect");
                    else if (effect_index == 3) call.set_effect("Scanner Effect");
                    else if (effect_index == 4) call.set_effect("Twinkle Effect");
                    else if (effect_index == 5) call.set_effect("Heartbeat Effect");
                    ESP_LOGI("LED", "Setting effect index %d", effect_index);
                  } else {
                    call.set_effect("None");
                    ESP_LOGI("LED", "Setting solid color mode");
                  }
                  call.perform();
                  ESP_LOGI("LED", "✅ LED restoration call completed");

              - delay: 1s
              - logger.log: "✅ LED TURNED ON with saved settings - startup complete!"
              - lambda: 'id(startup_complete) = true;'
              - logger.log: "⚪ STARTUP SUCCESS - All LEDs bright white confirmation"

              # Home the servo to its saved idle position now that aux power is up.
              # Doubles as a hardware self-test: if the servo does NOT twitch/move
              # here, the problem is servo power or the GPIO4 signal wire — not the
              # web UI or firmware (servo.write is proven to run at this point).
              - script.execute: servo_go_idle

            else:
              - logger.log: "❌ POWER ISSUE: Skipping LED restoration due to auxiliary power failure"
              - delay: 2s
              - logger.log: "=== FINAL STARTUP VERIFICATION ==="
              - light.turn_on:
                  id: led_strip
                  brightness: 100%
                  red: 100%
                  green: 0%
                  blue: 0%
                  effect: "None"
              - logger.log: "🔴 STARTUP FAILURE - All LEDs red warning"
              - delay: 1s

# ==============================================================================
# BINARY SENSORS - Digital Inputs
# ==============================================================================
binary_sensor:
  # ---------------------------------------------------------------------------
  # HIT PUSH BUTTON (GPIO19) — this face's hit detector, in place of the IR
  # receiver that occupied this pin on stock rev3 boards.
  #
  # Wiring: the face pulls GPIO19 up to 5V through a 10k resistor; the button
  # shorts the pin directly to GND. Idle = HIGH, hit = LOW, so the raw level is
  # active-LOW → `inverted: true` makes on_press mean "hit". The internal
  # pull-up is left on so a disconnected or unpopulated face idles HIGH instead
  # of floating and firing phantom hits; it only parallels the external 10k.
  #
  # ON THE 5V PULL-UP: ESP32 GPIOs are NOT 5V tolerant (3.3V nominal), but the
  # 10k makes this safe. The pin's ESD clamp diode holds the node at ~3.6-3.9V
  # and the resistor limits the injected current to (5 - 3.6)/10k ≈ 140uA —
  # well under the ~1mA rule of thumb, and harmless as backfeed into the 3.3V
  # rail when the ESP32 is unpowered. Do NOT shrink this resistor much below
  # ~2.2k, and never tie the line to 5V directly.
  #
  # The 10k must stay on the pull-up side with the button shorting the pin
  # itself. Moving it into the signal path (button on the far side) would put it
  # in a divider against the internal ~45k pull-up, giving only ~0.6V pressed —
  # a valid LOW, but too close to the 0.825V VIL limit to rely on.
  #
  # No enable switch and no ir_enabled check: the button is the target's primary
  # hit input and must always work. Re-trigger protection is already handled by
  # target_hit_script (mode: single), which swallows presses that land during
  # the hit effect and the cooldown window.
  - platform: gpio
    pin:
      number: ${hit_button_gpio}
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Hit Button"
    id: hit_button_input
    device_class: "motion"
    filters:
      - delayed_on: 10ms    # debounce the mechanical contact
      - delayed_off: 50ms
    on_press:
      - logger.log: "Hit button pressed - firing hit script"
      - script.execute: run_hit_script

  # GPIO25 Hit Trigger — enable via "GPIO25 Hit Trigger" switch in the UI
  - platform: gpio
    pin:
      number: ${io25_gpio}
      mode: INPUT_PULLUP
      inverted: true
    name: "GPIO25 Hit Trigger Input"
    id: gpio25_trigger_input
    filters:
      - delayed_on: 5ms
      - delayed_off: 50ms
    on_press:
      - if:
          condition:
            lambda: 'return id(gpio25_hit_enabled);'
          then:
            - logger.log: "GPIO25 hit trigger fired"
            - script.execute: run_hit_script

  # GPIO16 Digital Input
  - platform: gpio
    pin:
      number: ${io16_gpio}
      mode: INPUT_PULLUP
      inverted: true
    id: gpio16_digital
    name: "GPIO16 Digital State"
    device_class: "motion"
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - logger.log: "GPIO16 state is HIGH"
    on_release:
      - logger.log: "GPIO16 state is LOW"

  # GPIO17 Digital Input
  - platform: gpio
    pin:
      number: ${io17_gpio}
      mode: INPUT_PULLUP
      inverted: true
    id: gpio17_digital
    name: "GPIO17 Digital State"
    device_class: "motion"
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - logger.log: "GPIO17 state is HIGH"
    on_release:
      - logger.log: "GPIO17 state is LOW"

  # GPIO18 External Trigger Input (TRIGGER net - H4 connector pin 3)
  - platform: gpio
    pin:
      number: GPIO18
      mode: INPUT_PULLUP
      inverted: true
    name: "Trigger Input"
    id: trigger_input
    device_class: "motion"
    filters:
      - delayed_on: 10ms
      - delayed_off: 50ms
    on_press:
      - logger.log: "External trigger pressed - firing hit script"
      - script.execute: run_hit_script

# ==============================================================================
# SWITCHES - Digital Outputs
# ==============================================================================
switch:
  # Auxiliary power control
  - platform: gpio
    pin:
      number: ${aux_pwr_gpio}
    name: "Aux Pwr"
    id: aux_pwr

# ==============================================================================
# GROUND SWITCH (12V control) — PWM-capable for optional 0→100% ramp on hit
# ==============================================================================
# GPIO33 is driven by LEDC PWM (not a plain GPIO switch) so the GND switch can
# be ramped 0→100% via the light transition engine. See scripts/hit_script.yaml
# (gnd_ramp_enabled) and boards/common/common.yaml (GND Ramp switch).
#   - Ramp OFF (default): light turns on at 100% instantly = legacy hard switch.
#   - Ramp ON: brightness 0→100% over relay_timer (the GND-active window).
# gamma_correct: 0 keeps the sweep LINEAR in PWM duty (0→100%), not perceptual.
# frequency: tune per load (motor soft-start / lamp dimming / solenoid pull-in).
light:
  - platform: monochromatic
    name: "Gnd Switch"
    id: gnd_light
    output: gnd_output
    gamma_correct: 0
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

# ==============================================================================
# SERVO & PWM OUTPUT HARDWARE
# ==============================================================================
servo:
  - id: servo1
    output: pwm_output

output:
  # IMPORTANT: pwm_output (servo, 50 Hz) and gnd_output (GND ramp, 1000 Hz) MUST
  # sit on different LEDC timers. ESP32 pairs channels onto timers as
  # timer = (channel % 8) / 2, and channels on the same timer are forced to share
  # ONE frequency. With auto-assigned channels (0 and 1) both land on timer 0, so
  # the 1000 Hz GND output overrode the servo's 50 Hz and the servo stopped
  # responding entirely. Explicit channels 0 (timer 0) and 2 (timer 1) keep them
  # independent. Do not change these without checking the pairing.
  - platform: ledc
    id: pwm_output
    pin: ${servo_gpio}
    channel: 0            # timer 0 — servo, must stay 50 Hz
    frequency: 50 Hz

  # Ground switch PWM output (drives gnd_light above)
  - platform: ledc
    id: gnd_output
    pin: ${switch_12v}
    channel: 2            # timer 1 — separate from the servo timer
    frequency: 1000 Hz
