# ==============================================================================
# NEATO TARGET IR - LCD FACE BOARD (REV 3.X)
# ==============================================================================
# Hardware: Rev 3.x target board with HiLetgo GC9A01 1.28" 240x240 round TFT
#
# LCD Wiring:
#   GPIO18 - SPI CLK  (VSPI clock  — already on face connector)
#   GPIO19 - SPI MOSI (VSPI data   — already on face connector)
#   GPIO5  - LCD RST  (reset       — already on face connector)
#   GPIO21 - LCD DC   (data/command — route new pin #1 via face connector)
#   GPIO32 - IR receiver            (route new pin #2 via face connector)
#   CS     - wire display CS pin to GND directly (bypasses R8 uncertainty)
#   BL     - No pin on 7-pin module (backlight always on via VCC)
#
# Face pins repurposed:
#   GPIO18 - was external trigger input → now SPI CLK
#   GPIO19 - was IR receiver           → now SPI MOSI  (IR moved to GPIO32)
#   GPIO5  - was LED Strip 1           → now LCD RST
#
# LED Strip 1 is redefined on GPIO13 (unconnected dummy pin) so the shared
# hit script compiles without modification. It has no physical effect.
#
# Use target_main_lcd.yaml (not target_main.yaml) for this face.
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS
# ==============================================================================
substitutions:
  aux_pwr_gpio: GPIO26
  io16_gpio:    GPIO16
  io17_gpio:    GPIO17
  io25_gpio:    GPIO25
  switch_12v:   GPIO33
  servo_gpio:   GPIO04
  project_version: "3.0.0"

  # Dummy LED pin — GPIO13 is unconnected on the LCD face.
  # Required so the shared hit script (which drives led_strip) compiles cleanly.
  led_gpio: GPIO13

  # IR receiver relocated to GPIO32 (routed via face connector)
  ir_gpio: GPIO32

  # Secondary LED strip on the main board — hide from UI on LCD face
  led2_gpio:          GPIO22
  strip_2_led_count:  "100"
  strip_2_internal:   "true"

# ==============================================================================
# PACKAGES — include common (with led_gpio overridden above to GPIO13)
# GPIO18/GPIO19 binary sensors and trigger input are intentionally NOT included;
# those pins are owned by the SPI bus on this face.
# ==============================================================================
packages:
  common_components: !include common/common.yaml

# ==============================================================================
# ESPHOME CORE — boot sequence (simplified: no LED stages)
# ==============================================================================
esphome:
  min_version: 2025.8.2
  on_boot:
    - priority: 600
      then:
        - logger.log: "=== LCD FACE BOOT ==="
        - switch.turn_on: aux_pwr
        - lambda: 'id(startup_complete) = true;'
        - logger.log: "LCD face ready"

# ==============================================================================
# BINARY SENSORS — GPIO25 hit trigger + GPIO16/17 inputs
# (GPIO18 trigger and GPIO19 IR omitted — repurposed for SPI)
# ==============================================================================
binary_sensor:
  - platform: gpio
    pin:
      number: ${io25_gpio}
      mode: INPUT_PULLUP
      inverted: true
    name: "GPIO25 Hit Trigger Input"
    id: gpio25_trigger_input
    filters:
      - delayed_on: 5ms
      - delayed_off: 50ms
    on_press:
      - if:
          condition:
            lambda: 'return id(gpio25_hit_enabled);'
          then:
            - logger.log: "GPIO25 hit trigger fired"
            - script.execute: run_hit_script

  - platform: gpio
    pin:
      number: ${io16_gpio}
      mode: INPUT_PULLUP
      inverted: true
    name: "GPIO16 Digital State"
    device_class: motion
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - logger.log: "GPIO16 HIGH"
    on_release:
      - logger.log: "GPIO16 LOW"

  - platform: gpio
    pin:
      number: ${io17_gpio}
      mode: INPUT_PULLUP
      inverted: true
    name: "GPIO17 Digital State"
    device_class: motion
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      - logger.log: "GPIO17 HIGH"
    on_release:
      - logger.log: "GPIO17 LOW"

# ==============================================================================
# SWITCHES — Auxiliary power + ground switch
# ==============================================================================
switch:
  - platform: gpio
    pin:
      number: ${aux_pwr_gpio}
    name: "Aux Pwr"
    id: aux_pwr
    restore_mode: ALWAYS_ON

  - platform: gpio
    pin:
      number: ${switch_12v}
    name: "Gnd Switch"
    id: gnd_switch

# ==============================================================================
# SERVO & PWM OUTPUT
# ==============================================================================
servo:
  - id: servo1
    output: pwm_output

output:
  - platform: ledc
    id: pwm_output
    pin: ${servo_gpio}
    frequency: 50 Hz

number:
  - platform: template
    name: "Servo Slider"
    id: servo_slider
    min_value: -85
    max_value: 85
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    icon: "mdi:arrow-expand-horizontal"
    set_action:
      - servo.write:
          id: servo1
          level: !lambda 'return (x / 100.0);'
      - lambda: 'id(servo_slider).publish_state(x);'

# ==============================================================================
# LCD HIT EFFECT SELECTOR
# ==============================================================================
select:
  - platform: template
    name: "LCD Hit Effect"
    id: lcd_hit_effect_select
    icon: "mdi:television-play"
    options:
      - "Expanding Rings"
      - "Flash"
      - "Solid"
    initial_option: "Expanding Rings"
    restore_value: true
    optimistic: true

# ==============================================================================
# SPI BUS — VSPI hardware SPI (GPIO18 CLK / GPIO19 MOSI)
# GPIO5 used as CS on the display component below.
# No MISO defined — GC9A01 is write-only.
# ==============================================================================
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19

# ==============================================================================
# FONTS
# ==============================================================================
font:
  - file: "gfonts://Roboto"
    id: font_score
    size: 48
    glyphs: "0123456789 ptsPTS!"
  - file: "gfonts://Roboto"
    id: font_label
    size: 22
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 !.-"

# ==============================================================================
# IMAGES — Optional custom PNG graphics (240x240, stored in flash)
# ==============================================================================
# To use custom images:
#   1. Create a SmartTarget/images/ directory
#   2. Add 240x240 PNG files named target_idle.png and target_hit.png
#   3. Uncomment the block below and switch the display lambda to use
#      it.image(0, 0, id(img_target_idle)) / it.image(0, 0, id(img_target_hit))
#
# image:
#   - file: "images/target_idle.png"
#     id: img_target_idle
#     type: RGB565
#     resize: 240x240
#   - file: "images/target_hit.png"
#     id: img_target_hit
#     type: RGB565
#     resize: 240x240

# ==============================================================================
# DISPLAY — GC9A01A 240x240 round TFT
# Idle: programmatic bullseye with hit counter
# Hit:  red screen with point value (driven by hit_processing global)
# ==============================================================================
display:
  - platform: ili9xxx
    model: GC9A01A
    dc_pin: GPIO21
    reset_pin: GPIO5
    # cs_pin omitted — wire display CS pin directly to GND
    invert_colors: true
    data_rate: 40MHz
    rotation: 0
    update_interval: 100ms
    auto_clear_enabled: true
    color_palette: 8BIT
    lambda: |-
      auto BLACK  = Color(0,   0,   0);
      auto WHITE  = Color(255, 255, 255);
      auto RED    = Color(220, 30,  30);
      auto YELLOW = Color(255, 200, 0);

      // Skip idle redraws when nothing has changed
      static int  last_hit_count      = -1;
      static bool last_hit_processing = false;
      static std::string last_effect  = "";
      bool idle_dirty = (!id(hit_processing) &&
                         (id(hit_count) != last_hit_count ||
                          last_hit_processing              ||
                          id(lcd_hit_effect_select).state != last_effect));
      if (!id(hit_processing) && !idle_dirty) return;
      last_hit_count      = id(hit_count);
      last_hit_processing = id(hit_processing);
      last_effect         = id(lcd_hit_effect_select).state;

      if (id(hit_processing)) {
        // ── HIT SCREEN ───────────────────────────────────────────────────────
        auto effect = id(lcd_hit_effect_select).state;

        if (effect == "Expanding Rings") {
          it.fill(BLACK);
          int ring = (millis() % 1000) / 100;
          for (int i = 0; i < 5; i++) {
            int r = ((ring + i * 2) % 10) * 11 + 10;
            auto c = (i % 2 == 0) ? RED : YELLOW;
            it.circle(120, 120, r, c);
          }
          it.printf(120, 100, id(font_score), WHITE, TextAlign::CENTER,
                    "%d", id(target_points));
          it.print(120, 155, id(font_label), WHITE, TextAlign::CENTER, "pts");

        } else if (effect == "Flash") {
          uint32_t frame = (millis() / 150) % 2;
          auto BG   = frame ? BLACK : RED;
          auto TEXT = frame ? RED   : WHITE;
          it.fill(BG);
          it.print(120, 70,  id(font_label), TEXT, TextAlign::CENTER, "HIT!");
          it.printf(120, 125, id(font_score), TEXT, TextAlign::CENTER,
                    "%d", id(target_points));
          it.print(120, 180, id(font_label), TEXT, TextAlign::CENTER, "pts");

        } else {
          // Solid
          it.fill(RED);
          it.print(120, 70,  id(font_label), WHITE, TextAlign::CENTER, "HIT!");
          it.printf(120, 125, id(font_score), WHITE, TextAlign::CENTER,
                    "%d", id(target_points));
          it.print(120, 180, id(font_label), WHITE, TextAlign::CENTER, "pts");
        }

      } else {
        // ── IDLE SCREEN — bullseye ───────────────────────────────────────────
        it.fill(BLACK);

        it.filled_circle(120, 120, 100, WHITE);
        it.filled_circle(120, 120,  85, BLACK);
        it.filled_circle(120, 120,  70, WHITE);
        it.filled_circle(120, 120,  55, BLACK);
        it.filled_circle(120, 120,  40, RED);
        it.filled_circle(120, 120,  25, BLACK);
        it.filled_circle(120, 120,  12, YELLOW);

        // Crosshair
        it.line(120, 20,  120, 55,  WHITE);
        it.line(120, 185, 120, 220, WHITE);
        it.line(20,  120, 55,  120, WHITE);
        it.line(185, 120, 220, 120, WHITE);

        // Hit counter (bottom-right)
        if (id(hit_count) > 0) {
          it.printf(190, 190, id(font_label), WHITE, TextAlign::CENTER,
                    "x%d", id(hit_count));
        }
      }
