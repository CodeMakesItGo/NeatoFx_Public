# ==============================================================================
# NEATO TARGET IR - MAIN CONFIGURATION FILE
# ==============================================================================
# This is the PRIMARY configuration file that assembles all target components.
# It includes hardware definitions, network configuration, IR protocols,
# and optional integrations like FPP (Falcon Player) support.
#
# ONE BINARY for every target — there is no per-unit build.
#
# Usage:
#   esphome compile main.yaml
#   esphome run     main.yaml
#   esphome logs    main.yaml
#   Then set the Device ID from the device web interface.
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS - Device Identification
# ==============================================================================
substitutions:
  # ONE BINARY: there is no build-time id substitution. ESPHome appends the MAC
  # suffix to the hostname at runtime (see _shared/esphome_base.yaml), giving
  # each unit a unique, permanent hostname. Logical identity is the runtime
  # Device ID, assigned from the web UI and stored in flash — swapping in a
  # replacement target means setting that number and nothing else.
  name: target
  name_add_mac_suffix: "true"
  friendly_name: "NeatoFx Target"
  runtime_name_label: "Target Name"
  # Servo PWM effect — only used when servo_pwm_effects package is enabled below
  # Options: servo_pwm_sawzall | servo_pwm_flicker
  # servo_pwm_script: "servo_pwm_flicker"

# ==============================================================================
# EXTERNAL PACKAGES
# ==============================================================================
packages:
  # Runtime identity — in main.yaml, not the network configs, so a
  # standalone build gets the Device ID and Target Name too. The package is
  # pure globals/template entities and has no api: dependency.
  runtime_id: !include ../../_shared/runtime_id.yaml

  # Hardware — select one board revision:
  #board: !include boards/rev1.yaml    # Rev 1.x (legacy)
  board: !include boards/rev3.yaml     # Rev 3.x (current production)
  #board: !include boards/rev3_hit_1_0.yaml # Rev 3.x + hit face 1.0 (push button on GPIO19, no IR receiver)
  #board: !include boards/rev3_lcd_1_1.yaml # Rev 3.x + GC9A01 LCD face 1.1 (LED CTRL GPIO5, RST GPIO32, IR GPIO35)

  # Network mode — select one:
  #config: !include configs/standalone.yaml       # Device's own AP, no router
  #config: !include configs/networked.yaml        # Router, no HA server (No-HA LAN)
  config: !include configs/home_assistant.yaml    # Router + Home Assistant server

  # IR receiver configuration
  # ALL COMMENTED OUT for the hit face 1.0 board: that face detects hits with a
  # push button on GPIO19 — the pin the IR receiver used — so there is no IR
  # receiver to configure. The team/IR globals (ir_enabled, ir_command,
  # team_detected, ...) live in boards/common/common.yaml, so hit_script.yaml
  # still compiles with no protocol package selected. Re-enable one of these
  # when switching back to an IR board above.
  ir_receiver: !include protocols/ir_nec.yaml
  #ir_receiver: !include protocols/ir_raw.yaml
  #ir_receiver: !include protocols/ir_laser_tag.yaml
  #ir_receiver: !include protocols/ir_custom.yaml

  # Falcon Player Packages (only for networked targets)
  # Uncomment BOTH lines below to enable FPP support
  #fpp_file: !include integrations/target_fpp.yaml

  # Servo movement — include EXACTLY ONE of these two:
  servo_scripts: !include scripts/servo_movement_script.yaml  # with servo
  #servo_scripts: !include scripts/servo_stubs.yaml           # no servo

  # Servo Pin PWM Effects - uncomment to enable a device effect on hit
  # Also uncomment + set servo_pwm_script in substitutions below
  #servo_pwm_effects: !include scripts/servo_pwm_effects.yaml

  # Hit behavior script - defines what happens when the target is hit.
  # Include EXACTLY ONE — both define the same script ids.
  #hit_script: !include scripts/hit_script.yaml       # standard hit
  hit_script: !include scripts/hit_script_fuse.yaml   # fuse burns down LED Strip 2, then explodes

# ==============================================================================
# BLE PROVISIONING — MUST BE REMOVED ON LCD BUILDS
# ==============================================================================
# _shared/networked_base.yaml enables esp32_improv (BLE). Bluedroid needs ~60-70 KB
# of internal DRAM, and the GC9A01 framebuffer already takes 57.6 KB. Together they
# do not fit on a no-PSRAM ESP32: btc_config_init() fails, then Bluedroid aborts in
# btc_config_lock ("assert failed: xQueueSemaphoreTake ... btc_init_bluetooth") and
# the device boot-loops. Serial provisioning (improv_serial, in configs/*.yaml) is
# unaffected and still works — only BLE provisioning is lost.
#
# This has to live here in main.yaml: !remove only takes effect from the top-level
# config, which merges LAST and wins over every package. Putting it in the board
# file does nothing (board packages merge first, as the lowest-precedence base).
#
# Remove the leading '#' below when using an LCD board above; put the '#' back
# for non-LCD boards. Currently disabled (the '#' is present): the hit face 1.0
# board has no display, so there is no framebuffer competing with Bluedroid and
# BLE provisioning fits again.
#esp32_improv: !remove

# ==============================================================================
# TARGET HIT SCRIPTS - what to do when target is hit
# ==============================================================================
script:
  # Main Hit Script - do these things when target is hit
  - id: run_hit_script
    mode: parallel
    then:
      # MASTER ENABLE GATE — every hit source funnels through this script (IR
      # protocols, GPIO25, the external trigger, the Test Target Hit switch), so
      # gating here is what makes a disabled target ignore all of them.
      - if:
          condition:
            lambda: 'return !id(target_enabled);'
          then:
            - logger.log: "Target disabled - hit ignored"
          else:
            - script.execute: target_hit_script
            # Uncomment the next line when FPP package is enabled above
            #- script.execute: fpp_start_playlist
      # NOTE: esphome_hit_script (the audio / HA trigger) is intentionally NOT
      # launched here. In networked mode it makes a *blocking* http_request.post
      # to the Audio-50, which freezes the single-threaded main loop and stalls
      # the LED hit effect. It is now fired from INSIDE target_hit_script, AFTER
      # the visual effect has rendered — see scripts/hit_script.yaml.

# ==============================================================================
# DEBUGGING
# ==============================================================================
web_server:
  local: false
  js_url: ""
  js_include: "boards/common/custom_ui.js"

logger:
  level: WARN  # Reduced from DEBUG to prevent mobile browser overload
  #level: DEBUG

