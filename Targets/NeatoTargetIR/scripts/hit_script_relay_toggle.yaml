# ==============================================================================
# TARGET HIT SCRIPTS - RELAY TOGGLE variant (momentary push-button load)
# ==============================================================================
# The standard hit (scripts/hit_script.yaml) with ONE change: instead of holding
# the relay on for the Relay Timer, the relay PRESSES a momentary button twice —
# once at the hit and once when the Relay Timer runs out. For a push-on /
# push-off light button that means: hit -> light on, timer ends -> light off.
# Everything else — LEDs, GND switch, servo, audio, cooldown, enable/disable —
# IS the standard script, included below as a package.
#
# In main.yaml pick EXACTLY ONE hit script:
#   hit_script: !include scripts/hit_script_relay_toggle.yaml
#
# TIMING
#   t = 0                   relay on for Relay Pulse Width, then off   (press 1)
#   t = Relay Timer         relay on for Relay Pulse Width, then off   (press 2)
#   Relay Timer is therefore how long the light stays on. Relay Pulse Width is
#   a web-UI number (default 250 ms, persisted) — long enough for the button's
#   electronics to register, short enough not to look like a hold. If the Relay
#   Timer is shorter than two pulses the second press follows the first
#   immediately.
#
# CAVEAT — this is a toggle, not a state. The target cannot know whether the
#   light is currently on. A hit while the light is already on (e.g. someone
#   pressed the button by hand, or the target was disabled mid-window and only
#   one press went out) inverts the pairing until the next odd press. Disable
#   mid-window: the pending second press is cancelled and the relay released,
#   so the light stays in whatever state it was in.
#
# HOW THE OVERRIDE WORKS
#   ESPHome packages CONCATENATE lists, so `- id: !remove relay_pulse` deletes
#   the standard hold-pulse first and the replacement below is then the only
#   one. target_hit_script and target_disable_apply already start / stop
#   relay_pulse by id, so nothing else changes.
# ==============================================================================

packages:
  standard_hit: !include hit_script.yaml

substitutions:
  relay_pulse_default: "250"   # ms, first boot only (web UI value persists)

number:
  - platform: template
    name: "Relay Pulse Width"
    id: relay_pulse_width
    icon: "mdi:gesture-tap-button"
    unit_of_measurement: "ms"
    optimistic: true
    restore_value: true
    initial_value: ${relay_pulse_default}
    min_value: 50
    max_value: 2000
    step: 50

script:
  - id: !remove relay_pulse
  - id: relay_pulse
    mode: restart
    then:
      # Press 1 — light on
      - switch.turn_on: relay_1
      - delay: !lambda 'return (int) id(relay_pulse_width).state;'
      - switch.turn_off: relay_1
      # Wait out the rest of the Relay Timer (the second press ends at Relay Timer)
      - delay: !lambda |-
          int gap = id(relay_timer) - 2 * (int) id(relay_pulse_width).state;
          return std::max(0, gap);
      # Press 2 — light off
      - switch.turn_on: relay_1
      - delay: !lambda 'return (int) id(relay_pulse_width).state;'
      - switch.turn_off: relay_1
