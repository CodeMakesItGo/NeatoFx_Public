# ==============================================================================
# TARGET HIT SCRIPTS - GND SAWZALL variant
# ==============================================================================
# The standard hit (scripts/hit_script.yaml) with ONE change: during the GND
# window the GND switch revs a motor like a reciprocating saw instead of switching on solid. Everything else —
# LEDs, relay, servo, audio, cooldown, enable/disable — IS the standard script,
# included below as a package, so this file can never drift from it.
#
# In main.yaml pick EXACTLY ONE hit script:
#   hit_script: !include scripts/hit_script_gnd_sawzall.yaml
#
# WIRING
#   The GND switch (GPIO33, PWM-capable on Rev 3.x) sinks the load's ground:
#   a motor controller / ESC whose throttle follows the PWM duty. On Rev 1.x the GND output is a no-op stub, so this build behaves
#   exactly like the standard hit there.
#
# TIMING
#   Runs for the GND window — GND Timer, or the Relay Timer when GND Timer is 0
#   — the same window the solid pulse it replaces would hold for. GND Ramp has
#   no effect on this build: the effect owns the output level.
#
# HOW THE OVERRIDE WORKS
#   ESPHome packages CONCATENATE lists, so a plain second `- id: gnd_pulse` would
#   be a duplicate id. `- id: !remove gnd_pulse` deletes the standard pulse
#   first, the replacement below is then the only one, and `!extend` appends
#   the effect's stop to target_disable_apply so a disable mid-effect releases
#   the output. (Both tags are resolved after all packages are merged.)
# ==============================================================================

packages:
  standard_hit: !include hit_script.yaml

script:
  # Replace the standard solid GND pulse with the effect for the same window.
  - id: !remove gnd_pulse
  - id: gnd_pulse
    mode: restart
    then:
      - script.execute: gnd_sawzall
      - delay: !lambda 'int t = id(gnd_timer); return t > 0 ? t : id(relay_timer);'
      - script.stop: gnd_sawzall
      # The effect was stopped mid-step at an arbitrary level — release the load.
      - output.set_level:
          id: gnd_output
          level: 0.0

  # Disable mid-effect: the standard script stops gnd_pulse and turns gnd_light
  # off, but the effect drives the output directly, so stop it here too.
  - id: !extend target_disable_apply
    then:
      - script.stop: gnd_sawzall
      - output.set_level:
          id: gnd_output
          level: 0.0

  # ===========================================================================
  # SAWZALL THROTTLE
  # A human revving a reciprocating saw before/during a cut: two test blips ->
  # ramp to full throttle -> sustained cutting with load variation. Loops until
  # script.stop is called.
  # ===========================================================================
  - id: gnd_sawzall
    mode: restart
    then:
      - logger.log: "Sawzall: starting throttle sequence"

      # --- Test blip 1: quick squeeze-and-release ---
      - output.set_level:
          id: gnd_output
          level: 0.35
      - delay: 110ms
      - output.set_level:
          id: gnd_output
          level: 0.0
      - delay: 200ms

      # --- Test blip 2: higher rev, longer squeeze ---
      - output.set_level:
          id: gnd_output
          level: 0.6
      - delay: 220ms
      - output.set_level:
          id: gnd_output
          level: 0.0
      - delay: 280ms

      # --- Ramp to full throttle (human squeezing the trigger) ---
      - output.set_level:
          id: gnd_output
          level: 0.2
      - delay: 55ms
      - output.set_level:
          id: gnd_output
          level: 0.45
      - delay: 55ms
      - output.set_level:
          id: gnd_output
          level: 0.68
      - delay: 55ms
      - output.set_level:
          id: gnd_output
          level: 0.85
      - delay: 65ms
      - output.set_level:
          id: gnd_output
          level: 1.0

      # --- Sustained cutting: full power with load-induced dips ---
      - while:
          condition:
            lambda: 'return true;'
          then:
            # Full throttle run
            - output.set_level:
                id: gnd_output
                level: 1.0
            - delay: !lambda 'return 180 + (rand() % 320);'  # 180-500 ms

            # Blade biting into material - moderate dip
            - output.set_level:
                id: gnd_output
                level: !lambda 'return 0.70f + (rand() % 18) / 100.0f;'  # 70-88 %
            - delay: !lambda 'return 60  + (rand() % 120);'  # 60-180 ms

            # Recover to full
            - output.set_level:
                id: gnd_output
                level: 1.0
            - delay: !lambda 'return 100 + (rand() % 200);'  # 100-300 ms

            # Brief hard-load stall (blade catching)
            - output.set_level:
                id: gnd_output
                level: !lambda 'return 0.50f + (rand() % 25) / 100.0f;'  # 50-75 %
            - delay: !lambda 'return 30  + (rand() % 60);'   # 30-90 ms
