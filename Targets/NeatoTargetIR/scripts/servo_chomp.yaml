# ==============================================================================
# SERVO CHOMP - animated jaw (fish mouth) that chomps for the hit window
# ==============================================================================
# A third option for the servo_scripts slot. In main.yaml pick EXACTLY ONE:
#
#   servo_scripts: !include scripts/servo_movement_script.yaml  # swing once per hit
#   servo_scripts: !include scripts/servo_stubs.yaml            # no servo
#   servo_scripts: !include scripts/servo_chomp.yaml            # chomp for the hit window
#
# Nothing else to enable. This file is servo_movement_script.yaml plus the
# chomp: the same "Servo Idle Position" / "Servo Hit Position" controls (same
# ids, so calibration carries over when you swap variants), the same script ids
# the hit scripts and board call, and one extra control, "Chomp Interval".
#
# BEHAVIOR
#   Hit        -> the hit script calls servo_go_hit. Here that starts the chomp:
#                 jaw to Hit Position, back to Idle Position, repeat, one
#                 half-move per Chomp Interval
#   Hit ends   -> the hit script calls servo_go_idle when its hit display ends
#                 (the later of Relay Timer and hit_display_time, 3 s by
#                 default): chomp stops and the jaw closes, held shut under
#                 power. With Relay Timer >= 3 s the Relay Timer IS the chomp
#                 duration.
#   Disabled   -> target_disable_apply calls servo_go_idle: same. Same at boot.
#   Test       -> "Test Servo Hit" chomps for 3 s, then closes
#
# The chomp deliberately does NOT watch the relay pin. hit_script_relay_toggle
# only pulses the relay, and the fuse / lightning scripts time the relay to
# their own effects, so the servo_go_hit / servo_go_idle calls — which every
# hit script makes — are the one signal that means "hit window" everywhere.
#
# Chomp Interval must be long enough for the servo to actually reach the other
# angle, or it shudders mid-travel instead of chomping. A typical hobby servo
# needs ~250-400 ms for 90 degrees under a light jaw.
# ==============================================================================

substitutions:
  chomp_interval_default: "350"   # ms per half-move, first boot only (web UI value persists)

globals:
  - id: g_servo_idle_pos
    type: int
    restore_value: true
    initial_value: '0'

  - id: g_servo_hit_pos
    type: int
    restore_value: true
    initial_value: '90'

  # True from servo_go_hit until servo_go_idle — the chomp loop's run condition.
  - id: chomp_active
    type: bool
    restore_value: no
    initial_value: 'false'

number:
  - platform: template
    name: "Servo Idle Position"
    id: servo_slider
    min_value: 0
    max_value: 180
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    icon: "mdi:restore"
    unit_of_measurement: "°"
    set_action:
      - globals.set:
          id: g_servo_idle_pos
          value: !lambda 'return (int)x;'
      - servo.write:
          id: servo1
          level: !lambda 'return (x - 90.0f) / 90.0f;'

  - platform: template
    name: "Servo Hit Position"
    id: servo_hit_pos_ctrl
    min_value: 0
    max_value: 180
    step: 1
    initial_value: 90
    restore_value: true
    optimistic: true
    icon: "mdi:target"
    unit_of_measurement: "°"
    set_action:
      - globals.set:
          id: g_servo_hit_pos
          value: !lambda 'return (int)x;'
      # Move there immediately so the open angle can be calibrated live; the
      # idle control moves it back.
      - servo.write:
          id: servo1
          level: !lambda 'return (x - 90.0f) / 90.0f;'

  # Time for one half-move (open OR close). Read before every move, so a change
  # takes effect on the next chomp. Persisted.
  - platform: template
    name: "Chomp Interval"
    id: chomp_interval
    icon: "mdi:fish"
    unit_of_measurement: "ms"
    optimistic: true
    restore_value: true
    initial_value: ${chomp_interval_default}
    min_value: 100
    max_value: 2000
    step: 50

button:
  # Bench test from the web UI Test card: 3 s of chomping, then close.
  - platform: template
    name: "Test Servo Hit"
    id: test_servo_hit_button
    icon: "mdi:cog-play"
    on_press:
      - script.execute: servo_go_hit
      - delay: 3s
      - script.execute: servo_go_idle

script:
  # The chomp loop. Runs while chomp_active (set by servo_go_hit, cleared by
  # servo_go_idle), checking before each half-move so it stops within one
  # interval of the window closing, then parks the jaw closed.
  - id: servo_chomp
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(chomp_active);'
          then:
            # Open
            - servo.write:
                id: servo1
                level: !lambda 'return (id(g_servo_hit_pos) - 90.0f) / 90.0f;'
            - delay: !lambda 'return (int) id(chomp_interval).state;'
            # Close — only if we are still meant to be chomping
            - if:
                condition:
                  lambda: 'return id(chomp_active);'
                then:
                  - servo.write:
                      id: servo1
                      level: !lambda 'return (id(g_servo_idle_pos) - 90.0f) / 90.0f;'
                  - delay: !lambda 'return (int) id(chomp_interval).state;'
      # Window closed: close and hold
      - servo.write:
          id: servo1
          level: !lambda 'return (id(g_servo_idle_pos) - 90.0f) / 90.0f;'

  # Called by every hit script at the hit.
  - id: servo_go_hit
    mode: restart
    then:
      - globals.set:
          id: chomp_active
          value: 'true'
      - script.execute: servo_chomp

  # Called at the end of the hit, on disable, and at boot: stop any chomp in
  # progress and close.
  - id: servo_go_idle
    mode: restart
    then:
      - globals.set:
          id: chomp_active
          value: 'false'
      - script.stop: servo_chomp
      - servo.write:
          id: servo1
          level: !lambda 'return (id(g_servo_idle_pos) - 90.0f) / 90.0f;'
