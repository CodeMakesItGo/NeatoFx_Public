# ==============================================================================
# SERVO MOVEMENT SCRIPT - Configurable idle/hit positions
# ==============================================================================
# Provides web-UI controls for servo idle and hit positions (0-180°).
# The servo moves at its natural hardware speed.
#
# Included by: target_main.yaml (servo_scripts package)
# ==============================================================================

globals:
  - id: g_servo_idle_pos
    type: int
    restore_value: true
    initial_value: '0'

  - id: g_servo_hit_pos
    type: int
    restore_value: true
    initial_value: '90'

number:
  - platform: template
    name: "Servo Idle Position"
    id: servo_slider
    min_value: 0
    max_value: 180
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    icon: "mdi:restore"
    unit_of_measurement: "°"
    set_action:
      - globals.set:
          id: g_servo_idle_pos
          value: !lambda 'return (int)x;'
      - servo.write:
          id: servo1
          level: !lambda 'return (x - 90.0f) / 90.0f;'

  - platform: template
    name: "Servo Hit Position"
    id: servo_hit_pos_ctrl
    min_value: 0
    max_value: 180
    step: 1
    initial_value: 90
    restore_value: true
    optimistic: true
    icon: "mdi:target"
    unit_of_measurement: "°"
    set_action:
      - globals.set:
          id: g_servo_hit_pos
          value: !lambda 'return (int)x;'
      # Move to the new hit position immediately so it can be calibrated live
      # (mirrors the idle control). The idle control moves it back.
      - servo.write:
          id: servo1
          level: !lambda 'return (x - 90.0f) / 90.0f;'

script:
  - id: servo_go_hit
    mode: restart
    then:
      - servo.write:
          id: servo1
          level: !lambda 'return (id(g_servo_hit_pos) - 90.0f) / 90.0f;'

  - id: servo_go_idle
    mode: restart
    then:
      - servo.write:
          id: servo1
          level: !lambda 'return (id(g_servo_idle_pos) - 90.0f) / 90.0f;'

  # Zero the servo PWM output (called by hit_script after effects stop).
  # servo_stubs.yaml provides the no-op twin for boards without a servo.
  # NOTE: this drives the servo signal to 0% duty (no pulse). It exists to clean
  # up after a servo-pin PWM *effect* (sawzall/flicker). With no effect active
  # (servo_pwm_script = servo_pwm_none, the default) it is pointless and can leave
  # the servo limp/desynced from the servo component's tracked position.
  - id: servo_pwm_zero
    mode: single
    then:
      - output.set_level:
          id: pwm_output
          level: 0.0
