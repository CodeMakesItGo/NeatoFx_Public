# ==============================================================================
# TARGET HIT SCRIPTS - LIGHTNING (Old Town Mining "left cloud") variant
# ==============================================================================
# Drop-in replacement for scripts/hit_script.yaml. In main.yaml swap the include:
#
#   packages:
#     #hit_script: !include scripts/hit_script.yaml            # standard hit
#     #hit_script: !include scripts/hit_script_fuse.yaml       # fuse + explosion
#     hit_script: !include scripts/hit_script_lightning.yaml   # lightning storm
#
# Include EXACTLY ONE — all three define the same script ids
# (target_hit_script, gnd_pulse, target_disable_apply, target_enable_apply).
#
# WHAT IT IS
#   A frame-for-frame port of the xLights sequence
#   "emersonxlightslightningleftcloud.xsq" (2025.13, 50 ms timing, 12.805 s,
#   media: "Thunder Sound Effect [vJ08fwaLXwg].mp3") so ONE target can play the
#   left-cloud lightning show on its own outputs with no FPP in the loop.
#
#   xLights model         ->  target output      notes
#   ------------------------------------------------------------------------
#   Left-Cloud-1          ->  LED Strip 2        150 px, the cloud strip
#   Left-Cloud-2          ->  Target LEDs        6 px main strip
#   DmxFloodlight-left    ->  GND switch (PWM)   dimmable: 20 % / 15 % flashes
#   Wall + Posts          ->  Relay 1            two on/off strikes
#
#   Right-Cloud-*, DmxFloodlight-right and Rock-wall are NOT reproduced — they
#   belong to a second target (right cloud). Build that one by editing the
#   event tables below; the timing/rendering code is shared.
#
# TIMELINE (ms from hit)          strip2 (cloud-1)      strip1 (cloud-2)
#     300- 800  shimmer white 30%   x
#     300-1000  white 20%, fade                          x
#    1350-1850  white 25%, fade     x
#    1450-1950  RELAY on (wall/posts)
#    1500-2000  GND 20% -> 0
#    1800-2300  shimmer white 20%                        x
#    2400-4400  navy wipe IN 2 s    x (forward)          x (reverse)
#    4400-6400  navy->ice wipe OUT  x (forward)          x (reverse, navy)
#    7000-7800  RELAY on
#    7050-7850  grey 20%, fade                           x
#    8250-8600  shimmer grey 30%    x
#    8900-9250  GND 15% -> 0
#   12805       sequence end (thunder tail) -> cooldown -> restore
#
# HOW IT PLAYS
#   Both strips run a self-timed addressable_lambda effect ("Lightning Effect")
#   that renders the event table off millis() — that is what keeps shimmer,
#   fades and wipes on the 50 ms xLights grid without a script delay per frame.
#   Relay and GND are only four events between them, so they run as two small
#   delay-driven scripts launched at the same instant as the strips.
#
#   The Audio-50 / HA trigger fires BEFORE frame 0 (same reasoning as the fuse
#   script): esphome_hit_script's http_request.post is blocking, so it must land
#   before the animation starts or it stutters the first flash. Net effect: the
#   thunder MP3 and the lightning start together.
#
# WHAT IT IGNORES (on purpose)
#   - "Target Hit Effect" / "LED Strip 2 Hit Effect" selects — the sequence IS
#     the hit effect.
#   - relay_timer / gnd_timer / gnd_ramp_percent / hit_display_time — relay and
#     GND follow the sequence timeline, and the display window is the sequence
#     length. cooldown_timer is still honoured after the sequence.
#   - Team colours / capture mode still work at the END of the hit (the resting
#     colour logic is unchanged) but the flashes themselves are always the
#     sequence's white/navy.
#
# POWER — LED STRIP 2 MUST BE ON ITS OWN 5 V SUPPLY WITH THESE LEVELS
#   The white strikes are set to 100 % (raised from the xLights 20-30 %), and a
#   strike lights EVERY pixel at once: 150 x WS2812 at full white is ~9 A —
#   far beyond the board's 2 A regulator, which also feeds the ESP32 and relay.
#   Feed strip 2 from a separate 5 V supply (150 px: 10 A; 300 px: 20 A, inject
#   at both ends), tie its GND to the board GND, data only from the board.
#   To run strip 2 from the board regulator instead, set
#   lightning_strip2_scale to 0.15 or lower (150 px ~ 1.35 A peak).
#   The 6-px main strip is not a concern at any level.
#
# TUNING
#   All values are substitutions (compile-time) — same reasoning as the fuse
#   script: adding restore_value globals reindexes the flash preference table
#   on deployed targets. Override them in main.yaml and recompile.
# ------------------------------------------------------------------------------
substitutions:
  servo_pwm_script: "servo_pwm_none"   # no-op default

  # --- Lightning tuning -------------------------------------------------------
  lightning_seq_ms: "12805"       # sequence length (xLights sequenceDuration) — hold dark to here
  lightning_strip2_scale: "1.0"   # brightness multiplier on LED Strip 2 (see POWER) — 1.0 assumes a separate 5 V supply
  lightning_strip1_scale: "1.0"   # brightness multiplier on Target LEDs
  lightning_shimmer_ms: "50"      # shimmer half-period = xLights frame time
  lightning_frame_ms: "20ms"      # render interval (50 Hz; sequence grid is 20 Hz)
  lightning_gnd_scale: "1.0"      # multiplier on the two GND (floodlight) levels

# ==============================================================================
# LIGHTNING EFFECT - merged onto both strips (boards/common/common.yaml)
# ==============================================================================
# `!extend` is required, not a plain `id:` — package merge concatenates lists,
# so a bare `- id: led_strip2` would add a SECOND platform-less light. `!extend`
# folds the entry into the existing light after all packages are merged.
#
# Event table format (one row per xLights effect on that model):
#   { t0, t1, mode, fade, r, g, b, r2, g2, b2, level }
#   t0/t1  ms from hit                     mode  0 solid  1 shimmer
#   fade   fade-OUT length in ms (0 none)        2 wipe in  3 wipe out
#   rgb    palette colour 1                       (+10 = reversed direction)
#   rgb2   palette colour 2 (On effect blends 1 -> 2 over the event)
#   level  palette Brightness slider (0..1)
light:
  - id: !extend led_strip2
    effects:
      - addressable_lambda:
          name: "Lightning Effect"
          update_interval: ${lightning_frame_ms}
          lambda: |-
            // ---- Left-Cloud-1 ------------------------------------------------
            struct Ev { uint16_t t0, t1; uint8_t mode; uint16_t fade;
                        uint8_t r, g, b, r2, g2, b2; float level; };
            static const Ev EV[] = {
              { 300,  800, 1, 500, 255,255,255, 255,255,255, 1.00f },  // shimmer white (xLights 30%, raised to full)
              {1350, 1850, 0, 500, 255,255,255, 255,255,255, 1.00f },  // white, fade (xLights 25%, raised to full)
              {2400, 4400, 2,   0,   0,  0,128,   0,  0,128, 0.50f },  // navy wipe in
              {4400, 6400, 3,   0,   0,  0,128, 170,255,255, 0.50f },  // navy->ice wipe out
              {8250, 8600, 1, 350, 255,255,255, 255,255,255, 1.00f },  // shimmer white (xLights grey @30%, raised to full)
            };
            const float SCALE = ${lightning_strip2_scale};
            const uint32_t SHIM = ${lightning_shimmer_ms};

            static uint32_t t0 = 0;
            uint32_t now = millis();
            if (initial_run || t0 == 0) { t0 = now; }
            uint32_t t = now - t0;
            int n = it.size();
            it.all() = Color::BLACK;

            for (const Ev &e : EV) {
              if (t < e.t0 || t >= e.t1) continue;
              uint32_t dur = e.t1 - e.t0, el = t - e.t0;
              float p = (float) el / (float) dur;               // 0..1 through the event
              float lvl = e.level * SCALE;
              if (e.fade && (e.t1 - t) < e.fade) lvl *= (float)(e.t1 - t) / (float) e.fade;
              if (lvl > 1.0f) lvl = 1.0f;                        // never wrap a byte
              uint8_t mode = e.mode % 10; bool rev = e.mode >= 10;
              if (mode == 1 && ((el / SHIM) & 1)) continue;     // shimmer: every other frame dark
              // xLights "On" with two palette colours blends 1 -> 2 across the event
              uint8_t r = e.r + (int)((e.r2 - e.r) * p), g = e.g + (int)((e.g2 - e.g) * p),
                      b = e.b + (int)((e.b2 - e.b) * p);
              Color c((uint8_t)(r * lvl), (uint8_t)(g * lvl), (uint8_t)(b * lvl));
              int lo = 0, hi = n;                                // lit range [lo, hi)
              if (mode == 2)      { hi = (int)(p * n) + 1; }     // wipe in: grows from start
              else if (mode == 3) { lo = (int)(p * n); }         // wipe out: clears from start
              if (hi > n) hi = n;
              for (int i = lo; i < hi; i++) it[rev ? (n - 1 - i) : i] = c;
            }

  - id: !extend led_strip
    effects:
      - addressable_lambda:
          name: "Lightning Effect"
          update_interval: ${lightning_frame_ms}
          lambda: |-
            // ---- Left-Cloud-2 ------------------------------------------------
            struct Ev { uint16_t t0, t1; uint8_t mode; uint16_t fade;
                        uint8_t r, g, b, r2, g2, b2; float level; };
            static const Ev EV[] = {
              { 300, 1000, 0, 500, 255,255,255, 255,255,255, 1.00f },  // white, fade (xLights 20%, raised to full)
              {1800, 2300, 1, 500, 255,255,255, 255,255,255, 1.00f },  // shimmer white (xLights 20%, raised to full)
              {2400, 4400,12,   0,   0,  0,128,   0,  0,128, 0.50f },  // navy wipe in (reversed)
              {4400, 6400,13,   0,   0,  0,128,   0,  0,128, 0.50f },  // navy wipe out (reversed)
              {7050, 7850, 0, 500, 255,255,255, 255,255,255, 1.00f },  // white, fade (xLights grey @20%, raised to full)
            };
            const float SCALE = ${lightning_strip1_scale};
            const uint32_t SHIM = ${lightning_shimmer_ms};

            static uint32_t t0 = 0;
            uint32_t now = millis();
            if (initial_run || t0 == 0) { t0 = now; }
            uint32_t t = now - t0;
            int n = it.size();
            it.all() = Color::BLACK;

            for (const Ev &e : EV) {
              if (t < e.t0 || t >= e.t1) continue;
              uint32_t dur = e.t1 - e.t0, el = t - e.t0;
              float p = (float) el / (float) dur;
              float lvl = e.level * SCALE;
              if (e.fade && (e.t1 - t) < e.fade) lvl *= (float)(e.t1 - t) / (float) e.fade;
              if (lvl > 1.0f) lvl = 1.0f;
              uint8_t mode = e.mode % 10; bool rev = e.mode >= 10;
              if (mode == 1 && ((el / SHIM) & 1)) continue;
              uint8_t r = e.r + (int)((e.r2 - e.r) * p), g = e.g + (int)((e.g2 - e.g) * p),
                      b = e.b + (int)((e.b2 - e.b) * p);
              Color c((uint8_t)(r * lvl), (uint8_t)(g * lvl), (uint8_t)(b * lvl));
              int lo = 0, hi = n;
              if (mode == 2)      { hi = (int)(p * n) + 1; }
              else if (mode == 3) { lo = (int)(p * n); }
              if (hi > n) hi = n;
              for (int i = lo; i < hi; i++) it[rev ? (n - 1 - i) : i] = c;
            }

script:
  # GND-switch pulse — kept for interface compatibility with the other hit
  # scripts (same id, same behaviour) but NOT used by the lightning hit: the GND
  # output follows the sequence via lightning_gnd below. Still available to
  # anything that wants the legacy "follow relay" pulse.
  - id: gnd_pulse
    mode: restart
    then:
      - light.turn_on:
          id: gnd_light
          brightness: 100%
          transition_length: !lambda |-
            int p = id(gnd_ramp_percent);
            if (p <= 0) return 0;
            if (p > 100) p = 100;
            int t = id(gnd_timer); if (t <= 0) t = id(relay_timer);
            return t * p / 100;
      - delay: !lambda 'int t = id(gnd_timer); return t > 0 ? t : id(relay_timer);'
      - light.turn_off:
          id: gnd_light
          transition_length: 0s

  # ---- RELAY timeline: Wall + Posts strikes (relay is on/off, no dimming) ----
  # Started at t=0 alongside the strips; delays are absolute-to-relative.
  - id: lightning_relay
    mode: restart
    then:
      - delay: 1450ms
      - switch.turn_on: relay_1              # 1450-1950
      - delay: 500ms
      - switch.turn_off: relay_1
      - delay: 5050ms
      - switch.turn_on: relay_1              # 7000-7800
      - delay: 800ms
      - switch.turn_off: relay_1

  # ---- GND (PWM) timeline: DmxFloodlight-left --------------------------------
  # gnd_light has gamma_correct: 0, so brightness is linear PWM duty — the
  # xLights 20 % / 15 % (grey #808080 @ 30 %) land as 20 % / 15 % duty. Each
  # flash snaps on and fades to 0 over the event (fadeout 0.5 s >= event length).
  - id: lightning_gnd
    mode: restart
    then:
      - delay: 1500ms
      - light.turn_on:
          id: gnd_light
          brightness: !lambda 'return 0.20f * ${lightning_gnd_scale};'
          transition_length: 0s
      - light.turn_off:
          id: gnd_light
          transition_length: 500ms          # 1500-2000
      - delay: 7400ms
      - light.turn_on:
          id: gnd_light
          brightness: !lambda 'return 0.15f * ${lightning_gnd_scale};'
          transition_length: 0s
      - light.turn_off:
          id: gnd_light
          transition_length: 350ms          # 8900-9250

  # Main Target Hit Script - lightning version
  - id: target_hit_script
    mode: single  # Prevent overlapping hits
    then:
      - logger.log: "Target hit detected - lightning sequence..."
      # Disable IR during hit processing
      - globals.set:
          id: ir_enabled
          value: 'false'

      # Disable auto-save during hit processing to prevent overwriting saved effect
      - globals.set:
          id: hit_processing
          value: 'true'

      # Log hit information and increment hit counter
      - lambda: |-
          id(hit_count)++;
          ESP_LOGI("target_hit", "Hit detected - Player: %d, Points: %d, Total hits: %d", id(ir_command), id(target_points), id(hit_count));

      # Save current effect index + brightness so the idle look comes back after
      - lambda: |-
          std::string current_effect = id(led_strip).get_effect_name();
          int effect_index = 0;
          if (current_effect == "Rainbow Effect") effect_index = 1;
          else if (current_effect == "Color Wipe Effect") effect_index = 2;
          else if (current_effect == "Scanner Effect") effect_index = 3;
          else if (current_effect == "Twinkle Effect") effect_index = 4;
          else if (current_effect == "Heartbeat Effect") effect_index = 5;
          id(saved_effect_index) = effect_index;
          id(saved_brightness) = id(led_strip).remote_values.get_brightness();
          ESP_LOGI("target_hit", "Saved effect index: %d, brightness: %.2f", effect_index, (float)id(saved_brightness));

      # Take both strips dark FIRST (0 s) so the sequence starts from black like
      # xLights does, and so the effect select below is guaranteed to be a fresh
      # start (initial_run == true resets the timeline to frame 0).
      - light.turn_off:
          id: led_strip
          transition_length: 0s
      - light.turn_off:
          id: led_strip2
          transition_length: 0s

      # Trigger linked audio / HA event BEFORE frame 0 — see header. The blocking
      # POST lands here, during the sequence's 300 ms of pre-roll darkness, so
      # the thunder MP3 and the first flash start together.
      - script.execute: esphome_hit_script

      # ---- ROLL THE SEQUENCE (t = 0) ----
      # Brightness forced to full: the effect tables carry the xLights palette
      # levels themselves. No transition_length — mutually exclusive with
      # `effect`, and LightCall skips the default transition when starting a
      # non-None effect anyway.
      - light.turn_on:
          id: led_strip2
          brightness: 100%
          effect: "Lightning Effect"
      - light.turn_on:
          id: led_strip
          brightness: 100%
          effect: "Lightning Effect"
      - script.execute: lightning_relay
      - script.execute: lightning_gnd
      - script.execute: ${servo_pwm_script}
      - script.execute: servo_go_hit

      # Hold through the whole sequence (last light event ends at 9.25 s; the
      # remainder is the thunder tail, dark).
      - delay: ${lightning_seq_ms}ms

      # ---- SEQUENCE END ----
      - switch.turn_off: relay_1              # belt-and-braces; timeline already released it
      - light.turn_off:
          id: gnd_light
          transition_length: 0s
      - script.stop: ${servo_pwm_script}
      - script.execute: servo_pwm_zero
      - light.turn_off: led_strip
      - light.turn_off: led_strip2
      - script.execute: servo_go_idle

      # Final cooldown period
      - delay: !lambda 'return id(cooldown_timer);'

      # Restore original effect (index 0 = solid color, i.e. no effect)
      - lambda: |-
          std::string effect_name = "Scanner Effect";  // Default fallback
          switch (id(saved_effect_index)) {
            case 0: effect_name = "None"; break;
            case 1: effect_name = "Rainbow Effect"; break;
            case 2: effect_name = "Color Wipe Effect"; break;
            case 3: effect_name = "Scanner Effect"; break;
            case 4: effect_name = "Twinkle Effect"; break;
            case 5: effect_name = "Heartbeat Effect"; break;
            default:
              ESP_LOGW("target_hit", "Unknown effect index: %d, using default", id(saved_effect_index));
              break;
          }
          float brightness = id(saved_brightness);
          if (brightness <= 0.0f) brightness = 0.5f;  // never restore fully dark
          auto call = id(led_strip).turn_on();
          call.set_effect(effect_name);
          call.set_brightness(brightness);
          call.set_rgb(id(saved_red), id(saved_green), id(saved_blue));
          call.perform();
          ESP_LOGI("target_hit", "Restored effect: %s, brightness: %.2f", effect_name.c_str(), brightness);

      # Re-enable auto-save
      - globals.set:
          id: hit_processing
          value: 'false'

      # CAPTURE MODE - adopt the team's color as the new resting color (runs
      # after hit_processing is cleared so the auto-save persists it).
      - if:
          condition:
            lambda: 'return id(team_detected) && id(capture_mode_enabled);'
          then:
            - select.set:
                id: led_strip_color_preset
                option: !lambda 'return id(team_name);'
            - logger.log:
                format: "Capture mode: target taken by %s"
                args: ['id(team_name).c_str()']

      # Consume the team flag so a later non-IR trigger cannot reuse a stale team.
      - lambda: |-
          id(team_detected) = false;
          id(team_color_applied) = false;

      - globals.set:
          id: ir_enabled
          value: 'true'
      - logger.log: "Lightning sequence complete"


  # ==========================================================================
  # MASTER ENABLE / DISABLE — driven by the "Target Enabled" switch
  # (boards/common/common.yaml) and by the boot handler in that same file.
  # ==========================================================================

  # Apply the DISABLED state: abort any hit in flight, release every output and
  # take both strips dark. mode: restart so repeated toggles are harmless.
  - id: target_disable_apply
    mode: restart
    then:
      # Kill a hit mid-sequence — including the relay/GND timelines, which would
      # otherwise still fire their later strikes after the target was disabled.
      - script.stop: target_hit_script
      - script.stop: lightning_relay
      - script.stop: lightning_gnd
      - script.stop: gnd_pulse
      - script.stop: ${servo_pwm_script}
      - script.execute: servo_pwm_zero
      - globals.set:
          id: hit_processing
          value: 'false'
      - globals.set:
          id: team_detected
          value: 'false'
      - globals.set:
          id: team_color_applied
          value: 'false'
      - switch.turn_off: relay_1
      - light.turn_off:
          id: gnd_light
          transition_length: 0s
      - light.turn_off:
          id: led_strip
          transition_length: 0s
      - light.turn_off:
          id: led_strip2
          transition_length: 0s
      - script.execute: servo_go_idle
      - logger.log: "Target disabled - outputs released, LEDs dark"

  # Apply the ENABLED state: re-arm IR and restore the saved idle look.
  - id: target_enable_apply
    mode: restart
    then:
      - globals.set:
          id: hit_processing
          value: 'false'
      - globals.set:
          id: team_detected
          value: 'false'
      - globals.set:
          id: team_color_applied
          value: 'false'
      - globals.set:
          id: ir_enabled
          value: 'true'
      - lambda: |-
          std::string effect_name = "None";
          switch (id(saved_effect_index)) {
            case 1: effect_name = "Rainbow Effect"; break;
            case 2: effect_name = "Color Wipe Effect"; break;
            case 3: effect_name = "Scanner Effect"; break;
            case 4: effect_name = "Twinkle Effect"; break;
            case 5: effect_name = "Heartbeat Effect"; break;
            default: break;  // 0 (or unknown) = solid color, no effect
          }
          float brightness = id(saved_brightness);
          if (brightness <= 0.0f) brightness = 0.5f;  // never restore fully dark
          auto call = id(led_strip).turn_on();
          call.set_brightness(brightness);
          call.set_rgb(id(saved_red), id(saved_green), id(saved_blue));
          call.set_effect(effect_name);
          call.perform();
          ESP_LOGI("target_enable", "Enabled - restored effect: %s, brightness: %.2f",
                   effect_name.c_str(), brightness);
      - script.execute: servo_go_idle


  # No-op stub — active when no servo PWM effect is configured (default)
  - id: servo_pwm_none
    mode: single
    then: []


# ==============================================================================
# HIDE THE DEAD "Target LEDs Hit Effect" SELECT
# ==============================================================================
# The sequence IS the hit effect on BOTH strips: target_hit_script drives
# led_strip straight to "Lightning Effect" and never reads hit_effect_select.
# Left visible it is a live-looking control that does nothing on this build.
#
# Why this one is hidden rather than moved the way "LED Strip 2 Hit Effect" was:
# hit_effect_select is read by scripts/hit_script.yaml AND scripts/
# hit_script_fuse.yaml, so it has no single owner to move to — relocating it
# would mean duplicating the whole select into both. It stays shared in
# boards/common/common.yaml and only this variant opts out.
#
# `internal: true` drops it from the web server and the HA API; the custom UI
# prunes any row that reports no state (pruneMissing in
# boards/common/custom_ui.js), so the row disappears instead of sitting dead.
# Safe on deployed targets: restore_value keys off a hash of the entity NAME
# (EntityBase::calc_object_id_), which `internal` does not change.
#
# NOT hidden: "LED Strip 2 Solid Color" (led_strip2_color_preset). Its set_action
# calls light.turn_on on led_strip2 directly, so it still works as a manual
# strip-2 colour on this build — it is only unused BY THE HIT.
select:
  - id: !extend hit_effect_select
    internal: true
