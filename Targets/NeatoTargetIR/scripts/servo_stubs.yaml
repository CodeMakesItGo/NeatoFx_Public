# ==============================================================================
# SERVO STUBS - No-op placeholders for targets without servo movement
# ==============================================================================
# For boards with no servo hardware (Rev 1.x), so the hit scripts' calls to
# servo_go_hit / servo_go_idle always resolve. Every Rev 3.x board uses
# scripts/servo.yaml instead, where "Servo Mode" = Off does the same at runtime.
# ==============================================================================

script:
  - id: servo_go_hit
    mode: single
    then: []

  - id: servo_go_idle
    mode: single
    then: []
