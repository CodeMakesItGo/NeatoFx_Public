# ==============================================================================
# HIT STYLES - GND switch effects ("GND Effect" select in scripts/hit_script.yaml)
# ==============================================================================
# GND Effect = Flicker (gnd_flicker) and Throttle (gnd_throttle) — the loops
# that used to be hit_script_gnd_flicker.yaml and hit_script_gnd_sawzall.yaml. gnd_pulse (scripts/hit_script.yaml) starts one
# for the GND window — GND Timer, or the Relay Timer when GND Timer is 0 — then
# stops it and releases the output. Both loop until script.stop.
#
# They drive gnd_output directly, so GND Ramp has no effect on them. On Rev 1.x
# gnd_output is a no-op stub and both effects do nothing.
# ==============================================================================

script:
  # ===========================================================================
  # FLUORESCENT LIGHT FLICKER
  # Solid on at 90% with irregular blackouts, partial-brightness dips, and
  # rapid double-flicker bursts. Loops until script.stop is called.
  # ===========================================================================
  - id: gnd_flicker
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            # Solid on
            - output.set_level:
                id: gnd_output
                level: 0.9
            - delay: !lambda 'return 80  + (rand() % 200);'  # 80-280 ms

            # Single brief blackout
            - output.set_level:
                id: gnd_output
                level: 0.0
            - delay: !lambda 'return 15  + (rand() % 35);'   # 15-50 ms

            # Back to full brightness
            - output.set_level:
                id: gnd_output
                level: 0.9
            - delay: !lambda 'return 150 + (rand() % 350);'  # 150-500 ms

            # Partial-brightness dip (dim flicker)
            - output.set_level:
                id: gnd_output
                level: !lambda 'return 0.2f + (rand() % 40) / 100.0f;'  # 20-60 %
            - delay: !lambda 'return 20  + (rand() % 40);'   # 20-60 ms

            # Rapid double-flicker burst
            - output.set_level:
                id: gnd_output
                level: 0.0
            - delay: 12ms
            - output.set_level:
                id: gnd_output
                level: 0.9
            - delay: !lambda 'return 30  + (rand() % 60);'   # 30-90 ms
            - output.set_level:
                id: gnd_output
                level: 0.0
            - delay: !lambda 'return 8   + (rand() % 20);'   # 8-28 ms

            # Long solid-on period before next cycle
            - output.set_level:
                id: gnd_output
                level: 0.9
            - delay: !lambda 'return 200 + (rand() % 500);'  # 200-700 ms

  # ===========================================================================
  # THROTTLE
  # A human revving a reciprocating saw before/during a cut: two test blips ->
  # ramp to full throttle -> sustained cutting with load variation. Loops until
  # script.stop is called.
  # ===========================================================================
  - id: gnd_throttle
    mode: restart
    then:
      - logger.log: "GND throttle: starting"

      # --- Test blip 1: quick squeeze-and-release ---
      - output.set_level:
          id: gnd_output
          level: 0.35
      - delay: 110ms
      - output.set_level:
          id: gnd_output
          level: 0.0
      - delay: 200ms

      # --- Test blip 2: higher rev, longer squeeze ---
      - output.set_level:
          id: gnd_output
          level: 0.6
      - delay: 220ms
      - output.set_level:
          id: gnd_output
          level: 0.0
      - delay: 280ms

      # --- Ramp to full throttle (human squeezing the trigger) ---
      - output.set_level:
          id: gnd_output
          level: 0.2
      - delay: 55ms
      - output.set_level:
          id: gnd_output
          level: 0.45
      - delay: 55ms
      - output.set_level:
          id: gnd_output
          level: 0.68
      - delay: 55ms
      - output.set_level:
          id: gnd_output
          level: 0.85
      - delay: 65ms
      - output.set_level:
          id: gnd_output
          level: 1.0

      # --- Sustained cutting: full power with load-induced dips ---
      - while:
          condition:
            lambda: 'return true;'
          then:
            # Full throttle run
            - output.set_level:
                id: gnd_output
                level: 1.0
            - delay: !lambda 'return 180 + (rand() % 320);'  # 180-500 ms

            # Blade biting into material - moderate dip
            - output.set_level:
                id: gnd_output
                level: !lambda 'return 0.70f + (rand() % 18) / 100.0f;'  # 70-88 %
            - delay: !lambda 'return 60  + (rand() % 120);'  # 60-180 ms

            # Recover to full
            - output.set_level:
                id: gnd_output
                level: 1.0
            - delay: !lambda 'return 100 + (rand() % 200);'  # 100-300 ms

            # Brief hard-load stall (blade catching)
            - output.set_level:
                id: gnd_output
                level: !lambda 'return 0.50f + (rand() % 25) / 100.0f;'  # 50-75 %
            - delay: !lambda 'return 30  + (rand() % 60);'   # 30-90 ms
