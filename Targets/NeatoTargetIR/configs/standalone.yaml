# ==============================================================================
# STANDALONE TARGET CONFIGURATION
# ==============================================================================
# This configuration sets up a target device in standalone mode.
# In standalone mode, the target operates independently without requiring
# a central controller or Home Assistant integration.
# ==============================================================================

# Network mode, read by packages that need a router network
# (integrations/target_fpp.yaml refuses to build in standalone mode).
substitutions:
  network_mode: standalone

# Shared base packages — common to all NEATO-FX devices
packages:
  standalone_base: !include ../../../_shared/standalone_base.yaml

# ==============================================================================
# TARGET HIT SCRIPT - Standalone stub
# ==============================================================================
# No-op stub so run_hit_script can call esphome_hit_script without error.
# In networked mode this is replaced by the real script in target_networked_config.yaml.
script:
  - id: esphome_hit_script
    mode: single
    then: []
  # Same for the Home Assistant hit event target_hit_script fires first.
  - id: esphome_hit_event_script
    mode: parallel
    then: []
  # And the second-hit event (scripts/hit_script_fan_mister.yaml).
  - id: esphome_second_hit_event_script
    mode: parallel
    then: []
