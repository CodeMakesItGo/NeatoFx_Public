# ==============================================================================
# NETWORKED TARGET CONFIGURATION  (No-HA LAN mode)
# ==============================================================================
# Joins a WiFi router but expects NO Home Assistant server and NO internet
# (landlocked gallery LAN). The target is controlled from its web UI and triggers
# the shared Audio-50 directly over the LAN via HTTP POST — no broker/HA required.
#
# Use this when:      router present, no HA server (internet optional/absent)
# Use home_assistant.yaml instead when: a Home Assistant server is on the LAN
# Use standalone.yaml instead when:      device runs its own AP (no router)
# ==============================================================================

# Shared base packages — common to all NEATO-FX devices
packages:
  networked_base: !include ../../../_shared/networked_base.yaml
  network_sensors: !include ../../../_shared/network_sensors.yaml
  # OTA update checks disabled — gallery LANs are landlocked (no internet),
  # so the GitHub manifest fetch can never succeed. Re-enable this include
  # (and the update: block below) if deploying on an internet-connected net.
  #firmware_update: !include ../../../_shared/firmware_update.yaml

# ==============================================================================
# DASHBOARD IMPORT - Made for ESPHome
# ==============================================================================
# dashboard_import requires the api: component, which is removed in No-HA LAN
# mode (see below). Re-enable together with api: for ESPHome dashboard adoption.
#dashboard_import:
#  package_import_url: github://CodeMakesItGo/NeatoFx_Public/Targets/NeatoTargetIR/main.yaml@main
#  import_full_config: true

# ==============================================================================
# SUBSTITUTIONS - Configuration Variables
# ==============================================================================
substitutions:
  # ip_addr default (${ip_base}${id}) is set in _shared/networked_base.yaml.
  # Override here only if this device type needs a different subnet offset.

  # --- Direct Audio-50 trigger (no Home Assistant) ---------------------------
  # DEFAULT address of the shared Audio-50 this target plays through — it only
  # seeds the "Audio Device IP" text box on first boot (see the text: block
  # below); after that the web-UI value is authoritative and survives reboots.
  # The Audio-50 uses DHCP with a router-side reservation, so set this to that
  # reserved IP. Using the IP (not mDNS) keeps outbound ESP32 calls reliable.
  # Override the default per target with -s audio_host <ip>.
  audio_host: "192.168.8.3"
  # NOTE: the MP3 file number played on a hit is now a live web-UI control
  # ("Hit Sound (MP3 #)", default 1) — see the number: block below.

# ==============================================================================
# API & REMOTE ACCESS - Home Assistant (REMOVED — No-HA LAN mode)
# ==============================================================================
# No Home Assistant server on this gallery LAN. The target is controlled from its
# web UI and triggers the Audio-50 via direct HTTP POST, so the HA native API is
# not needed. _shared/networked_base.yaml provides api: (with a 5-min reboot
# timer that would otherwise reboot this device every 5 min with no HA client);
# !remove strips it here so this device runs pure LAN. Logs via serial or the
# web_server console; OTA still works. To use Home Assistant, switch main.yaml to
# configs/home_assistant.yaml instead of this file.
api: !remove

# ==============================================================================
# HTTP CLIENT - direct device-to-device triggering over the router LAN
# ==============================================================================
http_request:
  useragent: neato-target
  timeout: 1s            # short so an unreachable Audio-50 can't stall hits
# Optional: Physical button on GPIO for WiFi reset (uncomment if needed)
# binary_sensor:
#   - platform: gpio
#     pin:
#       number: GPIO0  # Change to your button pin
#       mode: INPUT_PULLUP
#       inverted: true
#     name: "Physical WiFi Reset Button"
#     on_press:
#       then:
#         - button.press: wifi_reset_button

# ==============================================================================
# HIT SOUND - MP3 file number this target plays, settable live from the web UI
# ==============================================================================
# Exposed as a "Hit Sound (MP3 #)" box in the device web UI (and HA). Persists
# across reboots; defaults to 1 on first boot.
#
#   1-255  This target picks the file. In the Input modes it overrides whatever
#          the Audio-50 has assigned to that input, so several targets can share
#          one speaker and one lighting routine, each with its own sound.
#   0      Hand the choice back to the Audio-50: the input runs exactly as it is
#          configured locally — its own "Input N MP3", including Sequential mode
#          if that input has it enabled. Use this when the speaker already has a
#          routine for the input and the target should just fire it.
#
# 0 only makes sense in the "Input 1"/"Input 2" modes. In "MP3 Only" mode there
# is no input routine to fall back on, so 0 means "play nothing" and the hit
# script skips the POST entirely (see esphome_hit_script below).
number:
  - platform: template
    name: "Hit Sound (MP3 #)"
    id: hit_sound_num
    icon: "mdi:music-note"
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 0        # 0 = defer to the Audio-50's own Input N MP3 setting
    max_value: 255
    step: 1
    mode: box

# ==============================================================================
# REMOTE AUDIO ENABLE - master switch for the on-hit Audio-50 trigger
# ==============================================================================
# When ON, a hit POSTs "Hit Sound (MP3 #)" to the Audio-50. Turn OFF from the
# web UI to silence remote audio without changing anything else — the hit
# script's POST is gated on this switch (see esphome_hit_script below).
#
# Default is OFF, matching configs/home_assistant.yaml: a target ships silent
# and only talks to a speaker once someone deliberately enables it.
# RESTORE_DEFAULT_OFF only supplies the first-boot value — once toggled, the
# stored state wins.
switch:
  - platform: template
    name: "Remote Audio Enable"
    id: remote_audio_switch
    icon: "mdi:speaker-wireless"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# ==============================================================================
# REMOTE AUDIO MODE - what a hit asks the Audio-50 to do
# ==============================================================================
# "MP3 Only" (default) POSTs the Net Play endpoint: sound only, no lights.
#
# "Input 1" / "Input 2" POST the Net Trigger endpoint instead, which runs the
# Audio-50's full run_inputN_script — so everything wired to that input fires
# too: its Output selection (Relay 1/2 or PWR 1/2 spotlight), the spotlight
# trigger brightness, the output timer, and the background-loop pause.
#
# In these modes "Hit Sound (MP3 #)" decides who picks the file: 1-255 overrides
# the Audio-50's own setting for that input (per-target sounds, shared lighting),
# 0 defers to it entirely (the input's routine runs untouched).
#
# Requires an Audio-50 running firmware with the Net Trigger endpoint.
select:
  - platform: template
    name: "Remote Audio Mode"
    id: remote_audio_mode
    icon: "mdi:playlist-play"
    optimistic: true
    restore_value: true
    initial_option: "MP3 Only"
    options:
      - "MP3 Only"
      - "Input 1"
      - "Input 2"

# ==============================================================================
# AUDIO DEVICE IP - which speaker this target POSTs to, editable from the web UI
# ==============================================================================
# Editable text box, persisted across reboots. On first boot (and after a Factory
# Reset) it seeds from the compile-time ${audio_host} substitution; from then on
# the stored value wins, so a speaker can be re-pointed in the field without
# recompiling. The hit script reads it at POST time — the new address takes
# effect on the very next hit, no reboot required. Leave it blank to fall back to
# ${audio_host}. Accepts an IP or a hostname; IPs are more reliable on the
# gallery LAN (no mDNS dependency).
text:
  - platform: template
    name: "Audio Device IP"
    id: audio_host_ip
    icon: "mdi:speaker"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${audio_host}"
    min_length: 0
    max_length: 32

# ==============================================================================
# Target Hit Script - ESPHome/Home Assistant integration
# ==============================================================================
script:
  - id: esphome_hit_script
    mode: single  # Prevent overlapping hits
    then:
      # Trigger the shared Audio-50 directly over the router — no Home Assistant.
      # Gated on the Remote Audio Enable switch so the UI can silence remote
      # audio without disabling anything else. "Audio Device IP" picks the
      # speaker and "Remote Audio Mode" picks the endpoint: Net Play for sound
      # only, or Net Trigger to also fire that input's lights/relay/timer on the
      # Audio-50 (see the select above). Either way the file played is this
      # target's "Hit Sound (MP3 #)".
      - if:
          condition:
            and:
              - switch.is_on: remote_audio_switch
              # "MP3 Only" + 0 has nothing to play — Net Play rejects 0 — so skip
              # the request rather than spend a hit waiting on it. 0 IS meaningful
              # in the Input modes: there it means "let the Audio-50 choose".
              - lambda: |-
                  return id(remote_audio_mode).current_option() != "MP3 Only" ||
                         (int) id(hit_sound_num).state >= 1;
          then:
            - http_request.post:
                url: !lambda |-
                  std::string host = id(audio_host_ip).state;
                  if (host.empty()) host = "${audio_host}";   // blank box → compile-time default
                  int mp3 = (int) id(hit_sound_num).state;
                  std::string mode = id(remote_audio_mode).current_option();
                  if (mode == "Input 1") {
                    return "http://" + host + "/number/Net%20Trigger/set?value=" + to_string(1000 + mp3);
                  } else if (mode == "Input 2") {
                    return "http://" + host + "/number/Net%20Trigger/set?value=" + to_string(2000 + mp3);
                  }
                  return "http://" + host + "/number/Net%20Play/set?value=" + to_string(mp3);
                capture_response: false
      # Optional: also notify Home Assistant (only fires if an HA client is
      # connected; harmless no-op otherwise). Uncomment if you run HA too.
      #- homeassistant.event:
      #    event: esphome.target-hit
      #    data:
      #      address: ${id}
      #      player: !lambda 'return id(ir_command);'
      #      points: !lambda 'return std::to_string(id(target_points));'
improv_serial:

# ==============================================================================
# FIRMWARE UPDATES - OTA via HTTP  (DISABLED for landlocked gallery LANs)
# ==============================================================================
# The GitHub manifest fetch below requires internet access, which the gallery
# networks don't have (DNS resolution of raw.githubusercontent.com fails).
# Re-enable this block AND the firmware_update package include above to restore
# self-updating on an internet-connected deployment.
#update:
#  - platform: http_request
#    id: firmware_update_check
#    name: "Firmware Update"
#    source: https://raw.githubusercontent.com/CodeMakesItGo/NeatoFx_Public/main/firmware/target-ir/manifest.json
