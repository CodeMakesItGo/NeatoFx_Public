# ==============================================================================
# HOME ASSISTANT TARGET CONFIGURATION  (HA server on the LAN)
# ==============================================================================
# Joins a WiFi router where a Home Assistant server IS present (internet
# optional). Keeps the native ESPHome api: enabled so HA can control the device
# and receive the esphome.target-hit events fired below.
#
# In this variant every sound is triggered THROUGH Home Assistant (the
# esphome.target-hit event below). The direct target -> Audio-50 "Remote Audio"
# POST, its controls (Remote Audio Enable / Mode, Audio Device IP, Hit Sound)
# and the http_request client exist ONLY in configs/networked.yaml, where there
# is no HA server to do the job. The custom web UI hides its Audio Trigger card
# on this build automatically (pruneMissing in boards/common/custom_ui.js).
#
# Use this when:      router present, Home Assistant server on the LAN
# Use networked.yaml instead when: router present but NO HA server (No-HA LAN)
# Use standalone.yaml instead when: device runs its own AP (no router)
# ==============================================================================

# Shared base packages — common to all NEATO-FX devices
packages:
  networked_base: !include ../../../_shared/networked_base.yaml
  network_sensors: !include ../../../_shared/network_sensors.yaml
  firmware_update: !include ../../../_shared/firmware_update.yaml

# ==============================================================================
# DASHBOARD IMPORT - Made for ESPHome
# ==============================================================================
# Requires the api: component (kept below), so it's enabled in this HA variant.
# Lets the ESPHome dashboard adopt this device from its published config.
dashboard_import:
  package_import_url: github://CodeMakesItGo/NeatoFx_Public/Targets/NeatoTargetIR/main.yaml@main
  import_full_config: true

# ==============================================================================
# SUBSTITUTIONS - Configuration Variables
# ==============================================================================
substitutions:
  # ip_addr default (${ip_base}1) is set in _shared/networked_base.yaml. It is a
  # placeholder, not a per-unit address — override it here before enabling manual_ip.
  # Override here only if this device type needs a different subnet offset.


# ==============================================================================
# API & REMOTE ACCESS - Home Assistant
# ==============================================================================
# _shared/networked_base.yaml provides api: (with a 5-min reboot timer if no HA
# client connects). We KEEP it here — a Home Assistant server is expected on the
# LAN, so the connection stays up and the reboot timer never fires.

# Optional: Physical button on GPIO for WiFi reset (uncomment if needed)
# binary_sensor:
#   - platform: gpio
#     pin:
#       number: GPIO0  # Change to your button pin
#       mode: INPUT_PULLUP
#       inverted: true
#     name: "Physical WiFi Reset Button"
#     on_press:
#       then:
#         - button.press: wifi_reset_button

# ==============================================================================
# NO REMOTE AUDIO CONTROLS IN THIS VARIANT
# ==============================================================================
# "Hit Sound (MP3 #)", "Remote Audio Enable", "Remote Audio Mode" and "Audio
# Device IP" live in configs/networked.yaml only. Here Home Assistant decides
# which sound plays for which target address (see the HA automations).

# ==============================================================================
# Target Hit Script - ESPHome/Home Assistant integration
# ==============================================================================
script:
  # No direct Audio-50 POST in HA mode — stub so the hit scripts, which call
  # esphome_hit_script in every variant, compile unchanged.
  - id: esphome_hit_script
    mode: single
    then: []

  # ==========================================================================
  # HOME ASSISTANT HIT EVENT — fired FIRST, before anything visual
  # ==========================================================================
  # target_hit_script calls this as its very first action, before the LED
  # effect, relay, servo and the Strobe Flash branch's 150 ms hold. The event
  # is a single non-blocking API write, so HA — and the HA-driven sound — gets
  # the hit as early as the firmware can produce it. mode: parallel so a fast
  # follow-up hit can never be dropped here.
  - id: esphome_hit_event_script
    mode: parallel
    then:
      - homeassistant.event:
          event: esphome.target-hit
          data:
            address: !lambda 'return id(device_id);'
            player: !lambda 'return id(ir_command);'
            points: !lambda 'return std::to_string(id(target_points));'
improv_serial:

# ==============================================================================
# FIRMWARE UPDATES - OTA via HTTP
# ==============================================================================
update:
  - platform: http_request
    id: firmware_update_check
    name: "Firmware Update"
    source: https://raw.githubusercontent.com/CodeMakesItGo/NeatoFx_Public/main/firmware/target-ir/manifest.json
