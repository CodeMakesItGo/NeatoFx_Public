# ==============================================================================
# NEATO MOTOR CONTROLLER 12V - MAIN CONFIGURATION FILE
# ==============================================================================
# 12V board (no CAN): Rev 3.3, or the original Rev 3.0 — pick the board below. One binary for every unit of this board:
# what the motor does — DC motor, AC controller, linear actuator, winch or
# pulse — is the "Motor Type" select in the web UI, kept across updates.
# The other board's main is main_24v.yaml; what they share is in base.yaml.
#
# ONE BINARY for every unit — there is no per-unit build.
#
# Usage:
#   esphome run     Controllers/NeatoMotor/main_12v.yaml
#   esphome compile Controllers/NeatoMotor/main_12v.yaml
#   esphome logs    Controllers/NeatoMotor/main_12v.yaml
#   Then set the Motor Type from the device web interface.
#
# Program a unit at a specific IP address (OTA over the network — use this when
# the .local name doesn't resolve, or to pick one unit out of several):
#   esphome run     Controllers/NeatoMotor/main_12v.yaml --device 192.168.1.50
#   esphome upload  Controllers/NeatoMotor/main_12v.yaml --device 192.168.1.50   # already compiled
#   esphome logs    Controllers/NeatoMotor/main_12v.yaml --device 192.168.1.50
# Replace 192.168.1.50 with the unit's IP (shown in its web UI under Debug, or
# in your router's client list). Or open http://<ip>/ in a browser and install
# a compiled firmware.ota.bin from the unit's web page (firmware update / OTA
# section) — no internet needed. A brand-new unit with no firmware is flashed
# over USB instead:
#   esphome run     Controllers/NeatoMotor/main_12v.yaml --device /dev/cu.usbserial-XXXX
#
# ------------------------------------------------------------------------------
# Author:   W. Jason Altice <jason.altice@neatofx.com>
# Company:  NeatoFx — https://neatofx.com
# Support:  jason.altice@neatofx.com
