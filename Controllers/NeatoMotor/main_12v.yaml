# person in line with local electrical codes. You are responsible for the safe
# installation and operation of the equipment this firmware controls.
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS - Device Identification
# ==============================================================================
substitutions:
  # ONE BINARY: ESPHome appends the MAC suffix to the hostname at runtime
  # (motor-12v-a1b2c3). Logical identity is the runtime Source Address (the CAN
  # node address on the 24V board), assigned from the web UI and stored in flash.
  name: motor-12v
  friendly_name: "NeatoFx Motor 12V"
  runtime_id_label: "Source Address"
  runtime_id_max: "238"         # highest assignable Source Address (0-238)
  runtime_name_label: "Motor Name"
  # Firmware update channel: firmware/<update_channel>/manifest.json
  # (configs/home_assistant.yaml), and the file the ESPHome dashboard adopts.
  update_channel: motor-12v
  main_file: main_12v.yaml
  # ESPHome project name — what the ESPHome device builder matches on when it
  # offers to adopt a unit, so each board has its own.
  project_name: "NeatoFX.Motor12V"

# ==============================================================================
# PACKAGES
# ==============================================================================
packages:
  # ---- BOARD — select exactly ONE ----
  board: !include boards/rev3_3_12v.yaml       # Rev 3.3 12V (current): Input 1 / Input 2, all motor types
  #board: !include boards/rev3_0_12v.yaml      # Rev 3.0 12V (original): one TOGGLE button, Linear Actuator only

  # ---- NETWORK — select ONE ----
  #config: !include configs/standalone.yaml         # AP-only: local web UI, no router, no Home Assistant
  #config: !include configs/networked.yaml          # Router, no HA server (No-HA LAN): web UI only
  config: !include configs/home_assistant.yaml      # Router + Home Assistant server: API + events + OTA
  
  # LAST on purpose — see base.yaml: its web_server must override the network
  # package's, or the default ESPHome page replaces the custom UI.
  base: !include base.yaml
