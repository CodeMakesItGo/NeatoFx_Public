# ==============================================================================
# NEATO MOTOR CONTROLLER - MAIN CONFIGURATION FILE
# ==============================================================================
# Single entry point. Select the behavior BOARD and (for the standard board)
# the DRIVE by un-commenting exactly one line in each group below.
#
# Standard board = hold-to-run joystick control on the BTN8962TA H-bridge, with
# a swappable drive so the same firmware runs a 24V DC motor OR a 240VAC
# controller. Winch is a self-contained alternate board.
#
# ONE BINARY for every unit — there is no per-unit build.
#
# Usage:
#   esphome run     Controllers/NeatoMotor/main.yaml
#   esphome compile Controllers/NeatoMotor/main.yaml
#   esphome logs    Controllers/NeatoMotor/main.yaml
#   Then set the CAN Source Address from the device web interface.
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS - Device Identification
# ==============================================================================
substitutions:
  # ONE BINARY: there is no build-time id substitution — ESPHome appends the MAC
  # suffix to the hostname at runtime. Logical identity is the runtime CAN
  # Source Address, assigned from the web UI and stored in flash.
  name: motor
  name_add_mac_suffix: "true"
  # This node's CAN source address, 0x00-0xEF, set from the web UI.
  runtime_id_label: "Source Address"
  runtime_id_max: "239"         # 0xEF
  runtime_name_label: "Motor Name"
  friendly_name: "NeatoFx Motor"

# ==============================================================================
# PACKAGES
# ==============================================================================
packages:
  # Runtime identity — required by can.yaml and the HA event address.
  runtime_id: !include ../../_shared/runtime_id.yaml

  # ---- BOARD / BEHAVIOR — select exactly ONE ----
  board: !include boards/rev3.yaml             # Standard: hold-to-run joystick (pick a DRIVE below)
  #board: !include boards/rev3_winch.yaml      # Winch: hall-encoder, auto-homing, soft limits

  # ---- DRIVE — standard board only; select ONE (leave commented for winch) ----
  drive: !include boards/common/drive_dc.yaml    # 24V DC motor via PWM ramp (default)
  #drive: !include boards/common/drive_ac.yaml   # 240VAC controller: ground one input, open the other

  # ---- NETWORK — select ONE ----
  #config: !include configs/networked.yaml          # Router, no HA server (No-HA LAN): web UI only
  config: !include configs/home_assistant.yaml      # Router + Home Assistant server: API + events + OTA
  #config: !include configs/standalone.yaml         # AP-only: local web UI, no router, no Home Assistant

  # ---- OPTIONAL ADD-ONS ----
  can:   !include boards/common/can.yaml         # CAN inter-controller bus (game-gates the joysticks)
  #sound: !include boards/common/sound.yaml       # DY-SV5W audio module on GPIO21/22

# ==============================================================================
# DEBUGGING
# ==============================================================================
logger:
  level: WARN  # INFO or DEBUG for troubleshooting
