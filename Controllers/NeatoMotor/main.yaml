# ==============================================================================
# NEATO-FX SMART MOTOR CONTROLLER - MAIN CONFIGURATION FILE
# ==============================================================================
# General-purpose bidirectional DC motor controller for linear actuators,
# winches, animatronic props, automated doors, and reversible DC motor loads.
#
# Usage:
#   esphome -s id <id> run Controllers/NeatoMotor/main.yaml
#   esphome -s id <id> logs Controllers/NeatoMotor/main.yaml
#   esphome -s id <id> compile Controllers/NeatoMotor/main.yaml
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS - Device Identification
# ==============================================================================
substitutions:
  id: "1"
  name: "motor-${id}"
  friendly_name: "Neato Motor ${id}"
  project_name: "CodeMakesItGo.Motor"
  project_version: "1.0.0"

# ==============================================================================
# PACKAGES - Hardware & Configuration
# ==============================================================================
packages:
  # Hardware definition — select board revision
  board: !include boards/rev3.yaml

  # Network configuration — select operating mode
  # - For networked (Home Assistant): uncomment the next line
  config: !include configs/networked.yaml
  # - For standalone AP mode: uncomment the next line
  #config: !include configs/standalone.yaml

# ==============================================================================
# DEBUGGING
# ==============================================================================
logger:
  level: WARN  # Change to DEBUG for troubleshooting
