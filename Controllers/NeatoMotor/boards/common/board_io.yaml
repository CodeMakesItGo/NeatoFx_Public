# ==============================================================================
# NEATO MOTOR CONTROLLER - BOARD I/O (shared by the Rev 3.3 12V and Rev 4.3 24V boards)
# ==============================================================================
# Hardware: Wemos D1 Mini ESP32 + 2x BTN8962TA H-bridge
#
# The 12V (Rev 3.3) and 24V (Rev 4.3) boards are the same circuit except for
# CAN: the 24V board
# carries the CAN transceiver on GPIO4/5, so its SW1 moved to GPIO25; the 12V
# board has no CAN and keeps SW1 on GPIO4. Each board file sets only:
#   sw1_pin          SW1 / open limit (also winch encoder channel B)
#   inactive_reason  log text when a joystick press is ignored
#
# Motor Control (BTN8962TA H-bridge):
#   GPIO19 - R_PWM (IN)  - Right H-bridge - Output A / forward / open / reel out
#   GPIO18 - L_PWM (IN)  - Left H-bridge  - Output B / reverse / close / reel in
#   GPIO17 - R_EN  (INH) - Right H-bridge enable
#   GPIO16 - L_EN  (INH) - Left H-bridge enable
#   GPIO34 - R_IS        - Right H-bridge current sense (ADC input-only)
#   GPIO35 - L_IS        - Left H-bridge current sense  (ADC input-only)
#
# Switch inputs (SW1 = ${sw1_pin}, SW2 = GPIO13):
#   DC / AC / Linear  limit switches (hard stops, no auto-reverse)
#   Winch             the two encoder channels instead (boards/common/winch.yaml
#                     reads the same pins, undebounced)
#   Pulse             unused
#
# Joystick Inputs (${input1_pin} = Input 1 / TGL1, ${input2_pin} = Input 2 / TGL2): what a
# press and a release do depends on "Motor Type" (boards/common/drives.yaml).
#
# Outputs:
#   ${status_led_pin} - STATUS LED (heartbeat) in every motor type
# ==============================================================================

# Defaults for the Rev 3.3 12V / Rev 4.3 24V boards; a board file overrides
# any that differ (the Rev 3.0 12V board: one input on GPIO14, LED on GPIO22).
substitutions:
  sw2_pin: GPIO13
  input1_pin: GPIO32
  input2_pin: GPIO27
  status_led_pin: GPIO26

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Driven by the main.yaml substitution (default "false" in
  # _shared/esphome_base.yaml). Hardcoding it here silently overrode the
  # shared default, because a board package's own esphome: block wins over
  # the esphome_base it includes.
  name_add_mac_suffix: ${name_add_mac_suffix}
  # Both come from substitutions so project_version is the single source
  # of truth. Hardcoding version here silently overrides the bump in
  # boards/common/common.yaml, which is exactly what used to happen.
  project:
    name: ${project_name}
    version: ${project_version}
  on_boot:
    - priority: 900   # Earliest — hold H-bridge safe before GPIO init
      then:
        - output.turn_off: motor_r_en
        - output.turn_off: motor_l_en
        - output.turn_off: motor_rpwm
        - output.turn_off: motor_lpwm
        - logger.log: "Boot: H-bridge disabled — motor safe"
    - priority: -100  # After all components initialized
      then:
        - light.turn_on:
            id: status_led
            effect: "Heartbeat"
        - logger.log: "Boot: Manual motor ready — hold Input 1 (forward) or Input 2 (reverse) to run"

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino
    version: recommended

# ==============================================================================
# MOTOR OUTPUTS - BTN8962TA H-Bridge
# ==============================================================================
output:
  # Direction PWM (ledc — R=right H-bridge/12V-A, L=left H-bridge/12V-B)
  - platform: ledc
    id: motor_rpwm
    pin: GPIO19
    frequency: 1000 Hz

  - platform: ledc
    id: motor_lpwm
    pin: GPIO18
    frequency: 1000 Hz

  # Half-bridge enable lines (digital)
  - platform: gpio
    id: motor_r_en
    pin: GPIO17

  - platform: gpio
    id: motor_l_en
    pin: GPIO16

  - platform: ledc
    id: status_led_output
    pin: ${status_led_pin}
    frequency: 1000 Hz

# ==============================================================================
# STATUS LED
# ==============================================================================
light:
  - platform: monochromatic
    name: "Status LED"
    id: status_led
    output: status_led_output
    internal: true
    effects:
      - pulse:
          name: "Heartbeat"
          transition_length: 500ms
          update_interval: 1500ms

# ==============================================================================
# BINARY SENSORS - Limit Switches & Joystick Inputs
# ==============================================================================
binary_sensor:
  # ---------------------------------------------------------------------------
  # SW1 — open / forward end limit switch (blocks forward / direction 1).
  # NO mode: stop fires on_press  (sensor goes ON  = switch closed to GND).
  # NC mode: stop fires on_release (sensor goes OFF = circuit opened = tripped).
  # ---------------------------------------------------------------------------
  - platform: gpio
    pin:
      number: ${sw1_pin}
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true   # also read by the winch encoder (boards/common/winch.yaml)
    name: "SW1"
    id: limit_open
    device_class: opening
    filters:
      - delayed_on: 20ms
    on_press:
      - if:
          condition:
            lambda: 'return id(limits_active)() && !id(limits_nc_mode) && id(motor_running) && id(current_direction);'
          then:
            - logger.log: "Open limit SW1 (NO): stopping motor"
            - script.execute: motor_stop_script
    on_release:
      - if:
          condition:
            lambda: 'return id(limits_active)() && id(limits_nc_mode) && id(motor_running) && id(current_direction);'
          then:
            - logger.log: "Open limit SW1 (NC): stopping motor"
            - script.execute: motor_stop_script

  # ---------------------------------------------------------------------------
  # SW2 — closed / reverse end limit switch (blocks reverse / direction 2).
  # NO mode: stop fires on_press  (sensor goes ON  = switch closed to GND).
  # NC mode: stop fires on_release (sensor goes OFF = circuit opened = tripped).
  # ---------------------------------------------------------------------------
  - platform: gpio
    pin:
      number: ${sw2_pin}
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true   # also read by the winch encoder (boards/common/winch.yaml)
    name: "SW2"
    id: limit_closed
    device_class: opening
    filters:
      - delayed_on: 20ms
    on_press:
      - if:
          condition:
            lambda: 'return id(limits_active)() && !id(limits_nc_mode) && id(motor_running) && !id(current_direction);'
          then:
            - logger.log: "Closed limit SW2 (NO): stopping motor"
            - script.execute: motor_stop_script
    on_release:
      - if:
          condition:
            lambda: 'return id(limits_active)() && id(limits_nc_mode) && id(motor_running) && !id(current_direction);'
          then:
            - logger.log: "Closed limit SW2 (NC): stopping motor"
            - script.execute: motor_stop_script

  # ---------------------------------------------------------------------------
  # Input 1 (${input1_pin}) — what it does depends on Motor Type (drives.yaml).
  # ---------------------------------------------------------------------------
  - platform: gpio
    pin:
      number: ${input1_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: "TGL1"
    id: input_1
    filters:
      - delayed_on: 20ms
    on_press:
      - if:
          condition:
            lambda: 'return id(board_active);'
          then:
            - logger.log: "Input 1: forward"
            - script.execute: motor_forward_start
          else:
            - logger.log: "Input 1 ignored — ${inactive_reason}"
    on_release:
      - logger.log: "Input 1: released"
      - script.execute: input_released

  # ---------------------------------------------------------------------------
  # Input 2 (${input2_pin}) — what it does depends on Motor Type (drives.yaml).
  # ---------------------------------------------------------------------------
  - platform: gpio
    pin:
      number: ${input2_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: "TGL2"
    id: input_2
    filters:
      - delayed_on: 20ms
    on_press:
      - if:
          condition:
            lambda: 'return id(board_active);'
          then:
            - logger.log: "Input 2: reverse"
            - script.execute: motor_reverse_start
          else:
            - logger.log: "Input 2 ignored — ${inactive_reason}"
    on_release:
      - logger.log: "Input 2: released"
      - script.execute: input_released

# ==============================================================================
# SENSORS - Current Monitoring & Stall Detection (Hardware-Specific)
# ==============================================================================
sensor:
  # ---------------------------------------------------------------------------
  # R_IS (GPIO34) — Right H-bridge current sense, fast sampling for stall detection
  # BTN8962TA IS pin: 1A motor ≈ 0.12V with 1kΩ IS resistor; 8A stall ≈ 0.94V
  # ---------------------------------------------------------------------------
  - platform: adc
    pin: GPIO34
    id: motor_current_forward_raw
    internal: true
    update_interval: 50ms
    filters:
      - multiply: 8.5
      - lambda: 'return std::max(0.0f, x);'
    # Over-current trip lives in the can_broadcast script (motor_can.yaml): it
    # checks this current against motor_max_current with a 2-sample (~200 ms)
    # debounce to ride out start-up inrush. No fast single-sample guard here.

  # ---------------------------------------------------------------------------
  # L_IS (GPIO35) — Left H-bridge current sense, fast sampling for stall detection
  # ---------------------------------------------------------------------------
  - platform: adc
    pin: GPIO35
    id: motor_current_reverse_raw
    internal: true
    update_interval: 50ms
    filters:
      - multiply: 8.5
      - lambda: 'return std::max(0.0f, x);'
    # Over-current handled in can_broadcast (see forward sensor above).

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
