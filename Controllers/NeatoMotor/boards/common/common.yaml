# ==============================================================================
# NEATO MOTOR CONTROLLER - COMMON COMPONENTS (MANUAL HOLD-TO-RUN)
# ==============================================================================
# Shared control logic for the Rev 3.0 CAN board. The motor is driven directly
# by two joystick inputs (hold = run, release = stop) and guarded by two hard
# limit switches. No timer, no auto-reverse — every start ramps up from 0 to
# speed, every stop is immediate. CAN telemetry / remote drive lives in
# boards/common/motor_can.yaml and is unaffected by this logic.
#
# Included by: motor_rev3_0.yaml
#
# Hardware IDs consumed from the board file:
#   Outputs : motor_rpwm, motor_lpwm, motor_r_en, motor_l_en
#   Sensors : motor_current_forward_raw, motor_current_reverse_raw
#   Binary  : limit_open, limit_closed, input_1, input_2
#
# Behaviour
# ---------
#   Input 1 held  -> ramp up to speed in direction 1 (forward / open)
#   Input 2 held  -> ramp up to speed in direction 2 (reverse / close)
#   Either released -> motor stops immediately
#
# Limit switch enforcement (hard stops only — they do not auto-reverse):
#   open  limit (SW1) fires -> motor stops; Input 1 / forward blocked
#   closed limit (SW2) fires -> motor stops; Input 2 / reverse blocked
#
# The "Limit Switches NC Mode" UI switch inverts the trip edge for BOTH limit
# switches at once, so the same firmware works with normally-open or
# normally-closed end-stops.
# ==============================================================================

# Shared base packages — common to all NEATO-FX devices
packages:
  esphome_base: !include ../../../../_shared/esphome_base.yaml

# ==============================================================================
# SUBSTITUTIONS - Shared Configuration Variables
# ==============================================================================
substitutions:
  # Project Information
  project_name: "CodeMakesItGo.Motor"
  project_version: "3.0.0"

# ==============================================================================
# GLOBAL VARIABLES
# ==============================================================================
globals:
  # true = forward (direction 1 / open), false = reverse (direction 2 / close)
  # Not persisted — reset on every boot. Kept named "current_direction" because
  # the CAN telemetry in motor_can.yaml reads it for the status frame.
  - id: current_direction
    type: bool
    restore_value: no
    initial_value: 'true'

  # true = motor outputs are energised, false = motor is braked/stopped
  - id: motor_running
    type: bool
    restore_value: no
    initial_value: 'false'

  # Step counter for the ramp-up repeat loop
  - id: motor_ramp_step
    type: int
    restore_value: no
    initial_value: '0'

  # true = limit switches are normally-closed (NC); false = normally-open (NO).
  # With inverted:true on the GPIO: NC idle reads ON, NC tripped reads OFF, so
  # NC mode trips the motor stop on on_release instead of on_press.
  - id: limits_nc_mode
    type: bool
    restore_value: yes
    initial_value: 'false'

  # true = local joystick inputs are armed. Defaults ON so the standard build
  # runs standalone. When the CAN package (can.yaml) is included, it drives this
  # from the 0x100 game-active frame for game-gated (excavator) operation.
  - id: board_active
    type: bool
    restore_value: no
    initial_value: 'true'

# ==============================================================================
# SCRIPTS - Manual Motor Control
# ==============================================================================
# The two DIRECTION scripts (motor_forward_start / motor_reverse_start) live in
# a selectable "drive" package so the same board can run either behaviour:
#   boards/common/motor_drive_dc.yaml — 24V DC motor via PWM ramp on the H-bridge
#   boards/common/motor_drive_ac.yaml — 240VAC controller: ground one input, open
#                                       the other (no PWM)
# The main file picks one (see motor_main.yaml / motor_ac_main.yaml). Both define
# motor_forward_start + motor_reverse_start; motor_stop_script below is shared
# (it opens BOTH outputs, which means "off" for either motor type).
# ---------------------------------------------------------------------------
script:
  # ---------------------------------------------------------------------------
  # motor_stop_script
  # Immediately stops the motor from any state by opening both outputs
  # (both H-bridges disabled, PWM 0). For the DC motor this brakes/coasts; for
  # the AC controller both inputs float = motor off.
  # ---------------------------------------------------------------------------
  - id: motor_stop_script
    mode: single
    then:
      - script.stop: motor_forward_start
      - script.stop: motor_reverse_start
      - lambda: 'id(motor_running) = false;'
      - output.set_level:
          id: motor_rpwm
          level: 0%
      - output.set_level:
          id: motor_lpwm
          level: 0%
      - output.turn_off: motor_r_en
      - output.turn_off: motor_l_en
      - logger.log: "Manual: stopped"

# ==============================================================================
# COVER - Home Assistant / web UI integration (gate device class)
# ==============================================================================
cover:
  - platform: template
    name: "Motor"
    id: wench_motor
    device_class: gate
    optimistic: false

    open_action:
      - script.execute: motor_forward_start

    close_action:
      - script.execute: motor_reverse_start

    stop_action:
      - script.execute: motor_stop_script

    # Position reported from the limit switches
    lambda: |-
      if (id(limit_open).state)   return COVER_OPEN;
      if (id(limit_closed).state) return COVER_CLOSED;
      return {};

# ==============================================================================
# NUMBER CONTROLS
# ==============================================================================
number:
  # Motor speed as a percentage of full power.
  - platform: template
    name: "Motor Speed"
    id: motor_speed_control
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
    icon: "mdi:speedometer"

  # Time (ms) for the ramp-up from 0 to full speed on every motor start.
  # 10 steps are used, so step delay = motor_ramp_ms / 10 (min 10 ms each).
  # Set to 0 to disable ramping (instant full speed).
  - platform: template
    name: "Ramp to Speed"
    id: motor_ramp_ms
    min_value: 0
    max_value: 2000
    step: 50
    initial_value: 300
    restore_value: true
    optimistic: true
    unit_of_measurement: "ms"
    icon: "mdi:sine-wave"

  # Over-current trip point. If a driven output's sensed current exceeds this,
  # the motor is stopped (see over-current check in motor_can.yaml). Settable
  # over CAN config 0x03 from the display setup screen.
  - platform: template
    name: "Max Current"
    id: motor_max_current
    min_value: 4
    max_value: 30
    step: 2
    initial_value: 8
    restore_value: true
    optimistic: true
    unit_of_measurement: "A"
    icon: "mdi:flash"

# ==============================================================================
# SWITCHES
# ==============================================================================
switch:
  # Toggle between normally-open (NO) and normally-closed (NC) limit switches.
  # Inverts the trip edge for BOTH limit switches. Saved to flash — set once to
  # match your hardware and leave it.
  - platform: template
    name: "invert SW 1 & 2 Logic"
    id: limits_nc_mode_switch
    icon: "mdi:electric-switch"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(limits_nc_mode) = true;'
      - logger.log: "Limit switches: NC mode enabled"
    turn_off_action:
      - lambda: 'id(limits_nc_mode) = false;'
      - logger.log: "Limit switches: NO mode enabled"

# ==============================================================================
# BINARY SENSORS - Motor Idle (required by configs/networked.yaml HA event)
# ==============================================================================
binary_sensor:
  - platform: template
    name: "Motor Idle"
    id: motor_idle
    device_class: running
    lambda: 'return !id(motor_running);'

# ==============================================================================
# TEXT SENSORS - Motor Status
# ==============================================================================
text_sensor:
  - platform: template
    name: "Motor Status"
    id: motor_status
    update_interval: 200ms
    icon: "mdi:arrow-decision"
    lambda: |-
      if (!id(motor_running)) return {"Stopped"};
      if (id(current_direction)) return {"Forward"};
      return {"Reverse"};

# ==============================================================================
# SENSORS - Motor Current Display
# ==============================================================================
sensor:
  # IC1 — forward direction, averaged for display
  - platform: template
    name: "Output A current"
    id: motor_current_forward
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 500ms
    lambda: 'return id(motor_current_forward_raw).state;'
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

  # IC2 — reverse direction, averaged for display
  - platform: template
    name: "Output B current"
    id: motor_current_reverse
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 500ms
    lambda: 'return id(motor_current_reverse_raw).state;'
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

