# ==============================================================================
# NEATO MOTOR CONTROLLER - COMMON COMPONENTS (MANUAL HOLD-TO-RUN)
# ==============================================================================
# Shared control logic for the 12V and 24V motor boards. The motor is driven directly
# by two joystick inputs (hold = run, release = stop) and guarded by two hard
# limit switches. No timer, no auto-reverse — every start ramps up from 0 to
# speed, every stop is immediate. CAN telemetry / remote drive lives in
# boards/common/motor_can.yaml and is unaffected by this logic.
#
# Included by: every board file (boards/rev3_3_12v.yaml, rev3_0_12v.yaml, rev4_3_24v.yaml)
#
# Hardware IDs consumed from the board file:
#   Outputs : motor_rpwm, motor_lpwm, motor_r_en, motor_l_en
#   Sensors : motor_current_forward_raw, motor_current_reverse_raw
#   Binary  : limit_open, limit_closed, input_1, input_2
#
# Behaviour
# ---------
#   Input 1 held  -> ramp up to speed in direction 1 (forward / open)
#   Input 2 held  -> ramp up to speed in direction 2 (reverse / close)
#   Either released -> motor stops immediately
#
# Limit switch enforcement (hard stops only — they do not auto-reverse):
#   open  limit (SW1) fires -> motor stops; Input 1 / forward blocked
#   closed limit (SW2) fires -> motor stops; Input 2 / reverse blocked
#
# The "Limit Switches NC Mode" UI switch inverts the trip edge for BOTH limit
# switches at once, so the same firmware works with normally-open or
# normally-closed end-stops.
# ==============================================================================

# Shared base packages — common to all NEATO-FX devices
packages:
  esphome_base: !include ../../../../_shared/esphome_base.yaml

# ==============================================================================
# SUBSTITUTIONS - Shared Configuration Variables
# ==============================================================================
substitutions:
  # Project Information
  project_name: "NeatoFX.Motor"
  project_version: "3.2.0"

# ==============================================================================
# GLOBAL VARIABLES
# ==============================================================================
globals:
  # true = forward (direction 1 / open), false = reverse (direction 2 / close)
  # Not persisted — reset on every boot. Kept named "current_direction" because
  # the CAN telemetry in motor_can.yaml reads it for the status frame.
  - id: current_direction
    type: bool
    restore_value: no
    initial_value: 'true'

  # true = motor outputs are energised, false = motor is braked/stopped
  - id: motor_running
    type: bool
    restore_value: no
    initial_value: 'false'

  # Step counter for the ramp-up repeat loop
  - id: motor_ramp_step
    type: int
    restore_value: no
    initial_value: '0'

  # true = limit switches are normally-closed (NC); false = normally-open (NO).
  # With inverted:true on the GPIO: NC idle reads ON, NC tripped reads OFF, so
  # NC mode trips the motor stop on on_release instead of on_press.
  - id: limits_nc_mode
    type: bool
    restore_value: yes
    initial_value: 'false'

  # true = local joystick inputs are armed. Defaults ON so the standard build
  # runs standalone. When the CAN package (can.yaml) is included, it drives this
  # from the 0x100 game-active frame for game-gated (excavator) operation.
  - id: board_active
    type: bool
    restore_value: no
    initial_value: 'true'

# ==============================================================================
# SCRIPTS - Stop
# ==============================================================================
# The direction scripts live in the drive packages (drive_dc / drive_ac /
# linear_act / winch / pulse), all compiled in; "Motor Type"
# (drives.yaml) routes Input 1 / Input 2 / the cover to one of them.
# This stop is shared by every type: it halts whatever is driving and opens
# BOTH outputs (both H-bridges disabled, PWM 0) — brake/coast for a DC motor or
# winch, both inputs floating for the AC controller, valves closed for Pulse.
#
# It deliberately does NOT stop linear_cycle: the linear actuator's timed cycle
# must survive the TGL1 release and its own limit switches (see linear_act.yaml).
script:
  - id: motor_stop_script
    mode: single
    then:
      - script.stop: dc_forward_start
      - script.stop: dc_reverse_start
      - script.stop: ac_forward_start
      - script.stop: ac_reverse_start
      - script.stop: la_reverse_start
      - script.stop: winch_reel_out_script
      - script.stop: winch_reel_in_script
      - script.stop: pulse_a_script
      - script.stop: pulse_b_script
      - lambda: |-
          id(motor_running)   = false;
          id(valve_a_running) = false;
          id(valve_b_running) = false;
          id(winch_ramping)   = false;
      - output.set_level:
          id: motor_rpwm
          level: 0%
      - output.set_level:
          id: motor_lpwm
          level: 0%
      - output.turn_off: motor_r_en
      - output.turn_off: motor_l_en
      - logger.log: "Motor: stopped"

  # Operator stop: the cover's Stop (web UI Stop button / Home Assistant).
  # motor_stop_script alone leaves linear_cycle running on purpose — limit
  # switches and the TGL1 release call it, and the cycle must survive those —
  # so a person pressing Stop cancels the cycle (or a Toggle move) here first.
  - id: motor_stop_requested
    mode: single
    then:
      - script.stop: linear_cycle
      - script.stop: linear_move
      - lambda: 'id(la_phase) = 0;'
      - script.execute: motor_stop_script

# ==============================================================================
# COVER - Home Assistant / web UI integration (gate device class)
# ==============================================================================
cover:
  - platform: template
    name: "Motor"
    id: wench_motor
    device_class: gate
    optimistic: false

    open_action:
      - script.execute: motor_forward_start

    close_action:
      - script.execute: motor_reverse_start

    # An operator Stop (web UI Stop button, Home Assistant) — unlike a limit
    # switch or an input release, it also cancels a running linear cycle.
    stop_action:
      - script.execute: motor_stop_requested

    # Position: from the limit switches, or the encoder for a winch.
    lambda: |-
      if (id(motor_type).current_option() == "Winch") {
        if (!id(winch_home_set)) return {};
        if (id(winch_count_global) <= 0) return COVER_CLOSED;
        if (id(winch_calibrated) && id(winch_count_global) >= id(winch_max_count)) return COVER_OPEN;
        return {};
      }
      if (id(limit_open).state)   return COVER_OPEN;
      if (id(limit_closed).state) return COVER_CLOSED;
      return {};

# ==============================================================================
# NUMBER CONTROLS
# ==============================================================================
number:
  # Motor speed as a percentage of full power.
  - platform: template
    name: "Motor Speed"
    id: motor_speed_control
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
    icon: "mdi:speedometer"

  # Time (ms) for the ramp-up from 0 to full speed on every motor start.
  # 10 steps are used, so step delay = motor_ramp_ms / 10 (min 10 ms each).
  # Set to 0 to disable ramping (instant full speed).
  - platform: template
    name: "Ramp to Speed"
    id: motor_ramp_ms
    min_value: 0
    max_value: 2000
    step: 50
    initial_value: 300
    restore_value: true
    optimistic: true
    unit_of_measurement: "ms"
    icon: "mdi:sine-wave"

  # Over-current trip point. If a driven output's sensed current exceeds this,
  # the motor is stopped (see over-current check in motor_can.yaml). Settable
  # over CAN config 0x03 from the display setup screen.
  - platform: template
    name: "Max Current"
    id: motor_max_current
    min_value: 4
    max_value: 30
    step: 2
    initial_value: 8
    restore_value: true
    optimistic: true
    unit_of_measurement: "A"
    icon: "mdi:flash"

# ==============================================================================
# SWITCHES
# ==============================================================================
switch:
  # Toggle between normally-open (NO) and normally-closed (NC) limit switches.
  # Inverts the trip edge for BOTH limit switches. Saved to flash — set once to
  # match your hardware and leave it.
  - platform: template
    name: "invert SW 1 & 2 Logic"
    id: limits_nc_mode_switch
    icon: "mdi:electric-switch"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(limits_nc_mode) = true;'
      - logger.log: "Limit switches: NC mode enabled"
    turn_off_action:
      - lambda: 'id(limits_nc_mode) = false;'
      - logger.log: "Limit switches: NO mode enabled"

# ==============================================================================
# BINARY SENSORS - Motor Idle (required by configs/networked.yaml HA event)
# ==============================================================================
binary_sensor:
  - platform: template
    name: "Motor Idle"
    id: motor_idle
    device_class: running
    lambda: 'return !id(motor_running);'

# ==============================================================================
# TEXT SENSORS - Motor Status
# ==============================================================================
text_sensor:
  - platform: template
    name: "Motor Status"
    id: motor_status
    update_interval: 200ms
    icon: "mdi:arrow-decision"
    lambda: |-
      auto t = id(motor_type).current_option();
      if (t == "Pulse") {
        if (id(valve_a_running) && id(valve_b_running)) return {"Pulsing A + B"};
        if (id(valve_a_running)) return {"Pulsing A"};
        if (id(valve_b_running)) return {"Pulsing B"};
        return {"Ready"};
      }
      if (t == "Winch") {
        if (!id(motor_running)) return {id(winch_home_set) ? "Stopped" : "Stopped (home not set)"};
        return {id(current_direction) ? "Reeling Out" : "Reeling In"};
      }
      if (t == "Linear Actuator" && id(la_phase) == 5) return {"Cooldown"};
      if (!id(motor_running)) return {"Stopped"};
      if (id(current_direction)) return {"Forward"};
      return {"Reverse"};

# ==============================================================================
# SENSORS - Motor Current Display
# ==============================================================================
sensor:
  # IC1 — forward direction, averaged for display
  - platform: template
    name: "Output A current"
    id: motor_current_forward
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 500ms
    lambda: 'return id(motor_current_forward_raw).state;'
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

  # IC2 — reverse direction, averaged for display
  - platform: template
    name: "Output B current"
    id: motor_current_reverse
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: 500ms
    lambda: 'return id(motor_current_reverse_raw).state;'
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

