# ==============================================================================
# NEATO MOTOR - DRIVE PACKAGE: LINEAR ACTUATOR (TIMED EXTEND / RETRACT CYCLE)
# ==============================================================================
# One-shot cycle for a linear actuator on the BTN8962TA H-bridge. A single
# trigger on TGL1 runs the whole move — the operator does NOT hold the input:
#
#   TGL1 triggered -> EXTEND  (ramp up forward) until SW1 or "Extend Time"
#                  -> COOLDOWN (outputs off) for "Cooldown Timer"
#                  -> RETRACT (ramp up reverse) until SW2 or "Retract Time"
#                  -> motor output off
#
# LIMIT SWITCHES OVERRIDE THE TIMERS. Each phase ends at its own switch or its
# time, whichever comes first: SW1 (open end) only ends opening, SW2 (closed
# end) only ends closing — neither ever blocks the other direction. A switch
# that is not installed never triggers, so its timer ends the phase; with the
# switches installed the timers are only a backstop.
#
# WHY THIS DRIVE OWNS THE OUTPUTS ON A TICK
# -----------------------------------------
# The board I/O (board_io.yaml) fires motor_stop_script on TGL1
# RELEASE and on either limit switch — that is correct hold-to-run behavior for
# drive_dc/drive_ac, but here the cycle must survive the release and must
# survive a limit hit. So linear_cycle re-asserts the outputs every 20 ms from a
# single "what should the actuator be doing at t?" function. Anything that pokes
# the H-bridge from outside the cycle is overridden on the next tick, and the
# cycle only ever relinquishes the outputs when it ends (or is cancelled).
#
# LINEAR MODE (select, saved) — "Cycle" is the extend -> cooldown -> retract
# above. "Toggle" is for a door: each Input 1 trigger makes ONE move,
# alternating — extend, then on the next trigger retract, then extend ... Each
# move runs with the same ramp until its own limit switch or its Extend /
# Retract Time (no cooldown), then turns off and STAYS until the next Input 1. Input 2
# (or Stop / Cancel) stops a move; the next Input 1 still goes the other way.
# Input 1 during a move reverses it. The next direction is saved, so a restart
# remembers whether the door is open or closed — and when a limit switch is
# already active it decides instead: SW2 (closed end) active -> extend, SW1
# (open end) active -> retract, so a closed sensor never blocks the open.
#
# To CANCEL a running cycle: the "Cancel Cycle" button, TGL2, or the cover's
# Stop (web UI Stop button / Home Assistant), which runs motor_stop_requested
# (common.yaml). motor_stop_script on its own — what the limit switches and the
# TGL1 release call — does NOT cancel it: stopping on a limit switch is exactly
# what this drive must ignore.
#
# Selected at runtime by "Motor Type" (boards/common/drives.yaml), which
# routes Input 1 / Input 2 / the cover to these scripts. Every drive is
# compiled into every build.
#
# Consumed IDs (from board + common):
#   Outputs : motor_rpwm, motor_lpwm, motor_r_en, motor_l_en
#   Numbers : motor_speed_control, motor_ramp_ms
#   Globals : current_direction, motor_running, motor_ramp_step, limits_nc_mode
#   Binary  : limit_open (SW1), limit_closed (SW2)
# ==============================================================================

# ==============================================================================
# GLOBAL VARIABLES
# ==============================================================================
globals:
  # millis() at the moment the cycle started — the whole cycle is derived from
  # elapsed time against this, so a missed tick never accumulates drift.
  - id: la_cycle_start
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Phase durations snapshotted at cycle start, so editing the numbers in the
  # web UI mid-move cannot stretch or truncate a cycle already in flight.
  - id: la_extend_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: la_retract_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: la_cooldown_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Cycle stage: 0 extend, 1 cooldown, 2 retract, 3 done. la_cycle_start is the
  # start of the CURRENT stage.
  - id: la_stage
    type: int
    restore_value: no
    initial_value: '0'

  # Latched end-stops. Set when the phase's limit trips, cleared at phase start.
  - id: la_fwd_blocked
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: la_rev_blocked
    type: bool
    restore_value: no
    initial_value: 'false'

  # Toggle mode: direction of the NEXT Input 1 move (true = extend). Saved, so
  # the door's open/closed state survives a restart.
  - id: la_toggle_extend_next
    type: bool
    restore_value: yes
    initial_value: 'true'

  # Toggle mode: the move in progress (true = extend) and its length.
  - id: la_move_extend
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: la_move_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # 0 = idle, 1 = extending, 2 = reached open limit, 3 = retracting,
  # 4 = reached closed limit, 5 = cooldown. Drives the "Cycle Phase" text sensor and the
  # transition logging.
  - id: la_phase
    type: int
    restore_value: no
    initial_value: '0'

# ==============================================================================
# NUMBER CONTROLS - Cycle Timing
# ==============================================================================
# Ramp and speed are NOT duplicated here: the cycle uses "Motor Speed" and
# "Ramp to Speed" from common.yaml, same as the other drives.
number:
  # Forward / extend run time. Counted from the start of the ramp, so very short
  # times with a long ramp simply never reach full speed.
  - platform: template
    name: "Extend Time"
    id: la_extend_time
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 10
    restore_value: true
    optimistic: true
    unit_of_measurement: "s"
    icon: "mdi:arrow-expand-right"

  # Reverse / retract run time, counted from the moment the extend phase ends.
  - platform: template
    name: "Retract Time"
    id: la_retract_time
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 10
    restore_value: true
    optimistic: true
    unit_of_measurement: "s"
    icon: "mdi:arrow-collapse-left"

  # Cycle mode only: pause with the outputs off between the end of the extend
  # (SW1 or Extend Time) and the start of the retract. Named like the Target's
  # cooldown, and in ms like it. 0 = retract straight away (the default).
  - platform: template
    name: "Cooldown Timer"
    id: la_cooldown_time
    min_value: 0
    max_value: 60000
    step: 100
    initial_value: 0
    restore_value: true
    optimistic: true
    unit_of_measurement: "ms"
    icon: "mdi:timer-pause-outline"

# ==============================================================================
# LINEAR MODE
# ==============================================================================
select:
  - platform: template
    name: "Linear Mode"
    id: la_mode
    icon: "mdi:swap-horizontal"
    options:
      - "Cycle"     # Input 1: timed extend, then retract (the original behavior)
      - "Toggle"    # Input 1: one move, alternating extend / retract (doors)
    initial_option: "Cycle"
    optimistic: true
    restore_value: true
    on_value:
      - script.stop: linear_cycle
      - script.stop: linear_move
      - lambda: 'id(la_phase) = 0;'
      - script.execute: motor_stop_script

# ==============================================================================
# BUTTONS
# ==============================================================================
button:
  # Fire the cycle from the web UI / Home Assistant, same as triggering TGL1.
  - platform: template
    name: "Run Cycle"
    id: la_run_button
    icon: "mdi:play-circle"
    on_press:
      - script.execute: la_forward_start

  # The only clean way out of a running cycle besides TGL2 — see the header.
  - platform: template
    name: "Cancel Cycle"
    id: la_cancel_button
    icon: "mdi:stop-circle"
    on_press:
      - script.execute: linear_cycle_cancel

# ==============================================================================
# TEXT SENSORS - Cycle Phase
# ==============================================================================
# common.yaml's "Motor Status" reports the commanded direction; this reports
# where the cycle is, including "blocked at a limit but still timing".
text_sensor:
  - platform: template
    name: "Cycle Phase"
    id: la_phase_text
    update_interval: 200ms
    icon: "mdi:timeline-clock"
    lambda: |-
      switch (id(la_phase)) {
        case 1:  return {"Extending"};
        case 2:  return {"Reached open limit"};
        case 3:  return {"Retracting"};
        case 4:  return {"Reached closed limit"};
        case 5:  return {"Cooldown"};
        default: return {"Idle"};
      }

# ==============================================================================
# SCRIPTS
# ==============================================================================
script:
  # ---------------------------------------------------------------------------
  # la_forward_start  (TGL1 press / cover open / "Run Cycle")
  # Thin launcher only. It must finish instantly, because motor_stop_script
  # does script.stop on it — and motor_stop_script is what TGL1's RELEASE calls
  # a few hundred milliseconds later. The cycle itself lives in linear_cycle,
  # which motor_stop_script does not know about and therefore cannot kill.
  # ---------------------------------------------------------------------------
  - id: la_forward_start
    mode: restart
    then:
      - logger.log:
          level: INFO
          format: "Linear: cycle triggered (extend %.1fs, retract %.1fs, ramp %.0f ms, speed %.0f%%)"
          args:
            - 'id(la_extend_time).state'
            - 'id(la_retract_time).state'
            - 'id(motor_ramp_ms).state'
            - 'id(motor_speed_control).state'
      - if:
          condition:
            lambda: 'return id(la_mode).current_option() == "Toggle";'
          then:
            # Pick the direction. A limit switch that is already active says
            # where the door is — SW2 (closed end) -> extend, SW1 (open end) ->
            # retract — so a closed sensor makes the next press open instead of
            # blocking it. With neither active (mid-travel, or no switches) use
            # the saved toggle. Either way the next press goes the other way.
            - lambda: |-
                bool at_open   = id(limits_nc_mode) ? !id(limit_open).state   : id(limit_open).state;
                bool at_closed = id(limits_nc_mode) ? !id(limit_closed).state : id(limit_closed).state;
                if (at_closed && !at_open)      id(la_move_extend) = true;
                else if (at_open && !at_closed) id(la_move_extend) = false;
                else                            id(la_move_extend) = id(la_toggle_extend_next);
                id(la_toggle_extend_next) = !id(la_move_extend);
                ESP_LOGI("linear_act", "Linear toggle: %s%s", id(la_move_extend) ? "extend" : "retract",
                         (at_closed != at_open) ? " (from the limit switch)" : "");
            - script.stop: linear_cycle
            - script.execute: linear_move
          else:
            - script.stop: linear_move
            - script.execute: linear_cycle

  # ---------------------------------------------------------------------------
  # linear_move  (Toggle mode)
  # One timed move in direction la_move_extend: ramp, latched limit switch for
  # that direction, re-asserted every 20 ms exactly like a linear_cycle phase,
  # then off — and nothing else until the next Input 1.
  # ---------------------------------------------------------------------------
  - id: linear_move
    mode: restart
    then:
      - lambda: |-
          id(la_cycle_start)    = millis();
          id(la_move_ms)        = (uint32_t)((id(la_move_extend) ? id(la_extend_time).state
                                                                 : id(la_retract_time).state) * 1000.0f);
          id(la_fwd_blocked)    = false;
          id(la_rev_blocked)    = false;
          id(la_phase)          = 0;
          id(current_direction) = id(la_move_extend);
          id(motor_running)     = true;
      - output.turn_off: motor_r_en
      - output.turn_off: motor_l_en
      - output.set_level:
          id: motor_rpwm
          level: 0%
      - output.set_level:
          id: motor_lpwm
          level: 0%
      - while:
          condition:
            lambda: 'return (millis() - id(la_cycle_start)) < id(la_move_ms);'
          then:
            - lambda: |-
                id(motor_running) = true;   // owns the motor while moving (see linear_cycle)
                uint32_t elapsed = millis() - id(la_cycle_start);
                bool forward = id(la_move_extend);

                bool raw = forward ? id(limit_open).state : id(limit_closed).state;
                bool hit = id(limits_nc_mode) ? !raw : raw;
                if (hit) {
                  if (forward) id(la_fwd_blocked) = true;
                  else         id(la_rev_blocked) = true;
                }
                bool blocked = forward ? id(la_fwd_blocked) : id(la_rev_blocked);

                int phase = forward ? (blocked ? 2 : 1) : (blocked ? 4 : 3);
                if (phase != id(la_phase)) {
                  switch (phase) {
                    case 1: ESP_LOGI("linear_act", "Linear: extending"); break;
                    case 2: ESP_LOGI("linear_act", "Linear: SW1 (open end) reached — move complete"); break;
                    case 3: ESP_LOGI("linear_act", "Linear: retracting"); break;
                    case 4: ESP_LOGI("linear_act", "Linear: SW2 (closed end) reached — move complete"); break;
                  }
                  id(la_phase) = phase;
                }
                id(current_direction) = forward;

                if (blocked) {
                  // This direction's limit switch overrides the timer: the move
                  // is over. Outputs off now; ending the timer exits the loop.
                  id(motor_rpwm)->set_level(0.0f);
                  id(motor_lpwm)->set_level(0.0f);
                  id(motor_r_en)->turn_off();
                  id(motor_l_en)->turn_off();
                  id(la_move_ms) = 0;
                  return;
                }

                float speed = id(motor_speed_control).state / 100.0f;
                uint32_t ramp = (uint32_t) id(motor_ramp_ms).state;
                float level = (ramp > 0 && elapsed < ramp) ? speed * (float) elapsed / (float) ramp : speed;
                if (forward) {
                  id(motor_lpwm)->set_level(0.0f);
                  id(motor_rpwm)->set_level(level);
                } else {
                  id(motor_rpwm)->set_level(0.0f);
                  id(motor_lpwm)->set_level(level);
                }
                id(motor_r_en)->turn_on();
                id(motor_l_en)->turn_on();
            - delay: 20ms
      - lambda: 'id(la_phase) = 0;'
      - logger.log:
          level: INFO
          format: "Linear: move complete — motor off until the next Input 1"
      - script.execute: motor_stop_script

  # ---------------------------------------------------------------------------
  # linear_cycle  (Cycle mode)
  # EXTEND -> COOLDOWN -> RETRACT -> off. Each moving stage ends at its own limit
  # switch or its time, whichever is first (switches override timers).
  # mode:restart — re-triggering TGL1 mid-cycle starts over from the extend.
  #
  # Every 20 ms it re-applies what the actuator should be doing, which is what
  # makes the cycle immune to the board's motor_stop_script (see header).
  # ---------------------------------------------------------------------------
  - id: linear_cycle
    mode: restart
    then:
      # --- Prologue: snapshot the timing, park the bridge safe -----------------
      - lambda: |-
          id(la_extend_ms)      = (uint32_t)(id(la_extend_time).state   * 1000.0f);
          id(la_cooldown_ms)    = (uint32_t) id(la_cooldown_time).state;   // already ms
          id(la_retract_ms)     = (uint32_t)(id(la_retract_time).state  * 1000.0f);
          id(la_stage)          = 0;
          id(la_cycle_start)    = millis();
          id(la_phase)          = 0;
          id(motor_ramp_step)   = 0;
          id(current_direction) = true;
          id(motor_running)     = true;
      - output.turn_off: motor_r_en
      - output.turn_off: motor_l_en
      - output.set_level:
          id: motor_rpwm
          level: 0%
      - output.set_level:
          id: motor_lpwm
          level: 0%

      # --- The cycle ----------------------------------------------------------
      - while:
          condition:
            lambda: 'return id(la_stage) < 3;'
          then:
            - lambda: |-
                // The cycle owns the motor while it runs: a TGL1 release or a
                // limit hit calls motor_stop_script, which clears motor_running.
                id(motor_running) = true;
                uint32_t now = millis();
                uint32_t el  = now - id(la_cycle_start);

                auto all_off = [&]() {
                  id(motor_rpwm)->set_level(0.0f);
                  id(motor_lpwm)->set_level(0.0f);
                  id(motor_r_en)->turn_off();
                  id(motor_l_en)->turn_off();
                };
                auto next_stage = [&](int stage, int phase, const char *why) {
                  all_off();
                  id(la_stage)       = stage;
                  id(la_cycle_start) = now;
                  id(la_phase)       = phase;
                  if (why) ESP_LOGI("linear_act", "Linear: %s", why);
                };
                auto hit = [&](bool raw) { return id(limits_nc_mode) ? !raw : raw; };

                // Ramp 0 -> speed over motor_ramp_ms from the stage start.
                float speed = id(motor_speed_control).state / 100.0f;
                uint32_t ramp = (uint32_t) id(motor_ramp_ms).state;
                float level = (ramp > 0 && el < ramp) ? speed * (float) el / (float) ramp : speed;

                switch (id(la_stage)) {
                  case 0:  // EXTEND — until SW1 or Extend Time
                    if (hit(id(limit_open).state)) { next_stage(1, 5, "SW1 (open end) reached — cooldown"); break; }
                    if (el >= id(la_extend_ms))    { next_stage(1, 5, "extend time done — cooldown"); break; }
                    if (id(la_phase) != 1) { id(la_phase) = 1; ESP_LOGI("linear_act", "Linear: extending"); }
                    id(current_direction) = true;
                    id(motor_lpwm)->set_level(0.0f);
                    id(motor_rpwm)->set_level(level);
                    id(motor_r_en)->turn_on();
                    id(motor_l_en)->turn_on();
                    break;

                  case 1:  // COOLDOWN — outputs off
                    all_off();
                    if (el >= id(la_cooldown_ms)) next_stage(2, 3, "retracting");
                    break;

                  case 2:  // RETRACT — until SW2 or Retract Time
                    if (hit(id(limit_closed).state)) { next_stage(3, 0, "SW2 (closed end) reached — cycle complete"); break; }
                    if (el >= id(la_retract_ms))     { next_stage(3, 0, "retract time done — cycle complete"); break; }
                    id(current_direction) = false;
                    id(motor_rpwm)->set_level(0.0f);
                    id(motor_lpwm)->set_level(level);
                    id(motor_r_en)->turn_on();
                    id(motor_l_en)->turn_on();
                    break;
                }
            - delay: 20ms

      # --- Done: motor output off ---------------------------------------------
      - lambda: 'id(la_phase) = 0;'
      - script.execute: motor_stop_script

  # ---------------------------------------------------------------------------
  # linear_cycle_cancel  ("Cancel Cycle" button, and TGL2 below)
  # Stops the cycle FIRST, then the motor — the other order would let the next
  # tick re-energise the bridge 20 ms later.
  # ---------------------------------------------------------------------------
  - id: linear_cycle_cancel
    mode: single
    then:
      - script.stop: linear_cycle
      - script.stop: linear_move
      - lambda: 'id(la_phase) = 0;'
      - script.execute: motor_stop_script

  # ---------------------------------------------------------------------------
  # la_reverse_start  (TGL2 held / cover close)
  # Manual retract jog, hold-to-run exactly like drive_dc — and the operator's
  # escape hatch from a running cycle. Blocked if the closed limit (SW2) is
  # active. Release of TGL2 stops it via the board's motor_stop_script.
  # ---------------------------------------------------------------------------
  - id: la_reverse_start
    mode: restart
    then:
      # Toggle mode: Input 2 just stops the move (no jog — the door's next
      # Input 1 still goes the other way).
      - if:
          condition:
            lambda: 'return id(la_mode).current_option() == "Toggle";'
          then:
            - script.execute: linear_cycle_cancel
          else:
            - script.stop: linear_cycle
            - lambda: 'id(la_phase) = 0;'
            # Only SW2 (closed end) blocks a retract; SW1 never does.
            - if:
                condition:
                  lambda: 'return id(limits_nc_mode) ? !id(limit_closed).state : id(limit_closed).state;'
                then:
                  - logger.log: "Manual: retract blocked — closed limit (SW2) active"
                else:
                  - logger.log:
                      level: INFO
                      format: "Manual: ramping retract (ramp=%.0f ms, speed=%.0f%%)"
                      args:
                        - 'id(motor_ramp_ms).state'
                        - 'id(motor_speed_control).state'
                  - lambda: |-
                      id(current_direction) = false;
                      id(motor_running)     = true;
                      id(motor_ramp_step)   = 0;
                  - output.turn_on: motor_r_en
                  - output.turn_on: motor_l_en
                  - output.set_level:
                      id: motor_rpwm
                      level: 0%
                  - repeat:
                      count: 10
                      then:
                        - lambda: |-
                            float speed = id(motor_speed_control).state / 100.0f;
                            float level = speed * (float)(id(motor_ramp_step) + 1) / 10.0f;
                            id(motor_lpwm)->set_level(level);
                            id(motor_ramp_step)++;
                        - delay: !lambda 'return (uint32_t)std::max(10.0f, id(motor_ramp_ms).state / 10.0f);'
