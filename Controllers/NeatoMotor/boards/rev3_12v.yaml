# ==============================================================================
# NEATO MOTOR CONTROLLER - HARDWARE DEFINITION (REV 3.0, 12V, MANUAL HOLD-TO-RUN)
# ==============================================================================
# Hardware: Wemos D1 Mini ESP32 + 2× BTN8962TA H-bridge
# Schematic: motor_ctrl_rev3.2
#
# Control logic is hold-to-run manual joystick control (see motor_common.yaml).
# No CAN bus on this variant — GPIO4 is reclaimed for the SW1 limit switch.
#
# Motor Control (BTN8962TA H-bridge):
#   GPIO19 - R_PWM (IN)  - Right H-bridge (12V-A) - direction 1 / forward / open
#   GPIO18 - L_PWM (IN)  - Left H-bridge  (12V-B) - direction 2 / reverse / close
#   GPIO17 - R_EN  (INH) - Right H-bridge enable
#   GPIO16 - L_EN  (INH) - Left H-bridge enable
#   GPIO34 - R_IS        - Right H-bridge current sense (ADC input-only)
#   GPIO35 - L_IS        - Left H-bridge current sense  (ADC input-only)
#
# Limit Switches (hard stops — no auto-reverse):
#   GPIO4  - SW1 / OPEN_SWITCH  (forward end — blocks Input 1 / forward)
#   GPIO13 - SW2 / CLOSED_SWITCH (reverse end — blocks Input 2 / reverse)
#
# Joystick Inputs (hold = run, release = stop):
#   GPIO32 - Input 1 -> motor forward / open  (blocked by SW1)
#   GPIO27 - Input 2 -> motor reverse / close (blocked by SW2)
#   Neither active -> motor stops
#
# Outputs:
#   GPIO26 - STATUS LED (external via connector)
#
# Behavior is configured via web UI:
#   Motor Speed          - PWM duty (%) the motor ramps up to
#   Start Ramp           - ms to ramp 0 -> speed on every start (0 = instant)
#   Limit Switches NC Mode - invert both end-stops for normally-closed wiring
# ==============================================================================

# ==============================================================================
# EXTERNAL PACKAGES
# ==============================================================================
packages:
  common: !include common/common.yaml

# ==============================================================================
# CORE CONFIGURATION
# ==============================================================================
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: "CodeMakesItGo.Motor"
    version: "3.0.0"
  on_boot:
    - priority: 900   # Earliest — hold H-bridge safe before GPIO init
      then:
        - output.turn_off: motor_r_en
        - output.turn_off: motor_l_en
        - output.turn_off: motor_rpwm
        - output.turn_off: motor_lpwm
        - logger.log: "Boot: H-bridge disabled — motor safe"
    - priority: -100  # After all components initialized
      then:
        - light.turn_on:
            id: status_led
            effect: "Heartbeat"
        - logger.log: "Boot: Manual motor ready — hold Input 1 (forward) or Input 2 (reverse) to run"

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino
    version: recommended

# ==============================================================================
# MOTOR OUTPUTS - BTN8962TA H-Bridge
# ==============================================================================
output:
  # Direction PWM (ledc — R=right H-bridge/12V-A, L=left H-bridge/12V-B)
  - platform: ledc
    id: motor_rpwm
    pin: GPIO19
    frequency: 1000 Hz

  - platform: ledc
    id: motor_lpwm
    pin: GPIO18
    frequency: 1000 Hz

  # Half-bridge enable lines (digital)
  - platform: gpio
    id: motor_r_en
    pin: GPIO17

  - platform: gpio
    id: motor_l_en
    pin: GPIO16

  - platform: ledc
    id: status_led_output
    pin: GPIO26
    frequency: 1000 Hz

# ==============================================================================
# STATUS LED
# ==============================================================================
light:
  - platform: monochromatic
    name: "Status LED"
    id: status_led
    output: status_led_output
    internal: true
    effects:
      - pulse:
          name: "Heartbeat"
          transition_length: 500ms
          update_interval: 1500ms

# ==============================================================================
# BINARY SENSORS - Limit Switches & Joystick Inputs
# ==============================================================================
binary_sensor:
  # ---------------------------------------------------------------------------
  # SW1 — open / forward end limit switch (blocks forward / direction 1).
  # NO mode: stop fires on_press  (sensor goes ON  = switch closed to GND).
  # NC mode: stop fires on_release (sensor goes OFF = circuit opened = tripped).
  # ---------------------------------------------------------------------------
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    name: "SW1"
    id: limit_open
    device_class: opening
    filters:
      - delayed_on: 20ms
    on_press:
      - if:
          condition:
            lambda: 'return !id(limits_nc_mode) && id(motor_running) && id(current_direction);'
          then:
            - logger.log: "Open limit SW1 (NO): stopping motor"
            - script.execute: motor_stop_script
    on_release:
      - if:
          condition:
            lambda: 'return id(limits_nc_mode) && id(motor_running) && id(current_direction);'
          then:
            - logger.log: "Open limit SW1 (NC): stopping motor"
            - script.execute: motor_stop_script

  # ---------------------------------------------------------------------------
  # SW2 — closed / reverse end limit switch (blocks reverse / direction 2).
  # NO mode: stop fires on_press  (sensor goes ON  = switch closed to GND).
  # NC mode: stop fires on_release (sensor goes OFF = circuit opened = tripped).
  # ---------------------------------------------------------------------------
  - platform: gpio
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: true
    name: "SW2"
    id: limit_closed
    device_class: opening
    filters:
      - delayed_on: 20ms
    on_press:
      - if:
          condition:
            lambda: 'return !id(limits_nc_mode) && id(motor_running) && !id(current_direction);'
          then:
            - logger.log: "Closed limit SW2 (NO): stopping motor"
            - script.execute: motor_stop_script
    on_release:
      - if:
          condition:
            lambda: 'return id(limits_nc_mode) && id(motor_running) && !id(current_direction);'
          then:
            - logger.log: "Closed limit SW2 (NC): stopping motor"
            - script.execute: motor_stop_script

  # ---------------------------------------------------------------------------
  # Input 1 (GPIO32) — hold to run forward / direction 1. Blocked by SW1.
  # ---------------------------------------------------------------------------
  - platform: gpio
    pin:
      number: GPIO32
      mode: INPUT_PULLUP
      inverted: true
    name: "TGL1"
    id: input_1
    filters:
      - delayed_on: 20ms
    on_press:
      - if:
          condition:
            lambda: 'return id(board_active);'
          then:
            - logger.log: "Input 1: forward"
            - script.execute: motor_forward_start
          else:
            - logger.log: "Input 1 ignored — board inactive"
    on_release:
      - logger.log: "Input 1: released — stopping"
      - script.execute: motor_stop_script

  # ---------------------------------------------------------------------------
  # Input 2 (GPIO27) — hold to run reverse / direction 2. Blocked by SW2.
  # ---------------------------------------------------------------------------
  - platform: gpio
    pin:
      number: GPIO27
      mode: INPUT_PULLUP
      inverted: true
    name: "TGL2"
    id: input_2
    filters:
      - delayed_on: 20ms
    on_press:
      - if:
          condition:
            lambda: 'return id(board_active);'
          then:
            - logger.log: "Input 2: reverse"
            - script.execute: motor_reverse_start
          else:
            - logger.log: "Input 2 ignored — board inactive"
    on_release:
      - logger.log: "Input 2: released — stopping"
      - script.execute: motor_stop_script

# ==============================================================================
# SENSORS - Current Monitoring & Stall Detection (Hardware-Specific)
# ==============================================================================
sensor:
  # ---------------------------------------------------------------------------
  # R_IS (GPIO34) — Right H-bridge current sense, fast sampling for stall detection
  # BTN8962TA IS pin: 1A motor ≈ 0.12V with 1kΩ IS resistor; 8A stall ≈ 0.94V
  # ---------------------------------------------------------------------------
  - platform: adc
    pin: GPIO34
    id: motor_current_forward_raw
    internal: true
    update_interval: 50ms
    filters:
      - multiply: 8.5
      - lambda: 'return std::max(0.0f, x);'
    # Over-current trip lives in the can_broadcast script (motor_can.yaml): it
    # checks this current against motor_max_current with a 2-sample (~200 ms)
    # debounce to ride out start-up inrush. No fast single-sample guard here.

  # ---------------------------------------------------------------------------
  # L_IS (GPIO35) — Left H-bridge current sense, fast sampling for stall detection
  # ---------------------------------------------------------------------------
  - platform: adc
    pin: GPIO35
    id: motor_current_reverse_raw
    internal: true
    update_interval: 50ms
    filters:
      - multiply: 8.5
      - lambda: 'return std::max(0.0f, x);'
    # Over-current handled in can_broadcast (see forward sensor above).

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
