# ==============================================================================
# NEATO MOTOR CONTROLLER - HARDWARE DEFINITION (REV 3.0 BOARD, MANUAL MODE)
# ==============================================================================
# Hardware: Wemos D1 Mini ESP32 + 2× BTN8962TA H-bridge
# Schematic: motor_ctrl_rev3.2
#
# This board file wires the Rev 3.0 hardware for simple MANUAL JOYSTICK
# operation. No encoder, no timer, no auto-reverse — pure hold-to-run with
# hard limit switch stops.
#
# Motor H-bridge (BTN8962TA):
#   GPIO19 - R_PWM — Direction 1 / Forward / Open
#   GPIO18 - L_PWM — Direction 2 / Reverse / Close
#   GPIO17 - R_EN  — Right H-bridge enable
#   GPIO16 - L_EN  — Left H-bridge enable
#   GPIO34 - R_IS  — Direction 1 current sense (ADC, input-only)
#   GPIO35 - L_IS  — Direction 2 current sense (ADC, input-only)
#
# Joystick Inputs (hold = run, release = stop):
#   GPIO32 - Input 1 → motor direction 1 (forward / open)
#   GPIO27 - Input 2 → motor direction 2 (reverse / close)
#   Neither active → motor stops
#
# Limit Switches (hard stops — motor is not allowed to travel past):
#   GPIO4  - Open switch  — far limit (blocks Input 1 / forward direction)
#   GPIO13 - Closed switch — near limit (blocks Input 2 / reverse direction)
#
# Status LED:
#   GPIO26 - STATUS LED (external via connector)
# ==============================================================================

# ==============================================================================
# PACKAGES
# ==============================================================================
packages:
  common: !include common/manual_control.yaml

# ==============================================================================
# SUBSTITUTIONS
# ==============================================================================
substitutions:
  project_name: "CodeMakesItGo.ManualMotor"

# ==============================================================================
# CORE CONFIGURATION
# ==============================================================================
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: ${project_name}
    version: "1.0.0"
  on_boot:
    - priority: 900   # Earliest — hold H-bridge safe before GPIO init
      then:
        - output.turn_off: motor_r_en
        - output.turn_off: motor_l_en
        - output.turn_off: motor_rpwm
        - output.turn_off: motor_lpwm
        - logger.log: "Boot: H-bridge disabled — motor safe"
    - priority: -100  # After all components initialized
      then:
        - light.turn_on:
            id: status_led
            effect: "Heartbeat"
        - logger.log: "Boot: Manual motor ready — hold Input 1 or Input 2 to run"

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino
    version: recommended

# ==============================================================================
# MOTOR OUTPUTS - BTN8962TA H-Bridge
# ==============================================================================
output:
  # Direction 1 PWM (forward / open)
  - platform: ledc
    id: motor_rpwm
    pin: GPIO19
    frequency: 1000 Hz

  # Direction 2 PWM (reverse / close)
  - platform: ledc
    id: motor_lpwm
    pin: GPIO18
    frequency: 1000 Hz

  # H-bridge enable lines (both must be ON for motor to run)
  - platform: gpio
    id: motor_r_en
    pin: GPIO17

  - platform: gpio
    id: motor_l_en
    pin: GPIO16

  - platform: ledc
    id: status_led_output
    pin: GPIO26
    frequency: 1000 Hz

# ==============================================================================
# STATUS LED
# ==============================================================================
light:
  - platform: monochromatic
    name: "Status LED"
    id: status_led
    output: status_led_output
    internal: true
    effects:
      - pulse:
          name: "Heartbeat"
          transition_length: 500ms
          update_interval: 1500ms

# ==============================================================================
# BINARY SENSORS - Limit Switches & Joystick Inputs
# ==============================================================================
binary_sensor:
  # ---------------------------------------------------------------------------
  # Open limit switch — far end of travel (blocks forward/direction 1)
  # NO mode: stop fires on_press  (sensor goes ON  = switch closed to GND).
  # NC mode: stop fires on_release (sensor goes OFF = circuit opened = tripped).
  # ---------------------------------------------------------------------------
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    name: "Open Limit Switch"
    id: limit_open
    device_class: opening
    filters:
      - delayed_on: 20ms
    on_press:
      - if:
          condition:
            lambda: 'return !id(limits_nc_mode) && id(motor_running) && id(motor_direction);'
          then:
            - logger.log: "Open limit (NO): stopping motor"
            - script.execute: motor_stop_script
    on_release:
      - if:
          condition:
            lambda: 'return id(limits_nc_mode) && id(motor_running) && id(motor_direction);'
          then:
            - logger.log: "Open limit (NC): stopping motor"
            - script.execute: motor_stop_script

  # ---------------------------------------------------------------------------
  # Closed limit switch — near end of travel (blocks reverse/direction 2)
  # NO mode: stop fires on_press  (sensor goes ON  = switch closed to GND).
  # NC mode: stop fires on_release (sensor goes OFF = circuit opened = tripped).
  # ---------------------------------------------------------------------------
  - platform: gpio
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: true
    name: "Closed Limit Switch"
    id: limit_closed
    device_class: opening
    filters:
      - delayed_on: 20ms
    on_press:
      - if:
          condition:
            lambda: 'return !id(limits_nc_mode) && id(motor_running) && !id(motor_direction);'
          then:
            - logger.log: "Closed limit (NO): stopping motor"
            - script.execute: motor_stop_script
    on_release:
      - if:
          condition:
            lambda: 'return id(limits_nc_mode) && id(motor_running) && !id(motor_direction);'
          then:
            - logger.log: "Closed limit (NC): stopping motor"
            - script.execute: motor_stop_script

  # ---------------------------------------------------------------------------
  # Input 1 — hold to run direction 1 (forward / open)
  # Blocked by open limit switch.
  # ---------------------------------------------------------------------------
  - platform: gpio
    pin:
      number: GPIO32
      mode: INPUT_PULLUP
      inverted: true
    name: "Input 1 (Forward)"
    id: input_1
    filters:
      - delayed_on: 20ms
    on_press:
      - logger.log: "Input 1: forward"
      - if:
          condition:
            lambda: 'return game_active();'
          then:
            - script.execute: motor_forward_start
    on_release:
      - logger.log: "Input 1: released — stopping"
      - script.execute: motor_stop_script

  # ---------------------------------------------------------------------------
  # Input 2 — hold to run direction 2 (reverse / close)
  # Blocked by closed limit switch.
  # ---------------------------------------------------------------------------
  - platform: gpio
    pin:
      number: GPIO27
      mode: INPUT_PULLUP
      inverted: true
    name: "Input 2 (Reverse)"
    id: input_2
    filters:
      - delayed_on: 20ms
    on_press:
      - logger.log: "Input 2: reverse"
      - if:
          condition:
            lambda: 'return game_active();'
          then:
            - script.execute: motor_reverse_start
    on_release:
      - logger.log: "Input 2: released — stopping"
      - script.execute: motor_stop_script

# ==============================================================================
# SENSORS - Current Monitoring & Stall Detection
# ==============================================================================
sensor:
  # R_IS (GPIO34) — direction 1 current sense
  # BTN8962TA: ~0.12V/A with 1kΩ IS resistor; multiply ×8.5 ≈ amps
  - platform: adc
    pin: GPIO34
    id: motor_current_forward_raw
    internal: true
    update_interval: 50ms
    filters:
      - multiply: 8.5
      - lambda: 'return std::max(0.0f, x);'
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1
    on_value_range:
      - above: 8.0
        then:
          - logger.log: "WARNING: Stall detected (forward) — emergency stop"
          - script.execute: motor_stop_script

  # L_IS (GPIO35) — direction 2 current sense
  - platform: adc
    pin: GPIO35
    id: motor_current_reverse_raw
    internal: true
    update_interval: 50ms
    filters:
      - multiply: 8.5
      - lambda: 'return std::max(0.0f, x);'
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1
    on_value_range:
      - above: 8.0
        then:
          - logger.log: "WARNING: Stall detected (reverse) — emergency stop"
          - script.execute: motor_stop_script

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
