# ==============================================================================
# NEATO BLASTER - MAIN CONFIGURATION FILE
# ==============================================================================
# This is the PRIMARY configuration file that assembles all blaster components.
# It includes hardware definitions, network configuration, IR transmitter,
# pump functionality, and optional integrations with Home Assistant.
#
# ONE BINARY for every blaster — there is no per-unit build.
#
# Usage:
#   esphome run     main.yaml
#   esphome compile main.yaml
#   esphome logs    main.yaml
#   Then set the Player ID (1-15) from the device web interface.
#
# Program a unit at a specific IP address (OTA over the network — use this when
# the .local name doesn't resolve, or to pick one unit out of several):
#   esphome run     Controllers/NeatoBlaster/main.yaml --device 192.168.1.50
#   esphome upload  Controllers/NeatoBlaster/main.yaml --device 192.168.1.50   # already compiled
#   esphome logs    Controllers/NeatoBlaster/main.yaml --device 192.168.1.50
# Replace 192.168.1.50 with the unit's IP (shown in its web UI under Debug, or
# in your router's client list). Or open http://<ip>/ in a browser and install
# a compiled firmware.ota.bin from the unit's web page (firmware update / OTA
# section) — no internet needed. A brand-new unit with no firmware is flashed
# over USB instead:
#   esphome run     Controllers/NeatoBlaster/main.yaml --device /dev/cu.usbserial-XXXX
#
# ------------------------------------------------------------------------------
# Author:   W. Jason Altice <jason.altice@neatofx.com>
# Company:  NeatoFx — https://neatofx.com
# Support:  jason.altice@neatofx.com
