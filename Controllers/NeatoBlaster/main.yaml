#
# Safety: NeatoFx devices can switch relays, motors and external power. Wiring
# to mains voltage, motors or other hazardous loads must be done by a qualified
# person in line with local electrical codes. You are responsible for the safe
# installation and operation of the equipment this firmware controls.
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS - Device Identification
# ==============================================================================
substitutions:
  # ONE BINARY: there is no build-time id substitution. ESPHome appends the MAC
  # suffix to the hostname at runtime (see _shared/esphome_base.yaml), giving
  # each unit a unique, permanent hostname. Logical identity is the runtime
  # Player ID, assigned from the web UI and stored in flash — swapping in a
  # replacement blaster means setting that number and nothing else.
  name: blaster
  name_add_mac_suffix: "true"
  friendly_name: "NeatoFx PumpBlaster"
  # Player-facing product: the identity global is player_id (see
  # _shared/runtime_id.yaml), matching the Display.
  runtime_id: player_id
  runtime_id_label: "Player ID"
  runtime_id_max: "15"        # player rides in the low nibble of the NEC command
  runtime_name_label: "Blaster Name"

# ==============================================================================
# EXTERNAL PACKAGES
# ==============================================================================
packages:
  # Runtime identity — the shared player_id global + number entity.
  runtime_id: !include ../../_shared/runtime_id.yaml

  # - For Rev 1.x blasters uncomment the next line
  #board: !include boards/rev1.yaml
  # - For Rev 3.x blasters uncomment the next line
  board: !include boards/rev3.yaml

  # - For standalone: uncomment the next line
  #config: !include configs/standalone.yaml
  # - For networked: uncomment the next line
  config: !include configs/networked.yaml

