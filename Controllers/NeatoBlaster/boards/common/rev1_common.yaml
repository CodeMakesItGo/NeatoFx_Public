# ==============================================================================
# NEATO BLASTER - COMMON COMPONENTS
# ==============================================================================
# This file contains shared components used by all blaster hardware revisions.
# It includes common substitutions, sensors, and settings that are consistent
# across different hardware versions.
#
# Included by: rev1.yaml (and future revisions)
# ==============================================================================

# Shared base packages — common to all NEATO-FX devices
packages:
  esphome_base: !include ../../../../_shared/esphome_base.yaml

# ==============================================================================
# COMMON SUBSTITUTIONS - Shared Configuration Variables
# ==============================================================================
substitutions:
  # Project Information
  project_name: "NeatoFX.Blaster"
  device_description: "NEATO Neato Blaster"

# ==============================================================================
# ESP32 FRAMEWORK - Common Settings
# ==============================================================================
esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino
    version: recommended
  flash_size: 4MB

# ==============================================================================
# LOGGING
# ==============================================================================
logger:
  level: WARN  # Change to DEBUG for troubleshooting

# ==============================================================================
# COMMON SENSORS - System Monitoring
# ==============================================================================
sensor:
  # System uptime monitoring
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    internal: true

  # WiFi signal strength
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    internal: true

  - platform: template
    name: "Player Active"
    id: player_active
    icon: "mdi:account-check"
    accuracy_decimals: 0
    lambda: 'return (float)id(game_active);'
    update_interval: 5s


# ==============================================================================
# IDENTITY
# ==============================================================================
# The "Player ID" number and the "Blaster Name" text sensor both come from
# _shared/runtime_id.yaml (runtime_id / runtime_id_label / runtime_name_label
# are set in main.yaml). This file used to declare a "Player ID" text sensor
# AND a "Player ID" number — two entities with the same name on one device,
# which Home Assistant silently disambiguates by appending _2 to one of the
# entity_ids. Do not re-add either here.

# ==============================================================================
# GLOBALS - Shared State
# ==============================================================================
globals:
  - id: game_active
    type: bool
    restore_value: no
    initial_value: 'false'
