# ==============================================================================
# NEATO RELAY 2 - MAIN CONFIGURATION FILE
# ==============================================================================
# Single entry point. Two independently controlled relays on one ESP32
# WROOM-32E board: latch each channel on/off, or fire it as a timed pulse for
# props, solenoids, air valves, lights and show cues.
#
# The two-channel sibling of NeatoRelay8 — same controls, same Home Assistant
# actions, same web UI, for installs that only need a pair of outputs.
#
# ONE BINARY for every unit — there is no per-unit build.
#
# Usage:
#   esphome run     Controllers/NeatoRelay2/main.yaml
#   esphome compile Controllers/NeatoRelay2/main.yaml
#   esphome logs    Controllers/NeatoRelay2/main.yaml
#   Then set the Device ID from the device web interface.
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS - Device Identification
# ==============================================================================
substitutions:
  # ONE BINARY: there is no build-time id substitution — ESPHome appends the MAC
  # suffix to the hostname at runtime (see _shared/esphome_base.yaml), giving
  # each unit a unique, permanent hostname. Logical identity is the runtime
  # Device ID, assigned from the web UI and stored in flash — swapping in a
  # replacement board means setting that number and nothing else.
  name: relay2
  name_add_mac_suffix: "true"
  friendly_name: "NeatoFx Relay 2"
  # Infrastructure product (not player-facing), so the identity global is
  # device_id — same as Target, Audio, Golf and Relay 8. See
  # _shared/runtime_id.yaml.
  runtime_id: device_id
  runtime_id_label: "Device ID"
  runtime_id_max: "99"
  runtime_name_label: "Relay Board Name"

# ==============================================================================
# PACKAGES
# ==============================================================================
packages:
  # Runtime identity — the shared device_id global + number entity.
  runtime_id: !include ../../_shared/runtime_id.yaml

  # ---- BOARD / BEHAVIOR — select exactly ONE ----
  board: !include boards/rev1.yaml            # Rev 1.x: 2 relays on an ESP32 WROOM-32E

  # ---- NETWORK — select ONE ----
  config: !include configs/networked.yaml      # Router + Home Assistant: API + web UI + OTA
  #config: !include configs/standalone.yaml     # AP-only: local web UI, no router, no Home Assistant

# ==============================================================================
# DEBUGGING
# ==============================================================================
logger:
  level: WARN  # INFO or DEBUG for troubleshooting
