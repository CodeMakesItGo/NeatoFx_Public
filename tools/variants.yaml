# ==============================================================================
# NEATO-FX VARIANT BUILD MATRIX
# ==============================================================================
# Consumed by tools/build_variant.py (local + test bench) and
# .github/workflows/ci.yaml (PR compile matrix).
#
# Every selectable option in each device's main.yaml packages block must be
# enabled by at least one variant here (tools/lint_repo.py enforces this).
#
# Variant spec: package_key -> include path to enable (all other options for
# that key are commented out). `null` disables the key entirely (used for
# Motor drive packages when a self-contained board variant is selected).
# `default` ({}) builds main.yaml exactly as committed.
# ==============================================================================

devices:
  # Neato Target IR — one main per hardware type (each has its own update
  # channel, see tools/release.py). IR protocol, servo mode, hit style, GPIO
  # modes and LED Strip 2 length are runtime selects, so the variants are only
  # board revision, network mode and the LCD-face specials.
  target:
    path: Targets/NeatoTargetIR/main_ir.yaml   # main.yaml just includes this
    label: "Neato Target IR"
    variants:
      default: {}
      rev1_standalone:
        board: boards/rev1.yaml
        config: configs/standalone.yaml
      ha:                       # Router + Home Assistant server
        config: configs/home_assistant.yaml
      lan_no_ha:                # No-HA LAN mode (router present, no HA server)
        config: configs/networked.yaml
      fpp:
        config: configs/networked.yaml
        fpp_file: integrations/target_fpp.yaml

  target_lcd:
    path: Targets/NeatoTargetIR/main_lcd.yaml
    label: "Neato Target LCD"
    variants:
      default: {}
      standalone:
        config: configs/standalone.yaml
      lan_no_ha:
        config: configs/networked.yaml
      fpp:
        fpp_file: integrations/target_fpp.yaml
      hit_fan_mister:           # fan icon; 2nd hit on the water drop = mister
        hit_script: scripts/hit_script_fan_mister.yaml
      hit_curtain:              # sun / moon mirroring a Home Assistant cover
        config: configs/home_assistant.yaml
        hit_script: scripts/hit_script_curtain.yaml

  target_hit:
    path: Targets/NeatoTargetIR/main_hit.yaml
    label: "Neato Target Hit"
    variants:
      default: {}
      standalone:
        config: configs/standalone.yaml
      lan_no_ha:
        config: configs/networked.yaml

  target_hologram:
    path: Targets/NeatoTargetIR/main_hologram.yaml
    label: "Neato Target Hologram"
    variants:
      default: {}
      standalone:
        config: configs/standalone.yaml
      lan_no_ha:
        config: configs/networked.yaml
      fpp:
        fpp_file: integrations/target_fpp.yaml

  motor:
    path: Controllers/NeatoMotor/main.yaml
    label: "Neato Motor"
    variants:
      default: {}   # rev3_12v + drive_dc + home_assistant
      linear_act:              # Linear actuator: timed extend -> retract cycle
        drive: boards/common/linear_act.yaml
      ac_standalone:
        drive: boards/common/drive_ac.yaml
        config: configs/standalone.yaml
      dc_can_sound:            # CAN/sound add-ons need rev3.yaml (SW1 on GPIO25; GPIO4 is CAN RX)
        board: boards/rev3.yaml
        can: boards/common/can.yaml
        sound: boards/common/sound.yaml
      winch:
        board: boards/rev3_winch.yaml
        drive: null
        can: null          # self-contained board; can.yaml assumes the standard board's IDs
      lan_no_ha:                # No-HA LAN mode (router present, no HA server)
        config: configs/networked.yaml

  blaster:
    path: Controllers/NeatoBlaster/main.yaml
    label: "Neato Blaster"
    variants:
      default: {}   # rev3 + networked
      rev1_standalone:
        board: boards/rev1.yaml
        config: configs/standalone.yaml

  relay8:
    path: Controllers/NeatoRelay8/main.yaml
    label: "Neato Relay 8"
    variants:
      default: {}   # rev1 + networked
      standalone:
        config: configs/standalone.yaml

  relay2:
    path: Controllers/NeatoRelay2/main.yaml
    label: "Neato Relay 2"
    variants:
      default: {}   # rev1 + networked
      standalone:
        config: configs/standalone.yaml

  golf:
    path: Golf/NeatoGolf/main.yaml
    label: "Neato Golf"
    variants:
      default: {}   # rev3 + standalone
      networked_fpp:
        config: configs/networked.yaml
        fpp_file: integrations/golf_fpp.yaml

  speaker:
    path: Audio/NeatoAudio50/main.yaml
    label: "Neato Audio 50"
    variants:
      default: {}   # rev2_4 + home_assistant (RFTX mode / RF receiver are runtime)
      rev24_networked_fpp:
        board: boards/rev2_4.yaml
        config: configs/networked.yaml
        fpp_file: integrations/speaker_fpp.yaml
      rev23_standalone:        # legacy board, own-AP mode
        board: boards/rev2_3.yaml
        config: configs/standalone.yaml
      ha:                      # Home Assistant LAN mode
        config: configs/home_assistant.yaml

  display:
    path: Displays/NeatoDisplay4/main.yaml
    label: "Neato Display 4"
    substitutions: { color: "YLW", font_color: "0xFFE000" }
    variants:
      default: {}   # stock "Target Shootout" geometry + images/
      gunslinger_art:          # Temecula "Gunslinger Jacks" geometry +
                               # ../../../Customers/temecula/images_mobile/.
                               # Needs the private repo; not buildable from a
                               # standalone NeatoFx_Public clone, so CI drops it
                               # from the matrix rather than failing on it.
        _requires: ../Customers/temecula/images_mobile
        image_layout: boards/common/image_layout_gunslinger.yaml
      waveshare_lcd4:          # Waveshare ESP32-S3-Touch-LCD-4 V4.0 (CH32V003 expander)
        board: boards/rev2_waveshare.yaml
      rev1:                    # original Guition board (GPIO backlight + relay)
        board: boards/rev1.yaml

  display7:
    path: Displays/NeatoDisplay7/main.yaml
    label: "Neato Display 7"
    substitutions: { color: "YLW", font_color: "0xFFE000" }
    variants:
      default: {}   # rev1_7b (1024x600 7B) + stock artwork scaled to 1000x600
      lcd7_800x480:            # 800x480 ESP32-S3-Touch-LCD-7 (8MB) + native artwork
        board: boards/rev1.yaml
        image_layout: boards/common/image_layout_default.yaml
