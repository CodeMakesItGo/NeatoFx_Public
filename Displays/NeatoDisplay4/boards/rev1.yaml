# ==============================================================================
# NEATO DISPLAY - HARDWARE DEFINITION (REV 1.X)
# ==============================================================================
# Defines all hardware for the Rev 1.x display board.
#
# Hardware Features:
# - ESP32-S3 with 16MB flash + octal PSRAM
# - ST7701S 480x480 RGB display via SPI
# - GT911 capacitive touchscreen via I2C
# - LEDC backlight control (GPIO38)
# - Internal relay (GPIO40)
# - WesternBangBang + Arial fonts
#
# Included by: display_main.yaml
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS - Rev 1.x Specific Configuration Variables
# ==============================================================================
substitutions:
  project_version: "3.2.0"

# ==============================================================================
# EXTERNAL PACKAGES
# ==============================================================================
packages:
  # Include common components shared across all display revisions
  common_components: !include common/common.yaml

# ==============================================================================
# CORE CONFIGURATION - Rev 1.x Boot Sequence
# ==============================================================================
esphome:
  min_version: 2025.8.2
  # MUST stay a LIST (leading "-"). configs/networked.yaml adds its own on_boot
  # trigger; ESPHome only concatenates on_boot across packages when both sides
  # are lists — as a bare dict this block silently overwrites, or is overwritten
  # by, the other package's trigger.
  on_boot:
    - priority: 300   # Let LVGL and the display initialize first
      then:
        - logger.log: "Booting up..."
        # Boot PARKED on the game over screen, not on the attract screen.
        # Which screen an idle lane should show is a function of Home Assistant
        # state - credits, free play - and none of that has arrived yet at
        # priority 300. The game over screen is the honest answer at this point:
        # it is exactly the state a paid lane sits in between players, and
        # refresh_idle_screen promotes it to the attract screen the moment the
        # lane is known to be playable, over the SAME path a mid-session credit
        # takes. That means the boot screen is reached by one code path instead
        # of two, and the lane can never boot into an attract screen that Home
        # Assistant would not have offered.
        #
        # end_sync_grace runs refresh_idle_screen once the sync window closes,
        # so a free site - no credits helper, so no credit update to react to -
        # still gets promoted.
        - lvgl.widget.hide: boot_screen
        - lvgl.widget.hide: game_screen
        - lvgl.widget.hide: game_shot_screen
        - lvgl.widget.show: game_over_screen
        - globals.set:
            id: game_over_active
            value: 'true'

# ==============================================================================
# ESP32-S3 FRAMEWORK
# ==============================================================================
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

# ==============================================================================
# OUTPUTS - Backlight PWM and Internal Relay
# ==============================================================================
output:
  - platform: ledc
    pin: GPIO38
    id: GPIO38
    frequency: 100Hz

  - id: internal_relay_1
    platform: gpio
    pin: 40

# ==============================================================================
# LIGHTING - Display Backlight
# ==============================================================================
light:
  - platform: monochromatic
    output: GPIO38
    name: Backlight
    id: backlight
    restore_mode: ALWAYS_ON

# ==============================================================================
# FONTS
# ==============================================================================
# Sizes are dictated by the artwork's value plates, so they come from the
# image_layout package selected in main.yaml (boards/common/image_layout_*.yaml)
# alongside the plate coordinates — change them there, not here. Roboto's line
# height is size * 2400/2048, which is what has to fit inside a plate.
# small_font is UI chrome, not artwork, so it stays a literal.
font:
  - file: "fonts/Roboto-Bold.ttf"
    id: shot_font
    size: ${shots_font_size}

  - file: "fonts/Roboto-Bold.ttf"
    id: hit_font
    size: ${hits_font_size}

  - file: "fonts/Roboto-Bold.ttf"
    id: score_font
    size: ${score_font_size}

  - file: "fonts/Roboto-Bold.ttf"
    id: final_score_font
    size: ${final_score_font_size}

  - file: "fonts/Roboto-Regular.ttf"
    id: small_font
    size: 24

# ==============================================================================
# I2C - GT911 Touchscreen Bus
# ==============================================================================
i2c:
  - id: bus_a
    sda: GPIO19
    scl: GPIO45

touchscreen:
  platform: gt911
  transform:
    mirror_x: false
    mirror_y: false
  id: my_touchscreen
  display: my_display
  on_touch:
    - logger.log:
        format: Touch at (%d, %d)
        args: [touch.x, touch.y]

# ==============================================================================
# SPI + DISPLAY - ST7701S 480x480
# ==============================================================================
spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

display:
  - platform: st7701s
    id: my_display
    update_interval: never
    auto_clear_enabled: False
    spi_mode: MODE3
    data_rate: 2MHz
    color_order: RGB
    invert_colors: False
    dimensions:
      width: 480
      height: 480
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    pclk_frequency: 12MHz
    pclk_inverted: False
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10] # CMD2_BKSEL_BK0
      - [0xCD, 0x00]                           # disable MDT flag
    data_pins:
      red:
        - 11 #r1
        - 12 #r2
        - 13 #r3
        - 14 #r4
        - 0  #r5
      green:
        - 8  #g0
        - 20 #g1
        - 3  #g2
        - 46 #g3
        - 9  #g4
        - 10 #g5
      blue:
        - 4  #b1
        - 5  #b2
        - 6  #b3
        - 7  #b4
        - 15 #b5
