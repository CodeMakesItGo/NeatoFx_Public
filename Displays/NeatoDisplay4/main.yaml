# ==============================================================================
# NEATO DISPLAY - MAIN CONFIGURATION FILE
# ==============================================================================
# This is the PRIMARY configuration file that assembles all display components.
# It includes hardware definitions, network configuration, game scripts,
# and the LVGL touch-screen UI.
#
# Usage:
#   esphome run display_main.yaml                   (starts with station ID 1)
#   esphome -s id 2 run display_main.yaml           (station ID 2)
#   Then adjust settings via the web interface
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS - Device Identification
# ==============================================================================
substitutions:
  # ONE BINARY PER COLOUR (not per unit). The colour selects artwork that is
  # compiled in, so it stays a build-time choice — but the unit number does
  # not: that is the runtime "Player ID". The colour is part of the name so
  # the four builds get their own .esphome/build/ directories instead of
  # overwriting each other, and ESPHome appends the MAC suffix per device.
  # color_lc MUST match color — program.sh sets both from one choice.
  color_lc: "ylw"                  # lowercase of ${color}: ylw | grn | blu | org
  name: station-${color_lc}
  name_add_mac_suffix: "true"
  friendly_name: "NeatoFx Display"
  # Player-facing product: the identity global is player_id (see
  # _shared/runtime_id.yaml), matching the Blaster.
  runtime_id: player_id
  runtime_id_label: "Player ID"
  runtime_id_max: "15"
  runtime_name_label: "Display Name"
  color: "YLW"                     # Screen color: YLW | GRN | BLU | ORG
  font_color: "0xFFE000"           # YLW=0xFFE000  GRN=0x00E000  BLU=0x00BFFF  ORG=0xFF6000

# ==============================================================================
# EXTERNAL PACKAGES
# ==============================================================================
packages:
  # Runtime player assignment (replaces the old compile-time -s id N).
  runtime_id: !include ../../_shared/runtime_id.yaml

  # Hardware board definition
  board: !include boards/rev1.yaml

  # Network configuration (WiFi, API, web server)
  config: !include configs/networked.yaml

  # Game logic scripts
  game_scripts: !include scripts/game_scripts.yaml

# ==============================================================================
# DEBUGGING
# ==============================================================================
logger:
  level: WARN
  baud_rate: 115200  # Must be non-zero for improv_serial (Made for ESPHome requirement)
