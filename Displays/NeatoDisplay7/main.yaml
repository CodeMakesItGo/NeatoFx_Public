# ==============================================================================
# NEATO DISPLAY 7" - MAIN CONFIGURATION FILE
# ==============================================================================
# Primary config for the 7" touch-screen game display. Assembles the Waveshare
# ESP32-S3-Touch-LCD-7B (1024x600) hardware - or the 800x480 ESP32-S3-Touch-LCD-7,
# selected in the packages block below - network config, game scripts, and
# the LVGL shooting-gallery UI. This is the general product build — it does NOT
# include the DigTown excavator game (that lives in Customers/DigTown/).
#
# Usage:
#   esphome run main.yaml                   (starts with station ID 1)
#   esphome -s id 2 run main.yaml           (station ID 2)
#   Then adjust settings via the web interface
#
# Program a unit at a specific IP address (OTA over the network — use this when
# the .local name doesn't resolve, or to pick one unit out of several):
#   esphome run     Displays/NeatoDisplay7/main.yaml --device 192.168.1.50
#   esphome upload  Displays/NeatoDisplay7/main.yaml --device 192.168.1.50   # already compiled
#   esphome logs    Displays/NeatoDisplay7/main.yaml --device 192.168.1.50
# Replace 192.168.1.50 with the unit's IP (shown in its web UI under Debug, or
# in your router's client list). Or open http://<ip>/ in a browser and install
# a compiled firmware.ota.bin from the unit's web page (firmware update / OTA
# section) — no internet needed. A brand-new unit with no firmware is flashed
# over USB instead:
#   esphome run     Displays/NeatoDisplay7/main.yaml --device /dev/cu.usbserial-XXXX
#
# ------------------------------------------------------------------------------
# Author:   W. Jason Altice <jason.altice@neatofx.com>
# Company:  NeatoFx — https://neatofx.com
# Support:  jason.altice@neatofx.com
