# LICENSE file in the repository root for the full terms. This configuration is
# provided "AS IS", without warranty of any kind, express or implied.
#
# Safety: NeatoFx devices can switch relays, motors and external power. Wiring
# to mains voltage, motors or other hazardous loads must be done by a qualified
# person in line with local electrical codes. You are responsible for the safe
# installation and operation of the equipment this firmware controls.
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS - Device Identification
# ==============================================================================
substitutions:
  # ONE BINARY PER COLOUR (not per unit). The colour selects artwork that is
  # compiled in, so it stays a build-time choice — but the unit number does
  # not: that is the runtime "Player ID". The colour is part of the name so
  # the five builds get their own .esphome/build/ directories instead of
  # overwriting each other, and ESPHome appends the MAC suffix per device.
  # color_lc MUST match color — program.sh sets both from one choice.
  color_lc: "ylw"                  # lowercase of ${color}: ylw | grn | blu | org | red
  name: station-${color_lc}
  name_add_mac_suffix: "true"
  friendly_name: "NeatoFx Display"
  # Player-facing product: the identity global is player_id (see
  # _shared/runtime_id.yaml), matching the Blaster.
  runtime_id: player_id
  runtime_id_label: "Player ID"
  runtime_id_max: "15"
  runtime_name_label: "Display Name"
  color: "YLW"                     # Screen color: YLW | GRN | BLU | ORG | RED
  font_color: "0xFFE000"           # YLW=0xFFE000  GRN=0x00E000  BLU=0x00BFFF
                                   # ORG=0xFF6000  RED=0xFF0000

# ==============================================================================
# EXTERNAL PACKAGES
# ==============================================================================
packages:
  # Runtime player assignment (replaces the old compile-time -s id N).
  runtime_id: !include ../../_shared/runtime_id.yaml

  # ---- SCREEN ARTWORK LAYOUT ----
  # Where the score / shots / hits / final-score digits sit on the artwork,
  # plus their font sizes and colours. The layout file ALSO sets ${images_dir},
  # the directory its PNGs come from, so the coordinates and the artwork travel
  # together — one line picks both and they cannot drift apart.
  #
  # Only one artwork set exists for this product, in one layout per panel size.
  # Display 4's Temecula "Gunslinger Jacks" set is 1024x1024 square artwork for
  # a 480x480 panel and does not fit a landscape screen, so there is no 7"
  # equivalent to select. Add another image_layout_*.yaml here when landscape
  # customer artwork exists.
  #
  # Do not define images_dir or the geometry in this file. Substitutions here
  # override those from a package, so a copy at this level would win over
  # whichever layout is selected.
  #
  # The layout must match the board below: the _7b layout uses the same artwork
  # pre-scaled to 1024x600 (images_7b/), and only fits the 7B's 16MB flash.
  image_layout: !include boards/common/image_layout_default_7b.yaml    # stock "Target Shootout" on the 7B (1024x600)
  # image_layout: !include boards/common/image_layout_default.yaml       # stock "Target Shootout" on the 800x480 board

  # ---- HARDWARE BOARD ----
  # Two different Waveshare boards, NOT interchangeable - the wrong build gives
  # a torn, repeating picture. Check the silkscreen: "7B" is the 1024x600 one.
  board: !include boards/rev1_7b.yaml                                  # ESP32-S3-Touch-LCD-7B, 1024x600, 16MB
  # board: !include boards/rev1.yaml                                     # ESP32-S3-Touch-LCD-7, 800x480, 8MB

  # Network configuration (WiFi, API, web server)
  config: !include configs/networked.yaml

  # Game logic scripts
  game_scripts: !include scripts/game_scripts.yaml

# ==============================================================================
# DEBUGGING
# ==============================================================================
logger:
  # WARN in production. The lane's decision points - TAP / ACTIVE / START / END,
  # plus the two SYNC/BOOT warnings - all log at WARN deliberately, so a fault
  # is diagnosable from a stock unit without reflashing anything. They are one
  # line per game start, not per frame.
  #
  # For a deeper trace, set `level: DEBUG` and add:
  #     logs:
  #       homeassistant.binary_sensor: DEBUG
  #       homeassistant.sensor: DEBUG
  # which prints "'input_boolean.player_<n>_active': Got state ON" every time
  # Home Assistant pushes a value - the one line that distinguishes "the device
  # never heard" from "the device heard and ignored it". Per-tag levels may not
  # exceed the global level, so the global has to come up for that to compile in.
  level: WARN
  baud_rate: 115200  # Must be non-zero for improv_serial (Made for ESPHome requirement)
