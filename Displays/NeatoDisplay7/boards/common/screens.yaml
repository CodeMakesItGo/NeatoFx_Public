# ==============================================================================
# NEATO DISPLAY - SCREENS & UI (7" 800x480)
# ==============================================================================
# LVGL pages and widgets for the Waveshare 7" 800x480 landscape display.
#
# Pages:
#   shot_page      - Shooting game UI (boot, game, shots, game-over screens)
#
# Included by: boards/common/common.yaml
# ==============================================================================

# ==============================================================================
# TEMPLATE SENSORS - Game State
# ==============================================================================
sensor:
  - platform: template
    name: "Player Score"
    id: player_score_sensor
    update_interval: never

  - platform: template
    name: "Player Hit"
    id: player_hit_sensor
    update_interval: never

  - platform: template
    name: "Player Shots"
    id: player_shot_sensor
    update_interval: never

# ==============================================================================
# IMAGES - Screen Backgrounds
# ==============================================================================
# Artwork lives in images/ pre-sized to EXACTLY 800x480, the panel resolution.
# That is deliberate and must stay true: ESPHome's `resize:` preserves aspect
# ratio (it fits within the box, it does not fill it), so art at any other
# ratio gets letterboxed and the plate coordinates below stop lining up. The
# source renders were 1344x752 (1.787:1) and were squashed ~7% horizontally to
# reach 5:3; re-exporting future artwork at 5:3 (e.g. 1600x960) avoids that.
# `platform: file` is required: the bare `image:` list is the legacy format,
# deprecated in 2026.7 and removed in ESPHome 2027.1.0.
#
# FLASH BUDGET — this is the tight one. The 8MB part gives a 0x3C0000
# (3,932,160 byte) OTA app slot, and each 800x480 RGB565 image costs exactly
# 768,000 bytes, so these three eat 2,304,000 of it. That is why the numeric
# fonts in boards/rev1.yaml are digit-only: without that glyph restriction the
# build does not fit. Check the "Flash:" line after any change here.
image:
  - platform: file
    file: "images/GAME_START_${color}.png"
    id: boot_logo
    type: RGB565
    resize: 800x480
    transparency: opaque

  - platform: file
    file: "images/GAME_PLAY_${color}.png"
    id: shots_background
    type: RGB565
    resize: 800x480
    transparency: opaque

  - platform: file
    file: "images/GAME_OVER.png"
    id: game_over_background
    type: RGB565
    resize: 800x480
    transparency: opaque

# ==============================================================================
# LVGL - Touch UI (800x480 landscape)
# ==============================================================================
lvgl:
  on_idle:
    - timeout: 15s
      then:
        - logger.log: "LVGL idle 15s timeout"

  page_wrap: true
  pages:

    # ==========================================================================
    # SHOT PAGE — shooting gallery game screens (shown/hidden as overlapping objs)
    # ==========================================================================
    - id: shot_page
      skip: false
      bg_color: 0x000000
      bg_opa: COVER
      border_opa: TRANSP

      widgets:

        # ------------------------------------------------------------------
        # GAME SHOT SCREEN
        # ------------------------------------------------------------------
        - obj:
            id: game_shot_screen
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_opa: COVER
            radius: 0
            pad_all: 0
            border_width: 0
            bg_color: 0x000000
            widgets:
              # The "SHOTS LEFT" / "SCORE" / "HITS" captions are part of the
              # artwork now, so only the numbers are LVGL labels.
              - image:
                  x: 0
                  y: 0
                  width: 100%
                  height: 100%
                  src: shots_background
              # Geometry tracks the artwork: the three value plates in
              # GAME_PLAY_${color}.png sit at x 319..650 (332 wide), with the
              # SHOTS LEFT plate at y 224..273, SCORE at 296..344 and HITS at
              # 367..416. Re-measure these if the artwork is redrawn.
              - label:
                  id: player_shot
                  x: 319
                  y: 224
                  width: 332
                  height: 50
                  text_font: shot_font
                  text_align: CENTER
                  align: TOP_LEFT
                  text_color: ${font_color}
                  text: ""
                  bg_opa: TRANSP

        # ------------------------------------------------------------------
        # GAME SCREEN
        # ------------------------------------------------------------------
        - obj:
            id: game_screen
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_opa: TRANSP
            radius: 0
            pad_all: 0
            border_width: 0
            bg_color: 0x000000
            widgets:
              - label:
                  id: player_hit
                  x: 319
                  y: 367
                  width: 332
                  height: 50
                  text_font: hit_font
                  text_align: CENTER
                  align: TOP_LEFT
                  text_color: ${font_color}
                  text: ""
                  bg_opa: TRANSP
              - label:
                  id: player_score
                  x: 319
                  y: 295
                  width: 332
                  height: 50
                  text_font: score_font
                  text_align: CENTER
                  align: TOP_LEFT
                  text_color: ${font_color}
                  text: ""
                  bg_opa: TRANSP

        # ------------------------------------------------------------------
        # BOOT SCREEN - Full-width splash + tap-anywhere to continue
        # ------------------------------------------------------------------
        - obj:
            id: boot_screen
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_color: 0x000000
            bg_opa: COVER
            radius: 0
            pad_all: 0
            border_width: 0
            widgets:
              # GAME_START_${color}.png carries the "TOUCH TO START GAME" panel.
              - image:
                  align: CENTER
                  src: boot_logo
              - button:
                  x: 0
                  y: 0
                  width: 800
                  height: 480
                  checkable: false
                  bg_color: 0x000000
                  bg_opa: TRANSP
                  border_color: 0x000000
                  border_width: 0
                  border_opa: TRANSP
                  radius: 0
                  shadow_width: 0
                  shadow_color: 0x000000
                  on_click:
                    then:
                      # Ask Home Assistant to start the round instead of
                      # starting it locally: start_player_game applies the
                      # credit gate, and the round begins only when it turns
                      # player_<id>_active on (see request_start_game in
                      # configs/networked.yaml). A refused start - no credit,
                      # free play off - leaves this screen untouched.
                      - script.execute: request_start_game

        # ------------------------------------------------------------------
        # GAME OVER SCREEN
        # ------------------------------------------------------------------
        - obj:
            id: game_over_screen
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_color: 0x000000
            bg_opa: COVER
            radius: 0
            pad_all: 0
            border_width: 0
            widgets:
              - image:
                  align: CENTER
                  src: game_over_background
              # FINAL SCORE plate in GAME_OVER.png: x 239..560, y 340..420.
              - label:
                  id: game_over_score
                  x: 239
                  y: 342
                  width: 322
                  height: 77
                  text_font: final_score_font
                  text_align: CENTER
                  align: TOP_LEFT
                  text_color: ${font_color}
                  text: ""
                  bg_opa: TRANSP

