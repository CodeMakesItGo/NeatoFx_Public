# ==============================================================================
# NEATO DISPLAY 7" - HARDWARE DEFINITION (REV 1.X)
# ==============================================================================
# Waveshare ESP32-S3-Touch-LCD-7B
# - ESP32-S3R8 (8MB PSRAM octal)
# - 800x480 RGB parallel display (built-in rpi_dpi_rgb driver)
# - GT911 capacitive touchscreen via I2C
#
# Touch pins:
#   GPIO4  = TP_IRQ  (interrupt)
#   GPIO8  = TP_SDA  (I2C data)
#   GPIO9  = TP_SCL  (I2C clock)
#   EXIO1  = TP_RST  (reset, via CH422G pin 1)
#
# Pin source: https://docs.waveshare.com/ESP32-S3-Touch-LCD-7B
#
# Included by: main.yaml
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS
# ==============================================================================
substitutions:
  project_version: "1.0.0"

# ==============================================================================
# EXTERNAL PACKAGES
# ==============================================================================
packages:
  common_components: !include common/common.yaml

# ==============================================================================
# CORE CONFIGURATION
# ==============================================================================
esphome:
  min_version: 2025.8.2
  on_boot:
    - priority: 300
      then:
        - logger.log: "Booting up..."
        - lvgl.page.show: shot_page

# ==============================================================================
# ESP32-S3 FRAMEWORK
# ==============================================================================
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

# ==============================================================================
# IO EXPANDER - CH422G (controls backlight enable and touch reset)
# ==============================================================================
ch422g:
  - id: ch422g_hub

# ==============================================================================
# OUTPUTS - Backlight Enable via IO expander (EXIO2 = CH422G pin 2)
# ==============================================================================
output:
  - platform: gpio
    pin:
      ch422g: ch422g_hub
      number: 2
      mode: OUTPUT
    id: backlight_en

# ==============================================================================
# LIGHTING - Display Backlight
# ==============================================================================
light:
  - platform: binary
    output: backlight_en
    name: Backlight
    id: backlight
    restore_mode: ALWAYS_ON

# ==============================================================================
# FONTS
# ==============================================================================
font:
  - file: "fonts/arialbd.ttf"
    id: score_font
    size: 120

  - file: "fonts/arialbd.ttf"
    id: hit_font
    size: 80

  - file: "fonts/arialbd.ttf"
    id: shot_font
    size: 120

  - file: "fonts/arial.ttf"
    id: label_font
    size: 36

  - file: "fonts/arial.ttf"
    id: small_font
    size: 24

# ==============================================================================
# I2C - GT911 Touchscreen Bus
# ==============================================================================
i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz

touchscreen:
  platform: gt911
  id: my_touchscreen
  display: my_display
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  transform:
    mirror_x: false
    mirror_y: false
  on_touch:
    - logger.log:
        format: Touch at (%d, %d)
        args: [touch.x, touch.y]

# ==============================================================================
# DISPLAY - RGB Parallel 800x480
# Pin source: https://docs.waveshare.com/ESP32-S3-Touch-LCD-7B
# ==============================================================================
display:
  - platform: rpi_dpi_rgb
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    pclk_frequency: 16MHz
    hsync_pulse_width: 4
    hsync_front_porch: 8
    hsync_back_porch: 8
    vsync_pulse_width: 4
    vsync_front_porch: 8
    vsync_back_porch: 8
    data_pins:
      red:
        - GPIO1   # R3
        - GPIO2   # R4
        - GPIO42  # R5
        - GPIO41  # R6
        - GPIO40  # R7
      green:
        - GPIO39  # G2
        - GPIO0   # G3
        - GPIO45  # G4
        - GPIO48  # G5
        - GPIO47  # G6
        - GPIO21  # G7
      blue:
        - GPIO14  # B3
        - GPIO38  # B4
        - GPIO18  # B5
        - GPIO17  # B6
        - GPIO10  # B7
