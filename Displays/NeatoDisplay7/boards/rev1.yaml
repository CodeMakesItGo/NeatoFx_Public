# ==============================================================================
# NEATO DISPLAY 7" - HARDWARE DEFINITION (REV 1.X)
# ==============================================================================
# Waveshare ESP32-S3-Touch-LCD-7B
# - ESP32-S3R8 (8MB PSRAM octal)
# - 800x480 RGB parallel display (built-in rpi_dpi_rgb driver)
# - GT911 capacitive touchscreen via I2C
#
# Touch pins:
#   GPIO4  = TP_IRQ  (interrupt)
#   GPIO8  = TP_SDA  (I2C data)
#   GPIO9  = TP_SCL  (I2C clock)
#   EXIO1  = TP_RST  (reset, via CH422G pin 1)
#
# Pin source: https://docs.waveshare.com/ESP32-S3-Touch-LCD-7B
#
# Included by: main.yaml
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS
# ==============================================================================
substitutions:
  project_version: "3.2.0"

# ==============================================================================
# EXTERNAL PACKAGES
# ==============================================================================
packages:
  common_components: !include common/common.yaml

# ==============================================================================
# CORE CONFIGURATION
# ==============================================================================
esphome:
  min_version: 2025.8.2
  on_boot:
    - priority: 300
      then:
        - logger.log: "Booting up..."
        - lvgl.page.show: shot_page
        # None of the four overlapping objs declares hidden: true, so they all
        # start VISIBLE, stacked. Every one of them has to be placed explicitly.
        # Boot PARKED on the game over screen, not on the attract screen.
        # Which screen an idle lane should show is a function of Home Assistant
        # state - credits, free play - and none of that has arrived yet at
        # priority 300. The game over screen is the honest answer at this point:
        # it is exactly the state a paid lane sits in between players, and
        # refresh_idle_screen promotes it to the attract screen the moment the
        # lane is known to be playable, over the SAME path a mid-session credit
        # takes. That means the boot screen is reached by one code path instead
        # of two, and the lane can never boot into an attract screen that Home
        # Assistant would not have offered.
        #
        # end_sync_grace runs refresh_idle_screen once the sync window closes,
        # so a free site - no credits helper, so no credit update to react to -
        # still gets promoted.
        - lvgl.widget.hide: boot_screen
        - lvgl.widget.hide: game_screen
        - lvgl.widget.hide: game_shot_screen
        - lvgl.widget.show: game_over_screen
        - globals.set:
            id: game_over_active
            value: 'true'

# ==============================================================================
# ESP32-S3 FRAMEWORK
# ==============================================================================
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

# ==============================================================================
# IO EXPANDER - CH422G (controls backlight enable and touch reset)
# ==============================================================================
ch422g:
  - id: ch422g_hub

# ==============================================================================
# OUTPUTS - Backlight Enable via IO expander (EXIO2 = CH422G pin 2)
# ==============================================================================
output:
  - platform: gpio
    pin:
      ch422g: ch422g_hub
      number: 2
      mode: OUTPUT
    id: backlight_en

# ==============================================================================
# LIGHTING - Display Backlight
# ==============================================================================
light:
  - platform: binary
    output: backlight_en
    name: Backlight
    id: backlight
    restore_mode: ALWAYS_ON

# ==============================================================================
# FONTS
# ==============================================================================
# Sizes are dictated by the artwork's value plates (see boards/common/
# screens.yaml): the three GAME_PLAY plates are 50 px tall, so 44 px arialbd
# (50 px line height) fills them exactly. The GAME_OVER "FINAL SCORE" plate is
# 81 px tall and gets its own larger face.
#
# `glyphs` is not cosmetic here — it is what makes the build fit the 3.93MB OTA
# slot alongside three 768KB backgrounds. These four labels only ever render
# printf("%d") output, so digits (plus a sign, for safety) are the whole
# alphabet they need. Dropping the default ~95-glyph ASCII set saves ~200KB.
# Any caption text belongs in the artwork, not in a label using these fonts.
font:
  - file: "fonts/arialbd.ttf"
    id: score_font
    size: 44
    glyphs: "-0123456789"

  - file: "fonts/arialbd.ttf"
    id: hit_font
    size: 44
    glyphs: "-0123456789"

  - file: "fonts/arialbd.ttf"
    id: shot_font
    size: 44
    glyphs: "-0123456789"

  - file: "fonts/arialbd.ttf"
    id: final_score_font
    size: 68
    glyphs: "-0123456789"

  - file: "fonts/arial.ttf"
    id: small_font
    size: 24

# ==============================================================================
# I2C - GT911 Touchscreen Bus
# ==============================================================================
i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz

touchscreen:
  platform: gt911
  id: my_touchscreen
  display: my_display
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  transform:
    mirror_x: false
    mirror_y: false
  on_touch:
    - logger.log:
        format: Touch at (%d, %d)
        args: [touch.x, touch.y]

# ==============================================================================
# DISPLAY - RGB Parallel 800x480
# Pin source: https://docs.waveshare.com/ESP32-S3-Touch-LCD-7B
# ==============================================================================
display:
  - platform: rpi_dpi_rgb
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    pclk_frequency: 16MHz
    hsync_pulse_width: 4
    hsync_front_porch: 8
    hsync_back_porch: 8
    vsync_pulse_width: 4
    vsync_front_porch: 8
    vsync_back_porch: 8
    data_pins:
      red:
        - GPIO1   # R3
        - GPIO2   # R4
        - GPIO42  # R5
        - GPIO41  # R6
        - GPIO40  # R7
      green:
        - GPIO39  # G2
        - GPIO0   # G3
        - GPIO45  # G4
        - GPIO48  # G5
        - GPIO47  # G6
        - GPIO21  # G7
      blue:
        - GPIO14  # B3
        - GPIO38  # B4
        - GPIO18  # B5
        - GPIO17  # B6
        - GPIO10  # B7
