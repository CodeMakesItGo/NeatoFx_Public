# ==============================================================================
# NEATO-FX SECRETS TEMPLATE
# ==============================================================================
# Copy this file to secrets.yaml IN THIS DIRECTORY (_shared/) and fill in your
# own values.
#
# ESPHome resolves a `!secret` tag against the secrets.yaml sitting next to the
# file that contains the tag — it does NOT walk up parent directories. The
# packages that use these secrets live in _shared/, so secrets.yaml must live
# in _shared/ too. (A build whose top-level YAML is elsewhere also falls back to
# a secrets.yaml next to that top-level file.)
#
# secrets.yaml is gitignored. NEVER commit it.
# ==============================================================================

# NOTE: no wifi_ssid / wifi_password here. Nothing in this repo references
# them — _shared/networked_base.yaml deliberately compiles in no network so one
# generic firmware works at any customer site. Per-site builds that DO compile
# in an SSID keep their own secrets.yaml next to their top-level YAML, because
# ESPHome resolves !secret against that directory (see above), not this one.

# Password for the setup hotspot a device raises when it has no WiFi yet
# (SSID = the device name, e.g. "target-1"). Customers need this to provision,
# so document it in the manual. Minimum 8 characters (WPA2).
ap_password: "ChangeMe123"

# OTA update password, compiled into every unit. Prevents anything else on the
# customer's LAN from pushing firmware. Shared across all units, so it is a
# speed bump rather than a per-device secret.
ota_password: "ChangeMeOTA"
