# ==============================================================================
# NEATO-FX SECRETS TEMPLATE
# ==============================================================================
# Copy this file to secrets.yaml in your private repo root (one level above
# this public submodule) and fill in your actual values.
#
# ESPHome searches for secrets.yaml by walking UP parent directories from the
# config file, so placing it at the private repo root ensures it is found
# automatically without modifying any config files.
#
# NEVER commit secrets.yaml to a public repository.
# ==============================================================================

# Customer WiFi network credentials
wifi_ssid: "YourNetworkName"
wifi_password: "YourWifiPassword"

# Fallback Access Point password (used when device cannot join WiFi)
ap_password: "neato123"
