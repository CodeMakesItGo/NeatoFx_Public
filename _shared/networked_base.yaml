# ==============================================================================
# NEATO-FX SHARED PACKAGE - NETWORKED BASE CONFIGURATION
# ==============================================================================
# Included by: all device *_networked_config.yaml files
# Contains: WiFi station mode, web server, captive portal, and dashboard import
#           configuration that is identical across all networked devices.
# ==============================================================================

# ==============================================================================
# SUBSTITUTIONS - Network Addressing Defaults
# ==============================================================================
# ip_base and ip_addr provide default static IP values used by the optional
# manual_ip block below. Each device can override ip_addr with its own
# subnet offset in its networked config substitutions.
#
# Override ip_addr in your device's networked config substitutions, or pass
# it on the command line:  esphome -s ip_addr 192.168.8.5 run ...
# ==============================================================================
substitutions:
  ip_base: "192.168.8."
  ip_addr: "${ip_base}${id}"    # Default: 192.168.8.1, .2, .3 … matches device id

# ==============================================================================
# WIFI CONFIGURATION - Network Setup & Management
# ==============================================================================
wifi:
  # Customer WiFi configuration
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Setup WiFi hotspot for customer configuration
  ap:
    ssid: "${name}"
    password: ""

  # Connection management
  reboot_timeout: 10min     # Reboot after 10 minutes of WiFi loss
  power_save_mode: light    # BLE (esp32_improv) requires modem sleep — 'none' is
                            # rejected by ESPHome when esp32_ble is present
  output_power: 20dB        # Maximum WiFi power for best range

  # --------------------------------------------------------------------------
  # OPTIONAL: Static IP Address
  # --------------------------------------------------------------------------
  # By default your device uses DHCP — your router assigns it an IP address
  # automatically. This works well for most setups.
  #
  # You may want a static (fixed) IP address if:
  #   • Your setup uses FPP / Falcon Player for light show sync — FPP needs
  #     to reach each device at a known, stable address
  #   • Your router assigns a different IP after every reboot and you're
  #     using direct-IP automations in Home Assistant
  #   • You are deploying many devices and want predictable addresses for
  #     remote flashing, monitoring, or bulk configuration
  #   • Your network has no DHCP server (uncommon, but possible in isolated
  #     game-room networks)
  #
  # To enable: uncomment the manual_ip block below. The ip_addr substitution
  # is defined above and can be overridden per-device or on the command line.
  # --------------------------------------------------------------------------
  # manual_ip:
  #   static_ip: ${ip_addr}
  #   gateway: ${ip_base}1
  #   subnet: 255.255.255.0
  #   dns1: ${ip_base}1
  #   dns2: 8.8.8.8

  on_connect:
    then:
      - logger.log: "WiFi connected successfully"

  on_disconnect:
    then:
      - logger.log: "WiFi disconnected"

# ==============================================================================
# NETWORK & WEB INTERFACE - Common Services
# ==============================================================================
web_server:
  port: 80
  include_internal: false
  # local: true embeds the web frontend (JS/CSS) into the firmware so the UI
  # works with NO internet. Must be true on landlocked gallery LANs — with
  # local: false the page pulls its JS from the ESPHome CDN and renders blank
  # when the network has no WAN access.
  local: true
  version: 2

# ==============================================================================
# API & REMOTE ACCESS - Home Assistant Integration
# ==============================================================================
api:
  reboot_timeout: 5min  # Reboot the device if no connection to Home Assistant for 5 minutes

# ==============================================================================
# CAPTIVE PORTAL & DASHBOARD - Initial Setup
# ==============================================================================
captive_portal:

esp32_improv:
  authorizer: none  # Allow BLE provisioning without physical authorization button

# Note: improv_serial is NOT included here because it requires logger baud_rate != 0,
# which conflicts with devices that disable serial logging (e.g. NeatoDisplay4).
# Add improv_serial: directly in the device's own networked.yaml where appropriate.
